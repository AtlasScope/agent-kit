<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prompt Library</title>
<style>
/* One reading column sorted by what people want fixed. Search and the list of complaints are the only
   controls; every entry has one Copy button. The DESIGN.md faces when installed, else system fonts; nothing loads from the web. */
:root {
  --bg: #F3F1EC; --surface: #FFFFFF; --sunk: #EAE7E0; --hover: #E3DFD6;
  --line: #C9C3B7; --line-soft: #DEDAD1;
  --ink: #14120E; --ink-2: #34302A; --ink-3: #5B564C;
  --accent: #8A4B00; --on-accent: #FFFFFF; --accent-soft: #F6E6CF; --ok: #1E6B3A; --on-ok: #FFFFFF;
  --sans: Geist, ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0E0D0C; --surface: #1A1917; --sunk: #141311; --hover: #2A2825;
  --line: #4A453E; --line-soft: #302D29;
  --ink: #F6F3EE; --ink-2: #DCD7CE; --ink-3: #ADA699;
  --accent: #F5A524; --on-accent: #1A1002; --accent-soft: #2E220F; --ok: #6FD49A; --on-ok: #0B1A10;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono, code, pre { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 760px) { .wrap { padding-left: 32px; padding-right: 32px; } }

/* Header: the name and the search box, nothing else */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 12px 24px; min-height: 64px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.search { position: relative; flex: 1 1 320px; max-width: 520px; margin-left: auto; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 44px 0 38px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clear { position: absolute; right: 2px; top: 2px; width: 40px; height: 40px; border: 0; background: none; border-radius: 8px; color: var(--ink-3); font-size: 20px; line-height: 1; }
.clear:hover { background: var(--hover); color: var(--ink); }
@media (max-width: 560px) { html { scroll-padding-top: 132px; } .search { flex-basis: 100%; max-width: none; margin-left: 0; } }

/* Intro */
.intro { padding: 36px 0 8px; max-width: 760px; }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 14px; font-weight: 700; }
.lede { font-size: 18px; color: var(--ink-2); margin: 0 0 12px; }
.how { color: var(--ink-3); margin: 0; }
.how code { font-size: 0.92em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }

/* Layout: the complaint list sits beside the entries on wide screens, above them on narrow ones */
.layout { display: grid; gap: 8px 48px; padding: 24px 0 80px; }
@media (min-width: 1040px) { .layout { grid-template-columns: 300px minmax(0, 1fr); } .index { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; } }
.index h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.index ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
@media (min-width: 640px) and (max-width: 1039px) { .index ol { grid-template-columns: 1fr 1fr; column-gap: 16px; } }
.index a { display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; line-height: 1.3; min-height: 44px; align-items: center; }
.index a:hover { background: var(--hover); }
.index a .n { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.index a.none { color: var(--ink-3); opacity: 0.55; }
.index .tools-link { margin-top: 10px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
.found { margin: 0 0 4px; color: var(--ink-3); }

/* Complaint sections */
.goal { margin: 0 0 48px; }
.goal > h2 { font-size: clamp(22px, 3vw, 28px); letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 6px; }
.goal > p { margin: 0 0 12px; color: var(--ink-2); max-width: 68ch; }
.entries { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-soft); }

/* One entry: name, one plain line, what you get back, Copy. Everything else waits behind "Show". */
.entry { border-bottom: 1px solid var(--line-soft); padding: 16px 0; }
.entry:target, .entry.flash { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
.ehead { display: flex; gap: 16px; align-items: flex-start; }
.ehead .what { flex: 1; min-width: 0; }
.kind { display: block; font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }
.entry h3 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.entry h3.cmd { font-family: var(--mono); font-size: 15.5px; font-weight: 600; }
.line { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.get { margin: 6px 0 0; font-size: 14px; color: var(--ink-3); }
.get b { font-weight: 600; color: var(--ink-2); }
.copy { flex: none; min-width: 84px; height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; color: var(--ink); }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.done, .copy.done:hover { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
details.more { margin-top: 8px; }
details.more > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--accent); font-size: 14.5px; font-weight: 550; min-height: 36px; list-style: none; border-radius: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); margin-right: 3px; }
details.more[open] > summary::before { transform: rotate(45deg); margin-top: -4px; }
.body { padding: 6px 0 4px; }
.body .lab { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); margin: 10px 0 4px; font-weight: 600; }
pre.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; color: var(--ink); max-width: 78ch; }
dl.facts { margin: 12px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 74ch; }
dl.facts dt { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); font-weight: 600; }
dl.facts dd { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }
.rel a { margin-right: 12px; display: inline-block; }
.idtag { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-3); font-family: var(--mono); }

/* Command reference, by tool */
.tools > h2 { font-size: clamp(22px, 3vw, 28px); letter-spacing: -0.02em; margin: 0 0 6px; }
.tools > p { margin: 0 0 12px; color: var(--ink-2); max-width: 68ch; }
details.tool { border-top: 1px solid var(--line-soft); }
details.tool:last-of-type { border-bottom: 1px solid var(--line-soft); }
details.tool > summary { cursor: pointer; list-style: none; padding: 14px 0; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; min-height: 44px; }
details.tool > summary::-webkit-details-marker { display: none; }
details.tool > summary b { font-size: 17px; }
details.tool > summary span { color: var(--ink-3); font-size: 14px; }
.tool .about { margin: 0 0 10px; color: var(--ink-2); max-width: 70ch; }
.tool dl.facts { margin: 0 0 14px; }
.tool h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.tool ul { list-style: none; margin: 0 0 16px; padding: 0; }
.tool li { padding: 7px 0; border-top: 1px dashed var(--line-soft); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
@media (min-width: 760px) { .tool li { grid-template-columns: minmax(180px, 34%) minmax(0, 1fr); gap: 16px; } }
.tool li a { font-family: var(--mono); font-size: 14.5px; overflow-wrap: anywhere; }
.tool li span { color: var(--ink-2); font-size: 15px; }

footer { border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 14px; padding: 18px 0 calc(28px + env(safe-area-inset-bottom, 0px)); }
footer p { margin: 0 0 6px; max-width: 80ch; }
.empty { padding: 24px 0; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } .copy { transition: background-color .15s, border-color .15s, color .15s; } }
@media (max-width: 480px) { .entry h3 { font-size: 16.5px; } .copy { min-width: 72px; padding: 0 12px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#">Prompt Library</a>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5l3.25 3.25" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search: slow, cluttered, dark mode" aria-label="Search the library" autocomplete="off" spellcheck="false">
      <button type="button" class="clear" id="clear" aria-label="Clear search" hidden>&times;</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="intro">
    <h1>What do you want fixed?</h1>
    <p class="lede" id="lede"></p>
    <p class="how">A <b>prompt</b> is plain text: copy it and paste it into any coding agent. A <b>command</b> starts with a slash, like <code>/impeccable</code>, and only works once its plugin is installed; each one says which. A <b>recipe</b> runs several commands in order.</p>
  </section>
  <div class="layout">
    <nav class="index" id="index" aria-label="Problems"></nav>
    <div id="list"></div>
  </div>
</main>
<p class="sr" id="status" role="status" aria-live="polite"></p>

<script type="application/json" id="library">__LIBRARY_DATA__</script>
<script>
const LIB = JSON.parse(document.getElementById("library").textContent);
const E = LIB.entries;
const BY = Object.fromEntries(E.map(e => [e.id, e]));
const GOAL_OF = {};
LIB.goals.forEach(([key, title, , ids]) => ids.forEach(id => { GOAL_OF[id] = { key, title }; }));

// What comes back, in plain words, from the mode each entry already records.
const GET = {
  read: "A report. Nothing is changed.",
  repro: "A report, plus a test that shows the problem. Your app code is not changed.",
  change: "A report, then a suggested fix for you to approve.",
  "Changes code": "It edits your code.",
  "Report only": "A report. Nothing is changed.",
  "Advice": "Advice in the chat. Nothing is changed.",
  "Asks before changing": "A plan first. Nothing changes until you say yes.",
  "Writes notes only": "Notes or documents. Your app code is not changed.",
  "Depends on the task": "Changes only how the agent works on your task.",
};
function getsBack(e) {
  if (e.iso) return "A report, tested on a separate copy. Your real data is not touched.";
  if (e.sec === "recipe") return "It edits your code, checking in with you between steps.";
  if (e.dmode === "Depends on the task" && e.sec !== "think") return "Depends on what it picks. It says which before it starts.";
  return GET[e.mode || e.dmode] || "";
}
function kindOf(e) {
  if (e.sec === "inv") return "Prompt · paste into any coding agent";
  if (e.sec === "db") return (e.flow ? "Database steps" : "Database prompt") + " · paste into any agent that can read your database";
  if (e.sec === "think") return "Add-on · put it in front of any task";
  if (e.sec === "recipe") return "Recipe · several commands in order";
  const b = (e.badge || "").toLowerCase();
  if (b.includes("built into claude code") || b === "bundled") return "Command · built into Claude Code";
  if (e.cmd && !e.cmd.startsWith("/") && !e.cmd.includes(":")) return "Command · run in a terminal or ask in plain words";
  return "Command · needs " + installName(e);
}
// The thing to install, in the words its install line uses, not the catalog group it sits in.
function installName(e) {
  if (e.group === "Engineering kit") return "the engineering-kit plugin";
  if (/plugin$/.test(e.badge || "") && e.badge !== "plugin") return "the " + e.badge;
  if (e.badge === "plugin" && (e.cmd || "").includes(":")) return "the " + e.cmd.slice(1).split(":")[0] + " plugin";
  return e.group;
}
const isCmd = e => e.sec === "ecmd" || e.sec === "dcmd";
const nameOf = e => isCmd(e) ? (e.cmd || e.t) : e.t;
const lineOf = e => e.line || e.why || e.use || "";
const copyText = e => e.sec === "ecmd" ? e.cmd : e.p;

const CH = LIB.choose || {};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "text") el.textContent = v; else if (k === "class") el.className = v; else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const link = id => BY[id] ? h("a", { href: "#" + id }, nameOf(BY[id])) : null;

// Find a library entry for a command named inside a recipe step.
const CMDIDX = {};
// Placeholders such as "<path>" always come last, so keep only the text before the first "<".
const norm = s => s.toLowerCase().split("<")[0].replace(/\s+/g, " ").trim();
E.forEach(e => { if (e.cmd) { const k = norm(e.cmd); if (!CMDIDX[k]) CMDIDX[k] = e.id; } });
const findCmd = s => { const k = norm(s); return CMDIDX[k] || CMDIDX[k.split(" ").slice(0, 2).join(" ")] || CMDIDX[k.split(" ")[0]] || null; };

function entry(e) {
  const btn = h("button", { type: "button", class: "copy", "data-id": e.id, "aria-label": "Copy " + nameOf(e) }, "Copy");
  const facts = h("dl", { class: "facts" });
  const fact = (k, v) => { if (v) facts.append(h("dt", {}, k), h("dd", {}, v)); };
  const body = h("div", { class: "body" });
  const label = e.sec === "ecmd" ? "What to type" : e.sec === "dcmd" ? (e.p && e.p !== e.cmd ? "Example to paste" : "What to type") : e.sec === "recipe" ? "Copied as one prompt" : "The full prompt";
  body.append(h("p", { class: "lab" }, label), h("pre", { class: "text" }, copyText(e)));
  if (e.sec === "db" && e.line && e.why) fact("Use it when", e.why);
  if (e.use && e.line) fact("Use it when", e.use);
  fact("What comes back", e.ev);
  fact("Skip it when", e.skip);
  fact("Agents often get this wrong", e.blind);
  fact("Watch out for", e.avoid);
  if (e.tools) fact("What it needs", e.tools.replace(/^Needs:\s*/, ""));
  if (e.steps) {
    const ids = e.steps.map(([c]) => findCmd(c)).filter((v, i, a) => v && a.indexOf(v) === i);
    if (ids.length) fact("Commands it uses", h("span", { class: "rel" }, ids.map(link)));
  }
  const c = CH[e.id];
  if (c && c.primary) fact("Pick this over " + nameOf(BY[c.primary]) + " when", c.when);
  if (c && c.alts) fact("The usual first pick for", c.job + ". Other choices: " + c.alts.map(a => nameOf(BY[a])).join(", ") + ".");
  if (e.kit && e.kit.length) fact("Commands that help with it", e.kit.join(", "));
  const rel = (e.rel || []).filter(id => BY[id]);
  if (rel.length) fact("Related", h("span", { class: "rel" }, rel.map(link)));
  if (isCmd(e)) fact("Comes from", h("a", { href: "#tool-" + slug(e.group) }, e.group + (e.badge ? " (" + e.badge + ")" : "")));
  if (facts.childNodes.length) body.append(facts);
  body.append(h("p", { class: "idtag" }, "Library ID " + e.id));
  const more = h("details", { class: "more" }, h("summary", {}, isCmd(e) ? "Show the example and details" : e.sec === "recipe" ? "Show the steps and details" : "Show the full prompt"), body);
  const get = getsBack(e);
  return h("li", { class: "entry", id: e.id },
    h("div", { class: "ehead" },
      h("div", { class: "what" },
        h("span", { class: "kind" }, kindOf(e)),
        h("h3", { class: isCmd(e) ? "cmd" : null }, nameOf(e)),
        h("p", { class: "line" }, lineOf(e)),
        get ? h("p", { class: "get" }, h("b", {}, "You get: "), get) : null),
      btn),
    more);
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// Build the page once; search only hides and shows.
const list = $("#list"), index = $("#index");
$("#lede").textContent = `${E.length} prompts, commands and recipes for coding agents such as Claude Code, Codex and Cursor. Pick the problem that sounds like yours, or search. Each entry says what it does and what you get back.`;
const found = h("p", { class: "found", id: "found", hidden: true });
const empty = h("p", { class: "empty", hidden: true });
list.append(found, empty);
const idxOl = h("ol");
index.append(h("h2", {}, "Problems"), idxOl);
const SECTIONS = [];
for (const [key, title, blurb, ids] of LIB.goals) {
  const ul = h("ul", { class: "entries" }, ids.map(id => entry(BY[id])));
  const sec = h("section", { class: "goal", id: "g-" + key, "aria-labelledby": "h-" + key }, h("h2", { id: "h-" + key }, title), h("p", {}, blurb), ul);
  list.append(sec);
  const n = h("span", { class: "n" }, ids.length);
  const a = h("a", { href: "#g-" + key }, h("span", {}, title), n);
  idxOl.append(h("li", {}, a));
  SECTIONS.push({ sec, a, n, ids, total: ids.length });
}

// Every command, by the tool it comes from: the reference cards for learning what each tool does.
const tools = h("section", { class: "tools", id: "tools" }, h("h2", {}, "Every command, by tool"),
  h("p", {}, "The same commands, listed by the plugin or skill they come from, with what each tool is for. Each name links to its entry above."));
const groups = [];
for (const e of E.filter(isCmd)) { let g = groups.find(x => x.name === e.group); if (!g) groups.push(g = { name: e.group, list: [] }); g.list.push(e); }
for (const g of groups) {
  const lead = g.list.find(e => e.gnote) || g.list[0];
  const badges = [...new Set(g.list.map(e => e.badge).filter(Boolean))].join(", ");
  const facts = h("dl", { class: "facts" });
  const fact = (k, v) => { if (v) facts.append(h("dt", {}, k), h("dd", {}, v)); };
  fact("Best for", lead.best); fact("Skip it for", lead.skipw); fact("Notes", lead.note);
  const body = h("div", {}, lead.gnote ? h("p", { class: "about" }, lead.gnote) : null, facts.childNodes.length ? facts : null);
  let sub = null, ul = null;
  for (const e of g.list) {
    if (!ul || (e.sub && e.sub !== sub)) { sub = e.sub; if (sub && g.list.some(x => x.sub !== sub)) body.append(h("h4", {}, sub)); ul = h("ul"); body.append(ul); }
    ul.append(h("li", {}, h("a", { href: "#" + e.id }, nameOf(e)), h("span", {}, lineOf(e))));
  }
  tools.append(h("details", { class: "tool", id: "tool-" + slug(g.name) },
    h("summary", {}, h("b", {}, g.name), h("span", {}, g.list.length + (g.list.length === 1 ? " command" : " commands") + (badges ? " · " + badges : ""))), body));
}
list.append(tools);
idxOl.append(h("li", { class: "tools-link" }, h("a", { href: "#tools" }, h("span", {}, "Every command, by tool"), h("span", { class: "n" }, E.filter(isCmd).length))));
const src = LIB.sources && LIB.sources.items && LIB.sources.items[0];
list.append(h("footer", {},
  h("p", {}, "Prompts need nothing installed. Commands need their plugin or skill; the line under each name says which. Recipes need every command they use."),
  src ? h("p", {}, "Source: ", h("a", { href: src[1], rel: "noopener" }, src[0]), ". " + src[2]) : null));

// Search: every word must appear somewhere in the entry or its problem group.
const HAY = {};
for (const e of E) HAY[e.id] = [e.id, e.t, e.cmd, e.line, e.why, e.use, e.p, e.ev, e.skip, e.aka, e.group, e.sub, GOAL_OF[e.id] && GOAL_OF[e.id].title, [].concat(e.tags || []).join(" "), [].concat(e.kit || []).join(" ")].filter(Boolean).join(" \n ").toLowerCase();
const q = $("#q"), clear = $("#clear"), status = $("#status");
function search() {
  const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  clear.hidden = !words.length;
  tools.hidden = !!words.length;
  let total = 0;
  for (const s of SECTIONS) {
    let shown = 0;
    for (const id of s.ids) {
      const ok = !words.length || words.every(w => HAY[id].includes(w));
      document.getElementById(id).hidden = !ok;
      if (ok) shown++;
    }
    total += shown;
    s.sec.hidden = !shown;
    s.n.textContent = words.length ? shown : s.total;
    s.a.classList.toggle("none", !shown);
  }
  found.hidden = !words.length || !total;
  found.textContent = total === 1 ? "1 match" : total + " matches";
  empty.hidden = !words.length || !!total;
  empty.textContent = "Nothing matches “" + q.value.trim() + "”. Try fewer or plainer words, or pick a problem from the list.";
  status.textContent = words.length ? (total ? found.textContent : "No matches") : "";
}
q.addEventListener("input", search);
clear.addEventListener("click", () => { q.value = ""; search(); q.focus(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== q && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); q.focus(); }
  if (ev.key === "Escape" && document.activeElement === q && q.value) { q.value = ""; search(); }
});

// A link to an entry or tool clears the search if it hides the target, then opens it.
function openTarget(id) {
  const el = id && document.getElementById(id);
  if (!el) return;
  if (el.closest("[hidden]")) { q.value = ""; search(); }
  if (el.matches("details.tool")) el.open = true;
  const d = el.querySelector && el.querySelector(":scope > details.more");
  if (d && el.classList.contains("entry")) el.classList.add("flash"), setTimeout(() => el.classList.remove("flash"), 1600);
}
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href").length > 1) openTarget(decodeURIComponent(a.getAttribute("href").slice(1)));
});
if (location.hash) openTarget(decodeURIComponent(location.hash.slice(1)));

// One copy action per entry.
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (err) {
    const t = h("textarea", { style: "position:fixed;opacity:0;top:0;left:0" }); t.value = text; document.body.append(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} t.remove(); return ok;
  }
}
list.addEventListener("click", async ev => {
  const b = ev.target.closest("button.copy");
  if (!b) return;
  const e = BY[b.dataset.id];
  const ok = await copy(copyText(e));
  b.textContent = ok ? "Copied" : "Select it below";
  b.classList.toggle("done", ok);
  status.textContent = ok ? "Copied " + nameOf(e) : "Copy failed. Open the entry and select the text.";
  if (!ok) { const d = b.closest(".entry").querySelector("details.more"); d.open = true; }
  clearTimeout(b._t); b._t = setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 1600);
});
</script>
