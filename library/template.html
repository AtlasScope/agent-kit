<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompt Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One quiet frame (header, search, four views) around a library you can scan. Section hues survive only as small wayfinding marks; amber is the single accent for actions and the current place. */
:root {
  --bg: #ECEAE4; --surface: #FFFFFF; --sunk: #E4E1DA; --hover: #DEDAD1;
  --line: #B9B3A6; --line-soft: #D2CEC4;
  --ink: #0B0A08; --ink-2: #26231E; --ink-3: #46423A;
  --accent: #8A4B00; --on-accent: #FFFFFF; --accent-soft: #F6E6CF;
  --s-inv: #00704A; --s-think: #5A2FC2; --s-ecmd: #006C80; --s-dcmd: #1849C4; --s-recipe: #BF1F5E; --s-desk: #8A4B00; --s-db: #5C6B00; --on-s: #FFFFFF;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --hh: 0px;
  --lift: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(28,22,10,.07), 0 6px 14px -6px rgba(28,22,10,.10), 0 20px 34px -22px rgba(28,22,10,.22);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 4px rgba(28,22,10,.08), 0 10px 22px -8px rgba(28,22,10,.16), 0 28px 44px -24px rgba(28,22,10,.30);
  --risk: #B42318;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --s-inv: #4BF0A8; --s-think: #BFA8FF; --s-ecmd: #3FE0F5; --s-dcmd: #8CB6FF; --s-recipe: #FF7FB2; --s-desk: #F5A524; --s-db: #C9E05A; --on-s: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7), 0 24px 40px -24px rgba(0,0,0,.9);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.09), 0 2px 4px rgba(0,0,0,.6), 0 12px 26px -10px rgba(0,0,0,.8), 0 30px 50px -24px rgba(0,0,0,1);
  --risk: #FF8A75;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --s-inv: #4BF0A8; --s-think: #BFA8FF; --s-ecmd: #3FE0F5; --s-dcmd: #8CB6FF; --s-recipe: #FF7FB2; --s-desk: #F5A524; --s-db: #C9E05A; --on-s: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7), 0 24px 40px -24px rgba(0,0,0,.9);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.09), 0 2px 4px rgba(0,0,0,.6), 0 12px 26px -10px rgba(0,0,0,.8), 0 30px 50px -24px rgba(0,0,0,1);
  --risk: #FF8A75;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -0.008em; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--ink); }
* { scrollbar-color: var(--line) transparent; }
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
svg.i { width: 16px; height: 16px; flex: none; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.mono { font-family: var(--mono); letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-soft); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 10px 28px; min-height: 64px; }
.brand { font-size: 18px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand b { color: var(--accent); }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: none; height: 36px; padding: 0 12px; border-radius: 8px; color: var(--ink-3); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 600; }
.tabs .ct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.search { position: relative; margin-left: auto; flex: 0 1 380px; min-width: 0; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 0 40px 0 36px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; pointer-events: none; }
.clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
.clear:hover { background: var(--hover); color: var(--ink); }
@media (hover: none) { .kbd { display: none; } }

main .wrap { padding-block: 32px 80px; }
.spectrum { display: grid; grid-template-columns: repeat(5, 1fr); height: 3px; }
.spectrum span { background: var(--c); }
.stages .chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); }

/* Shared controls */
.copy { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.primary { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--on-s); font-weight: 600; min-height: 34px; padding: 0 14px; border-radius: 9px; }
.copy.primary:hover { filter: brightness(1.1); color: var(--on-s); }
.copy .ok, .cmd .ok { display: none; }
.copy.copied .ok, .cmd.copied .ok { display: block; } .copy.copied .cp, .cmd.copied .cp { display: none; }
.cmd { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--mono); font-size: 12.5px; letter-spacing: 0; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
.cmd svg { width: 13px; height: 13px; opacity: .5; flex: none; }
.cmd:hover { border-color: var(--accent); } .cmd:hover svg { opacity: 1; }
.cmd.pick { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); border-color: color-mix(in srgb, var(--c, var(--accent)) 55%, var(--line)); font-weight: 600; }
.opt { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
.about { width: 30px; height: 30px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; }
.about:hover { color: var(--accent); background: var(--hover); }
.star { width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; margin: -5px -6px 0 0; }
.star:hover { color: var(--ink); background: var(--hover); }
.star[aria-pressed="true"] { color: var(--accent); }
.star[aria-pressed="true"] svg path { fill: currentColor; }
.chip { min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.chip .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.tag { font-size: 12px; font-weight: 600; padding: 0 8px; line-height: 20px; border-radius: 999px; background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); white-space: nowrap; }
@media (pointer: coarse) { .copy, .cmd, .chip { min-height: 44px; } .tabs button, .search input { height: 44px; } .star, .about { width: 44px; height: 44px; } .star { margin: -10px -12px -6px 0; } }

/* Page heads */
.head { max-width: 760px; margin-bottom: 32px; }
.head h1 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; text-wrap: balance; }
.head p { margin: 12px 0 0; color: var(--ink-2); font-size: 16px; max-width: 56ch; text-wrap: pretty; }
.block { margin-top: 48px; }
.block > h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.block > .lede { margin: 4px 0 16px; color: var(--ink-3); max-width: 64ch; }

/* Calm, lifted surfaces. Color marks where things belong (a wash at the top of each card, the ID badge, the selected tab); solid color is kept for the one thing you are choosing or the best pick. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 16px 16px 14px; border-radius: 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--surface)) 0, var(--surface) 76px); border: 1px solid color-mix(in srgb, var(--c) 22%, var(--line-soft)); box-shadow: var(--lift); }
.card:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); box-shadow: var(--lift-hi); }
.c-head { display: flex; align-items: flex-start; gap: 8px; }
.c-title { all: unset; cursor: pointer; flex: 1; min-width: 0; color: var(--ink); font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.35; overflow-wrap: anywhere; }
.c-title.code { font-family: var(--mono); font-size: 14px; letter-spacing: 0; }
.c-title:hover { color: var(--c); }
.c-title:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; border-radius: 4px; }
.c-desc { margin: 0; color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.c-steps { margin: 0; padding: 8px 10px; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0; background: var(--sunk); border-radius: 8px; }
.c-steps li + li::before { content: "→ "; color: var(--c); }
.c-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--ink-3); }
.badge { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0; padding: 0 7px; border-radius: 6px; line-height: 20px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.risk { color: var(--risk); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.risk::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.best-label { font-size: 12px; font-weight: 700; color: var(--c); }
.c-acts { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.c-acts .copy { flex: 1; justify-content: center; }
.copy.soft { min-height: 34px; padding: 0 14px; border-radius: 9px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c) 40%, var(--line-soft)); color: var(--c); font-weight: 600; }
.copy.soft:hover, .copy.soft:focus-visible, .card.best .copy.soft { background: var(--c); border-color: var(--c); color: var(--on-s); }
.details { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
.details:hover { border-color: var(--ink-3); color: var(--ink); }

/* Tabs that switch a panel. Unselected: a lifted neutral tile with a color dot. Selected: solid color. */
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.door { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 15px 18px 17px; border-radius: 16px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); min-width: 0; }
.door b { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
.door b::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.door b .n { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--c); }
.door span.d { font-size: 13.5px; color: var(--ink-2); }
.door:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); box-shadow: var(--lift-hi); }
.door:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.door[aria-selected="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 14px 30px -16px var(--c); }
.door[aria-selected="true"] b::before { background: currentColor; opacity: .8; }
.door[aria-selected="true"] b .n, .door[aria-selected="true"] span.d { color: inherit; opacity: .85; }
.sectabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.sectabs .door { padding: 12px 14px; }
.sectabs .door b { font-size: 15px; }
.sec-line { margin: 14px 0 18px; color: var(--ink-2); max-width: 75ch; }
.panel { margin-top: 28px; }
.panel-head { margin-bottom: 16px; }
.panel-head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.025em; }
.panel-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.gbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
.gtabs { display: contents; }
.gtab { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; white-space: nowrap; }
.gtab .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.gtab:hover { border-color: var(--c); }
.gtab[aria-selected="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.gtab[aria-selected="true"] .n { color: inherit; opacity: .8; }
.gsel { position: relative; display: inline-flex; }
.gsel select { -webkit-appearance: none; appearance: none; min-height: 34px; padding: 0 34px 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer; max-width: 100%; }
.gsel select.on { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.gsel::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; color: var(--ink-3); }
.gsel:has(select.on)::after { color: var(--on-s); }
.gsel.narrow { display: none; width: 100%; }
.gsel.narrow select { width: 100%; min-height: 44px; border-radius: 12px; }
.blurb { margin: -2px 0 16px; color: var(--ink-3); font-size: 14px; max-width: 80ch; }
details.gabout { margin: -2px 0 16px; max-width: 80ch; }
details.gabout summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.gabout summary::-webkit-details-marker { display: none; }
details.gabout summary svg { transition: transform .2s cubic-bezier(.2,.8,.2,1); color: var(--c); }
details.gabout[open] summary svg { transform: rotate(90deg); }
details.gabout p { margin: 6px 0 0; color: var(--ink-3); font-size: 14px; }
.gsec + .gsec { margin-top: 28px; }
.gsec h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.gsec h3 .n { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-3); }

/* Start */
.symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.symcard { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); font-weight: 500; line-height: 1.35; }
.symcard span { flex: 1; }
.symcard svg { color: var(--c); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.symcard:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.symcard:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.symcard[aria-expanded="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.symcard[aria-expanded="true"] svg { color: inherit; transform: rotate(90deg); }
.results { margin-top: 18px; padding: 18px; border-radius: 18px; background: color-mix(in srgb, var(--c) 7%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line-soft)); }
.results h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.sitbox { border-radius: 16px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--lift); padding: 4px 18px; }
.sitbox .stage-note { margin: 12px 0 4px; color: var(--ink-3); }
.sit { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 32px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.sit .when { margin: 0; }
.sit .cmds { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sit .or { color: var(--ink-3); font-size: 13px; }
.rcard .k { font-weight: 600; font-size: 15.5px; }
.rcard p { margin: 0; font-size: 14px; color: var(--ink-2); }
.rcard p.rule { color: var(--ink-3); }
.recent { margin-top: 28px; }
.recent h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.rlist { display: flex; flex-wrap: wrap; gap: 8px; }
.ritem { display: inline-flex; align-items: center; max-width: 100%; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); }
.ritem .rt { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 7px 4px 7px 12px; font-size: 13.5px; font-weight: 500; min-width: 0; }
.ritem .rt::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.ritem .rt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.ritem .rt:hover { color: var(--c); }
.ritem .rt:focus-visible { outline: 2px solid var(--c); border-radius: 8px; }
.ritem .rc { width: 34px; height: 34px; border: 0; background: none; color: var(--c); display: grid; place-items: center; border-radius: 8px; }
.ritem .rc:hover { background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.ritem .rc .ok { display: none; } .ritem .rc.copied .ok { display: block; } .ritem .rc.copied .cp { display: none; }

  else if (location.hash.startsWith("#e-")) { if (SH.pushed) history.back(); else history.replaceState(null, "", "#" + viewHash()); }
  if (S.view === "starred" && !S.q) render();
  const f = RETURN_FOCUS; RETURN_FOCUS = null;
  if (f && f.isConnected) f.focus({ preventScroll: true });
});
$("#sheet").addEventListener("click", ev => { if (ev.target.id === "sheet") closeSheet(); });

function basePrompt(e) {
  if (SH.ver === "desk" && e.desk) return e.sec === "inv" ? e.desk.core : e.desk.body;
  return e.p;
}
function composed(e) {
  const C = LIB.composer;
  const parts = [basePrompt(e)];
  if (SH.proj.length) parts.push("Project: " + SH.proj.map(k => LIB.projects[k][0] + " (watch for " + LIB.projects[k][1] + ")").join("; ") + ".");
  if (C.scope[SH.scope][1]) parts.push(C.scope[SH.scope][1]);
  parts.push(C.mode[SH.mode][1]);
  if (e.iso) parts.push("Anything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.");
  if (e.ev) parts.push("Evidence I expect: " + e.ev);
  if (e.blind) parts.push("Watch out: " + e.blind);
  if (e.avoid) parts.push("Avoid: " + e.avoid);
  if (SH.footer) parts.push(C.footer);
  return parts.join("\n\n");
}
function seg(label, options, cur, onpick) {
  return h("div", { class: "seg", role: "group", "aria-label": label }, options.map(([k, l]) => h("button", { type: "button", "aria-pressed": cur === k ? "true" : "false", onclick: () => onpick(k) }, l)));
}
function relChips(ids) { return h("div", { class: "rel" }, ids.filter(id => BY[id]).map(id => h("button", { type: "button", class: "chip", onclick: () => openSheet(id) }, h("span", { class: "n" }, id), BY[id].t))); }
function facts(rows) { return h("dl", { class: "facts" }, rows.filter(Boolean).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])); }
function sub(title, node) { return h("div", {}, h("p", { class: "sub-h" }, title), node); }

function drawSheet() {
  const e = BY[SH.id]; const box = $("#sheet-in");
  box.innerHTML = ""; box.style.setProperty("--c", SECCOLOR(e.sec));
  const meta = h("div", { class: "sh-meta" }, h("span", { class: "badge" }, e.id), h("span", {}, SEC[e.sec][1]), e.group && e.group !== SEC[e.sec][1] ? h("span", {}, e.group) : null, e.desk ? h("span", { class: "tag" }, "In Desk · " + e.desk.cat) : null, e.aka ? h("span", {}, "Field guide name: " + e.aka) : null);
  box.append(h("div", { class: "sh-head" },
    h("div", { class: "hd" }, h("h2", { id: "sheet-title", class: isCode(e) ? "code" : "" }, e.t), meta, e.why && e.sec !== "think" ? h("p", { class: "sh-why" }, e.why) : null),
    star(e.id, e.t), h("button", { type: "button", class: "x", "aria-label": "Close", html: SVG.x, onclick: closeSheet })));

  if (e.flow) {
    box.append(h("ol", { class: "steps" }, e.flow.map(([label, ids, note]) => h("li", {}, h("div", { class: "sb" }, h("b", {}, label), ids.length ? relChips(ids) : null, h("span", { class: "for" }, note))))));
    box.append(h("p", { class: "prompt" }, e.p));
    box.append(h("div", { class: "acts" }, copyBtn("Copy whole workflow", e.p, { primary: true, id: e.id, toast: "Copied " + e.t })));
    box.append(h("p", { class: "note" }, "The copied text includes each prompt in full, so it works in any agent without this page."));
  }
  if ((INVLIKE.has(e.sec) && !e.flow) || e.sec === "think" || e.sec === "desk") {
    if (e.desk && e.sec !== "desk") box.append(seg("Wording", [["desk", "Desk wording"], ["guide", "Guide wording"]], SH.ver, k => { SH.ver = k; drawSheet(); }));
    const text = INVLIKE.has(e.sec) ? basePrompt(e) : (SH.ver === "desk" && e.desk ? e.desk.body : e.p);
    box.append(h("p", { class: "prompt" }, text));
    box.append(h("div", { class: "acts" }, copyBtn("Copy this wording", text, { primary: true, id: e.id, toast: "Copied “" + e.t + "”" })));
    if (e.use) box.append(h("p", { class: "note" }, h("b", {}, "When to use. "), e.use));
    if (e.desk && e.sec === "inv" && SH.ver === "desk" && e.desk.body.slice(e.desk.core.length).trim()) box.append(h("p", { class: "note" }, "In Desk this prompt also ends with: “" + e.desk.body.slice(e.desk.core.length).trim() + "” The fuller prompt below adds a matching line for the option you pick."));
    if (e.also) box.append(h("p", { class: "note" }, "The Desk wording also covers " + e.also.map(id => id + " (" + BY[id].t + ")").join(", ") + "."));
  }
  if (e.sec === "db" && !e.flow) {
    box.append(facts([
      ["What it should bring back", e.ev], ["Skip it when", e.skip], ["Common overreach", e.avoid], ["What you need", e.tools],
      ["How it runs", modeLabel(e) + ". " + (e.iso ? "Reads production, and runs any rebuild or replay on a separate database you approve." : "Reads only. Nothing in production changes.")],
      ["Works with", e.plat], ["Install", "Nothing. It is a plain prompt for any agent."]]));
    const refs = (e.refs || []).filter(k => LIB.dbTools?.[k]);
    if (refs.length) box.append(sub("Tools that can help (installed separately)", h("ul", { class: "reflist" }, refs.map(k => { const [name, url, what] = LIB.dbTools[k]; return h("li", {}, h("a", { href: url, target: "_blank", rel: "noopener" }, name), h("span", {}, what)); }))));
    if (refs.length && LIB.dbToolsVerified) box.append(h("p", { class: "note" }, "Install steps last checked " + LIB.dbToolsVerified + ". Follow the linked page if they have changed."));
  }
  if (INVLIKE.has(e.sec) && !e.flow) {
    if (e.sec === "inv") box.append(facts([
      ["What it should bring back", e.ev], ["Skip it when", e.skip], ["What you need", e.tools],
      ["How it runs", MODES[e.mode] + ". " + TOPO[e.top] + ". " + (e.scope === "wide" ? "Looks across the whole project." : "Looks at one area.")],
      ["Most useful for", (e.proj || []).filter(k => LIB.projects?.[k]).length ? e.proj.filter(k => LIB.projects?.[k]).map(k => LIB.projects[k][0]).join(", ") : "Any project"],
      e.kit.length ? ["Skills that help", h("div", {}, e.kit.map(k => { const id = findCmd(k); return id ? h("button", { type: "button", class: "cmd", onclick: () => openSheet(id) }, k) : h("span", { class: "cmd" }, k); }))] : null]));
    if (e.blind) box.append(h("p", { class: "note" }, h("b", {}, "Where agents slip up. "), e.blind));
    if (e.runs) box.append(h("p", { class: "note" }, h("b", {}, "Past runs. "), ...e.runs.flatMap(([n, u], i) => [i ? ", " : "", h("a", { href: u, target: "_blank", rel: "noopener" }, n)])));
    const C = LIB.composer;
    const out = h("pre", { class: "out" }, composed(e));
    let cbtn = copyBtn("Copy full prompt", composed(e), { primary: true, toast: "Copied full " + e.id });
    const refresh = () => { out.textContent = composed(e); const n = copyBtn("Copy full prompt", composed(e), { primary: true, toast: "Copied full " + e.id }); cbtn.replaceWith(n); cbtn = n; };
    const projBox = h("div", { class: "checks" }, Object.entries(LIB.projects || {}).map(([k, [name]]) => {
      const inp = h("input", { type: "checkbox", id: "pj-" + k }); inp.checked = SH.proj.includes(k);
      inp.addEventListener("change", () => { SH.proj = inp.checked ? [...SH.proj, k] : SH.proj.filter(x => x !== k); refresh(); });
      return h("label", { for: "pj-" + k }, inp, name);
    }));
    const ft = h("input", { type: "checkbox", id: "pj-footer" }); ft.checked = SH.footer;
    ft.addEventListener("change", () => { SH.footer = ft.checked; refresh(); });
    const det = h("details", { class: "composer" }, h("summary", {}, h("i", { html: SVG.chev, style: "display:contents" }), "Build a fuller prompt", h("span", {}, "choose what it may change, how far it looks, which project")),
      h("div", { class: "cbody" },
        h("div", { class: "crow" }, h("span", { class: "lab" }, "Changes"), seg("Mode", Object.entries(C.mode).map(([k, v]) => [k, v[0]]), SH.mode, k => { SH.mode = k; SH.open = true; drawSheet(); })),
        h("div", { class: "crow" }, h("span", { class: "lab" }, "How far"), seg("Scope", Object.entries(C.scope).map(([k, v]) => [k, v[0]]), SH.scope, k => { SH.scope = k; SH.open = true; drawSheet(); })),
        Object.keys(LIB.projects || {}).length ? h("div", { class: "crow" }, h("span", { class: "lab" }, "Project"), projBox) : null,
        h("div", { class: "crow" }, h("span", { class: "lab" }, "Ending"), h("div", { class: "checks" }, h("label", { for: "pj-footer" }, ft, "End with a table for my playbook"))),
        out, h("div", { class: "acts" }, cbtn)));
    if (SH.open) det.open = true;
    det.addEventListener("toggle", () => { SH.open = det.open; });
    box.append(det);
  }
  if (e.sec === "dcmd") {
    box.append(h("p", { class: "prompt code" }, e.p));
    box.append(h("div", { class: "acts" }, copyBtn("Copy example prompt", e.p, { primary: true, id: e.id, toast: "Copied example" }), cmdChip(e.cmd, e.cmd)));
    box.append(facts([["What it does", e.dmode], ["Comes from", e.group + (e.badge ? " · " + e.badge : "")], e.best ? ["Best for", e.best] : null, e.skipw ? ["Skip it for", e.skipw] : null]));
    if (e.note) box.append(h("p", { class: "note" }, e.note));
    const sibs = E.filter(x => x.sec === "dcmd" && x.group === e.group && x.id !== e.id).slice(0, 12);
    if (sibs.length) box.append(sub("More from " + e.group, relChips(sibs.map(x => x.id))));
  }
  if (e.sec === "ecmd") {
    box.append(h("div", { class: "acts" }, copyBtn("Copy " + e.cmd, e.cmd, { primary: true, toast: "Copied " + e.cmd })));
    box.append(facts([["Comes from", e.group + " · " + e.badge], ["About it", e.gnote]]));
  }
  if (e.sec === "recipe") {
    box.append(h("ol", { class: "steps" }, e.steps.map(([cmd, why]) => {
      const id = findCmd(cmd);
      return h("li", {}, h("div", { class: "sb" }, h("span", { class: "opt" }, cmdChip(cmd, cmd), id ? aboutBtn(id, cmd) : null), h("span", { class: "for" }, why)));
    })));
    box.append(h("p", { class: "prompt" }, e.p));
    box.append(h("div", { class: "acts" }, copyBtn("Copy whole recipe", e.p, { primary: true, id: e.id, toast: "Copied " + e.t })));
  }
  const rel = e.flow ? [] : (e.rel || []).filter(id => BY[id]);
  if (rel.length) box.append(sub(e.sec === "ecmd" ? "Prompts it helps with" : "Related", relChips(rel)));
  if (INVLIKE.has(e.sec)) {
    const tools = E.filter(x => x.sec === "ecmd" && (x.rel || []).includes(e.id));
    if (tools.length) box.append(sub("Commands that help", relChips(tools.map(x => x.id))));
  }
  box.append(h("div", { class: "sh-bottom" }, h("button", { type: "button", class: "details", onclick: closeSheet }, "Close")));

/* Header height, search and boot */
const top_ = $("#top");
function measure() { document.documentElement.style.setProperty("--hh", (getComputedStyle(top_).position === "sticky" ? top_.offsetHeight : 0) + "px"); }
new ResizeObserver(measure).observe(top_); addEventListener("resize", measure); measure();
const q = $("#q");
q.addEventListener("input", () => { S.q = q.value.trim(); $("#clear").hidden = !S.q; $("#kbd").hidden = !!S.q; render(); window.scrollTo(0, 0); });
q.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && q.value) { ev.preventDefault(); clearSearch(); $("#status").textContent = ""; render(); }
  if (ev.key === "Enter" && S.q) { const first = searchList()[0]; if (first) { ev.preventDefault(); copy(copyText(first), null, "Copied best match: “" + first.t + "”").then(ok => ok && noteCopy(first.id)); } }
});
$("#clear").addEventListener("click", () => { clearSearch(); render(); q.focus(); });
document.addEventListener("keydown", ev => { if (ev.key === "/" && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") && !$("#sheet").open) { ev.preventDefault(); q.focus(); } });
function fromHash() {
  const hs = decodeURIComponent(location.hash.slice(1));
  if (hs.startsWith("e-") && BY[hs.slice(2)]) { if (!$("#sheet").open) { if (RENDERED !== viewHash()) render(); openSheet(hs.slice(2)); } return; }
  if ($("#sheet").open) { HIST_CLOSE = true; closeSheet(); }
  if (hs && hs === RENDERED) return;
  if (setLib(hs)) { S.view = "library"; clearSearch(); save(); render(); window.scrollTo(0, 0); return; }
  if (hs === "recipes") { go("library", "s-recipe"); return; }
  if (VIEWS.includes(hs)) S.view = hs;
  render();
}
addEventListener("hashchange", fromHash);
fromHash();
</script>
