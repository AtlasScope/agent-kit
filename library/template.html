<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompt Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Three ways in (Prompts, Skills, Recipes), each a short list of categories, each category a list you can read top to bottom.
   Colour says only which kind of thing you are looking at: green prompts, blue skills, pink recipes. Amber is for actions. */
:root {
  --bg: #ECEAE4; --surface: #FFFFFF; --sunk: #E4E1DA; --hover: #DEDAD1;
  --line: #B9B3A6; --line-soft: #D2CEC4;
  --ink: #0B0A08; --ink-2: #26231E; --ink-3: #4F4A41;
  --accent: #8A4B00; --on-accent: #FFFFFF; --accent-soft: #F6E6CF;
  --k-prompt: #00704A; --k-skill: #1849C4; --k-recipe: #BF1F5E; --on-k: #FFFFFF;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --lift: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(28,22,10,.07), 0 6px 14px -6px rgba(28,22,10,.10), 0 20px 34px -22px rgba(28,22,10,.22);
  --risk: #B42318;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --k-prompt: #4BF0A8; --k-skill: #8CB6FF; --k-recipe: #FF7FB2; --on-k: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7);
  --risk: #FF8A75;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -0.008em; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
svg.i { width: 16px; height: 16px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-inline: 32px; } }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-soft); }
.top .wrap { display: flex; align-items: center; gap: 10px 24px; min-height: 64px; }
.brand { all: unset; cursor: pointer; font-size: 18px; font-weight: 600; letter-spacing: -0.025em; white-space: nowrap; }
.brand b { color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: none; height: 38px; padding: 0 13px; border-radius: 9px; color: var(--ink-3); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 600; }
.search { position: relative; margin-left: auto; flex: 0 1 360px; min-width: 0; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 0 38px 0 36px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
main .wrap { padding-block: 36px 96px; }

/* Shared */
.kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--c); letter-spacing: 0.01em; }
.kicker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
h1.title { margin: 6px 0 0; font-size: clamp(28px, 3.4vw, 38px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--ink-2); font-size: 16.5px; max-width: 62ch; text-wrap: pretty; }
.back { all: unset; cursor: pointer; display: none; align-items: center; gap: 6px; color: var(--ink-3); font-size: 14px; font-weight: 500; margin-bottom: 14px; min-height: 40px; }
.back:hover { color: var(--ink); }
.back svg { transform: rotate(180deg); }
.copy { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line-soft)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); color: var(--c); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.copy:hover, .copy:focus-visible { background: var(--c); border-color: var(--c); color: var(--on-k); }
.copy .ok, .cmdchip .ok { display: none; } .copy.copied .ok, .cmdchip.copied .ok { display: block; } .copy.copied .cp, .cmdchip.copied .cp { display: none; }
.cmdchip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 13px; letter-spacing: 0; color: var(--ink); }
.cmdchip:hover { border-color: var(--c); }
.cmdchip svg { width: 13px; height: 13px; opacity: .6; }
.tag { font-size: 12px; font-weight: 600; padding: 0 8px; line-height: 20px; border-radius: 999px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); white-space: nowrap; }
.mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--on-k); background: var(--k-prompt); padding: 0 8px 0 6px; border-radius: 999px; line-height: 20px; white-space: nowrap; }
.mark svg { width: 12px; height: 12px; }
.risk { color: var(--risk); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: inherit; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.code { font-family: var(--mono); font-size: .93em; letter-spacing: 0; }
.more-res { margin-top: 14px; min-height: 32px; }
@media (pointer: coarse) { .copy, .cmdchip, .tabs button, .search input { min-height: 44px; } }

/* Home: three doors */
.home-head { max-width: 760px; }
.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
.kind { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-soft); border-top: 4px solid var(--c); box-shadow: var(--lift); }
.kind:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); border-top-color: var(--c); }
.kind:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
.kind h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 10px; }
.kind h2 .n { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--c); letter-spacing: 0; }
.kind .def { margin: 0; font-size: 15.5px; font-weight: 600; color: var(--ink); }
.kind .more { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.kind .eg { margin: auto 0 0; padding-top: 12px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 13.5px; }
.kind .go { color: var(--c); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.homegrid { display: flex; flex-direction: column; }
.complaints { margin-top: 44px; }
ol.steps .stepcopy { margin-left: 8px; vertical-align: 1px; font-family: var(--sans); font-size: 12.5px; letter-spacing: 0; padding: 2px 9px; min-height: 28px; }
@media (pointer: coarse) { ol.steps .stepcopy { min-height: 44px; } }
.complaints h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.complaints p { margin: 4px 0 14px; color: var(--ink-3); }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 14px; }
.qchip:hover { border-color: var(--accent); color: var(--ink); }

/* Overview of categories */
.cats-sec { margin-top: 36px; }
.cats-sec > h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.cats-sec > p { margin: 2px 0 14px; color: var(--ink-3); max-width: 70ch; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.cat { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--lift); }
.cat:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.cat:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.cat b { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; display: flex; align-items: baseline; gap: 8px; }
.cat b .n { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--c); letter-spacing: 0; }
.cat span { color: var(--ink-2); font-size: 14px; }
.cat.quiet { box-shadow: none; background: transparent; border-style: dashed; }
.tips { margin-top: 28px; padding: 18px 20px; border-radius: 16px; background: color-mix(in srgb, var(--c) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line-soft)); }
.tips h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
.tips ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px 20px; counter-reset: t; }
.tips li { counter-increment: t; font-size: 14px; color: var(--ink-2); }
.tips li b { display: block; color: var(--ink); font-size: 14.5px; }
.tips li b::before { content: counter(t) ". "; color: var(--c); }

/* Category page: rail + list */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 110px); overflow-y: auto; padding: 0 4px 12px 0; }
.rail .all { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13.5px; font-weight: 500; padding: 4px 10px 10px; }
.rail .all:hover { color: var(--ink); }
.rail .all svg { transform: rotate(180deg); }
.rail h3 { margin: 14px 0 6px 10px; font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.rail .r { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
.rail .r .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.rail .r:hover { background: var(--hover); color: var(--ink); }
.rail .r:focus-visible { outline: 2px solid var(--c); }
.rail .r[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--c), var(--lift); }
.cathead { margin-bottom: 22px; max-width: 70ch; }
.cathead h1 { margin: 4px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
.cathead p { margin: 6px 0 0; color: var(--ink-2); }
.cathead .how { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; color: var(--ink-3); font-size: 14px; }
.sub { margin: 30px 0 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); }

/* One item: name, what it does, when to use it, what you get back, Copy. Open it for the full text. */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; box-shadow: var(--lift); padding: 16px 18px; scroll-margin-top: 90px; }
.item.hl { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent), var(--lift); }
.it-head { display: flex; align-items: flex-start; gap: 14px; }
.it-name { flex: 1; min-width: 0; }
.it-name h3 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.35; overflow-wrap: anywhere; }
.it-name h3.code { font-family: var(--mono); font-size: 15px; letter-spacing: 0; }
.it-what { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; max-width: 72ch; text-wrap: pretty; }
.it-when { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); max-width: 72ch; }
.it-when b { color: var(--ink); font-weight: 600; }
.it-meta { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--ink-3); }
.it-meta .kdot { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; }
.it-meta .kdot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.foot-copy { display: none; }
.toggle { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-left: auto; color: var(--ink-2); font-size: 13.5px; font-weight: 500; min-height: 28px; }
.toggle:hover { color: var(--ink); }
.toggle:focus-visible { outline: 2px solid var(--c); border-radius: 4px; }
.toggle svg { transform: rotate(90deg); transition: transform .18s; }
.toggle[aria-expanded="true"] svg { transform: rotate(-90deg); }
.more-box { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.more-box > * { align-self: stretch; }
.more-box > .copy { align-self: flex-start; }
pre.text { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line-soft); font-family: var(--sans); font-size: 14px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.facts { margin: 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 0; }
.facts dt, .facts dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.facts dt { color: var(--ink-3); padding-right: 14px; }
.facts dd { color: var(--ink-2); overflow-wrap: anywhere; }
.facts code { font-family: var(--mono); font-size: 13px; }
.closest { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
ol.steps { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
ol.steps li::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c); width: 24px; height: 24px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); display: grid; place-items: center; }
ol.steps li > span { padding-top: 2px; }
ol.steps .stp { font-weight: 600; color: var(--ink); }
ol.steps .stp.code { font-family: var(--mono); font-size: 13px; letter-spacing: 0; font-weight: 500; }
ol.steps .kd { display: inline-block; margin: 0 2px 0 6px; font-size: 11.5px; font-weight: 600; color: var(--k); }

/* Search */
.res-sec { margin-top: 28px; }
.res-sec h2 { margin: 0 0 10px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.res-sec h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.res-sec h2 .n { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--ink-3); }

footer.foot { margin-top: 72px; padding-top: 16px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; }
footer.foot p { margin: 0; max-width: 80ch; }
.src { padding: 12px 0; border-top: 1px solid var(--line-soft); }
.src h3 { margin: 0; font-size: 15px; } .src p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: 10px; z-index: 60; }

@media (max-width: 960px) {
  .kinds { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .back { display: inline-flex; }
}
@media (max-width: 760px) {
  .complaints { order: -1; margin: 24px 0 8px; }
  .top { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .top .wrap { flex-wrap: wrap; padding-block: 12px; min-height: 0; gap: 10px; }
  .search { order: 2; flex: 1 1 100%; margin: 0; }
  .tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .tabs button { justify-content: center; height: 48px; font-size: 14.5px; }
  main .wrap { padding-block: 24px calc(100px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .kind { padding: 18px; } .kind h2 { font-size: 21px; }
  .item { padding: 14px; }
  .it-head { flex-direction: column; gap: 10px; }
  .head-copy { display: none; }
  .it-meta .foot-copy { display: inline-flex; order: 9; flex: 1 1 100%; }
  .it-meta .toggle { order: 10; margin: 0 auto; }
  .facts { grid-template-columns: minmax(0, 1fr); } .facts dd { border-top: 0; padding-top: 0; }
  footer.foot { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .toggle svg { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <button type="button" class="brand" id="brand">Prompt Library<b>.</b></button>
    <nav class="tabs" id="tabs" aria-label="Kinds"></nav>
    <div class="search" role="search">
      <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5l3.25 3.25" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search, or describe the problem" aria-label="Search the library" autocomplete="off" spellcheck="false">
      <button type="button" class="clear" id="clear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<p class="sr" id="status" role="status" aria-live="polite"></p>

<script type="application/json" id="library">__LIBRARY_DATA__</script>
<script>
const LIB = JSON.parse(document.getElementById("library").textContent);
const V = LIB.v3 || { tips: [], promptCats: [], when: {}, skillGroups: [], recipeGroups: [], recipes: [] };
const NOT_SHOWN = LIB.notShown || {};
const PATCH = V.patch || {};
const E = [...LIB.entries, ...(LIB.keen || []), ...V.recipes.map(r => ({ ...r, sec: "recipe2" }))].filter(e => !NOT_SHOWN[e.id]).map(e => PATCH[e.id] ? { ...e, ...PATCH[e.id] } : e);
const BY = Object.fromEntries(E.map(e => [e.id, e]));
// An old link to a hidden entry opens what replaced it (an entry or a page recipe).
const replacement = id => { for (let i = 0; i < 5 && !BY[id] && NOT_SHOWN[id] && typeof NOT_SHOWN[id] === "string"; i++) id = NOT_SHOWN[id]; return BY[id] ? id : null; };
const CLOSEST = LIB.closest || {};
function norm(s) { return s.toLowerCase().split("<")[0].replace(/,.*$/, "").replace(/\s+/g, " ").trim(); }
const CMDIDX = {};

function searchList() {

  words = words.map(stem).map(w => [w, new RegExp("(^|[^a-z0-9])" + esc(w))]);
  if (!words.length) return { list: [], loose: false };
  const frontRow = (LIB.front || []).find(([t]) => t.toLowerCase() === ql);
  const scored = SEARCHABLE.map((e, i) => {
    const f = IDX[e.id]; let s = 0, hit = 0;
    if (f[0][0] === ql) s += 1000;
    if (e.cmd && norm(e.cmd) === ql) s += 900;
    if (f[1][0].includes(ql) && ql.length > 2) s += 200;
    // A problem picked from the home page puts its own picks first, best first.
    if (frontRow && frontRow[1].includes(e.id)) { s += 500 - frontRow[1].indexOf(e.id) * 20; hit = words.length; return { e, i, s, hit }; }

  page(app, "skill", railSecs, head, body);
}

function renderSearch(app) {
  const { list: found, loose } = searchList();
  const n = found.length;
  $("#status").textContent = n ? `${n} matches. Press Enter to open the best one.` : "No matches";
  app.append(h("div", { class: "home-head" }, h("h1", { class: "title" }, n ? `${n} ${loose ? "close " : ""}match${n === 1 ? "" : "es"}` : "No matches"),
    h("p", { class: "lede" }, n ? (loose ? `Nothing matches every word of “${S.q}”, so these match most of them. ` : `For “${S.q}”. `) + "Press Enter to open the best one." : "Try a plain problem such as “slow”, “cluttered” or “numbers wrong”, or a command name.")));
  if (!n) return;
  app.append(h("section", { class: "res-sec", style: "--c:var(--accent)" }, h("h2", {}, "Best match"), h("div", { class: "list" }, item(found[0], { kind: true, where: true }))));
  for (const k of ["prompt", "skill", "recipe"]) {
    const all = found.slice(1).filter(e => kindOf(e) === k); if (!all.length) continue;
    app.append(h("section", { class: "res-sec", style: `--c:${KIND[k].c}` }, h("h2", {}, KIND[k].name, h("span", { class: "n" }, String(all.length))), h("div", { class: "list" }, (S.more?.has(k) ? all : all.slice(0, 12)).map(e => item(e, { where: true }))),
      all.length > 12 && !S.more?.has(k) ? h("button", { type: "button", class: "linkbtn more-res", onclick: () => { (S.more = S.more || new Set()).add(k); render(); } }, `Show all ${all.length} ${KIND[k].name.toLowerCase()}`) : null));
  }
}
function renderSources(app) {
  const SRC = LIB.sources || { intro: "", items: [] };
  app.append(h("div", { class: "home-head" }, h("h1", { class: "title" }, "Where these came from"), SRC.intro ? h("p", { class: "lede" }, SRC.intro) : null));
  app.append(h("div", { style: "margin-top:20px" }, SRC.items.map(([t, url, d]) => h("div", { class: "src" }, h("h3", {}, url ? h("a", { href: url, target: "_blank", rel: "noopener" }, t) : t), h("p", {}, d)))));

function footer() {
  return h("footer", { class: "foot" },
    h("p", {}, "Copy puts the text on your clipboard. Nothing leaves your browser. Items marked New have not been run on a real project yet."),
    h("p", {}, h("button", { type: "button", class: "linkbtn", onclick: () => go("sources") }, "Where these came from")));
}
function render() {
  renderTabs();
  const app = $("#app"); app.innerHTML = "";
  if (S.q) renderSearch(app);
  else ({ home: renderHome, prompts: renderPrompts, skills: renderSkills, recipes: renderRecipes, sources: renderSources }[S.view] || renderHome)(app);
  app.append(footer());
  const t = S.q ? "Search" : { prompts: "Prompts", skills: "Skills", recipes: "Recipes", sources: "Sources" }[S.view];
  document.title = (t ? t + " · " : "") + "Prompt Library";
}

/* Search box */
const q = $("#q"); let qt;
q.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { S.q = q.value.trim(); $("#clear").hidden = !S.q; if (S.q) setHash(searchHash(), false); else setHash(routeHash(), false); render(); }, 120); });
q.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && S.q) { const best = searchList().list[0]; if (best) { ev.preventDefault(); q.blur(); openItem(best.id); } }
  if (ev.key === "Escape") { clearSearch(); setHash(routeHash(), false); render(); }
});
$("#clear").addEventListener("click", () => { clearSearch(); setHash(routeHash(), false); render(); q.focus(); });
$("#brand").addEventListener("click", () => go("home"));
document.addEventListener("keydown", ev => { if (ev.key === "/" && document.activeElement !== q && !ev.metaKey && !ev.ctrlKey && !/input|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); q.focus(); } });
fromHash();
