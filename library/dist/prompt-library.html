 the past","p":"Choose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.","why":"Past reports, backfills, restatements or changed classification rules matter.","ev":"Two or more past checkpoints, when each record was true and when it was known, the source revisions, and changes you can demonstrate.","skip":"Nobody needs past results to stay reproducible.","avoid":"Requiring bitemporal storage everywhere. Work out what is actually needed before choosing a structure.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D03","R04","PG01","PG15"],"tags":"historical report changed, old data meanings, as-of, restatement, backfill, point in time, history rewritten","line":"Checks whether you can still reproduce what the database said on an earlier date, after the data or the rules changed."},{"id":"PG05","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Map every place that writes to the database","p":"Map the actual write paths for the important tables in this application. Identify every script, job, API, function, trigger and agent that can create, update or delete their records. Show who owns each field, which paths overlap, and where two writers can disagree or overwrite each other. Recommend the simplest ownership model supported by the existing system.","why":"Several jobs, functions, APIs or agents change the same data, or nobody is sure who owns it.","ev":"A map from each writer to its tables and columns, then to triggers, side effects and consumers, with the cases where writers overlap or conflict.","skip":"One code path writes each table.","avoid":"Treating every extra writer as wrong. Find the paths that actually conflict.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","R05","PG06","PG09"],"tags":"what writes to this table, mysterious overwrites, who owns this field, multiple writers, write ownership","line":"Maps every job, function and agent that writes to the database, and the places where two of them change the same data."},{"id":"PG06","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Stop rewriting data that hasn't changed","p":"Investigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.","why":"Upserts and updates run at high volume, imports are costly, or vacuum and write-ahead log churn look high.","ev":"Statement counts, the share of writes that really change a row, dead-row and churn figures, index and WAL effects where measurable, and before-and-after tests on a copy.","skip":"Write volume is small, or every write is a change that has to happen.","avoid":"Suppressing deliberate last-seen timestamps, trigger side effects, version counters or refreshes that are meant to happen.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy for before-and-after tests. Helps: query statistics (pg_stat_statements).","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P04","P09","PG05","PG07","PG13"],"tags":"too many upserts, write amplification, upserts identical rows, unchanged updates, rewriting everything, nightly reload, dead tuples, wal","refs":["pgss","bestpractices"],"iso":true,"line":"Finds imports and updates that rewrite rows that didn't change, which costs money and slows the database."},{"id":"PG07","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Is our ingestion process more complicated than necessary?","p":"Trace one complete ingestion cycle from the original source to the final database records. Identify repeated parsing, unnecessary intermediate states, duplicate validation, repeated reads, redundant transformations and writes that could be consolidated. Recommend the simplest workflow that preserves accuracy, traceability, failure recovery and the ability to process corrections.","why":"The import pipeline is long, slow to correct, or does the same work at several stages.","ev":"One real trace from source to final rows, the work done twice, the checkpoints, a shorter path, and checks that the shorter path gives the same results and still replays.","skip":"The pipeline is already one short step from source to table.","avoid":"Removing evidence, provenance or checkpoints that recovery depends on.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy to check the shorter path against.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D04","PG05","PG06","PG08","PG09"],"tags":"ingestion, etl, import pipeline, simplify pipeline, sprawling pipeline, data pipeline","iso":true,"line":"Traces one real import from start to finish and proposes a shorter path that gives the same result."},{"id":"PG08","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Can we rerun everything without damaging the data?","p":"Examine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.","why":"Imports get retried, schedulers overlap, files are replayed, or runs fail halfway.","ev":"Replay scenarios with their conflict keys, interrupted-run cases, before-and-after data comparisons and a safe way to resume.","skip":"Every import runs once, by hand, with nothing to retry.","avoid":"Calling an import safe to rerun just because the SQL has ON CONFLICT.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: an isolated database for replay tests, and pgTAP.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["R01","R06","PG05","PG07"],"tags":"failed run duplicates records, retry, replay, idempotent import, rerun safely, backfill twice, duplicate import","refs":["pgtap"],"iso":true,"line":"Checks whether rerunning an import or a failed job can duplicate or damage data, and how to make reruns safe."},{"id":"PG09","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Find where write logic should live","p":"Trace how records are validated, transformed and written across application code, database functions, triggers and background jobs. Find rules duplicated in different layers or placed where they are difficult to test and maintain. Recommend the simplest ownership boundary for each rule, without assuming that moving more logic into Postgres is automatically better.","why":"Business rules are split across SQL, triggers, edge functions, server routes and workers.","ev":"Each rule with the layers that enforce it, the current owner, duplicated checks, how testable each place is, transaction limits and what a change would touch.","skip":"Each rule already lives in exactly one place.","avoid":"Automatically favouring stored procedures, or automatically moving everything out of the database.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","PG05","PG07","PG10"],"tags":"trigger or app code, validation in trigger, business logic in database, edge function, stored procedure, duplicate validation","line":"Finds business rules split across the database, server code and background workers, and says where each should live."},{"id":"PG10","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Which database objects no longer earn their keep?","p":"Examine the tables, views, functions, triggers, indexes and materialized views in this database. Identify redundant representations, obsolete objects, overlapping responsibilities, unnecessary dependency chains and abstractions that no longer provide meaningful value. Verify actual consumers before recommending removal. Rank opportunities by complexity eliminated, operational savings and migration risk.","why":"The list of views, functions and triggers has grown hard to reason about.","ev":"A map of objects, what depends on them and who uses them, the removal candidates, migration risks and how much complexity goes away.","skip":"The schema is small and every object has a known reader.","avoid":"Deleting objects that look unused but are called dynamically or by outside clients.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access to the catalog, plus the repository and any outside clients.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A03","I06","PG09","PG11","PG12"],"tags":"unused views, dead views, unused functions, schema cleanup, too many views, triggers, database clutter, drop unused","refs":["bestpractices"],"line":"Lists the views, functions and triggers nothing needs any more, and what removing each one would risk."},{"id":"PG11","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Are we storing the same truth multiple times?","p":"Find concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.","why":"Caches, aggregates, materialized views or derived columns drift from the raw facts.","ev":"The authoritative source and each copy, how each is refreshed, examples of drift, and what each copy costs readers and writers.","skip":"Each fact is stored once.","avoid":"Rejecting all denormalisation. Copies kept for speed or history can be worth it.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","D02","PG05","PG10"],"tags":"stale view, materialized view out of date, duplicate data, cache disagrees, derived column, denormalized, source of truth","line":"Finds the same facts stored in several places that have drifted apart, and says which copy to trust."},{"id":"PG12","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Can the schema be easier to understand without losing depth?","p":"Review the database's logical organization from the perspective of a new senior engineer. Identify confusing names, mixed responsibilities, inconsistent conventions, unclear relationships and schemas that obscure the business domain. Recommend structural improvements that make the model easier to understand and maintain without sacrificing useful historical detail or creating unnecessary migrations.","why":"New developers or agents keep misunderstanding names, concepts or relationships.","ev":"The specific confusions, the work they affect, a schema map, and the least disruptive naming or boundary fixes.","skip":"Nobody has misread the schema recently.","avoid":"Cosmetic renames and broad migrations with no shown maintenance benefit.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: declarative schema files, if the project uses them.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","G01","PG10","PG11"],"tags":"agents can't understand schema, confusing table names, schema map, naming conventions, data model clarity","refs":["declarative"],"line":"Finds the table and column names that keep confusing people and agents, and the smallest renames that would help."},{"id":"PG13","sec":"db","group":"Performance and maintenance","gk":"PG","t":"Find the true sources of database waste","p":"Measure which tables, indexes, queries and maintenance activities consume the most storage, execution time and write resources. Distinguish useful capacity from avoidable waste, including unused indexes, row churn, bloat, poor plans and excessive scans. Recommend changes based on observed workload and realistic savings, not generic optimization rules.","why":"The bill is high, CPU or disk usage is high, storage keeps growing, or you suspect bloat.","ev":"Table and index sizes, the top statements, usage counts, dead-row and maintenance figures, EXPLAIN output and the savings you expect.","skip":"Usage and cost are small and steady.","avoid":"Judging an index from a code search alone, or looking only at query time and ignoring write cost.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access and query statistics (pg_stat_statements). Helps: Supabase Advisors, and HypoPG to test an index without building it.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","I03","PG06","PG14"],"tags":"postgres costs, database bill, supabase performance, slow postgres, bloat, unused indexes, high cpu, storage growing","refs":["pgss","advisors","hypopg","bestpractices"],"line":"Shows where the database bill, processing time and storage actually go, with the saving each fix would bring."},{"id":"PG14","sec":"db","group":"Performance and maintenance","gk":"PG","t":"What will become expensive as the database grows?","p":"Use actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.","why":"Fact or history tables are growing fast, or you need to plan capacity.","ev":"Current row counts and growth rates, the workload assumed, the size at which each operation becomes a bottleneck, and costs before and after at a realistic scale.","skip":"Data volume is small and flat.","avoid":"Partitioning or new layers without a measured or credible need.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access. Helps: query statistics (pg_stat_statements) and HypoPG.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","P05","PG13"],"tags":"ten times the data, growth, capacity planning, partitioning, scale, slow as it grows","refs":["pgss","hypopg"],"line":"Estimates when each table and query will get slow or expensive as the data grows."},{"id":"PG15","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Can we rebuild this database from its sources?","p":"Determine whether this database can be reconstructed from the repository, migrations, original source material and retained operational records. Identify anything that exists only in production, any transformations that cannot be reproduced, and data that would be permanently lost. Where possible, test the reconstruction on an isolated database and compare the resulting records and relationships.","why":"You worry about disaster recovery, production-only state, or whether the data could be rebuilt.","ev":"The exact inputs needed to rebuild, the migration chain, a sampled comparison of a rebuilt copy against production, and the gaps that can't be recovered.","skip":"The database is a disposable cache you can refill at any time.","avoid":"Running a destructive restore against production, or treating a list of backups as proof they restore.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only production access and a separate database you are allowed to build into.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["I02","D02","PG04","PG17"],"tags":"backup restore, disaster recovery, rebuild database, outage, reproduce production, restore test","refs":["pgtap"],"iso":true,"line":"Checks whether the database could be rebuilt from its sources if it were lost, by rebuilding a copy and comparing."},{"id":"PG17","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Are our database changes safe before we merge?","p":"Review this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.","why":"A migration, or a change to functions, views, RLS, types or column meaning, is about to ship.","ev":"The migration diff, the consumers it touches, how old and new app versions coexist during rollout, locks and rollback, and a replay on a separate database.","skip":"The change touches no schema, functions or policies.","avoid":"Claiming a rollback exists because the application code can be reverted.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only access to the live schema and a separate database to replay the migration. Helps: pgTAP and, on Supabase, Advisors and branches.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["G02","I02","S06","PG15"],"tags":"safe migrations, migration review, can this migration ship, schema change, rls change, breaking change, rollback","refs":["pgtap","advisors","declarative","bestpractices"],"iso":true,"line":"Checks a database change before you merge it: what it touches, whether the running app survives it, and how to undo it."},{"id":"PG16","sec":"db","group":"Agent decisions","gk":"PG","t":"Which decisions should an expert agent make without me?","p":"Find recurring database decisions that agents currently escalate to me, including field classification, record matching, write conflicts, source precedence and schema choices. Determine which can be resolved through established standards, existing precedent and authoritative evidence. Make the decision rules reusable, identify their limits, and reserve escalation for genuine product or risk decisions.","why":"Agents keep asking you to classify fields, match records or pick between sources.","ev":"The kinds of question that repeat, the standards and precedents that settle them, each rule with its exceptions, and where escalation really belongs.","skip":"Agents rarely escalate database questions.","avoid":"Inventing accounting, source-precedence or product policy where no authority exists.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, past agent transcripts or notes, and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["M05","M07","G01","PG01","PG09"],"tags":"agent keeps asking me, stop asking me to classify, escalations, decision rules, classify every record","line":"Writes down the rules an agent can use to settle the data questions it keeps asking you."},{"id":"DBR01","sec":"db","group":"Workflows","t":"Is the data actually right?","why":"Prove the numbers before fixing anything.","flow":[["Start",["PG01","PG02"],"PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong."],["If needed",["PG03","PG04"],"PG03 for identity gaps; PG04 when the meaning of past records matters."],["Change",[],"Fix only the confirmed shared causes, and add SQL or metric tests for them."],["Done when",[],"Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly."]],"p":"Is the data actually right? Prove the numbers before fixing anything.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong.\n\nCan we independently prove these numbers? (PG01)\nTake a representative set of important figures from this database and independently reconstruct them from their original sources. Don't rely on the existing calculation code to verify itself. Find discrepancies in definitions, source selection, units, dates, classifications, and relationships. Determine which errors are isolated and which come from shared logic, then rank corrections by analytical impact.\n\nFind data that is internally consistent but wrong (PG02)\nLook for data that passes the database's constraints and ordinary validation but is still analytically wrong. Test cross-table relationships, accounting identities, historical continuity, plausible ranges, source coverage, and independent calculations. Focus on contradictions that existing checks would miss, and distinguish genuine errors from legitimate differences in definitions or reporting periods.\n\n2. If needed: PG03 for identity gaps; PG04 when the meaning of past records matters.\n\nFind where records silently change identity (PG03)\nTrace how real-world entities are identified, matched and connected across imports, source documents and database tables. Find cases where distinct entities are merged, identical entities are duplicated, or historical relationships become disconnected. Identify the matching rule responsible and the affected population before proposing corrections.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Fix only the confirmed shared causes, and add SQL or metric tests for them.\n\n4. Done when: Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly.","rel":["PG01","PG02","PG03","PG04"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order: prove the numbers are right, then fix only what was confirmed."},{"id":"DBR02","sec":"db","group":"Workflows","t":"Make ingestion simpler and cheaper","why":"Less work per import, without losing provenance or corrections.","flow":[["Start",["PG05","PG07"],"PG05 when it is unclear who writes what; otherwise PG07."],["If needed",["PG06","PG08","PG09"],"PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places."],["Change",[],"Make the smallest change to one cause at a time, keeping provenance and corrections."],["Done when",[],"The same results for reference inputs, measurably less work, and retries that do no harm."]],"p":"Make ingestion simpler and cheaper Less work per import, without losing provenance or corrections.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG05 when it is unclear who writes what; otherwise PG07.\n\nMap every place that writes to the database (PG05)\nMap the actual write paths for the important tables in this application. Identify every script, job, API, function, trigger and agent that can create, update or delete their records. Show who owns each field, which paths overlap, and where two writers can disagree or overwrite each other. Recommend the simplest ownership model supported by the existing system.\n\nIs our ingestion process more complicated than necessary? (PG07)\nTrace one complete ingestion cycle from the original source to the final database records. Identify repeated parsing, unnecessary intermediate states, duplicate validation, repeated reads, redundant transformations and writes that could be consolidated. Recommend the simplest workflow that preserves accuracy, traceability, failure recovery and the ability to process corrections.\n\n2. If needed: PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places.\n\nStop rewriting data that hasn't changed (PG06)\nInvestigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.\n\nCan we rerun everything without damaging the data? (PG08)\nExamine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.\n\nFind where write logic should live (PG09)\nTrace how records are validated, transformed and written across application code, database functions, triggers and background jobs. Find rules duplicated in different layers or placed where they are difficult to test and maintain. Recommend the simplest ownership boundary for each rule, without assuming that moving more logic into Postgres is automatically better.\n\n3. Change: Make the smallest change to one cause at a time, keeping provenance and corrections.\n\n4. Done when: The same results for reference inputs, measurably less work, and retries that do no harm.","rel":["PG05","PG06","PG07","PG08","PG09"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to make imports cheaper and simpler without losing where the data came from."},{"id":"DBR03","sec":"db","group":"Workflows","t":"Simplify a crowded schema","why":"Fewer objects with the same outcomes.","flow":[["Start",["PG10"],"Inventory objects and their real consumers."],["If needed",["PG11","PG12","PG17"],"PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships."],["Change",[],"Confirm consumers before retiring anything, and keep old and new versions working during rollout."],["Done when",[],"Less complexity with unchanged results for users and data."]],"p":"Simplify a crowded schema Fewer objects with the same outcomes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Inventory objects and their real consumers.\n\nWhich database objects no longer earn their keep? (PG10)\nExamine the tables, views, functions, triggers, indexes and materialized views in this database. Identify redundant representations, obsolete objects, overlapping responsibilities, unnecessary dependency chains and abstractions that no longer provide meaningful value. Verify actual consumers before recommending removal. Rank opportunities by complexity eliminated, operational savings and migration risk.\n\n2. If needed: PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships.\n\nAre we storing the same truth multiple times? (PG11)\nFind concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.\n\nCan the schema be easier to understand without losing depth? (PG12)\nReview the database's logical organization from the perspective of a new senior engineer. Identify confusing names, mixed responsibilities, inconsistent conventions, unclear relationships and schemas that obscure the business domain. Recommend structural improvements that make the model easier to understand and maintain without sacrificing useful historical detail or creating unnecessary migrations.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\n3. Change: Confirm consumers before retiring anything, and keep old and new versions working during rollout.\n\n4. Done when: Less complexity with unchanged results for users and data.","rel":["PG10","PG11","PG12","PG17"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to cut the views, functions and tables you don't need, with the same results."},{"id":"DBR04","sec":"db","group":"Workflows","t":"Reduce PostgreSQL resource cost","why":"Spend less where the measurements say the money goes.","flow":[["Start",["PG13"],"Measure the top consumers first."],["If needed",["PG06","PG14","P03"],"PG06 for write churn; PG14 when growth is the driver; P03 for one slow query."],["Change",[],"Take the biggest measured savings first. No speculative indexes or partitions."],["Done when",[],"Workload figures before and after, with no loss of correctness."]],"p":"Reduce PostgreSQL resource cost Spend less where the measurements say the money goes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Measure the top consumers first.\n\nFind the true sources of database waste (PG13)\nMeasure which tables, indexes, queries and maintenance activities consume the most storage, execution time and write resources. Distinguish useful capacity from avoidable waste, including unused indexes, row churn, bloat, poor plans and excessive scans. Recommend changes based on observed workload and realistic savings, not generic optimization rules.\n\n2. If needed: PG06 for write churn; PG14 when growth is the driver; P03 for one slow query.\n\nStop rewriting data that hasn't changed (PG06)\nInvestigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.\n\nWhat will become expensive as the database grows? (PG14)\nUse actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.\n\nQueries that grow badly (P03)\nFind database queries whose cost grows disproportionately with records, tenants, or relationships. Examine execution plans, indexes, joins, pagination, and application-side filtering.\n\n3. Change: Take the biggest measured savings first. No speculative indexes or partitions.\n\n4. Done when: Workload figures before and after, with no loss of correctness.","rel":["PG06","PG13","PG14","P03"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to lower the Postgres bill where the measurements say the money goes."},{"id":"DBR05","sec":"db","group":"Workflows","t":"Ship or recover safely","why":"A schema change or a restore you have actually tested.","flow":[["Start",["PG17","PG15"],"PG17 for a change about to ship; PG15 for rebuilding or recovery."],["If needed",["G02","R06","PG04"],"G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move."],["Change",[],"Run migrations and restores on a separate database, check compatibility, and plan the recovery."],["Done when",[],"A migration or restore tested on a separate database, and no claim about production that wasn't proved."]],"p":"Ship or recover safely A schema change or a restore you have actually tested.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG17 for a change about to ship; PG15 for rebuilding or recovery.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\nCan we rebuild this database from its sources? (PG15)\nDetermine whether this database can be reconstructed from the repository, migrations, original source material and retained operational records. Identify anything that exists only in production, any transformations that cannot be reproduced, and data that would be permanently lost. Where possible, test the reconstruction on an isolated database and compare the resulting records and relationships.\n\n2. If needed: G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move.\n\nDatabase changes during a deploy (G02)\nTrace what happens during the deployment window when a new database migration or API schema change goes live while previous client bundles, active background workers, or queue consumers are still running. Identify column renames, non-nullable additions, or contract changes that break backwards compatibility before the old code finishes draining.\n\nHalf-finished failures (R06)\nTrace error, timeout and cancellation paths for transactions, locks, file handles, temporary files, worker jobs and network connections. Identify paths that leave resources held or state half-committed, and demonstrate them with controlled failure injection where practical.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Run migrations and restores on a separate database, check compatibility, and plan the recovery.\n\n4. Done when: A migration or restore tested on a separate database, and no claim about production that wasn't proved.","rel":["PG04","PG15","PG17","G02","R06"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to ship a schema change, or test a restore, safely."},{"id":"M01","sec":"think","group":"Thinking prompts","t":"Deeper, not bigger","p":"I want the professional-grade version of this task, not a larger version. Look at what I'm trying to accomplish and tell me what a genuinely excellent practitioner would notice, investigate, or verify that I've overlooked. Start with the original evidence instead of just relying on existing summaries. Identify the methods that would materially improve the result and the independent evidence that would establish whether it's correct. Then improve the assignment accordingly. Keep the objective and scope intact. Don't add process or complexity just to make the work sound more sophisticated.","use":"Use it before you hand an agent a task you only half know how to describe.","aka":"Professional-grade, not larger","dmode":"Depends on the task","line":"Asks the agent what an expert would check that you missed, then improves the task without making it bigger."},{"id":"M02","sec":"think","group":"Thinking prompts","t":"Prove it wrong","p":"Before we go ahead, try to prove the proposed solution wrong. Write down the claims it depends on, then look for evidence against each one in the code, the data, the logs or the documentation, and run the cheapest test that could break it. Report which claims held, which failed and which you could not check. If one failed, say what that changes and propose the smallest adjustment. Recommend going ahead only if nothing you found argues against it.","use":"Use it when an agent's plan sounds right and you can't see why it might be wrong.","aka":"Falsification","dmode":"Asks before changing","line":"Makes the agent look hard for evidence that its own plan is wrong before you go ahead."},{"id":"M03","sec":"think","group":"Thinking prompts","t":"Root cause first","p":"Don't fix the visible symptom yet. Reproduce it, then work backward through the code and data until you can say in one or two sentences why it happens, pointing to the exact lines or records involved. Then look for every other place the same cause shows up or could show up. Report the cause, the evidence that proves it and the other places it affects. Propose one fix that removes the cause everywhere it applies, and a check that would fail if it came back.","use":"Use it the second time the same kind of bug shows up.","aka":"Root cause","dmode":"Report only","line":"Makes the agent explain why a bug happened, and what else shares that cause, before it patches anything."},{"id":"M04","sec":"think","group":"Thinking prompts","t":"Simpler first","p":"Before adding anything, try to solve this by removing something. Look for a layer, rule, setting, dependency, special case or duplicate path that could go, and check whether the problem disappears or gets easier once it does. Only if nothing can be removed, propose the smallest addition that works and say why each new piece is needed. Compare the options by how much there will be to understand and maintain afterwards, not by how much code is written today.","use":"Use it when the proposed fix adds a new setting, table or service.","aka":"Complexity reduction","dmode":"Changes code","line":"Makes the agent try to remove something before it adds a new setting, table or service."},{"id":"M05","sec":"think","group":"Thinking prompts","t":"Let the expert decide","p":"Treat the technical decisions as yours. Make them the way a senior engineer on this codebase would: follow the project's existing conventions first, then established standards and primary documentation, and investigate when you are unsure instead of asking me. Bring me only decisions about what the product should do, who it affects, what it costs, or a risk I would have to accept, each with your recommendation and what it would cost to change later. List the technical choices you made, one line each, so I can review them if I want.","use":"Use it when an agent keeps asking you technical questions you can't judge.","aka":"Expert delegation","rel":["PG16"],"dmode":"Depends on the task","line":"Tells the agent to make the technical calls itself and only ask you about product and risk decisions."},{"id":"M06","sec":"think","group":"Thinking prompts","t":"Check it independently","p":"Prove your solution works in a way that does not rely on the code or tests you just wrote. Choose a check that would fail if the fix were wrong: use the product the way a person would (click through it, call the real endpoint, read the real data), compare against an independent source, or write the test from the requirement before looking at your implementation. Run it, show the result, and say plainly what it does not cover.","use":"Use it before you accept 'tests pass' as proof that something works.","aka":"Independent verification","dmode":"Changes code","line":"Makes the agent prove its work by a route that doesn't rely on the code and tests it just wrote."},{"id":"M07","sec":"think","group":"Thinking prompts","t":"Spec without the interview","p":"Turn my request into a compact working specification: desired outcome, actual scope, meaningful exclusions, observable acceptance criteria, and stopping point. Resolve technical ambiguity from the repository and authoritative references yourself; ask me only for product preferences, permissions, or genuine tradeoffs you cannot determine independently. Then execute if the task is authorized and ready.","use":"The default way to start a real task. The opposite of /grill-me.","aka":"Outcome-bound spec without needless interview","rel":["PG16"],"dmode":"Changes code","line":"Has the agent turn your request into a short plan with a clear finish line, finding answers itself instead of quizzing you."},{"id":"M08","sec":"think","group":"Thinking prompts","t":"Reproduce, measure, prove","p":"Before repairing a suspected defect or performance problem, establish a reproducible failing case or measurable baseline. Find the root cause, implement the narrowest defensible fix, rerun an independent check, and report the before/after evidence. If you can't measure or reproduce it, say what evidence is missing instead of claiming a win.","use":"Use it in the second session, after a read-only investigation found a real problem.","dmode":"Changes code","line":"Tells the agent to reproduce or measure the problem first, then fix it narrowly and show before-and-after proof."},{"id":"M09","sec":"think","group":"Thinking prompts","t":"Compare three options","p":"Do not implement the first viable approach you find. Present three genuinely distinct ways to solve this problem: (1) the smallest, most conservative patch to the existing code, (2) the cleanest long-term structural design, and (3) a subtractive approach that removes an existing constraint, layer, or edge case. Compare their blast radius, testability, and failure modes, recommend one, and wait for my decision.","use":"Use it for decisions that will be expensive to undo.","aka":"Three-way tradeoff","dmode":"Asks before changing","line":"Has the agent lay out three different fixes (the smallest patch, the cleanest long-term design, and one that removes something) and recommend one."},{"id":"M10","sec":"think","group":"Thinking prompts","t":"Handoff note before you stop","p":"Prepare a compact, self-contained technical checkpoint so a fresh agent session can resume this work cold. Document only: (1) verified facts and current system state, (2) approaches already tested and why they were ruled out, (3) exact files and uncommitted changes in flight, and (4) the single next falsifiable step. Summarize system ground truth, not our conversation history.","use":"Use it before the agent compacts (shrinks its memory of the chat) or a long session ends. /pre-compact does the full version.","aka":"Cold-start handoff checkpoint","dmode":"Writes notes only","line":"Has the agent write a short note on where the work stands so a fresh session can pick it up."},{"id":"M11","sec":"think","group":"Thinking prompts","t":"Thorough and bold","p":"Go past the first answer. For each claim you make, check the original evidence (the code, the data or the docs) and say which claims you verified and which you assumed. Then give one clear recommendation, the strongest argument against it, and the result that would change your mind.","use":"Add it to any prompt when you want depth and a firm recommendation, with the checking shown.","dmode":"Depends on the task","line":"Asks for a thorough answer that says what was checked and what was assumed, and ends with one firm recommendation."},{"id":"M12","sec":"think","group":"Thinking prompts","t":"Deepen modules, simplify interfaces","p":"Do a cleanup pass on the code this change touched. Find logic that lives in more than one place, modules whose callers have to know too much to use them, and thin pass-through layers that add nothing. Merge the duplicates, put the core logic behind one clear entry point, and make each interface smaller than the work it hides. Keep behaviour identical: run the existing tests before and after, and leave alone anything you could not prove safe. Report what you merged, moved or removed in plain words first, with files underneath.","use":"Use it as a cleanup pass on each pull request, or on a schedule for overdue maintenance. It pushes the agent to merge duplicated code, put core logic in one place and cut lines. Shared by Chris (@_khrus) on X on 7 Nov 2026; the idea is John Ousterhout's, from A Philosophy of Software Design, and Matt Pocock pointed him to it. /improve-codebase-architecture is the longer version: a scan, a report and an interview.","aka":"Deep modules (Ousterhout)","src":"https://x.com/_khrus/status/2118971805885239777","rel":["EC04","A03","M04"],"dmode":"Changes code","line":"A cleanup pass that merges duplicated code and keeps the core logic in one place."},{"id":"EC01","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/engineer","cmd":"/engineer","p":"/engineer","why":"Describe what's going on and it picks one starting move from this guide (an investigation prompt, an installed skill, or a plain prompt with nothing to install) and says why. In Codex it's $engineer.","rel":[],"dmode":"Depends on the task"},{"id":"EC35","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/database","cmd":"/database","p":"/database","why":"Describe a PostgreSQL problem in plain words and it picks one database prompt from this library, says why, and runs it read-only when it can reach the code and database. In Codex it's $database.","rel":["PG00","PG01","PG02","PG03","PG04","PG05","PG06","PG07","PG08","PG09","PG10","PG11","PG12","PG13","PG14","PG15","PG17","PG16"],"dmode":"Report only"},{"id":"EC36","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/engineering-setup","cmd":"/engineering-setup","p":"/engineering-setup","why":"Explains in plain words whether /engineer and /database should start on their own, then saves your answer to your Claude Code settings after showing the change. Claude Code only; takes effect next session.","rel":[],"dmode":"Changes code"},{"id":"EC02","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/diagnosing-bugs","cmd":"/diagnosing-bugs","p":"/diagnosing-bugs","why":"For hard bugs and slowdowns. Builds a check that fails on the bug, shrinks it, ranks likely causes, adds logging, fixes it with a test that keeps it from coming back, then cleans up.","rel":["P01","R05","A06","G06"],"dmode":"Changes code"},{"id":"EC03","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/tdd","cmd":"/tdd","p":"/tdd","why":"Writes the tests first, one small working slice at a time. Agrees with you where the tests will hook into the code before writing any.","rel":["R03","T02","T06"],"dmode":"Changes code"},{"id":"EC04","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/improve-codebase-architecture","cmd":"/improve-codebase-architecture","p":"/improve-codebase-architecture","why":"Looks at recently busy parts of the code for modules that add little behind their interface, writes a before/after HTML report to the temp folder, then interviews you about one.","rel":["A01","A03","A05","M12"],"dmode":"Writes notes only","line":"Finds parts of the code that add complexity without doing much, writes a before-and-after report, then talks the changes through with you."},{"id":"EC05","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/grill-me","cmd":"/grill-me","p":"/grill-me","why":"Asks rounds of numbered questions, each with a suggested answer, until every open question in a plan is settled. For product direction, not routine fixes.","rel":["A01"],"dmode":"Advice"},{"id":"EC06","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/grill-with-docs","cmd":"/grill-with-docs","p":"/grill-with-docs","why":"The same interview, but it writes terms into GLOSSARY.md and records each settled decision as an ADR (a short decision record).","rel":["A02","D05"],"dmode":"Writes notes only","line":"The same question-and-answer session as /grill-me, but it also writes down the terms you agree on and each decision you settle, so later sessions keep them."},{"id":"EC07","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/research","cmd":"/research","p":"/research","why":"A background agent answers a question from original sources and saves a Markdown note with citations in the repo.","rel":[],"dmode":"Writes notes only"},{"id":"EC08","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/retro","cmd":"/retro","p":"/retro","why":"Reviews a session and suggests changes to the agent's setup: how it finds its way around, its checks, its instruction files and what its tools cost.","rel":["G01"],"dmode":"Advice"},{"id":"EC09","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/wizard","cmd":"/wizard","p":"/wizard","why":"Writes a bash script that walks you through the steps only you can do, like dashboards, secrets and switchovers.","rel":[],"dmode":"Changes code","line":"Writes a short script that walks you through the steps only you can do, such as dashboard settings, secrets and switching services over."},{"id":"EC10","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/to-questionnaire","cmd":"/to-questionnaire","p":"/to-questionnaire","why":"Turns a decision you can't make alone into a questionnaire for the person who can.","rel":[],"dmode":"Writes notes only"},{"id":"EC11","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.6.2","t":"/wait-what","cmd":"/wait-what","p":"/wait-what","why":"Asks the agent to explain its last message again in plain words.","rel":[],"dmode":"Advice"},{"id":"EC12","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/insecure-defaults:audit","cmd":"/insecure-defaults:audit","p":"/insecure-defaults:audit","why":"Finds unsafe defaults: fallback secrets, default passwords, switches that let everything through when they fail, weak encryption, loose access rules and debug details leaking out.","rel":["T05","S06","R02"],"dmode":"Report only"},{"id":"EC13","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/supply-chain-risk-auditor","cmd":"/supply-chain-risk-auditor","p":"/supply-chain-risk-auditor","why":"Checks your direct dependencies and the ones in the lockfile for security warnings, abandoned projects and risky publishers.","rel":["T04","I06"],"dmode":"Report only","line":"Checks the outside packages your project uses for known security problems, abandoned projects and risky publishers."},{"id":"EC14","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/agentic-actions-auditor","cmd":"/agentic-actions-auditor","p":"/agentic-actions-auditor","why":"Checks GitHub Actions that run Claude, Codex or Gemini for exposed tokens and prompt injection (hidden instructions in issues and PRs that the AI might follow).","rel":["T04"],"dmode":"Report only"},{"id":"EC15","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/differential-review:diff-review","cmd":"/differential-review:diff-review","p":"/differential-review:diff-review","why":"Security review of a set of code changes, using git history and counting how many callers each change could affect.","rel":["T03","G02"],"dmode":"Report only","line":"Security review of a set of code changes, using their history and how many other places each change could affect."},{"id":"EC16","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/sharp-edges","cmd":"/sharp-edges","p":"/sharp-edges","why":"Finds APIs that are easy to misuse and configuration options that are dangerous.","rel":["T05"],"dmode":"Report only"},{"id":"EC17","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/variant-analysis","cmd":"/variant-analysis","p":"/variant-analysis","why":"After one bug is found, hunts for the other places with the same root cause.","rel":["M03"],"dmode":"Report only"},{"id":"EC18","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/property-based-testing","cmd":"/property-based-testing","p":"/property-based-testing","why":"Writes and reviews property tests (tests that throw many generated inputs at a rule) with fast-check or Hypothesis.","rel":["R03","R04","T02"],"dmode":"Changes code"},{"id":"EC19","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/dimensional-analysis","cmd":"/dimensional-analysis","p":"/dimensional-analysis","why":"Finds bugs from mixed-up units and decimal scaling by labeling each value with its unit.","rel":["G05","D02"],"dmode":"Report only"},{"id":"EC20","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/spec-to-code-compliance","cmd":"/spec-to-code-compliance","p":"/spec-to-code-compliance","why":"Checks code against the document that specifies it, one requirement at a time.","rel":["D01","D02","A02"],"dmode":"Report only"},{"id":"EC21","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/audit-context-building","cmd":"/audit-context-building","p":"/audit-context-building","why":"Reads code one function at a time and records what each one assumes, before any bug hunt starts.","rel":["T03","A04","A07"],"dmode":"Writes notes only","line":"Reads the code one function at a time and writes down what each one assumes, before any bug hunt starts."},{"id":"EC22","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/goal-prompt","cmd":"/goal-prompt","p":"/goal-prompt","why":"Drafts /goal commands with a checkable finish line and limits on when to stop.","rel":[],"dmode":"Advice"},{"id":"EC23","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.1 · public","t":"/experience-architecture:diagnose","cmd":"/experience-architecture:diagnose","p":"/experience-architecture:diagnose","why":"Start here for any complaint about navigation, the Back button, filters, shared links or too many pages. Finds the causes, says whether the page structure is the problem, and checks its own file references before reporting.","rel":["A08","R07","A01"],"dmode":"Report only"},{"id":"EC24","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.1 · public","t":"/experience-architecture:rethink","cmd":"/experience-architecture:rethink","p":"/experience-architecture:rethink","why":"For questions like whether a page should exist, where a feature belongs, or whether to add a tab. Gives a recommendation, and for a real structural problem two or three options with a clickable prototype and a move-over plan that keeps old links working.","rel":["A08","A05"],"dmode":"Asks before changing"},{"id":"EC25","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.1 · public","t":"/experience-architecture:verify","cmd":"/experience-architecture:verify","p":"/experience-architecture:verify","why":"Proves behaviour in a browser and saves the user journeys as a repeat check that ends PASS, FAIL or EXPLORATORY. Typed values and secrets stay out of the logs.","rel":["R07","T01","G06"],"dmode":"Changes code"},{"id":"EC26","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"built into Claude Code","t":"/code-review","cmd":"/code-review","p":"/code-review","why":"Checks a set of changes or a PR for bugs, at an effort level you pick. Run it at high or above before marking a PR ready.","rel":["D06"],"dmode":"Report only","line":"Checks a set of changes, or a pull request (a change waiting to be merged), for bugs at an effort level you pick."},{"id":"EC27","sec":"ecmd","group":"Other commands that help", ore and after.","best":"Any section of text you just want fixed without picking a skill.","skipw":"A whole docs folder at once. Run Vale first to find the worst files.","note":"Reads PRODUCT.md, DESIGN.md, CLAUDE.md and Vale's accepted words when they exist, so product names stay and the tone matches the project.","t":"/fix-writing","cmd":"/fix-writing","p":"/fix-writing README.md:12-40","why":"Paste the text or point at a file and line range. It picks the right tools and rules for you.","dmode":"Changes code"},{"id":"UI084","sec":"dcmd","group":"Humanizer","sub":"Command","badge":"plugin · v3.1.0","gnote":"Rewrites AI-sounding writing so it reads like a person wrote it, without changing what it says. Based on Wikipedia's list of signs of AI writing.","best":"PR descriptions, READMEs, release notes, landing copy and emails that read as machine-made.","skipw":"UI labels and error messages (use /impeccable clarify), or whole folders of docs (use Vale to find the problems first).","note":"","t":"/humanizer","cmd":"/humanizer","p":"/humanizer rewrite this PR description","why":"Removes signs of AI writing: not-X-but-Y contrasts, one-line closers, staged openers, forced lists of three, dashes everywhere, inflated claims, sales language, stock AI words, bold labels, filler.","dmode":"Changes code"},{"id":"UI085","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:setup","cmd":"/vale:setup","p":"/vale:setup","why":"Installs Vale (a writing checker), writes .vale.ini, downloads its style rules and does a first run. Only for a repo with no Vale setup yet.","dmode":"Changes code"},{"id":"UI086","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:triage","cmd":"/vale:triage","p":"/vale:triage vale is too noisy in this repo","why":"Turns a huge first run into a decision for each rule: fix, downgrade or switch off. Gives a short plan in order.","dmode":"Report only"},{"id":"UI087","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:fix","cmd":"/vale:fix","p":"/vale:fix the docs folder","why":"Runs Vale and fixes the error-level problems, one pull request per file. Leaves warnings and suggestions for you.","dmode":"Changes code"},{"id":"UI088","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:vocab","cmd":"/vale:vocab","p":"/vale:vocab stop flagging our product names","why":"Adds your own terms (product names, APIs, jargon) to a word list so spell check stops flagging them.","dmode":"Changes code"},{"id":"UI089","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:ci","cmd":"/vale:ci","p":"/vale:ci run vale on pull requests","why":"Sets Vale to run automatically: in GitHub Actions, as a check before each commit, or in another runner.","dmode":"Changes code"},{"id":"UI090","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"vale \u003cpath>","cmd":"vale \u003cpath>","p":"vale docs/","why":"The Vale checker itself, run in a terminal from the repo's main folder.","dmode":"Report only"},{"id":"UI091","sec":"dcmd","group":"Stop Slop","sub":"Command","badge":"skill · hardikpandya","gnote":"A strict rulebook Claude follows while it writes, so AI tells never make it in. It scores the draft 1 to 10 on directness, rhythm, trust, authenticity and density, and revises anything under 35 of 50.","best":"Writing something new that has to sound human from the first draft: posts, landing copy, bios, emails.","skipw":"Technical docs and anything with real uncertainty. It bans all adverbs, em dashes and hedging, which can remove correct warnings. Use Humanizer or Sepia there.","note":"","t":"/stop-slop","cmd":"/stop-slop","p":"/stop-slop write the launch post","why":"Writes or rewrites text under its rules: no filler openers, no not-X-but-Y, no passive voice, no lists of three, varied sentence length.","dmode":"Changes code"},{"id":"UI092","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia","cmd":"/sepia:sepia","p":"/sepia:sepia de-AI these release notes","why":"Picks the right operation and document rules for you.","dmode":"Changes code"},{"id":"UI093","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-review","cmd":"/sepia:sepia-review","p":"/sepia:sepia-review this PR reply","why":"Points out the signs of AI writing without changing anything.","dmode":"Report only"},{"id":"UI094","sec":"dcmd","group"
