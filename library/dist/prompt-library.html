,{"id":"RC11","sec":"recipe","group":"Design recipes","t":"Write prose that doesn't sound like AI","why":"Take one piece of writing from draft to ready to send.","steps":[["/stop-slop","draft it with the anti-AI rules on"],["/slop-guard","get a score and the list of AI phrases"],["/humanizer","rewrite those phrases, facts unchanged"],["/slop-guard","score again; it should go up"]],"p":"Write prose that doesn't sound like AI. One piece of prose from draft to sendable.\nRun these in order, and check in with me between steps:\n1. /stop-slop: draft it with the anti-AI rules on\n2. /slop-guard: get a score and the list of AI phrases\n3. /humanizer: rewrite those phrases, facts unchanged\n4. /slop-guard: score again; it should go up","dmode":"Changes code"},{"id":"RC12","sec":"recipe","group":"Design recipes","t":"Type and color system from scratch","why":"Fonts, a palette scale and dark mode, saved so every later pass uses them.","steps":[["/web-typography","pick and pair the faces, set the type scale"],["/oklch-skill","palette scale, dark mode, contrast, Tailwind tokens"],["/impeccable document","save both as DESIGN.md"],["/impeccable audit","check contrast and theming held up"]],"p":"Type and color system from scratch. Fonts, a palette scale and dark mode, saved so every later pass uses them.\nRun these in order, and check in with me between steps:\n1. /web-typography: pick and pair the faces, set the type scale\n2. /oklch-skill: palette scale, dark mode, contrast, Tailwind tokens\n3. /impeccable document: save both as DESIGN.md\n4. /impeccable audit: check contrast and theming held up","dmode":"Changes code"},{"id":"RC13","sec":"recipe","group":"Design recipes","t":"Landing page that converts","why":"From how you pitch the product to a page that's checked for turning visitors into sign-ups.","steps":[["/product-marketing","once per product: audience, claims, voice"],["/copywriting","headline, value props, calls to action"],["/hallmark \u003cprompt>","build the page around that copy"],["/image","a real hero image if the page needs one"],["/cro","what will stop people converting, in order"],["/harsh-review","the blunt pass before you share it"]],"p":"Landing page that converts. From positioning to a page that is checked for conversion.\nRun these in order, and check in with me between steps:\n1. /product-marketing: once per product: audience, claims, voice\n2. /copywriting: headline, value props, calls to action\n3. /hallmark \u003cprompt>: build the page around that copy\n4. /image: a real hero image if the page needs one\n5. /cro: what will stop people converting, in order\n6. /harsh-review: the blunt pass before you share it","dmode":"Changes code"},{"id":"RC14","sec":"recipe","group":"Design recipes","t":"Native iPhone screen","why":"SwiftUI screens that someone who knows iPhones well would trust.","steps":[["/ios-hig-design","the platform patterns this screen should use"],["/impeccable shape","agree the screen's job first"],["/swiftui-pro","review the SwiftUI against modern practice"],["/impeccable audit","native accessibility and platform rules"]],"p":"Native iPhone screen. SwiftUI that a fluent iPhone user would trust.\nRun these in order, and check in with me between steps:\n1. /ios-hig-design: the platform patterns this screen should use\n2. /impeccable shape: agree the screen's job first\n3. /swiftui-pro: review the SwiftUI against modern practice\n4. /impeccable audit: native accessibility and platform rules","dmode":"Changes code"},{"id":"RC15","sec":"recipe","group":"Design recipes","t":"Usability rescue","why":"People get lost or make mistakes. Find out where, then fix it.","steps":[["/ux-heuristics","usability audit by Nielsen's rules"],["/design-everyday-things","the why: affordances, feedback, mapping"],["/impeccable distill","cut what is in the way"],["/ux-writing","labels and errors that explain themselves"]],"p":"Usability rescue. People get lost or make mistakes. Find out where, then fix it.\nRun these in order, and check in with me between steps:\n1. /ux-heuristics: usability audit by Nielsen's rules\n2. /design-everyday-things: the why: affordances, feedback, mapping\n3. /impeccable distill: cut what is in the way\n4. /ux-writing: labels and errors that explain themselves","dmode":"Changes code"},{"id":"RC16","sec":"recipe","group":"Design recipes","t":"Brutal pre-launch review","why":"Every tough review angle at once, then the fixes. Only when you ask for it.","steps":[["/harsh-review","blunt, evidence-backed, ships the small fixes"],["/steve-jobs-design-review","what to cut for focus"],["/viewport-proof","proof it works at every screen size"],["/impeccable polish","the last detail pass"]],"p":"Brutal pre-launch review. Every critical lens at once, then the fixes. Only when you ask for it.\nRun these in order, and check in with me between steps:\n1. /harsh-review: blunt, evidence-backed, ships the small fixes\n2. /steve-jobs-design-review: what to cut for focus\n3. /viewport-proof: proof it works at every screen size\n4. /impeccable polish: the last detail pass","dmode":"Changes code"},{"id":"RC17","sec":"recipe","group":"Design recipes","t":"Dark mode done right","why":"Colors that keep their contrast and character in both light and dark themes.","steps":[["/oklch-skill","build the dark scale in OKLCH"],["/impeccable colorize","apply it with intent, not inversion"],["/impeccable audit","contrast and theming checks"],["/viewport-proof","screenshots of both themes at each size"]],"p":"Dark mode done right. Colors that hold contrast and character in both themes.\nRun these in order, and check in with me between steps:\n1. /oklch-skill: build the dark scale in OKLCH\n2. /impeccable colorize: apply it with intent, not inversion\n3. /impeccable audit: contrast and theming checks\n4. /viewport-proof: screenshots of both themes at each size","dmode":"Changes code"},{"id":"RC18","sec":"recipe","group":"Design recipes","t":"Interactions that feel alive","why":"Feedback on every action, and motion only where it earns its place.","steps":[["/microinteractions","design the trigger, rule and feedback"],["/animate","build the motion properly"],["/review-animations","check against the ten standards"],["/animation-performance","only if anything drops frames"]],"p":"Interactions that feel alive. Feedback on every action, motion that earns its place.\nRun these in order, and check in with me between steps:\n1. /microinteractions: design the trigger, rule and feedback\n2. /animate: build the motion properly\n3. /review-animations: check against the ten standards\n4. /animation-performance: only if anything drops frames","dmode":"Changes code"},{"id":"RC19","sec":"recipe","group":"Design recipes","t":"People sign up and drift away","why":"Design how people get started and come back, instead of hoping they will.","steps":[["/improve-retention","where the drop happens and why"],["/impeccable onboard","first run and empty states"],["/ux-writing","the words on those screens"],["/hooked-ux","a return habit, checked for manipulation"]],"p":"People sign up and drift away. Activation and return visits, designed rather than hoped for.\nRun these in order, and check in with me between steps:\n1. /improve-retention: where the drop happens and why\n2. /impeccable onboard: first run and empty states\n3. /ux-writing: the words on those screens\n4. /hooked-ux: a return habit, checked for manipulation","dmode":"Changes code"},{"id":"RC20","sec":"recipe","group":"Design recipes","t":"Image-led hero","why":"A page built around a real image instead of a gradient.","steps":[["/image","make the image, sized for where it goes"],["/impeccable shape","plan the hero around it"],["/hallmark redesign \u003cpath>","rebuild the page to match"],["/impeccable optimize","keep the image from slowing the page"]],"p":"Image-led hero. A page built around a real image instead of a gradient.\nRun these in order, and check in with me between steps:\n1. /image: make the image, sized for where it goes\n2. /impeccable shape: plan the hero around it\n3. /hallmark redesign \u003cpath>: rebuild the page to match\n4. /impeccable optimize: keep the image from slowing the page","dmode":"Changes code"},{"id":"RC21","sec":"recipe","group":"Design recipes","t":"Cinematic launch page","why":"A memorable launch moment that still loads fast.","steps":[["/top-design","scroll story, dramatic type, motion plan"],["/image","the key visuals"],["/animate","each motion built in the right order"],["/animation-performance","hold the frame rate"],["/viewport-proof","check it on a phone"]],"p":"Cinematic launch page. A memorable launch moment that still loads fast.\nRun these in order, and check in with me between steps:\n1. /top-design: scroll story, dramatic type, motion plan\n2. /image: the key visuals\n3. /animate: each motion built in the right order\n4. /animation-performance: hold the frame rate\n5. /viewport-proof: check it on a phone","dmode":"Changes code"},{"id":"RC22","sec":"recipe","group":"Design recipes","t":"Hierarchy fix in an hour","why":"The page works but looks amateur.","steps":[["/refactoring-ui","hierarchy, spacing, color and depth"],["/impeccable layout","rhythm and structure"],["/impeccable typeset","type sizes and weights"],["/impeccable polish","tidy the details"]],"p":"Hierarchy fix in an hour. The page works but looks amateur.\nRun these in order, and check in with me between steps:\n1. /refactoring-ui: hierarchy, spacing, color and depth\n2. /impeccable layout: rhythm and structure\n3. /impeccable typeset: type sizes and weights\n4. /impeccable polish: tidy the details","dmode":"Changes code"},{"id":"RC23","sec":"recipe","group":"Design recipes","t":"A motion system for the whole app","why":"Decide once how the product moves, then bring the existing animation in line.","steps":[["/motion setup","agree the durations, curves and springs; writes MOTION.md"],["/motion review","what to cut, fix and add, with frames as evidence"],["/motion build","fix the worst three, one at a time"],["/motion review","check the result against MOTION.md"]],"p":"A motion system for the whole app. Decide once how the product moves, then bring the existing animation in line.\nRun these in order, and check in with me between steps:\n1. /motion setup: agree the durations, curves and springs; writes MOTION.md\n2. /motion review: what to cut, fix and add, with frames as evidence\n3. /motion build: fix the worst three, one at a time\n4. /motion review: check the result against MOTION.md","dmode":"Changes code"}],"symptoms":[["Numbers on screen don't match the source",["D01","D02","A04","G05","PG01"]],["A workflow got slow, or database cost jumped",["P01","P02","P03","P04"]],["Tests are green but production keeps breaking",["T01","T02","I02","S06"]],["Agents break nearby features on small edits",["A01","A02","R03","G01"]],["Things happen twice, or not at all",["R01","R05","D04","I04"]],["Merged but not live, or a deploy broke something",["I02","G02","S06","I05"]],["Worried about who can see or change what",["T03","T05","G03","S06"]],["The app hangs when an outside service is down",["G04","P09","R02","R06"]],["Your computer is full or browser tests are flaky",["I07","I01","T01"]],["Users get lost, or Back and shared links misbehave",["R07","A08","A01","T01"]],["Animations stutter, lag or all feel different",["MO02","MO01","MO04","MO03"]]],"composer":{"mode":{"read":["Read-only","Treat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence."],"repro":["Reproducer only","You may add a failing test or a small reproduction script for the highest-risk finding. Do not change application code, data or configuration."],"change":["Propose a fix","After reporting, propose the smallest fix for the top confirmed finding as a diff for my review. Do not apply it to production, run migrations, or delete anything."]},"scope":{"repo":["Whole repo",""],"branch":["This branch","Limit this to files changed on the current branch (git diff main...HEAD) and their direct callers."],"slice":["One slice first","Start with one high-traffic route, module or entity. Report on that slice, then stop before scanning the rest."]},"footer":"End with a table I can paste into my playbook, one row per finding:\n| ID | Project | Verdict (Clean / Suspect / Confirmed) | Evidence | False-positive notes |"},"routines":[["After a big feature or change","Check the whole path people use through what changed, what it touches, and that nothing old broke.","Stick to what changed. A small change doesn't need a check of everything."],["Weekly, if something changed","Recent changes that show signs of slowing down, failing at random, or deploy or accuracy trouble.","Skip it when nothing important was merged and nothing looks different."],["Monthly","Problems you already know about: tests that fail at random, risky packages, wasted check time, work done over and over.","Start with the known problem areas. Don't rerun checks on things that haven't changed."],["Quarterly","Whether the overall design still fits, how much growth it can take, who owns what, and old shortcuts that now cost you.","Only when the system or the evidence has changed."],["After something breaks","The real cause, a test that shows the problem, and a fix for the shared cause.","Stop once it can't happen again. Don't set up anything permanent by default."]],"stages":[["start","Start a project","Do these once per project, before any design work. Everything later reads what they write.",[["Teach Claude who the users are and what the brand is","/impeccable init"],["Write down the design system the code already has","/impeccable document"],["Styles have drifted into copies of each other","/impeccable extract"],["Repo docs need a prose linter","/vale:setup"],["Get a design check after every UI edit","/impeccable hooks on|off|status"],["Not sure where to start in this project","/impeccable"],["Decide once how this product should move","/motion setup"]]],["plan","Plan","Before any code. Agree what the screen is for and look at a few options.",[["Plan a new screen before writing code","/impeccable shape"],["See a few real directions before committing","/prototype","/impeccable generate"],["Choose a library for a task","/pick-ui-library"],["Don't know the name for an effect","/animation-vocabulary"],["Settle a design argument with a quick test","/lean-ux"],["Understand why people stop coming back","/improve-retention","/hooked-ux"],["Plan a hero or page entrance before coding it","/motion storyboard"]]],["build","Build","Pick the builder that matches what you are making.",[["A marketing or landing page","/hallmark \u003cprompt>","example-skills:frontend-design"],["A dashboard, admin screen or tool","/interface-design"],["First-run flow or empty states","/impeccable onboard"],["One interaction that has to feel exactly right","/animate","/impeccable animate"],["Touch, drag, sheets and springs","/apple-design"],["A native iPhone screen","/ios-hig-design","/swiftui-pro"],["A chart or dashboard tile","/dataviz"],["A big multi-view artifact","example-skills:web-artifacts-builder"],["A real image: hero, illustration, texture","/image"]]],["review","Review","Get a second opinion before changing anything. Most of these only report back.",[["This page kind of stinks. Tell me why.","/impeccable critique \u003cpage>"],["Rethink it, even if it breaks the design system","/impeccable critique \u003cpage>, ignore DESIGN.md","/prototype \u003cpage> x3"],["Review a whole screen's UX","/impeccable critique","/interface-design:design-review"],["Review one component's polish","/emil-design-eng"],["Accessibility and best-practice rules","/web-design-guidelines \u003cfile-or-pattern>","/impeccable audit"],["See what breaks with ugly data","/break-ui"],["Click through the real flow in a browser","example-skills:webapp-testing"],["Check existing motion","/review-animations","/motion review"],["Be brutal about it, then fix the easy things","/harsh-review","/steve-jobs-design-review"],["A usability audit by the book","/ux-heuristics"],["Prove it works at every screen size","/viewport-proof"]]],["refine","Refine the look","It works, but it doesn't look right yet.",[["It looks AI-generated","/interface-design:design-deslop","/impeccable bolder"],["Too busy or cluttered","/impeccable distill","/impeccable quieter"],["Type feels off","/impeccable typeset","/web-typography"],["Palette scale, dark mode or contrast","/oklch-skill","/color-expert"],["Spacing and rhythm feel off","/impeccable layout"],["Flat and gray","/impeccable colorize"],["Tune one element live in the running app","/impeccable live"],["Find where motion would help","/find-animation-opportunities","/motion review"],["Add a little personality","/impeccable delight"],["Buttons and toggles feel dead","/microinteractions","/impeccable animate"],["Make it cinematic","/top-design","/impeccable overdrive"],["Hierarchy looks amateur","/refactoring-ui","/impeccable layout"]]],["ship","Harden and ship","Odd cases, speed, phones, and the final pass.",[["Edge cases, errors, loading and empty states","/impeccable harden"],["Confusing labels and error messages","/impeccable clarify","/ux-writing"],["Landing copy that has to convert","/copywriting","/cro"],["Make a web app feel native on iPhone","/mobile-native","/impeccable adapt"],["A native iOS or Android app follows the platform rules","/impeccable audit","/impeccable adapt"],["Slow page or heavy bundle","/impeccable optimize"],["Animation stutters","/animation-performance","/motion fix"],["Final pass before shipping","/impeccable polish"]]],["writing","Words","READMEs, pull request descriptions, docs and emails.",[["I hate how this text reads. Just fix it.","/fix-writing"],["Write something new that can't sound like AI","/stop-slop","/sepia:sepia-write"],["This text sounds like AI wrote it","/humanizer","/sepia:sepia-refactor"],["Release notes, PR replies or a postmortem","/sepia:sepia"],["How AI-sounding is this draft, by the numbers?","/slop-guard"],["Find AI-sounding prose across a repo","vale \u003cpath>","/vale:triage"],["Fix the error-level alerts","/vale:fix"],["Vale flags a correct product name","/vale:vocab"],["Lint docs on every pull request","/vale:ci"]]]],"overlaps":[["Review a built UI",[["/impeccable critique","Scores the whole screen's usability and layout, and tests it as different kinds of users"],["/interface-design:design-review","A strict quality review with a pass-or-fail bar"],["/emil-design-eng","Fine polish on one component"],["/hallmark audit \u003cpath>","Checks marketing pages against Hallmark's minimum standard"]],"Critique for a whole screen. Design-review for app screens you want held to a high bar. Emil for one component. Hallmark audit only for pages Hallmark would build."],["Rule and accessibility checks",[["/web-design-guidelines \u003cpath>","Vercel's current rule list, with the file and line for each problem"],["/impeccable audit","Accessibility, speed and light and dark themes, ranked from most to least urgent"]],"Guidelines for a quick checklist with clear answers. Audit when you also want speed and themes checked and ranked."],["Build a new page",[["/hallmark \u003cprompt>","Marketing pages in many different styles"],["/interface-design","App screens, saving the design rules for next time"],["example-skills:frontend-design","Quick and light, nothing to set up first"],["/impeccable shape","Knows your project once you have run init"]],"Hallmark for anything the public will see. Interface Design for tools and dashboards. Frontend-design for quick throwaways."],["Animation",[["/animate","Builds one animation carefully, following Emil Kowalski's order of decisions"],["/impeccable animate","Motion as part of a broader design pass"],["/apple-design","Motion that follows your finger: swipes, drags and springs"],["/motion","Agent Kit's own motion command: checks its work with frame captures and keeps one set of values in MOTION.md"]],"/animate for one interaction you want exactly right. Impeccable animate for a light pass over a screen. Apple-design when touch and drag are involved. /motion when you want the result checked frame by frame, or the whole product's motion made consistent."],["Variants to choose from",[["/prototype","Three or more different versions of something new"],["/impeccable generate","Several versions of something that already exists"],["/impeccable live","Swaps versions in live while your app runs"]],"Prototype when the idea is new. Generate or live when the thing exists and you are fine-tuning it."],["Make it less generic",[["/interface-design:design-deslop","Removes the signs that AI made it"],["/impeccable bolder","Gives it a clear point of view"],["/impeccable delight","Adds small touches of personality"]],"Deslop first to remove the defaults, then bolder. Delight last, and only a little."],["Fix AI-sounding writing",[["/fix-writing","Picks the right one of these for you"],["/humanizer","Rewrites one piece of text"],["/stop-slop","Strict rules while you write something new"],["/sepia:sepia","Knows formats like release notes, pull request replies and incident write-ups"],["/slop-guard","Gives a score only and never edits"],["/vale:fix","Rule-based fixes across a whole repo"],["/impeccable clarify","Words in the app: labels, buttons and error messages"]],"Not sure? /fix-writing chooses. Stop-slop to write clean from the start. Humanizer to fix a draft, especially one with facts in it. Sepia when the format matters. Slop-guard to measure. Vale across many files. Clarify for words inside the app."],["Be critical about a design",[["/impeccable critique","A scored usability review that changes nothing"],["/harsh-review","Blunt, backed by evidence, and makes the small fixes"],["/steve-jobs-design-review","Only about simplicity and focus"],["/ux-heuristics","Usability checked against Nielsen's ten rules"],["/interface-design:design-review","A quality bar for app screens"]],"Critique to understand what is wrong. Harsh review when you want it said bluntly and the easy fixes done. Steve Jobs review to decide what to cut. Heuristics for usability. Design-review for dashboards."],["Color and type",[["/impeccable colorize","Adds color as part of a design pass"],["/oklch-skill","Exact color steps, dark mode and readable contrast"],["/impeccable typeset","Fonts and text sizes as part of a design pass"],["/web-typography","Choosing and pairing fonts, size steps and how fonts load, in depth"]],"Impeccable for a pass over a screen. The specialists when you need exact values or a font decision."],["Words in the interface vs on the page",[["/impeccable clarify","Fixes wording as part of a design pass"],["/ux-writing","The full rules for small app text: errors, empty screens and tone"],["/copywriting","Wording that sells on marketing pages"],["/fix-writing","Any writing, and picks the right rules"]],"Clarify for a quick pass. UX writing when the app's wording is the whole job. Copywriting when the page has to sell. Fix-writing for anything that isn't app text or marketing."],["Phones and native apps",[["/impeccable adapt","Changes the layout to fit each screen size"],["/mobile-native","Makes a web app feel like an app on a phone: taps, the notch, full-height screens"],["/ios-hig-design","Apple's patterns for a real iPhone app"],["/swiftui-pro","Reviews SwiftUI code"],["/viewport-proof","Proves it works at each size and changes nothing"]],"Adapt and mobile-native for websites on phones. HIG and SwiftUI Pro for a real iPhone app. Viewport proof only to prove the result before you ship."]],"reading":[{"t":"Harness design for long-running application development","by":"Anthropic","url":"https://www.anthropic.com/research/harness-design-long-running-apps","idea":"Planner, builder and evaluator roles, independent QA and file handoffs for multi-hour builds, with their costs.","str":"Primary, vendor research","st":"Link opens (checked 6 Nov)"},{"t":"Getting started with loops","by":"Anthropic","url":"https://claude.com/resources/articles/getting-started-with-loops","idea":"Turn-based, goal-based and time-based loops, how each verifies itself, and usage limits.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Claude Code best practices","by":"Anthropic","url":"https://code.claude.com/docs/en/best-practices","idea":"Current guidance on context files, planning, tool use and verification. Use this over secondhand summaries.","str":"Primary, official docs","st":"Link opens (checked 6 Nov)"},{"t":"Rethinking skills and prompts for GPT-6 Astra","by":"OpenAI","url":"https://developers.openai.com/blog/rethinking-skills-and-prompts-for-gpt-6-astra","idea":"Short triggers, progressive disclosure, and why long AGENTS.md files and skill piles hurt. Read before adding skills.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Harness engineering","by":"OpenAI","url":"https://openai.com/index/harness-engineering/","idea":"Making repositories legible to agents, enforcing architecture mechanically, removing complexity.","str":"Primary, vendor essay","st":"Site blocks automated checks; open it yourself"},{"t":"Agent pull requests are everywhere: here's how to review them","by":"GitHub blog","url":"https://github.blog/ai-and-ml/generative-ai/agent-pull-requests-are-everywhere-heres-how-to-review-them/","idea":"How to review generated code and decide how much to trust it.","str":"Primary, vendor blog","st":"Link opens (checked 6 Nov)"},{"t":"Technology Radar: mattpocock/skills","by":"Thoughtworks, 4 Nov 2026","url":"https://www.thoughtworks.com/en-au/radar/tools/mattpocock-skills","idea":"Places the skills in Trial, not Adopt, and warns against adopting whole skill libraries uncritically.","str":"Independent assessment","st":"Link opens (checked 6 Nov)"},{"t":"Skills for real engineers","by":"Matt Pocock","url":"https://github.com/mattpocock/skills","idea":"Small composable skills split into ones you type and ones the agent reaches for.","str":"Primary source code","st":"Repo read in full for the kit, 6 Nov"},{"t":"A Philosophy of Software Design","by":"John Ousterhout","url":"https://web.stanford.edu/~ouster/cgi-bin/book.php","idea":"Deep modules (a lot of behavior behind a small interface) and designing it twice. The source of M12; Matt Pocock's codebase-design skill builds on both ideas.","str":"Primary, book","st":"Not checked from here; open it yourself"},{"t":"“Deepen modules and simplify interfaces”","by":"Chris (@_khrus), 7 Nov 2026","url":"https://x.com/_khrus","idea":"The one-line prompt in M12, run on every pull request and nightly. Credits Ousterhout's book and Matt Pocock.","str":"Practitioner post, author's claims","st":"Profile link; the post is from 7 Nov 2026"},{"t":"Trail of Bits skills","by":"Trail of Bits","url":"https://github.com/trailofbits/skills","idea":"Security and assurance skills, each its own plugin, many with evals.","str":"Primary source code","st":"Chosen plugins scanned, 6 Nov"},{"t":"Superpowers","by":"Jesse Vincent","url":"https://github.com/obra/superpowers","idea":"A full development method: brainstorm, plan, subagent build, verify before claiming done.","str":"Primary source code","st":"Inspected, 6 Nov; not installed"},{"t":"Code Health Check Prompt","by":"tinosingh","url":"https://github.com/tinosingh/Code-Health-Check-Prompt","idea":"Every finding needs file:line, command output or a commit; calibrate to the repo; grade confidence. Folded into D06.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Codebase review prompts","by":"markoverano","url":"https://github.com/markoverano/codebase-review-prompts","idea":"A broad performance and maintainability review prompt. Its per-line-count expectations are not used here.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Hacker News","by":"Community","url":"https://news.ycombinator.com/","idea":"Practitioner discussion and critiques of agent tools. Evidence varies thread to thread.","str":"Discussion","st":"Monitor selectively"},{"t":"r/ClaudeCode","by":"Community","url":"https://www.reddit.com/r/ClaudeCode/","idea":"Day-to-day Claude Code tips and failure reports.","str":"Discussion","st":"Monitor selectively"}],"areaBlurb":{"Architecture and hidden complexity":"Spots where the way the code is built invites bugs: status spread across many places, words that change meaning between layers, and layers that cost more than they help.","Performance and scale":"Where time and money go as the data grows. Every claim here needs a measurement before and after.","Correctness and reliability":"What happens when something runs twice, fails, times out or happens in the wrong order, and whether people can tell a stand-in value from the real one.","Testing and security":"What the tests really prove, and where input from outside can reach something sensitive.","Infrastructure and environment":"The path from a merged change to the live site, what automated checks cost, and the computer the agents run on.","Data integrity and analytics":"Telling missing from zero, knowing where each number came from, and records whose meaning changes over time.","Agent harness and modern stack":"Newer kinds of trouble: out-of-date agent instructions, old and new versions running at once after a deploy, data leaking into pages, outside services going down, rounding errors, and screens that show a change before it is saved.","Start here":"One broad look when the database feels hard to trust or costly. If you can already name the problem, skip it and pick the narrower prompt.","Accuracy and evidence":"Proves the data is right, not just valid: rebuilt figures, whole populations, stable identities and past results that still reproduce.","Writes and ingestion":"Who writes what, how often it changes nothing, and whether imports survive retries and corrections.","Schema and dependencies":"Fewer objects, one home for each fact, and a model a new engineer or agent can read.","Performance and maintenance":"Where storage, time and write cost actually go, and what grows expensive first. Every claim needs a measurement.","Rebuild and safe change":"Changes and restores proved on a separate database before anyone relies on them.","Agent decisions":"Turns questions agents keep asking you into rules they can apply themselves.","Workflows":"Short routes through the database prompts for a whole job. Start with the first step and only take the optional ones when the evidence points there.","Motion":"How the interface moves: whether animation follows a system, what it costs, who it leaves out, and where it helps or gets in the way. Each prompt works in any agent. The motion-kit plugin's /motion runs the same checks with frame-by-frame captures."},"sources":{"intro":"Collected from two field guides, one for agent engineering and one for design skills, plus a set of everyday saved prompts. The skills it points to ship in this repo as plugins.","items":[["agent-kit on GitHub","https://github.com/AtlasScope/agent-kit","The design, engineering, experience-architecture and working-style plugins this library refers to, and the source of this page."]]},"dbSymptoms":[["The numbers don't match their source",["PG01","PG02","D02"]],["Records are merged, duplicated or lose history",["PG03","PG04","D05"]],["Imports rewrite everything or run twice",["PG06","PG08","PG07"]],["Nobody knows what writes to a table",["PG05","PG09","R05"]],["Too many views, functions and triggers",["PG10","PG11","PG12"]],["Postgres is slow or costs too much",["PG13","PG14","P03"]],["A migration is about to ship, or a restore is untested",["PG17","PG15","G02"]],["Agents keep asking me to decide",["PG16","M05"]]],"dbTools":{"supabase":["Supabase agent skills","https://github.com/supabase/agent-skills","Official skills for Supabase and Postgres work. Install with: claude plugin marketplace add supabase/agent-skills, then claude plugin install supabase@supabase-agent-skills. Other agents: npx skills add supabase/agent-skills."],"bestpractices":["Postgres best practices skill (Supabase)","https://github.com/supabase/agent-skills/blob/main/skills/supabase-postgres-best-practices/SKILL.md","Rules for queries, indexes, connections, locking and RLS. Works on any Postgres, not only Supabase. Install with: claude plugin install postgres-best-practices@supabase-agent-skills."],"pgss":["pg_stat_statements","https://supabase.com/docs/guides/database/extensions/pg_stat_statements","Postgres extension that counts how often each statement runs and how long it takes. Check it is enabled before trusting its numbers."],"advisors":["Supabase Advisors","https://supabase.com/docs/guides/observability/advisors","Built-in security and performance checks in the Supabase dashboard. Read their output rather than running another scanner."],"hypopg":["HypoPG","https://supabase.com/docs/guides/database/extensions/hypopg","Tests whether an index would help without building it. Optional, and not needed for most investigations."],"pgtap":["pgTAP database tests","https://supabase.com/docs/guides/local-development/testing/overview","SQL tests for rules and RLS policies. Run them on a local or branch database, never production."],"declarative":["Declarative schemas (Supabase)","https://supabase.com/docs/guides/local-development/declarative-database-schemas","Keep the desired schema in files and generate migrations from it. Weigh it against the migration workflow you already have."],"pgdocs":["PostgreSQL documentation","https://www.postgresql.org/docs/current/","The reference for exact behaviour. Check the version your database runs."]},"dbToolsVerified":"2026-11-07"}</script>

<script>
const LIB = JSON.parse(document.getElementById("library").textContent);
const E = LIB.entries; const BY = Object.fromEntries(E.map(e => [e.id, e]));
const CMDIDX = {};
E.forEach(e => { if (e.cmd) { const k = norm(e.cmd); if (!CMDIDX[k]) CMDIDX[k] = e.id; } });
function norm(s) { return s.toLowerCase().replace(/\s*<[^>]*>/g, "").replace(/,.*$/, "").replace(/\s+/g, " ").trim(); }
function findCmd(s) { const k = norm(s); if (CMDIDX[k]) return CMDIDX[k]; const two = k.split(" ").slice(0, 2).join(" "); return CMDIDX[two] || CMDIDX[k.split(" ")[0]] || null; }

const SECS = [
  ["inv", "Engineering investigations", "Prompts that send an agent looking for one kind of problem without changing anything. Each says what proof to bring back and when to skip it. From the Agent Engineering Field Guide."],
  ["db", "Database", "Prompts for PostgreSQL databases on any host: proving the data is right, simpler and cheaper writes, a leaner schema, real costs, and changes and restores tested on a copy. All read-only unless you say otherwise."],
  ["think", "Thinking prompts", "Short lines you add to any task to change how the agent works: try to prove itself wrong, keep things simple, check its work, hand off cleanly."],
  ["ecmd", "Engineering commands", "Installed skills you start with a slash command. Each one runs part of an investigation for you."],
  ["dcmd", "Design commands", "Every design skill command, with a ready example prompt. From the Design Skills Field Guide."],
  ["recipe", "Design recipes", "Short sequences of design commands for a whole job, from a new landing page to dark mode. Copy one step, or the whole recipe as one prompt that checks in with you between steps."],
];
const SEC = Object.fromEntries(SECS.map(s => [s[0], s]));
if (E.some(e => e.sec === "desk")) { SECS.push(["desk", "Desk only", "Saved in Desk with no match in either guide."]); SEC.desk = SECS[SECS.length - 1]; }
const GROUPED = new Set(["inv", "db", "ecmd", "dcmd"]);
const INVLIKE = new Set(["inv", "db"]);
const SECCOLOR = s => `var(--s-${s})`;
const MODES = { read: "Changes nothing", repro: "Adds a test that shows it", change: "Suggests a fix" };
const TOPO = { single: "One session", split: "Look first, then fix in a new session" };
const TABS = [["start", "Start"], ["library", "Library"], ["choosing", "Which one?"], ["starred", "Starred"]];
const VIEWS = ["start", "library", "choosing", "starred", "sources"];
const STORE = "mpl-v1";
let S = { view: "start", q: "", stage: "start", sym: -1, stars: [], stab: "code", lsec: "inv", lgrp: 0, recent: [] };
try { const saved = JSON.parse(localStorage.getItem(STORE) || "{}"); Object.assign(S, { view: saved.view, stage: saved.stage || "start", stars: Array.isArray(saved.stars) ? saved.stars : [], stab: saved.stab || "code", lsec: saved.lsec || "inv", lgrp: Number.isInteger(saved.lgrp) ? saved.lgrp : 0, recent: Array.isArray(saved.recent) ? saved.recent : [] }); } catch (e) {}
if (!VIEWS.includes(S.view)) S.view = S.view === "recipes" ? "library" : "start";
function save() { try { localStorage.setItem(STORE, JSON.stringify({ view: S.view, stage: S.stage, stars: S.stars, stab: S.stab, lsec: S.lsec, lgrp: S.lgrp, recent: S.recent })); } catch (e) {} }

const SVG = {
  copy: '<svg class="i cp" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg><svg class="i ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  star: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.9l1.85 3.87 4.23.55-3.1 2.93.8 4.2L8 11.4l-3.78 2.05.8-4.2-3.1-2.93 4.23-.55z"/></svg>',
  x: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  info: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.25v4" stroke-linecap="round"/><circle cx="8" cy="5" r=".4" fill="currentColor"/></svg>',
  chev: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>',
};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v; else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(c)); }
  return n;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1600); }
async function copy(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = h("textarea", { style: "position:fixed;left:-9999px;top:0" }); ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove();
    if (!ok) { toast("Copy blocked here. Select the text and copy it."); return false; }
  }
  if (btn) { btn.classList.add("copied"); setTimeout(() => btn.classList.remove("copied"), 1200); }
  toast(label || "Copied");
  return true;
}
function noteCopy(id, rerender = true) { if (!id) return; S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 8); save(); }
// A labelled copy button (prompts) or a command chip (commands).
function copyBtn(label, text, opts = {}) {
  const b = h("button", { type: "button", class: "copy" + (opts.primary ? " primary" : "") + (opts.soft ? " soft" : ""), "aria-label": opts.aria || null }, label);
  b.insertAdjacentHTML("afterbegin", SVG.copy);
  b.addEventListener("click", ev => { ev.stopPropagation(); copy(text, b, opts.toast).then(ok => ok && noteCopy(opts.id)); });
  return b;
}
function cmdChip(cmd, text, opts = {}) {
  const b = h("button", { type: "button", class: "cmd" + (opts.pick ? " pick" : ""), title: "Copy " + cmd }, cmd);
  b.insertAdjacentHTML("beforeend", SVG.copy);
  b.addEventListener("click", ev => { ev.stopPropagation(); copy(text, b, opts.toast || "Copied " + cmd).then(ok => ok && noteCopy(opts.id)); });
  return b;
}
function aboutBtn(id, label) {
  return h("button", { type: "button", class: "about", "aria-label": "About " + label, title: "About " + label, html: SVG.info, onclick: () => openSheet(id) });
}
const isStar = id => S.stars.includes(id);
function star(id, title) {
  const b = h("button", { type: "button", class: "star", "aria-pressed": isStar(id) ? "true" : "false", "aria-label": (isStar(id) ? "Unstar " : "Star ") + title, title: isStar(id) ? "Unstar" : "Star", html: SVG.star });
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    S.stars = isStar(id) ? S.stars.filter(x => x !== id) : [...S.stars, id]; save();
    document.querySelectorAll(`.star[data-id="${id}"]`).forEach(s => { s.setAttribute("aria-pressed", isStar(id) ? "true" : "false"); s.setAttribute("aria-label", (isStar(id) ? "Unstar " : "Star ") + title); s.title = isStar(id) ? "Unstar" : "Star"; });
    renderTabs(); if (S.view === "starred" && !S.q && !$("#sheet").open) render();
  });
  b.dataset.id = id;
  return b;
}
function copyText(e) { return e.sec === "ecmd" ? e.cmd : e.desk ? e.desk.body : e.p; }
const isCode = e => e.sec === "ecmd" || e.sec === "dcmd";
function desc(e) { return e.sec === "think" ? (e.use || e.p) : e.sec === "desk" ? e.desk?.body : e.why; }
function copyLabel(e) { return e.flow ? "Copy workflow" : { dcmd: "Copy example", ecmd: "Copy command", recipe: "Copy recipe" }[e.sec] || "Copy prompt"; }
const modeLabel = e => e.iso ? "Tests on a separate copy" : MODES[e.mode];

// Search ranks results: an exact ID or command first, then title words, then other names and tags, then descriptions, then the body.
const lc = (...xs) => xs.flat().filter(Boolean).join(" ").toLowerCase();
const FIELDS = e => [
  [lc(e.id), 60], [lc(e.t), 40],
  [lc(e.aka, e.tags, e.cmd, e.desk?.t), 25],
  [lc(e.why, e.use, e.group, e.sub), 10],
  [lc(e.p, e.ev, e.skip, e.avoid, e.tools, e.desk?.body, (e.steps || []).map(s => s.join(" ")), (e.flow || []).map(s => s[2]), e.kit), 3],
];
const IDX = Object.fromEntries(E.map(e => [e.id, FIELDS(e)]));
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const stem = w => w.length > 4 ? w.replace(/(ing|ed|es|s)$/, "") : w;
function score(e, ql, words) {
  const f = IDX[e.id]; let s = 0, hit = 0;
  if (f[0][0] === ql) s += 1000;
  if (e.cmd && norm(e.cmd) === ql) s += 900;
  if (f[1][0] === ql) s += 500; else if (ql.length > 2 && f[1][0].includes(ql)) s += 200;
  if (words.length > 1 && f[2][0].includes(ql)) s += 120;
  for (const [w, start] of words) {
    let best = 0;
    for (const [txt, wt] of f) if (txt.includes(w)) best = Math.max(best, start.test(txt) ? wt * 1.5 : wt);
    if (best) { hit++; s += best; }
  }
  return { s, hit };
}
let LOOSE = false;
// Every word must match. If nothing matches every word, show entries that match most of them.
function searchList() {
  const ql = S.q.toLowerCase().replace(/\s+/g, " ").trim();
  const words = ql.split(" ").filter(Boolean).map(stem).map(w => [w, new RegExp("(^|[^a-z0-9])" + esc(w))]);
  if (!words.length) return [];
  const scored = E.map((e, i) => ({ e, i, ...score(e, ql, words) })).filter(x => x.hit);
  const full = scored.filter(x => x.hit === words.length);
  const pool = full.length ? full : scored.filter(x => x.hit >= Math.ceil(words.length / 2));
  LOOSE = !full.length && pool.length > 0;
  return pool.sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.e);
}

const RISKY = new Set(["Changes code", "Suggests a fix", "Adds a test that shows it"]);
function card(e, opts = {}) {
  const meta = h("div", { class: "c-meta" }, h("span", { class: "badge" }, e.id));
  if (opts.best) meta.append(h("span", { class: "best-label" }, opts.label || "Best first"));
  if (e.desk) meta.append(h("span", { class: "tag" }, "In Desk"));
  const mode = INVLIKE.has(e.sec) && !e.flow ? modeLabel(e) : e.dmode || null;
  if (mode) meta.append(h("span", { class: RISKY.has(mode) ? "risk" : null }, mode));
  if (e.sec === "ecmd" && e.rel?.length) meta.append(h("span", {}, "Used in " + e.rel.length + (e.rel.length === 1 ? " investigation" : " investigations")));
  if (e.sec === "recipe") meta.append(h("span", {}, e.steps.length + " steps"));
  if (e.flow) meta.append(h("span", {}, "Workflow"));
  const d = desc(e);
  return h("article", { class: "card" + (opts.best ? " best" : ""), style: `--c:${SECCOLOR(e.sec)}` },
    h("div", { class: "c-head" }, h("button", { type: "button", class: "c-title" + (isCode(e) ? " code" : ""), onclick: () => openSheet(e.id) }, e.t), star(e.id, e.t)),
    meta,
    d ? h("p", { class: "c-desc" }, d) : null,
    e.sec === "recipe" ? h("ol", { class: "c-steps", "aria-label": "Steps" }, e.steps.map(([c]) => h("li", {}, c.replace(/\s*<[^>]*>/g, "")))) : null,
    e.flow ? h("ol", { class: "c-steps", "aria-label": "Steps" }, e.flow.filter(s => s[1].length).map(([l, ids]) => h("li", {}, l + ": " + ids.join(" or ")))) : null,
    h("div", { class: "c-acts" }, copyBtn(copyLabel(e), copyText(e), { soft: true, id: e.id, toast: "Copied “" + e.t + "”", aria: copyLabel(e) + ": " + e.t }), h("button", { type: "button", class: "details", tabindex: "-1", onclick: () => openSheet(e.id) }, "Details")));
}
const cards = (list, opts = {}) => h("div", { class: "cards" }, list.map((e, i) => card(e, { best: opts.best && i === 0, label: opts.label })));

// A row of tabs that switch one panel. Arrow keys move between them.
function tablist(cls, label, items, cur, onpick) {
  const list = h("div", { class: cls, role: "tablist", "aria-label": label });
  items.forEach(it => {
    list.append(h("button", { type: "button", role: "tab", class: it.cls, style: it.c ? `--c:${it.c}` : null, "aria-selected": cur === it.k ? "true" : "false", tabindex: cur === it.k ? "0" : "-1", onclick: () => onpick(it.k) }, ...it.kids));
  });
  list.addEventListener("keydown", ev => {
    if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(ev.key)) return;
    const tabs = [...list.querySelectorAll('[role="tab"]')]; const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    ev.preventDefault();
    const n = ev.key === "Home" ? 0 : ev.key === "End" ? tabs.length - 1 : (i + (ev.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    tabs[n].focus(); tabs[n].click();
  });
  return list;
}
function refocus(sel) { requestAnimationFrame(() => document.querySelector(sel)?.focus({ preventScroll: true })); }

function renderTabs() {
  const v = $("#tabs"); v.innerHTML = "";
  TABS.forEach(([k, name]) => {
    const b = h("button", { type: "button", "aria-current": S.view === k && !S.q ? "page" : null, onclick: () => go(k) }, name);
    if (k === "starred" && S.stars.length) b.append(h("span", { class: "ct" }, S.stars.length));
    v.append(b);
  });
}
function clearSearch() { S.q = ""; $("#q").value = ""; $("#clear").hidden = true; $("#kbd").hidden = false; }
function libHash() { return S.lgrp >= 0 && GROUPED.has(S.lsec) ? `g-${S.lsec}-${S.lgrp}` : "s-" + S.lsec; }
function viewHash() { return S.view === "library" ? libHash() : S.view; }
function setLib(hs) {
  const m = /^(?:s-(\w+)|g-(\w+)-(-?\d+))$/.exec(hs || ""); if (!m) return false;
  const k = m[1] || m[2]; if (!SEC[k]) return false;
  S.lsec = k; S.lgrp = m[3] != null ? +m[3] : (GROUPED.has(k) ? 0 : -1); return true;
}
// Moving to a new view or section adds a Back step; changing a group inside a section does not.
function nav(push) { const hs = "#" + viewHash(); if (location.hash === hs) return; history[push ? "pushState" : "replaceState"](null, "", hs); }
function go(k, anchor) {
  S.view = k; clearSearch();
  if (k === "library" && anchor) setLib(anchor);
  save(); nav(true); render(); window.scrollTo(0, 0);
}

let RENDERED = "";
function render() {
  renderTabs();
  const app = $("#app"); app.innerHTML = "";
  if (S.q) renderSearch(app);
  else ({ start: renderStart, library: renderLibrary, choosing: renderChoosing, starred: renderStarred, sources: renderSources }[S.view] || renderStart)(app);
  app.append(footer());
  RENDERED = S.q ? "" : viewHash();
}

function renderSearch(app) {
  const list = searchList();
  const n = list.length, word = `${n} ${LOOSE ? "close " : ""}match${n === 1 ? "" : "es"}`;
  const st = $("#status"); st.textContent = n ? `${word}. Press Enter to copy the best match.` : "No matches";
  app.append(h("div", { class: "head" }, h("h1", {}, n ? word : "No matches"), h("p", {}, n ? (LOOSE ? `Nothing matches every word of “${S.q}”, so these match most of them. ` : `For “${S.q}”, across every section. `) + "Press Enter to copy the best match." : "Try a command name, a problem such as “slow” or “duplicate”, or an ID like R05.")));
  if (!n) return;
  const [top, ...rest] = list;
  app.append(h("section", { class: "search-sec", style: `--c:${SECCOLOR(top.sec)}` }, h("h2", {}, "Best match"), cards([top], { best: true, label: "Enter copies this" })));
  SECS.forEach(([k, name]) => {
    const items = rest.filter(e => e.sec === k); if (!items.length) return;
    app.append(h("section", { class: "search-sec", style: `--c:${SECCOLOR(k)}` }, h("h2", {}, name, h("span", { class: "n" }, String(items.length))), cards(items)));
  });
}

function recentRow(title) {
  const list = S.recent.map(id => BY[id]).filter(Boolean); if (!list.length) return null;

    if (sibs.length) box.append(sub("More from " + e.group, relChips(sibs.map(x => x.id))));
  }
  if (e.sec === "ecmd") {
    box.append(h("div", { class: "acts" }, copyBtn("Copy " + e.cmd, e.cmd, { primary: true, toast: "Copied " + e.cmd })));
    box.append(facts([["Comes from", e.group + " · " + e.badge], ["About it", e.gnote]]));
  }
  if (e.sec === "recipe") {
    box.append(h("ol", { class: "steps" }, e.steps.map(([cmd, why]) => {
      const id = findCmd(cmd);
      return h("li", {}, h("div", { class: "sb" }, h("span", { class: "opt" }, cmdChip(cmd, cmd), id ? aboutBtn(id, cmd) : null), h("span", { class: "for" }, why)));
    })));
    box.append(h("p", { class: "prompt" }, e.p));
    box.append(h("div", { class: "acts" }, copyBtn("Copy whole recipe", e.p, { primary: true, id: e.id, toast: "Copied " + e.t })));
  }
  if (e.dmode && e.sec !== "dcmd") box.append(facts([["What it does", e.dmode]]));
  const rel = e.flow ? [] : (e.rel || []).filter(id => BY[id]);
  if (rel.length) box.append(sub(e.sec === "ecmd" ? "Prompts it helps with" : "Related", relChips(rel)));
  if (INVLIKE.has(e.sec)) {
    const tools = E.filter(x => x.sec === "ecmd" && (x.rel || []).includes(e.id));
    if (tools.length) box.append(sub("Commands that help", relChips(tools.map(x => x.id))));
  }
  box.append(h("div", { class: "sh-bottom" }, h("button", { type: "button", class: "details", onclick: closeSheet }, "Close")));
}

/* Header height, search and boot */
const top_ = $("#top");
function measure() { document.documentElement.style.setProperty("--hh", (getComputedStyle(top_).position === "sticky" ? top_.offsetHeight : 0) + "px"); }
new ResizeObserver(measure).observe(top_); addEventListener("resize", measure); measure();
const q = $("#q");
q.addEventListener("input", () => { S.q = q.value.trim(); $("#clear").hidden = !S.q; $("#kbd").hidden = !!S.q; render(); window.scrollTo(0, 0); });
q.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && q.value) { ev.preventDefault(); clearSearch(); $("#status").textContent = ""; render(); }
  if (ev.key === "Enter" && S.q) { const first = searchList()[0]; if (first) { ev.preventDefault(); copy(copyText(first), null, "Copied best match: “" + first.t + "”").then(ok => ok && noteCopy(first.id)); } }
});
$("#clear").addEventListener("click", () => { clearSearch(); render(); q.focus(); });
document.addEventListener("keydown", ev => { if (ev.key === "/" && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") && !$("#sheet").open) { ev.preventDefault(); q.focus(); } });
function fromHash() {
  const hs = decodeURIComponent(location.hash.slice(1));
  if (hs.startsWith("e-") && BY[hs.slice(2)]) { if (!$("#sheet").open) { if (RENDERED !== viewHash()) render(); openSheet(hs.slice(2)); } return; }
  if ($("#sheet").open) { HIST_CLOSE = true; closeSheet(); }
  if (hs && hs === RENDERED) return;
  if (setLib(hs)) { S.view = "library"; clearSearch(); save(); render(); window.scrollTo(0, 0); return; }
  if (hs === "recipes") { go("library", "s-recipe"); return; }
  if (VIEWS.includes(hs)) S.view = hs;
  render();
}
addEventListener("hashchange", fromHash);
fromHash();
</script>
