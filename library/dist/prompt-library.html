<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompt Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* One quiet frame (header, search, four views) around a library you can scan. Section hues survive only as small wayfinding marks; amber is the single accent for actions and the current place. */
:root {
  --bg: #ECEAE4; --surface: #FFFFFF; --sunk: #E4E1DA; --hover: #DEDAD1;
  --line: #B9B3A6; --line-soft: #D2CEC4;
  --ink: #0B0A08; --ink-2: #26231E; --ink-3: #46423A;
  --accent: #8A4B00; --on-accent: #FFFFFF; --accent-soft: #F6E6CF;
  --s-inv: #00704A; --s-think: #5A2FC2; --s-ecmd: #006C80; --s-dcmd: #1849C4; --s-recipe: #BF1F5E; --s-desk: #8A4B00; --s-db: #5C6B00; --on-s: #FFFFFF;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --hh: 0px;
  --lift: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(28,22,10,.07), 0 6px 14px -6px rgba(28,22,10,.10), 0 20px 34px -22px rgba(28,22,10,.22);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 4px rgba(28,22,10,.08), 0 10px 22px -8px rgba(28,22,10,.16), 0 28px 44px -24px rgba(28,22,10,.30);
  --risk: #B42318;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --s-inv: #4BF0A8; --s-think: #BFA8FF; --s-ecmd: #3FE0F5; --s-dcmd: #8CB6FF; --s-recipe: #FF7FB2; --s-desk: #F5A524; --s-db: #C9E05A; --on-s: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7), 0 24px 40px -24px rgba(0,0,0,.9);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.09), 0 2px 4px rgba(0,0,0,.6), 0 12px 26px -10px rgba(0,0,0,.8), 0 30px 50px -24px rgba(0,0,0,1);
  --risk: #FF8A75;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --s-inv: #4BF0A8; --s-think: #BFA8FF; --s-ecmd: #3FE0F5; --s-dcmd: #8CB6FF; --s-recipe: #FF7FB2; --s-desk: #F5A524; --s-db: #C9E05A; --on-s: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7), 0 24px 40px -24px rgba(0,0,0,.9);
  --lift-hi: inset 0 1px 0 rgba(255,255,255,.09), 0 2px 4px rgba(0,0,0,.6), 0 12px 26px -10px rgba(0,0,0,.8), 0 30px 50px -24px rgba(0,0,0,1);
  --risk: #FF8A75;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -0.008em; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--ink); }
* { scrollbar-color: var(--line) transparent; }
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
svg.i { width: 16px; height: 16px; flex: none; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.mono { font-family: var(--mono); letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-soft); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; gap: 10px 28px; min-height: 64px; }
.brand { font-size: 18px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand b { color: var(--accent); }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: none; height: 36px; padding: 0 12px; border-radius: 8px; color: var(--ink-3); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 600; }
.tabs .ct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.search { position: relative; margin-left: auto; flex: 0 1 380px; min-width: 0; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 0 40px 0 36px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; pointer-events: none; }
.clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
.clear:hover { background: var(--hover); color: var(--ink); }
@media (hover: none) { .kbd { display: none; } }

main .wrap { padding-block: 32px 80px; }
.spectrum { display: grid; grid-template-columns: repeat(5, 1fr); height: 3px; }
.spectrum span { background: var(--c); }
.stages .chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); }

/* Shared controls */
.copy { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.primary { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--on-s); font-weight: 600; min-height: 34px; padding: 0 14px; border-radius: 9px; }
.copy.primary:hover { filter: brightness(1.1); color: var(--on-s); }
.copy .ok, .cmd .ok { display: none; }
.copy.copied .ok, .cmd.copied .ok { display: block; } .copy.copied .cp, .cmd.copied .cp { display: none; }
.cmd { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--mono); font-size: 12.5px; letter-spacing: 0; line-height: 1.35; text-align: left; overflow-wrap: anywhere; }
.cmd svg { width: 13px; height: 13px; opacity: .5; flex: none; }
.cmd:hover { border-color: var(--accent); } .cmd:hover svg { opacity: 1; }
.cmd.pick { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); border-color: color-mix(in srgb, var(--c, var(--accent)) 55%, var(--line)); font-weight: 600; }
.opt { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
.about { width: 30px; height: 30px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; }
.about:hover { color: var(--accent); background: var(--hover); }
.star { width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; margin: -5px -6px 0 0; }
.star:hover { color: var(--ink); background: var(--hover); }
.star[aria-pressed="true"] { color: var(--accent); }
.star[aria-pressed="true"] svg path { fill: currentColor; }
.chip { min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.chip .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.tag { font-size: 12px; font-weight: 600; padding: 0 8px; line-height: 20px; border-radius: 999px; background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); white-space: nowrap; }
@media (pointer: coarse) { .copy, .cmd, .chip { min-height: 44px; } .tabs button, .search input { height: 44px; } .star, .about { width: 44px; height: 44px; } .star { margin: -10px -12px -6px 0; } }

/* Page heads */
.head { max-width: 760px; margin-bottom: 32px; }
.head h1 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; text-wrap: balance; }
.head p { margin: 12px 0 0; color: var(--ink-2); font-size: 16px; max-width: 56ch; text-wrap: pretty; }
.block { margin-top: 48px; }
.block > h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.block > .lede { margin: 4px 0 16px; color: var(--ink-3); max-width: 64ch; }

/* Calm, lifted surfaces. Color marks where things belong (a wash at the top of each card, the ID badge, the selected tab); solid color is kept for the one thing you are choosing or the best pick. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 16px 16px 14px; border-radius: 16px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--surface)) 0, var(--surface) 76px); border: 1px solid color-mix(in srgb, var(--c) 22%, var(--line-soft)); box-shadow: var(--lift); }
.card:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); box-shadow: var(--lift-hi); }
.c-head { display: flex; align-items: flex-start; gap: 8px; }
.c-title { all: unset; cursor: pointer; flex: 1; min-width: 0; color: var(--ink); font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.35; overflow-wrap: anywhere; }
.c-title.code { font-family: var(--mono); font-size: 14px; letter-spacing: 0; }
.c-title:hover { color: var(--c); }
.c-title:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; border-radius: 4px; }
.c-desc { margin: 0; color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.c-steps { margin: 0; padding: 8px 10px; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0; background: var(--sunk); border-radius: 8px; }
.c-steps li + li::before { content: "→ "; color: var(--c); }
.c-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--ink-3); }
.badge { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0; padding: 0 7px; border-radius: 6px; line-height: 20px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.risk { color: var(--risk); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.risk::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.best-label { font-size: 12px; font-weight: 700; color: var(--c); }
.c-acts { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.c-acts .copy { flex: 1; justify-content: center; }
.copy.soft { min-height: 34px; padding: 0 14px; border-radius: 9px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c) 40%, var(--line-soft)); color: var(--c); font-weight: 600; }
.copy.soft:hover, .copy.soft:focus-visible, .card.best .copy.soft { background: var(--c); border-color: var(--c); color: var(--on-s); }
.details { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
.details:hover { border-color: var(--ink-3); color: var(--ink); }

/* Tabs that switch a panel. Unselected: a lifted neutral tile with a color dot. Selected: solid color. */
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.door { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 15px 18px 17px; border-radius: 16px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); min-width: 0; }
.door b { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
.door b::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.door b .n { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--c); }
.door span.d { font-size: 13.5px; color: var(--ink-2); }
.door:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); box-shadow: var(--lift-hi); }
.door:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.door[aria-selected="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 14px 30px -16px var(--c); }
.door[aria-selected="true"] b::before { background: currentColor; opacity: .8; }
.door[aria-selected="true"] b .n, .door[aria-selected="true"] span.d { color: inherit; opacity: .85; }
.sectabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.sectabs .door { padding: 12px 14px; }
.sectabs .door b { font-size: 15px; }
.sec-line { margin: 14px 0 18px; color: var(--ink-2); max-width: 75ch; }
.panel { margin-top: 28px; }
.panel-head { margin-bottom: 16px; }
.panel-head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.025em; }
.panel-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.gbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
.gtabs { display: contents; }
.gtab { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; white-space: nowrap; }
.gtab .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.gtab:hover { border-color: var(--c); }
.gtab[aria-selected="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.gtab[aria-selected="true"] .n { color: inherit; opacity: .8; }
.gsel { position: relative; display: inline-flex; }
.gsel select { -webkit-appearance: none; appearance: none; min-height: 34px; padding: 0 34px 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer; max-width: 100%; }
.gsel select.on { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.gsel::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; color: var(--ink-3); }
.gsel:has(select.on)::after { color: var(--on-s); }
.gsel.narrow { display: none; width: 100%; }
.gsel.narrow select { width: 100%; min-height: 44px; border-radius: 12px; }
.blurb { margin: -2px 0 16px; color: var(--ink-3); font-size: 14px; max-width: 80ch; }
details.gabout { margin: -2px 0 16px; max-width: 80ch; }
details.gabout summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.gabout summary::-webkit-details-marker { display: none; }
details.gabout summary svg { transition: transform .2s cubic-bezier(.2,.8,.2,1); color: var(--c); }
details.gabout[open] summary svg { transform: rotate(90deg); }
details.gabout p { margin: 6px 0 0; color: var(--ink-3); font-size: 14px; }
.gsec + .gsec { margin-top: 28px; }
.gsec h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.gsec h3 .n { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-3); }

/* Start */
.symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.symcard { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); font-weight: 500; line-height: 1.35; }
.symcard span { flex: 1; }
.symcard svg { color: var(--c); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.symcard:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.symcard:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.symcard[aria-expanded="true"] { background: var(--c); border-color: var(--c); color: var(--on-s); font-weight: 600; }
.symcard[aria-expanded="true"] svg { color: inherit; transform: rotate(90deg); }
.results { margin-top: 18px; padding: 18px; border-radius: 18px; background: color-mix(in srgb, var(--c) 7%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line-soft)); }
.results h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.sitbox { border-radius: 16px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--lift); padding: 4px 18px; }
.sitbox .stage-note { margin: 12px 0 4px; color: var(--ink-3); }
.sit { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 32px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.sit .when { margin: 0; }
.sit .cmds { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sit .or { color: var(--ink-3); font-size: 13px; }
.rcard .k { font-weight: 600; font-size: 15.5px; }
.rcard p { margin: 0; font-size: 14px; color: var(--ink-2); }
.rcard p.rule { color: var(--ink-3); }
.recent { margin-top: 28px; }
.recent h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.rlist { display: flex; flex-wrap: wrap; gap: 8px; }
.ritem { display: inline-flex; align-items: center; max-width: 100%; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--lift); }
.ritem .rt { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 7px 4px 7px 12px; font-size: 13.5px; font-weight: 500; min-width: 0; }
.ritem .rt::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.ritem .rt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.ritem .rt:hover { color: var(--c); }
.ritem .rt:focus-visible { outline: 2px solid var(--c); border-radius: 8px; }
.ritem .rc { width: 34px; height: 34px; border: 0; background: none; color: var(--c); display: grid; place-items: center; border-radius: 8px; }
.ritem .rc:hover { background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

footer.foot p { margin: 0; max-width: 80ch; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }

dialog.sheet { margin: 0 0 0 auto; height: 100%; max-height: none; width: min(680px, 100%); max-width: 100%; border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--bg); color: var(--ink); overflow: hidden; box-shadow: -24px 0 60px -30px rgba(0,0,0,.45); }
dialog.sheet::backdrop { background: rgba(8, 6, 2, .4); }
.sheet-in:focus { outline: none; }
.sh-bottom { display: none; }
.sheet-in { box-shadow: inset 0 4px 0 var(--c); }
.rel .chip:hover { border-color: var(--c); }
.sheet-in { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) 28px; display: flex; flex-direction: column; gap: 20px; }
.sh-head { display: flex; gap: 8px; align-items: flex-start; }
.sh-head .hd { flex: 1; min-width: 0; }

.sh-head .star { margin: 2px 0 0; width: 36px; height: 36px; }

pre.out { margin: 0; padding: 12px 14px; background: var(--sunk); border-radius: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.6; letter-spacing: 0; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; }

ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }

ol.steps li::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-3); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; margin-top: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: 10px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); z-index: 60; }

  .copy, .cmd, .chip, .tabs button, .search input, .star, .about, .door, .gtab, .symcard, .details, .card { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }

}

  .tabs button { justify-content: center; padding: 0 4px; height: 48px; border-radius: 10px; font-size: 14px; }
  .tabs button[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }
  main .wrap { padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .sit, .src { grid-template-columns: minmax(0, 1fr); }

  .results { padding: 12px; margin-inline: -4px; }

  .gtabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .gtabs::-webkit-scrollbar { display: none; }
  dialog.sheet { width: 100%; border-left: 0; }
  .sh-bottom { display: block; position: sticky; bottom: calc(-1 * max(48px, env(safe-area-inset-bottom, 0px))); margin: 0 -16px calc(-1 * max(48px, env(safe-area-inset-bottom, 0px))); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
  .sh-bottom .details { width: 100%; min-height: 48px; font-weight: 600; color: var(--ink); }
  .gbar .gtabs, .gsel.wide { display: none; }
  .gsel.narrow { display: flex; }
  .sheet-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sh-head h2 { font-size: 21px; }
  dl.facts { grid-template-columns: minmax(0, 1fr); }
  dl.facts dd { border-top: 0; padding-top: 0; }

  details.composer summary span { display: none; }
  footer.foot { flex-direction: column; }
}

<script type="application/json" id="library">{"entries":[{"id":"A01","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Status hidden in a pile of flags","p":"Find every implicit state machine in this application. Identify where states, transitions, and invalid combinations are scattered across flags, conditionals, and components.","why":"Finds features whose real status is spread across a pile of yes/no flags, so combinations that should be impossible can happen.","ev":"A list of states and transitions per feature, each with file:line, plus one reachable invalid combination shown concretely.","skip":"Small features with one status field that has a fixed list of values and is checked in one place.","mode":"read","top":"split","scope":"wide","tools":"Repository access only.","kit":["/improve-codebase-architecture","/grill-me"],"rel":["A06","G06","R03"],"imp":"H","blind":"Agents tend to list every boolean as a state. Ask which combinations are reachable and which are only theoretical.","aka":"Implicit state machines"},{"id":"A02","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Meaning drift across the stack","p":"Trace the same business concept across the entire stack. Find places where its meaning, representation, or validation changes between the UI, API, database, and background jobs.","why":"Shows where one word (a task, a fund, a run) means slightly different things in different parts of the app.","ev":"One table per concept: layer, type or column, validation rule, file:line. Mismatches marked.","skip":"Ideas that only live in one part of the app.","mode":"read","top":"split","scope":"wide","tools":"Repository access and read-only access to the database layout.","kit":["/grill-with-docs","/spec-to-code-compliance"],"rel":["D01","D03","G03"],"imp":"H","blind":"This is an unbounded trace. Name one concept up front or it will wander.","aka":"Semantic drift through the stack"},{"id":"A03","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Layers that don't earn their keep","p":"Identify abstractions that no longer earn their complexity. Find wrappers, factories, inheritance, and generic utilities that make the application harder to understand than a simpler implementation would.","why":"Finds extra layers of code you could delete so the code, and the agents reading it, get simpler.","ev":"For each candidate: callers count, what deleting it would move where (the deletion test), and what tests would change.","skip":"Right after a cleanup of the code, or when the layer walls off an outside company's toolkit.","mode":"read","top":"single","scope":"wide","tools":"Repository access only.","kit":["/improve-codebase-architecture","/simplify"],"rel":["A05","M04","PG10"],"imp":"H","blind":"Agents call thin adapters redundant when they exist to isolate an unstable SDK or give tests a seam.","aka":"Abstractions past their usefulness"},{"id":"A04","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Two systems that disagree","p":"Find places where two systems can disagree about the same truth. Trace their ownership, synchronization, cache invalidation, and recovery behavior.","why":"Finds data kept in two places (a saved copy and a table, the browser and the server) that can quietly disagree.","ev":"Pairs of stores with the field, who writes each, how they sync, and a sequence of events that makes them diverge.","skip":"Read-only copies that are rebuilt from scratch on every load.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","kit":["/audit-context-building"],"rel":["R05","G06","D02","PG05","PG11"],"imp":"H","aka":"Competing sources of truth"},{"id":"A05","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Old design choices that now cost you","p":"Look for architectural decisions that were reasonable when this project was smaller but are now liabilities. Distinguish actual problems from stylistic preferences.","why":"Separates old design choices that now cost real time or bugs from ones that are only out of fashion.","ev":"Each decision with the original reason, the current cost (incidents, workarounds, slow paths) and evidence for that cost.","skip":"Projects younger than a few months.","mode":"read","top":"single","scope":"wide","tools":"Repository and its git history.","kit":["/improve-codebase-architecture","/recommend"],"rel":["A03","P05"],"imp":"M","aka":"Obsolete architectural assumptions"},{"id":"A06","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Code that relies on lucky timing","p":"Identify asynchronous operations whose correctness depends on events happening in a particular order without an explicit guarantee. Trace the scheduling, retries, cancellation, and conflicting writes; reproduce the highest-risk cases and propose the smallest enforceable contract.","why":"Finds code that only works because things usually happen in the right order.","ev":"The assumed order, what can reorder it (retry, webhook, slow network), and a reproduction for the worst case.","skip":"Scripts that do one step at a time with nothing running side by side.","mode":"repro","top":"split","scope":"wide","tools":"Repository; a way to run the code locally to reproduce the problem.","kit":["/diagnosing-bugs"],"rel":["R05","A01","G04"],"imp":"H","aka":"Implicit ordering contracts"},{"id":"A07","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Timers and connections nobody closes","p":"Map external side effects and resource lifecycles across this application: connections, subscriptions, listeners, timers, streams, cache entries and background workers. Find unclear ownership, incomplete cleanup and operations that outlive their intended scope. Prioritize evidenced leaks or correctness risks over stylistic patterns.","why":"Finds timers, listeners and connections that nobody clearly owns or shuts off.","ev":"Each resource with where it is created, who should release it, and the path where it is not released.","skip":"Short-lived scripts and one-off server functions that keep nothing running between calls.","mode":"read","top":"single","scope":"wide","tools":"Repository access; memory snapshots help confirm.","kit":["/audit-context-building"],"rel":["P07","R06"],"imp":"H","aka":"Side-effect and resource ownership"},{"id":"A08","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Screens that fight how people work","p":"Map this application's pages, navigation and URLs against the jobs its users actually do. Find pages that should merge, become a tab or panel, or go away; navigation systems that compete for the same destinations; and jobs users have to assemble by hand across screens. Say whether the structure itself causes the problems, and if it does, name the end state it should reach.","why":"Finds when confusing screens are a symptom of how the product is organised rather than a list of separate bugs.","ev":"A verdict per page (keep, merge, demote, retire) with the evidence for each, the two to five causes behind the symptoms, and today's site map next to the proposed one.","skip":"Products with a handful of pages, or right after a navigation redesign nobody has used yet.","mode":"read","top":"split","scope":"wide","tools":"Repository; the app running locally with test accounts for the browser checks.","kit":["/experience-architecture:diagnose","/experience-architecture:rethink"],"rel":["A05","R07","A02"],"imp":"H","blind":"Agents propose a redesign for every complaint. Ask whether one structural cause explains two or more findings; if none does, the structure is sound and the fixes are local.","aka":"Structure that fights the users' work"},{"id":"P01","sec":"inv","group":"Performance and scale","gk":"P","t":"Slowest journeys, end to end","p":"Trace the five most expensive user journeys from browser interaction to database response. Find unnecessary round trips, waterfalls, serialization, and repeated computations, and measure their contribution to latency.","why":"Shows where the seconds go on the paths people actually use.","ev":"A timed trace per journey (browser network panel, server timing, query time) with each step's share of the total.","skip":"When nobody has reported slowness and costs are flat.","mode":"read","top":"split","scope":"wide","tools":"Browser developer tools or Playwright recordings, server logs or timing data, and the database's query plan (EXPLAIN).","kit":["/diagnosing-bugs"],"rel":["P02","P03","M08"],"imp":"H","blind":"Static reading guesses at latency. Require a measured trace before any ranking.","aka":"Expensive journeys"},{"id":"P02","sec":"inv","group":"Performance and scale","gk":"P","t":"Steps that wait for no reason","p":"Find all hot paths where independent asynchronous operations run sequentially. Establish which can safely run concurrently without violating ordering, rate limits, or transaction boundaries.","why":"Finds steps that wait for each other to finish when they could run at the same time.","ev":"Each chain with the operations, why they are independent, and a before/after timing on a realistic input.","skip":"Paths that run once a day or already finish in a few milliseconds.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a timing script to measure the result afterward.","kit":["/diagnosing-bugs"],"rel":["P09","A06","M08"],"imp":"H","blind":"Agents wrap awaits in Promise.all without noticing they share one database transaction or hit a rate-limited API. Check transactions, rate limits and pool sizes before changing anything.","aka":"Sequential asynchronous work"},{"id":"P03","sec":"inv","group":"Performance and scale","gk":"P","t":"Queries that grow badly","p":"Find database queries whose cost grows disproportionately with records, tenants, or relationships. Examine execution plans, indexes, joins, pagination, and application-side filtering.","why":"Finds the database queries that will be the first to slow down as tables grow.","ev":"EXPLAIN ANALYZE output for each suspect query at realistic row counts, plus the index or rewrite and its new plan.","skip":"Tables that will stay small (settings, lookup lists).","mode":"read","top":"single","scope":"narrow","tools":"Read-only database access with EXPLAIN (the database's query plan). A Neon or Supabase branch copy for anything heavier.","kit":[],"rel":["P01","P05","P06","PG13"],"imp":"H","aka":"Query scaling"},{"id":"P04","sec":"inv","group":"Performance and scale","gk":"P","t":"Work repeated for nothing","p":"Identify expensive work that is repeated despite unchanged inputs. Investigate caching, memoization, batch operations, and incremental computation before recommending changes.","why":"Finds work redone on every request or screen redraw when nothing it depends on changed.","ev":"The operation, how often it runs, how often its inputs change, and its measured cost.","skip":"Work that is already cheap, where saving results would add a risk of stale data for little gain.","mode":"read","top":"single","scope":"wide","tools":"A profiler or request logs to count repeats.","kit":[],"rel":["A04","P01","PG06"],"imp":"H","blind":"A cache is a second source of truth. Any cache proposal must say who invalidates it and when.","aka":"Repeated expensive work"},{"id":"P05","sec":"inv","group":"Performance and scale","gk":"P","t":"What breaks at ten times the size","p":"Investigate what happens when this application's data volume and concurrent users increase tenfold. Identify the first likely bottlenecks using evidence from its current design.","why":"Names the first thing to break if the project takes off, before it does.","ev":"Current sizes and rates, the projected tenfold numbers, and the limit each bottleneck hits (pool size, plan limit, query cost).","skip":"Products with no growth in sight; revisit quarterly.","mode":"read","top":"single","scope":"wide","tools":"Database stats, hosting plan limits, current traffic numbers.","kit":[],"rel":["P03","P09"],"imp":"M","aka":"Tenfold growth stress"},{"id":"P06","sec":"inv","group":"Performance and scale","gk":"P","t":"Loops that blow up with big data","p":"Identify potentially quadratic or worse operations in frequently used code paths, including nested joins in application memory, copy-on-every-iteration patterns and repeated scans. Determine realistic input sizes and benchmark the highest-impact candidates before changing their algorithms.","why":"Finds loops inside loops that are fine at 50 rows and painful at 50,000.","ev":"Each candidate with realistic input size and a benchmark at that size; ignore candidates whose real inputs stay small.","skip":"Code whose inputs are small and capped by design.","mode":"read","top":"single","scope":"narrow","tools":"A speed-test setup. The experimental agent-complexity-optimizer scanner can suggest places to look.","kit":[],"rel":["P03","M08"],"imp":"H","blind":"Static scanners flag nested loops over tiny arrays. Without real sizes the list is mostly noise.","aka":"Growth complexity analysis"},{"id":"P07","sec":"inv","group":"Performance and scale","gk":"P","t":"Memory that keeps growing","p":"Investigate sustained memory growth and allocation pressure. Look for unbounded caches, retained closures, unremoved listeners, large error objects, detached DOM references and accidentally retained request data. Use heap profiles or repeatable growth tests to validate candidates.","why":"Finds why a page or process gets slower or crashes the longer it runs.","ev":"Two heap snapshots over a repeated action, with the growing object type and what retains it.","skip":"When memory use stays flat over a long session.","mode":"read","top":"single","scope":"narrow","tools":"Chrome DevTools memory snapshots or Node --inspect.","kit":["/diagnosing-bugs"],"rel":["A07"],"imp":"H","aka":"Allocation and memory retention"},{"id":"P08","sec":"inv","group":"Performance and scale","gk":"P","t":"One slow step that blocks the rest","p":"Find synchronous work performed in latency-sensitive asynchronous handlers, including filesystem operations, parsing, compression, large serialization and CPU-heavy transforms. Measure event-loop impact and identify safe offloading, batching or scheduling fixes.","why":"Finds one slow step that makes every other request wait in line behind it.","ev":"Event-loop delay or long-task measurements tied to the specific handler.","skip":"Background scripts where nothing else shares the process.","mode":"read","top":"single","scope":"narrow","tools":"Node profiler or the browser's Performance panel.","kit":[],"rel":["P01","P04"],"imp":"H","aka":"Event loop and blocking I/O"},{"id":"P09","sec":"inv","group":"Performance and scale","gk":"P","t":"Parallel work with no limit","p":"Examine places where work is parallelized or queued without explicit limits. Find cases where a speed optimization could overwhelm rate limits, memory, connection pools or a downstream service; propose and test concurrency bounds with realistic load.","why":"Finds work run in parallel with no limit, which can swamp the database connections or an outside service.","ev":"Each fan-out with its maximum width at realistic input, the downstream limit, and a load test with a bound.","skip":"Parallel work over a fixed, small list.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a load-testing script pointed at a non-production copy.","kit":[],"rel":["P02","G04"],"imp":"H","aka":"Concurrency boundedness"},{"id":"R01","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Safe to run twice?","p":"Find operations that cannot safely be retried. Examine duplicate events, partial failures, idempotency, transaction boundaries, and recovery from interrupted execution.","why":"Finds actions that do damage when they run twice: double sends, double charges, duplicate rows.","ev":"Each operation with its trigger, what a second run does, and whether a key or constraint prevents it.","skip":"Actions that only read data.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only access to the database layout.","kit":["/diagnosing-bugs"],"rel":["R05","R06","D04","PG08"],"imp":"H","aka":"Retry and idempotency failures"},{"id":"R02","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Fallbacks that look like real data","p":"Trace every place the application silently substitutes a default, null, stale value, or empty result when something fails. Determine whether users could mistake the fallback for valid information.","why":"Finds screens that show a confident zero or an empty list when the real answer is 'we could not load this'.","ev":"Each fallback with its trigger, what the user sees, and whether anything tells them it is a fallback.","skip":"Fallbacks that are already labelled on screen.","mode":"read","top":"single","scope":"wide","tools":"Repository; the app running to see what users see.","kit":["/insecure-defaults:audit"],"rel":["D01","T05","S06"],"imp":"H","aka":"Misleading fallbacks"},{"id":"R03","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Rules the data never enforces","p":"Identify business invariants the system assumes but never enforces. Find the appropriate enforcement point and develop tests that attempt to violate them.","why":"Finds the rules everyone assumes (one owner per task, no negative balance) that nothing actually checks.","ev":"Each invariant, where it is assumed, where it could be enforced (constraint, schema, server check) and a test that breaks it today.","skip":"Rules the database itself already enforces.","mode":"repro","top":"single","scope":"wide","tools":"Repository; a test database or branch copy.","kit":["/property-based-testing","/tdd"],"rel":["A01","T02"],"imp":"H","aka":"Unenforced invariants"},{"id":"R04","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Dates, times and time zones","p":"Analyze the system's handling of time: time zones, daylight saving, expiration, scheduled jobs, clock differences, and historical as-of queries.","why":"Finds the date bugs that show up twice a year, at midnight, or in another time zone.","ev":"Each time-sensitive path with the zone it assumes, and a test at a DST boundary and at midnight in your users' main time zone and in UTC.","skip":"Features that never show or compare dates.","mode":"repro","top":"single","scope":"wide","tools":"Repository; tests with the clock fixed to a set time.","kit":["/property-based-testing"],"rel":["D03"],"imp":"M","aka":"Time handling"},{"id":"R05","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Updates that overwrite each other","p":"Find race conditions and out-of-order updates across background jobs, UI mutations, caches, webhooks, and database writes. Prove suspected problems with reproducible cases.","why":"Finds updates that overwrite newer data because two things wrote at once.","ev":"A reproduction for each race (a script or test that loses an update) rather than a theory.","skip":"Data that only one thing ever writes.","mode":"repro","top":"split","scope":"wide","tools":"Repository; a local or branch-copy database to reproduce the problem.","kit":["/diagnosing-bugs"],"rel":["A06","A04","R01","PG05"],"imp":"H","blind":"Agents list theoretical races freely. Count only the ones with a reproduction.","aka":"Races and stale writes"},{"id":"R06","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Half-finished failures","p":"Trace error, timeout and cancellation paths for transactions, locks, file handles, temporary files, worker jobs and network connections. Identify paths that leave resources held or state half-committed, and demonstrate them with controlled failure injection where practical.","why":"Finds what is left behind when something fails halfway.","ev":"Each failure path with the resource left held, shown by injecting the failure.","skip":"Code that holds nothing open beyond a single request.","mode":"repro","top":"single","scope":"wide","tools":"Repository; a way to force errors in tests.","kit":["/diagnosing-bugs"],"rel":["A07","R01","I04"],"imp":"H","aka":"Partial resource cleanup on failure"},{"id":"R07","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Lost place: Back, refresh and shared links","p":"Check whether this application keeps the user's place. In a real browser, open lists, filters, tabs, panels and records, then press Back and Forward, refresh, open links in a new tab, and open shared links in a fresh browser both signed out and as another account. Find where users lose a filter, scroll position, draft or open panel, or land somewhere other than what was shared, and trace each case to where that state lives.","why":"Finds the everyday friction where Back closes the wrong thing, a filter resets, or a pasted link opens the wrong view.","ev":"Each case as a recorded journey (start, action, expected, observed) with the file and line that owns the state, and the journey runner's verdict: PASS, FAIL or EXPLORATORY.","skip":"Static sites with no filters, panels or signed-in pages.","mode":"read","top":"single","scope":"narrow","tools":"The app running locally or on staging with test accounts; Playwright, which the plugin looks for and asks before installing.","kit":["/experience-architecture:diagnose","/experience-architecture:verify"],"rel":["T01","A08","G06"],"imp":"H","blind":"Blocking data-changing requests does not make a browser run read-only, because some apps change data on an ordinary page load. Never point it at production with real accounts."},{"id":"T01","sec":"inv","group":"Testing and security","gk":"T","t":"Unit tests that give false comfort","p":"Find critical user journeys that have extensive unit-test coverage but insufficient evidence that they work end to end. Strengthen the smallest set of tests that closes the real gaps.","why":"Finds features whose automated checks all pass and that still break for real people.","ev":"Each journey with what the tests cover, what they skip (real auth, real DB, real browser), and the one added check.","skip":"User paths already covered by a browser test.","mode":"repro","top":"single","scope":"wide","tools":"Playwright or the in-app browser for the full start-to-finish check.","kit":["/tdd","/viewport-proof"],"rel":["T02","T06","I02"],"imp":"H","aka":"False confidence from unit tests"},{"id":"T02","sec":"inv","group":"Testing and security","gk":"T","t":"Tests that can't fail","p":"Find tests that would continue passing if the underlying feature stopped working. Examine mocks, fixtures, assertions, and tests that merely reproduce implementation details.","why":"Finds tests that pass no matter what.","ev":"For each suspect test, break the feature on purpose and show the test still passes.","skip":"Brand-new test suites written before the code.","mode":"repro","top":"single","scope":"wide","tools":"Repository and the test runner.","kit":["/property-based-testing","/tdd"],"rel":["T06","T01"],"imp":"H","aka":"Tests that cannot fail meaningfully"},{"id":"T03","sec":"inv","group":"Testing and security","gk":"T","t":"Outside input reaching sensitive actions","p":"Trace every external input from entry point to sensitive operation. Investigate authorization gaps, injection risks, unsafe parsing, and tenant isolation failures.","why":"Follows input from outsiders to the places it can do harm.","ev":"Each path: entry point, checks along the way, sensitive operation, and the missing check if any, with file:line.","skip":"Never skip for anything that holds other people's data or money.","mode":"read","top":"split","scope":"wide","tools":"Repository access.","kit":["/security-review","/audit-context-building","/differential-review:diff-review"],"rel":["T05","S06","G03"],"imp":"H","aka":"Input-to-sensitive-operation tracing"},{"id":"T04","sec":"inv","group":"Testing and security","gk":"T","t":"Risk from outside packages","p":"Review dependency and CI supply-chain exposure: install scripts, untrusted pull requests, privileged tokens, outdated packages, and unsafe automation permissions.","why":"Checks what a harmful outside package or pull request could reach.","ev":"Advisories matched to installed versions, install scripts present, workflow permissions and which secrets each job can read.","skip":"Rarely; run after adding packages or automated build jobs.","mode":"read","top":"single","scope":"narrow","tools":"The lockfile (exact package list), automated build workflow files, npm audit or the auditor skill.","kit":["/supply-chain-risk-auditor","/agentic-actions-auditor","/ci-optimizer:ci-check"],"rel":["I06","I03"],"imp":"H","aka":"Supply-chain exposure"},{"id":"T05","sec":"inv","group":"Testing and security","gk":"T","t":"Security checks that fail open","p":"Search for security-sensitive behavior that fails open when configuration is missing, an authorization service fails, or a request is malformed.","why":"Finds security checks that let people in when something goes wrong.","ev":"Each check with what happens on missing config, thrown error and malformed input, shown with a request or test.","skip":"Never skip for sign-in, keys or owner checks.","mode":"read","top":"single","scope":"narrow","tools":"Repository; the app running locally in demo mode.","kit":["/insecure-defaults:audit","/sharp-edges"],"rel":["S06","T03","R02"],"imp":"H","aka":"Fail-open security paths"},{"id":"T06","sec":"inv","group":"Testing and security","gk":"T","t":"What the tests really prove","p":"Choose critical features and ask what the existing tests truly prove. Identify mocks that bypass important integration behavior, assertions that cannot fail meaningfully, and tests that reproduce the implementation's assumptions. Produce the smallest independent check that catches a real regression.","why":"Asks what each test really proves, then adds one check that would catch a real break.","ev":"For each feature, the claim the tests make, what they actually exercise, and a new check that fails when the feature is broken.","skip":"Features with an existing start-to-finish check that has caught a real bug.","mode":"repro","top":"single","scope":"narrow","tools":"Repository and test runner.","kit":["/tdd","/property-based-testing"],"rel":["T02","T01","M06"],"imp":"H","aka":"Test claims versus real evidence"},{"id":"S06","sec":"inv","group":"Testing and security","gk":"T","t":"Settings that differ in production","p":"Audit settings that differ between local development, CI, preview and production. Find ambiguous fallbacks, fail-open access controls and configuration whose behavior silently changes when an environment variable is missing. Verify against the actual deployment configuration, not only README examples.","why":"Finds settings that behave differently in production than anyone expects.","ev":"A table of each setting per environment, the default when missing, and the behavior that changes.","skip":"Projects with one environment.","mode":"read","top":"single","scope":"narrow","tools":"Vercel settings list (names only, never values), automated build config, the code that reads each setting.","kit":["/insecure-defaults:audit"],"rel":["T05","I05","G02"],"imp":"H","blind":"Never print secret values. The audit needs variable names and code paths, not contents.","aka":"Configuration and secure default drift"},{"id":"I01","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Duplicate tools and stale caches","p":"Inventory the development environment's browser runtimes, caches, SDKs, package managers, and duplicate installations. Identify obsolete or wasteful components, assess dependencies, and propose a safe cleanup.","why":"Finds disk space and confusion spent on duplicate developer tools and stale saved files on your computer.","ev":"Each component with size, version, what depends on it, and whether deleting it is safe and reversible.","skip":"When disk space is fine and builds are stable.","mode":"read","top":"single","scope":"narrow","tools":"A terminal on your computer.","kit":[],"rel":["I07"],"imp":"M","blind":"Treat every deletion as a proposal. Shared runtimes break other apps silently.","aka":"Toolchain and cache hygiene"},{"id":"I02","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Why production might not match main","p":"Trace a change from commit to production, including builds, migrations, deployment triggers, cache refreshes, and background services. Identify every reason production might not reflect merged code.","why":"Lists every way 'merged' can fail to mean 'live'.","ev":"The real pipeline as steps with their config files, and for each, how it can skip or fail without anyone noticing.","skip":"Right after the same trace, unless the release process changed.","mode":"read","top":"single","scope":"narrow","tools":"Automated build and Vercel config, deployment history (read-only).","kit":[],"rel":["G02","I05","PG15"],"imp":"H","aka":"Merge-to-production trace"},{"id":"I03","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Check time that catches nothing","p":"Analyze CI and deployment costs against actual failures detected. Find repeated work, redundant checks, and expensive jobs that contribute little incremental confidence.","why":"Finds paid automated-check minutes spent on checks that never catch anything.","ev":"Per job: run count, minutes, failures that were real bugs, and what else would have caught them.","skip":"When the bills for automated checks are small and runs are fast.","mode":"read","top":"single","scope":"narrow","tools":"GitHub Actions run history via gh.","kit":["/ci-optimizer:ci-timings","/ci-optimizer:ci-check"],"rel":["T04"],"imp":"H","aka":"CI cost versus confidence"},{"id":"I04","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Background jobs that hang or stop halfway","p":"Find background jobs that can block other work or leave partially updated data. Examine queues, locks, timeouts, retries, deployment behavior, and observability.","why":"Finds scheduled jobs and background workers that can hang, overlap or stop halfway.","ev":"Each job with its trigger, timeout, what happens if two run at once, and what happens if it dies midway.","skip":"Projects with no background jobs.","mode":"read","top":"single","scope":"narrow","tools":"Repository, the scheduled jobs in vercel.json, logs.","kit":[],"rel":["R06","R01","G02"],"imp":"H","aka":"Blocking and partial background jobs"},{"id":"I05","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Dashboard and repo out of sync","p":"Compare declared infrastructure configuration with the running environment and identify drift that affects reliability, security, or developer productivity.","why":"Finds where the hosting dashboard and the repo disagree.","ev":"Each setting declared in the repo next to its live value, with the source of each.","skip":"Setups that are fully managed from the repo.","mode":"read","top":"single","scope":"narrow","tools":"Vercel and database dashboards or MCP tools, read-only.","kit":[],"rel":["S06","I02"],"imp":"M","aka":"Infrastructure drift"},{"id":"I06","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Packages nobody uses, or that work by luck","p":"Audit dependencies for packages declared but unused, imports satisfied only through transitive dependencies, and heavyweight libraries used for trivial behavior. Check build-time and runtime use, dynamic imports, tooling and security advisories before recommending removal or replacement.","why":"Finds packages nobody uses and packages that work only by accident.","ev":"Each package with every import site (including config files and scripts) and the bundle or install cost.","skip":"Right after a package cleanup.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a package checker such as knip or depcheck if already present.","kit":["/supply-chain-risk-auditor"],"rel":["T04"],"imp":"H","blind":"Static scans flag packages as unused when they load from PostCSS, Vite or Next config, CLI scripts or file-based routing.","aka":"Ghost and phantom dependencies"},{"id":"I07","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Old runtimes and when support ends","p":"Inventory actual versions and dependencies of Playwright, Puppeteer, system Chrome, Chromium caches and Electron apps. Verify current vendor-supported and security-fix thresholds rather than trusting hard-coded version numbers. Distinguish safe disposable caches from app-owned runtimes and report the rollback path before any cleanup.","why":"Finds old browser runtimes on your computer and which are safe to remove, before a cleanup breaks an app that needs them.","ev":"Each runtime with version, owner app, support status from the vendor, size, and a rollback path.","skip":"When browser tests are stable and disk space is fine.","mode":"read","top":"single","scope":"narrow","tools":"A terminal on your computer; vendor release pages.","kit":[],"rel":["I01"],"imp":"M","blind":"Do not delete shared runtimes or force a system Chrome until every dependent app is known.","aka":"Runtime inventory and support lifecycle"},{"id":"D01","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Missing vs zero vs stale","p":"Identify where the application confuses missing, zero, unavailable, estimated, stale, and not applicable. Trace the consequences through storage, calculations, and presentation.","why":"Finds where 'we don't know' turns into 0 and then into a wrong total.","ev":"Each field with how each absence state is stored, how calculations treat it, and how it displays.","skip":"Data with no optional values.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","kit":["/spec-to-code-compliance"],"rel":["R02","D02","G05"],"imp":"H","aka":"Missing versus zero versus stale"},{"id":"D02","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Where did this number come from?","p":"Trace every derived metric to its raw evidence, transformation logic, assumptions, and historical version. Find calculations that cannot be independently reproduced.","why":"Checks that every number on screen can be traced back to a source document.","ev":"For each metric: raw inputs, formula with file:line, and an independent recomputation for one real record.","skip":"Numbers shown exactly as stored, with no math applied.","mode":"read","top":"split","scope":"wide","tools":"Repository, read-only database, and the source documents the numbers come from.","kit":["/spec-to-code-compliance","/dimensional-analysis"],"rel":["D01","D03","G05","PG01"],"imp":"H","aka":"Derived-metric provenance"},{"id":"D03","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Old records, new meanings","p":"Find historical records whose meanings change when current classifications or schemas are applied retroactively. Identify where time-aware interpretation is necessary.","why":"Finds old records that read differently once today's rules are applied to them.","ev":"Each classification with when it changed, which records predate it, and how the app reads them now.","skip":"Data with no history or no categories.","mode":"read","top":"single","scope":"wide","tools":"Read-only database access, history of database changes.","kit":[],"rel":["R04","D02","PG04"],"imp":"H","aka":"Historically changing meaning"},{"id":"D04","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Imports that fail quietly","p":"Audit data ingestion for records that could be duplicated, overwritten, silently omitted, or assigned to the wrong entity without triggering an error.","why":"Finds rows that go missing or land on the wrong record during import, with no error.","ev":"Each ingestion step with its matching key, conflict rule and what it logs, plus counts in versus counts stored.","skip":"Data that is only typed in by hand.","mode":"read","top":"single","scope":"narrow","tools":"Repository, import logs, read-only database.","kit":[],"rel":["R01","D05"],"imp":"H","aka":"Silent ingestion errors"},{"id":"D05","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Links between records worth adding","p":"Identify where data relationships have greater analytical value than isolated fields. Find missing links, broken historical continuity, and relationships the source evidence cannot actually support.","why":"Finds links between records worth adding, and ones the evidence does not support.","ev":"Each relationship with its source evidence, current coverage, and gaps.","skip":"When the data layout is still changing weekly.","mode":"read","top":"single","scope":"wide","tools":"Read-only database access, source documents.","kit":["/grill-with-docs"],"rel":["D04","D03","PG03"],"imp":"H","aka":"Relationship and historical value"},{"id":"D06","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Code health, with proof","p":"Perform a focused code-health audit calibrated to this repository's own conventions and operational risks. Require a specific file/line, reproducible command, trace or commit for every finding; grade confidence and impact; reject generic style complaints. Return a short ranked list of repairable issues rather than hundreds of speculative observations.","why":"A general health check of the code that refuses findings without evidence.","ev":"A ranked list of under fifteen issues, each with file:line or a command, confidence and impact.","skip":"When a narrower investigation above already fits the symptom.","mode":"read","top":"single","scope":"wide","tools":"Repository access.","kit":["/harsh-review","/code-review"],"rel":["M02","T06"],"imp":"H","aka":"Evidence-required code-health audit"},{"id":"G01","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Out-of-date agent instructions","p":"Compare every agent instruction and documentation file in this repository (CLAUDE.md, AGENTS.md, .cursorrules, SKILL.md, README.md, architecture docs) against the actual directory structure, package scripts, and code patterns. Identify stale rules that reference deleted paths, replaced libraries, or deprecated patterns that mislead coding agents.","why":"Finds instructions that send agents to files and patterns that no longer exist.","ev":"Each stale line with the file it lives in and the current fact it contradicts.","skip":"Right after an instruction-file cleanup.","mode":"read","top":"single","scope":"narrow","tools":"Repository access.","kit":["/retro"],"rel":["M10"],"imp":"H","aka":"Context-file drift"},{"id":"G02","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Database changes during a deploy","p":"Trace what happens during the deployment window when a new database migration or API schema change goes live while previous client bundles, active background workers, or queue consumers are still running. Identify column renames, non-nullable additions, or contract changes that break backwards compatibility before the old code finishes draining.","why":"Checks that each database change works with the old code that is still live while a release finishes.","ev":"Each recent migration checked against the previous release's queries, with any break shown.","skip":"Changes that touch neither the database layout nor how parts of the app talk to each other.","mode":"read","top":"single","scope":"narrow","tools":"Repository, migrations folder, previous release tag.","kit":["/differential-review:diff-review"],"rel":["I02","S06","PG17"],"imp":"H","aka":"Migration and rolling-deploy skew"},{"id":"G03","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Hidden data anyone can read","p":"Inspect API responses, Server Component and SSR serialization payloads, and RPC returns crossing from server to browser. Find places where full database rows or internal objects (internal flags, other tenants' keys, audit metadata, large unused JSON columns) are serialized over the network and merely hidden in the UI.","why":"Finds data sent to the browser that the screen hides but anyone can read.","ev":"Each payload with the fields sent, the fields used, and any field that should never leave the server.","skip":"Static pages with no user data.","mode":"read","top":"single","scope":"narrow","tools":"Browser network panel or curl against a local server.","kit":["/security-review"],"rel":["T03","A02"],"imp":"H","aka":"Wire-boundary over-fetching"},{"id":"G04","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"When an outside service goes down","p":"Assume each external API, LLM provider, or webhook source this application depends on either hangs for 30 seconds, returns 429 or 503 for an hour, or delivers a burst of out-of-order webhooks on recovery. Trace which transactions or connection pools are held open during external calls, and whether core journeys degrade gracefully or lock up.","why":"Asks what happens to the app when an outside API, an AI provider or a service that sends it updates goes down.","ev":"Each dependency with its timeout, retry policy, what is held open while waiting, and the user-visible result.","skip":"Features with no outside calls.","mode":"read","top":"single","scope":"wide","tools":"Repository; a local run with outside services made to fail on purpose.","kit":["/diagnosing-bugs"],"rel":["P09","A06","R02"],"imp":"H","aka":"Third-party outage blast radius"},{"id":"G05","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Rounding and unit mix-ups","p":"Trace calculations involving currency, percentages, basis points, share counts, weights, or rates across storage, transformation, and UI display. Identify where binary floating-point math is used instead of exact decimal or integer types, where premature rounding compounds across aggregations, or where scale conventions (0.05 versus 5.0 for 5%, cents versus dollars) are ambiguous across boundaries.","why":"Finds money and percentage values that change scale or lose precision along the way.","ev":"Each value's unit at every hop, with any hop where the unit or rounding changes.","skip":"Apps with no money, rates or counts.","mode":"read","top":"single","scope":"wide","tools":"Repository and read-only access to the database layout.","kit":["/dimensional-analysis"],"rel":["D02","D01"],"imp":"H","aka":"Numerical precision and unit drift"},{"id":"G06","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Screens showing a change that was refused","p":"Trace every flow where the client updates UI state or local cache optimistically before server confirmation. Demonstrate what happens to user state, queued actions, and screen accuracy when the server rejects the mutation, times out, or returns canonical values that differ from the client's assumption.","why":"Finds screens that show a change right away and keep showing it after the server refused it.","ev":"Each optimistic flow with a forced rejection and a screenshot or test of what the screen then shows.","skip":"Flows that wait for the server before updating the screen.","mode":"repro","top":"single","scope":"narrow","tools":"In-app browser or Playwright set to block or alter requests.","kit":["/diagnosing-bugs"],"rel":["A04","A01"],"imp":"M","aka":"Optimistic UI rollback failure"},{"id":"MO01","sec":"inv","group":"Motion","gk":"MO","t":"Motion nobody chose","p":"List every animation and transition in this codebase with its duration, easing and animated properties. Count the distinct durations and the distinct easing curves. Find values used only once, transitions that name no property or no easing, and places that should share a value and do not. Propose the smallest set of shared durations and curves that covers what exists, and show which existing values map to which.","why":"Shows whether the app's motion follows a system or was typed one animation at a time.","ev":"A table of distinct durations and curves with counts, each outlier with file:line, and a mapping from existing values to a proposed set of about four durations and three curves.","skip":"Apps with a handful of animations, or a motion token file that everything already uses.","mode":"read","top":"single","scope":"wide","tools":"Repository access only.","kit":["/motion"],"rel":["MO02","MO05"],"imp":"M","blind":"Agents propose a token system and start migrating. Ask for the mapping only; migrating is a separate change.","aka":"Motion value sprawl"},{"id":"MO02","sec":"inv","group":"Motion","gk":"MO","t":"Animations that cost frames","p":"Find animations and transitions that make the browser run layout or heavy paint on every frame: width, height, top, left, margin, padding, large shadows and blurs, and anything driven from a scroll or pointer handler through component state. For the worst three, measure the interaction in a browser with CPU throttling and report how many layouts and long frames happen during it. Propose the cheaper equivalent for each (transform, opacity, or a single measured move) and say what would look different.","why":"Finds the animations that stutter on slower phones and laptops, and what each one costs.","ev":"Each candidate with file:line and the property involved; for the worst three, a throttled recording with the layout count and the frames over budget, taken before any change.","skip":"When motion is limited to color and opacity changes on small elements.","mode":"read","top":"split","scope":"wide","tools":"Repository; the app running locally and a browser with performance tooling (DevTools or Playwright).","kit":["/motion"],"rel":["MO01","MO04","P01"],"imp":"H","blind":"Static reading flags every height transition. A small accordion is fine; ask for the measurement before any rewrite.","aka":"Layout and paint cost of animation"},{"id":"MO03","sec":"inv","group":"Motion","gk":"MO","t":"Motion with no off switch","p":"Check how this app behaves for people who have asked their system for reduced motion. List every animation that moves, scales, rotates or loops, and say whether it has a reduced-motion version. Find content that only becomes visible through an animation, motion that starts on its own and runs longer than five seconds with no pause control, and gestures with no button or keyboard alternative. For each gap, say what the reduced version should be: usually a short fade or an instant change that keeps the meaning.","why":"Finds motion that can make people dizzy or lock them out, and content that disappears when animation is turned off.","ev":"A list of moving animations with file:line and whether each has a reduced version; a browser run with reduced motion emulated showing what still moves; the WCAG criterion behind each gap (2.2.2, 2.3.1, 2.3.3, 2.5.1 or 2.5.7).","skip":"Internal prototypes nobody else will use.","mode":"read","top":"single","scope":"wide","tools":"Repository; a browser that can emulate prefers-reduced-motion.","kit":["/motion"],"rel":["MO02","MO05"],"imp":"H","blind":"Agents add one global rule that zeroes every duration and call it done. That is a floor. Ask what each large movement becomes instead.","aka":"Reduced-motion coverage"},{"id":"MO04","sec":"inv","group":"Motion","gk":"MO","t":"Animations that restart, block or never finish","p":"Find animations that break when the user does not wait for them. Look for keyframe animations on things that can be triggered twice in a row, exits that never play because the element is removed first, input ignored until an animation ends, focus that moves only after an animation, and end states that differ from the element's resting style. Reproduce the three most reachable cases by triggering the interaction again mid-animation, and propose the smallest fix for each.","why":"Finds motion that works in a demo and breaks under fast, real use.","ev":"Each case with file:line, the sequence of inputs that triggers it, and what the user sees: a restart, a jump, an ignored click or a missing exit.","skip":"Apps whose only motion is hover and focus color.","mode":"repro","top":"split","scope":"wide","tools":"Repository; the app running locally with a browser to trigger interactions quickly.","kit":["/motion"],"rel":["MO02","MO06"],"imp":"H","aka":"Interruption and completion defects"},{"id":"MO05","sec":"inv","group":"Motion","gk":"MO","t":"Motion with no job","p":"Go through every animation in this product and say what it tells the user: that their input registered, where something came from or went, where they now are, that work is in progress, or that one thing changed. List the ones that tell the user nothing, and the ones seen so often that they slow people down (tooltips, menus, anything triggered from the keyboard). For each, recommend removing it, shortening it or keeping it, with one sentence of reasoning. Do not propose new animations.","why":"Produces a list of animations to delete or shorten, which is usually the cheapest way to make an app feel faster.","ev":"One row per animation: where it is (file:line), how often a person meets it in a day, the job it does or \"none\", and remove, shorten or keep.","skip":"Apps with almost no motion. Look for missing feedback instead (MO06).","mode":"read","top":"single","scope":"wide","tools":"Repository; the running app helps.","kit":["/motion"],"rel":["MO01","MO06"],"imp":"M","blind":"Agents defend every animation as polish. Ask what the user learns from it; if the answer is nothing, it goes.","aka":"Purposeless and over-frequent motion"},{"id":"MO06","sec":"inv","group":"Motion","gk":"MO","t":"State changes with no feedback","p":"Walk the main flows of this app and list every moment where the interface changes with no visible answer or explanation: a press with no pressed state, an item that vanishes on delete, a panel that appears with no sign of where it came from, a page change with no sense of direction, a wait of more than a second with no indicator. For each, say what the user is left guessing, and specify the smallest motion that would answer it: what changes, for how long, and what happens with reduced motion. Leave out anything the user triggers many times a minute.","why":"Finds the few places where a small animation would remove real confusion.","ev":"Each moment with its flow, the component (file:line), what the user is left guessing, and a one-line spec for the motion.","skip":"Right after a motion pass, or when the complaint is that the app already moves too much (MO05).","mode":"read","top":"single","scope":"narrow","tools":"Repository and the running app.","kit":["/motion"],"rel":["MO05","MO04"],"imp":"M","blind":"Agents add an animation to every state change. Ask for ten at most, ranked by how confusing the moment is without one.","aka":"Missing interaction feedback"},{"id":"PG00","sec":"db","group":"Start here","gk":"PG","t":"Make this database easier to trust and operate","p":"I want this PostgreSQL database to become easier to maintain, faster where it matters, less expensive to operate, and more trustworthy.\n\nStudy how the database actually works today, including its schema, important relationships, data sources, reads, writes, background jobs, migrations and consumers. Use the real database state, repository and operational evidence rather than relying on documentation alone.\n\nFind the few underlying problems responsible for the greatest amount of unnecessary complexity, repeated work, data-quality risk and operational expense.\n\nI care especially about correctness of the underlying data, efficient and reliable writes, duplicated logic, unnecessary database objects, historical accuracy, and changes that make future development easier for coding agents.\n\nRank the opportunities by actual impact. Distinguish demonstrated problems from theoretical concerns, and don't recommend a redesign just because an approach is unconventional.\n\nMake recommendations that simplify the existing system rather than introduce more infrastructure or recurring processes. Reuse evidence already gathered, investigate only what's needed to support a decision, and group related findings around their shared cause.\n\nUse read-only investigation initially. Don't modify production data, schemas or infrastructure. Give me the strongest findings, what proves them, and the smallest changes that would produce meaningful improvements.","why":"The broad starting point when the database feels hard to trust or costly, and you can't yet name one problem.","ev":"A short ranked list of confirmed problems, each with the tables, writers and consumers involved, and the proof: query plans, samples, counts or a check against the source.","skip":"You already know the specific problem. Go straight to the narrower prompt for it.","avoid":"Turning one look into a standing review, a new process or automated governance.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: query statistics (pg_stat_statements) and, on Supabase, the built-in Advisors.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["PG01","PG05","PG10","PG13"],"tags":"database health, postgres health, simplify database, clean up database, healthier database, overall database review, supabase, neon, start here","refs":["supabase","pgss","advisors"]},{"id":"PG01","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Can we independently prove these numbers?","p":"Take a representative set of important figures from this database and independently reconstruct them from their original sources. Don't rely on the existing calculation code to verify itself. Find discrepancies in definitions, source selection, units, dates, classifications, and relationships. Determine which errors are isolated and which come from shared logic, then rank corrections by analytical impact.","why":"Important figures may be wrong ev
