en though their lineage is documented.","ev":"Samples from the original sources, an independent rebuild of each figure, each disagreement classified, how many records it affects, and the shared causes.","skip":"The figures are copied straight from the source with no calculation applied.","avoid":"Checking a value with the same code or source reading that produced it.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and the original source documents.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D02","D01","PG02","PG04"],"tags":"wrong numbers, incorrect numbers, inaccurate data, figures don't match, doesn't match the source, reconciliation, recompute, verify metrics, data provenance"},{"id":"PG02","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Find data that is internally consistent but wrong","p":"Look for data that passes the database's constraints and ordinary validation but is still analytically wrong. Test cross-table relationships, accounting identities, historical continuity, plausible ranges, source coverage, and independent calculations. Focus on contradictions that existing checks would miss, and distinguish genuine errors from legitimate differences in definitions or reporting periods.","why":"Every check passes, but totals or outputs still look implausible.","ev":"Cross-table reconciliations, identities and expected-population comparisons that fail, with source samples and how much data is affected.","skip":"There is no derived or analytical output, only records stored as entered.","avoid":"Calling different grains, as-of dates or reporting bases errors without checking their definitions.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: pgTAP on a local or branch database, to turn confirmed rules into tests.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D01","R03","PG01","PG03"],"tags":"totals are wrong, rows are valid but wrong, inaccurate data, sanity checks, reconciliation, implausible values, missing records","refs":["pgtap"]},{"id":"PG03","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Find where records silently change identity","p":"Trace how real-world entities are identified, matched and connected across imports, source documents and database tables. Find cases where distinct entities are merged, identical entities are duplicated, or historical relationships become disconnected. Identify the matching rule responsible and the affected population before proposing corrections.","why":"Sources use aliases, changing identifiers, share classes or inconsistent names for the same thing.","ev":"Likely duplicates and false merges with their source IDs, the matching rule behind each, the records affected and a counterexample you can rerun.","skip":"Every source shares one stable identifier and nothing is matched by name.","avoid":"Merging entities just because their names look alike.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D05","D04","A02","PG02"],"tags":"duplicates, merged records, share classes merged, entity matching, wrong company, identity, dedupe"},{"id":"PG04","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Reproduce what the database believed in the past","p":"Choose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.","why":"Past reports, backfills, restatements or changed classification rules matter.","ev":"Two or more past checkpoints, when each record was true and when it was known, the source revisions, and changes you can demonstrate.","skip":"Nobody needs past results to stay reproducible.","avoid":"Requiring bitemporal storage everywhere. Work out what is actually needed before choosing a structure.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D03","R04","PG01","PG15"],"tags":"historical report changed, old data meanings, as-of, restatement, backfill, point in time, history rewritten"},{"id":"PG05","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Map every place that writes to the database","p":"Map the actual write paths for the important tables in this application. Identify every script, job, API, function, trigger and agent that can create, update or delete their records. Show who owns each field, which paths overlap, and where two writers can disagree or overwrite each other. Recommend the simplest ownership model supported by the existing system.","why":"Several jobs, functions, APIs or agents change the same data, or nobody is sure who owns it.","ev":"A map from each writer to its tables and columns, then to triggers, side effects and consumers, with the cases where writers overlap or conflict.","skip":"One code path writes each table.","avoid":"Treating every extra writer as wrong. Find the paths that actually conflict.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","R05","PG06","PG09"],"tags":"what writes to this table, mysterious overwrites, who owns this field, multiple writers, write ownership"},{"id":"PG06","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Stop rewriting data that hasn't changed","p":"Investigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.","why":"Upserts and updates run at high volume, imports are costly, or vacuum and write-ahead log churn look high.","ev":"Statement counts, the share of writes that really change a row, dead-row and churn figures, index and WAL effects where measurable, and before-and-after tests on a copy.","skip":"Write volume is small, or every write is a change that has to happen.","avoid":"Suppressing deliberate last-seen timestamps, trigger side effects, version counters or refreshes that are meant to happen.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy for before-and-after tests. Helps: query statistics (pg_stat_statements).","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P04","P09","PG05","PG07","PG13"],"tags":"too many upserts, write amplification, upserts identical rows, unchanged updates, rewriting everything, nightly reload, dead tuples, wal","refs":["pgss","bestpractices"],"iso":true},{"id":"PG07","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Is our ingestion process more complicated than necessary?","p":"Trace one complete ingestion cycle from the original source to the final database records. Identify repeated parsing, unnecessary intermediate states, duplicate validation, repeated reads, redundant transformations and writes that could be consolidated. Recommend the simplest workflow that preserves accuracy, traceability, failure recovery and the ability to process corrections.","why":"The import pipeline is long, slow to correct, or does the same work at several stages.","ev":"One real trace from source to final rows, the work done twice, the checkpoints, a shorter path, and checks that the shorter path gives the same results and still replays.","skip":"The pipeline is already one short step from source to table.","avoid":"Removing evidence, provenance or checkpoints that recovery depends on.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy to check the shorter path against.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D04","PG05","PG06","PG08","PG09"],"tags":"ingestion, etl, import pipeline, simplify pipeline, sprawling pipeline, data pipeline","iso":true},{"id":"PG08","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Can we rerun everything without damaging the data?","p":"Examine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.","why":"Imports get retried, schedulers overlap, files are replayed, or runs fail halfway.","ev":"Replay scenarios with their conflict keys, interrupted-run cases, before-and-after data comparisons and a safe way to resume.","skip":"Every import runs once, by hand, with nothing to retry.","avoid":"Calling an import safe to rerun just because the SQL has ON CONFLICT.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: an isolated database for replay tests, and pgTAP.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["R01","R06","PG05","PG07"],"tags":"failed run duplicates records, retry, replay, idempotent import, rerun safely, backfill twice, duplicate import","refs":["pgtap"],"iso":true},{"id":"PG09","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Find where write logic should live","p":"Trace how records are validated, transformed and written across application code, database functions, triggers and background jobs. Find rules duplicated in different layers or placed where they are difficult to test and maintain. Recommend the simplest ownership boundary for each rule, without assuming that moving more logic into Postgres is automatically better.","why":"Business rules are split across SQL, triggers, edge functions, server routes and workers.","ev":"Each rule with the layers that enforce it, the current owner, duplicated checks, how testable each place is, transaction limits and what a change would touch.","skip":"Each rule already lives in exactly one place.","avoid":"Automatically favouring stored procedures, or automatically moving everything out of the database.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","PG05","PG07","PG10"],"tags":"trigger or app code, validation in trigger, business logic in database, edge function, stored procedure, duplicate validation"},{"id":"PG10","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Which database objects no longer earn their keep?","p":"Examine the tables, views, functions, triggers, indexes and materialized views in this database. Identify redundant representations, obsolete objects, overlapping responsibilities, unnecessary dependency chains and abstractions that no longer provide meaningful value. Verify actual consumers before recommending removal. Rank opportunities by complexity eliminated, operational savings and migration risk.","why":"The list of views, functions and triggers has grown hard to reason about.","ev":"A map of objects, what depends on them and who uses them, the removal candidates, migration risks and how much complexity goes away.","skip":"The schema is small and every object has a known reader.","avoid":"Deleting objects that look unused but are called dynamically or by outside clients.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access to the catalog, plus the repository and any outside clients.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A03","I06","PG09","PG11","PG12"],"tags":"unused views, dead views, unused functions, schema cleanup, too many views, triggers, database clutter, drop unused","refs":["bestpractices"]},{"id":"PG11","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Are we storing the same truth multiple times?","p":"Find concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.","why":"Caches, aggregates, materialized views or derived columns drift from the raw facts.","ev":"The authoritative source and each copy, how each is refreshed, examples of drift, and what each copy costs readers and writers.","skip":"Each fact is stored once.","avoid":"Rejecting all denormalisation. Copies kept for speed or history can be worth it.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","D02","PG05","PG10"],"tags":"stale view, materialized view out of date, duplicate data, cache disagrees, derived column, denormalized, source of truth"},{"id":"PG12","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Can the schema be easier to understand without losing depth?","p":"Review the database's logical organization from the perspective of a new senior engineer. Identify confusing names, mixed responsibilities, inconsistent conventions, unclear relationships and schemas that obscure the business domain. Recommend structural improvements that make the model easier to understand and maintain without sacrificing useful historical detail or creating unnecessary migrations.","why":"New developers or agents keep misunderstanding names, concepts or relationships.","ev":"The specific confusions, the work they affect, a schema map, and the least disruptive naming or boundary fixes.","skip":"Nobody has misread the schema recently.","avoid":"Cosmetic renames and broad migrations with no shown maintenance benefit.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: declarative schema files, if the project uses them.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","G01","PG10","PG11"],"tags":"agents can't understand schema, confusing table names, schema map, naming conventions, data model clarity","refs":["declarative"]},{"id":"PG13","sec":"db","group":"Performance and maintenance","gk":"PG","t":"Find the true sources of database waste","p":"Measure which tables, indexes, queries and maintenance activities consume the most storage, execution time and write resources. Distinguish useful capacity from avoidable waste, including unused indexes, row churn, bloat, poor plans and excessive scans. Recommend changes based on observed workload and realistic savings, not generic optimization rules.","why":"The bill is high, CPU or disk usage is high, storage keeps growing, or you suspect bloat.","ev":"Table and index sizes, the top statements, usage counts, dead-row and maintenance figures, EXPLAIN output and the savings you expect.","skip":"Usage and cost are small and steady.","avoid":"Judging an index from a code search alone, or looking only at query time and ignoring write cost.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access and query statistics (pg_stat_statements). Helps: Supabase Advisors, and HypoPG to test an index without building it.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","I03","PG06","PG14"],"tags":"postgres costs, database bill, supabase performance, slow postgres, bloat, unused indexes, high cpu, storage growing","refs":["pgss","advisors","hypopg","bestpractices"]},{"id":"PG14","sec":"db","group":"Performance and maintenance","gk":"PG","t":"What will become expensive as the database grows?","p":"Use actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.","why":"Fact or history tables are growing fast, or you need to plan capacity.","ev":"Current row counts and growth rates, the workload assumed, the size at which each operation becomes a bottleneck, and costs before and after at a realistic scale.","skip":"Data volume is small and flat.","avoid":"Partitioning or new layers without a measured or credible need.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access. Helps: query statistics (pg_stat_statements) and HypoPG.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","P05","PG13"],"tags":"ten times the data, growth, capacity planning, partitioning, scale, slow as it grows","refs":["pgss","hypopg"]},{"id":"PG15","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Can we rebuild this database from its sources?","p":"Determine whether this database can be reconstructed from the repository, migrations, original source material and retained operational records. Identify anything that exists only in production, any transformations that cannot be reproduced, and data that would be permanently lost. Where possible, test the reconstruction on an isolated database and compare the resulting records and relationships.","why":"You worry about disaster recovery, production-only state, or whether the data could be rebuilt.","ev":"The exact inputs needed to rebuild, the migration chain, a sampled comparison of a rebuilt copy against production, and the gaps that can't be recovered.","skip":"The database is a disposable cache you can refill at any time.","avoid":"Running a destructive restore against production, or treating a list of backups as proof they restore.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only production access and a separate database you are allowed to build into.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["I02","D02","PG04","PG17"],"tags":"backup restore, disaster recovery, rebuild database, outage, reproduce production, restore test","refs":["pgtap"],"iso":true},{"id":"PG17","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Are our database changes safe before we merge?","p":"Review this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.","why":"A migration, or a change to functions, views, RLS, types or column meaning, is about to ship.","ev":"The migration diff, the consumers it touches, how old and new app versions coexist during rollout, locks and rollback, and a replay on a separate database.","skip":"The change touches no schema, functions or policies.","avoid":"Claiming a rollback exists because the application code can be reverted.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only access to the live schema and a separate database to replay the migration. Helps: pgTAP and, on Supabase, Advisors and branches.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["G02","I02","S06","PG15"],"tags":"safe migrations, migration review, can this migration ship, schema change, rls change, breaking change, rollback","refs":["pgtap","advisors","declarative","bestpractices"],"iso":true},{"id":"PG16","sec":"db","group":"Agent decisions","gk":"PG","t":"Which decisions should an expert agent make without me?","p":"Find recurring database decisions that agents currently escalate to me, including field classification, record matching, write conflicts, source precedence and schema choices. Determine which can be resolved through established standards, existing precedent and authoritative evidence. Make the decision rules reusable, identify their limits, and reserve escalation for genuine product or risk decisions.","why":"Agents keep asking you to classify fields, match records or pick between sources.","ev":"The kinds of question that repeat, the standards and precedents that settle them, each rule with its exceptions, and where escalation really belongs.","skip":"Agents rarely escalate database questions.","avoid":"Inventing accounting, source-precedence or product policy where no authority exists.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, past agent transcripts or notes, and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["M05","M07","G01","PG01","PG09"],"tags":"agent keeps asking me, stop asking me to classify, escalations, decision rules, classify every record"},{"id":"DBR01","sec":"db","group":"Workflows","t":"Is the data actually right?","why":"Prove the numbers before fixing anything.","flow":[["Start",["PG01","PG02"],"PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong."],["If needed",["PG03","PG04"],"PG03 for identity gaps; PG04 when the meaning of past records matters."],["Change",[],"Fix only the confirmed shared causes, and add SQL or metric tests for them."],["Done when",[],"Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly."]],"p":"Is the data actually right? Prove the numbers before fixing anything.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong.\n\nCan we independently prove these numbers? (PG01)\nTake a representative set of important figures from this database and independently reconstruct them from their original sources. Don't rely on the existing calculation code to verify itself. Find discrepancies in definitions, source selection, units, dates, classifications, and relationships. Determine which errors are isolated and which come from shared logic, then rank corrections by analytical impact.\n\nFind data that is internally consistent but wrong (PG02)\nLook for data that passes the database's constraints and ordinary validation but is still analytically wrong. Test cross-table relationships, accounting identities, historical continuity, plausible ranges, source coverage, and independent calculations. Focus on contradictions that existing checks would miss, and distinguish genuine errors from legitimate differences in definitions or reporting periods.\n\n2. If needed: PG03 for identity gaps; PG04 when the meaning of past records matters.\n\nFind where records silently change identity (PG03)\nTrace how real-world entities are identified, matched and connected across imports, source documents and database tables. Find cases where distinct entities are merged, identical entities are duplicated, or historical relationships become disconnected. Identify the matching rule responsible and the affected population before proposing corrections.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Fix only the confirmed shared causes, and add SQL or metric tests for them.\n\n4. Done when: Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly.","rel":["PG01","PG02","PG03","PG04"],"tags":"recipe workflow","dmode":"Asks before changing"},{"id":"DBR02","sec":"db","group":"Workflows","t":"Make ingestion simpler and cheaper","why":"Less work per import, without losing provenance or corrections.","flow":[["Start",["PG05","PG07"],"PG05 when it is unclear who writes what; otherwise PG07."],["If needed",["PG06","PG08","PG09"],"PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places."],["Change",[],"Make the smallest change to one cause at a time, keeping provenance and corrections."],["Done when",[],"The same results for reference inputs, measurably less work, and retries that do no harm."]],"p":"Make ingestion simpler and cheaper Less work per import, without losing provenance or corrections.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG05 when it is unclear who writes what; otherwise PG07.\n\nMap every place that writes to the database (PG05)\nMap the actual write paths for the important tables in this application. Identify every script, job, API, function, trigger and agent that can create, update or delete their records. Show who owns each field, which paths overlap, and where two writers can disagree or overwrite each other. Recommend the simplest ownership model supported by the existing system.\n\nIs our ingestion process more complicated than necessary? (PG07)\nTrace one complete ingestion cycle from the original source to the final database records. Identify repeated parsing, unnecessary intermediate states, duplicate validation, repeated reads, redundant transformations and writes that could be consolidated. Recommend the simplest workflow that preserves accuracy, traceability, failure recovery and the ability to process corrections.\n\n2. If needed: PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places.\n\nStop rewriting data that hasn't changed (PG06)\nInvestigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.\n\nCan we rerun everything without damaging the data? (PG08)\nExamine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.\n\nFind where write logic should live (PG09)\nTrace how records are validated, transformed and written across application code, database functions, triggers and background jobs. Find rules duplicated in different layers or placed where they are difficult to test and maintain. Recommend the simplest ownership boundary for each rule, without assuming that moving more logic into Postgres is automatically better.\n\n3. Change: Make the smallest change to one cause at a time, keeping provenance and corrections.\n\n4. Done when: The same results for reference inputs, measurably less work, and retries that do no harm.","rel":["PG05","PG06","PG07","PG08","PG09"],"tags":"recipe workflow","dmode":"Asks before changing"},{"id":"DBR03","sec":"db","group":"Workflows","t":"Simplify a crowded schema","why":"Fewer objects with the same outcomes.","flow":[["Start",["PG10"],"Inventory objects and their real consumers."],["If needed",["PG11","PG12","PG17"],"PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships."],["Change",[],"Confirm consumers before retiring anything, and keep old and new versions working during rollout."],["Done when",[],"Less complexity with unchanged results for users and data."]],"p":"Simplify a crowded schema Fewer objects with the same outcomes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Inventory objects and their real consumers.\n\nWhich database objects no longer earn their keep? (PG10)\nExamine the tables, views, functions, triggers, indexes and materialized views in this database. Identify redundant representations, obsolete objects, overlapping responsibilities, unnecessary dependency chains and abstractions that no longer provide meaningful value. Verify actual consumers before recommending removal. Rank opportunities by complexity eliminated, operational savings and migration risk.\n\n2. If needed: PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships.\n\nAre we storing the same truth multiple times? (PG11)\nFind concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.\n\nCan the schema be easier to understand without losing depth? (PG12)\nReview the database's logical organization from the perspective of a new senior engineer. Identify confusing names, mixed responsibilities, inconsistent conventions, unclear relationships and schemas that obscure the business domain. Recommend structural improvements that make the model easier to understand and maintain without sacrificing useful historical detail or creating unnecessary migrations.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\n3. Change: Confirm consumers before retiring anything, and keep old and new versions working during rollout.\n\n4. Done when: Less complexity with unchanged results for users and data.","rel":["PG10","PG11","PG12","PG17"],"tags":"recipe workflow","dmode":"Asks before changing"},{"id":"DBR04","sec":"db","group":"Workflows","t":"Reduce PostgreSQL resource cost","why":"Spend less where the measurements say the money goes.","flow":[["Start",["PG13"],"Measure the top consumers first."],["If needed",["PG06","PG14","P03"],"PG06 for write churn; PG14 when growth is the driver; P03 for one slow query."],["Change",[],"Take the biggest measured savings first. No speculative indexes or partitions."],["Done when",[],"Workload figures before and after, with no loss of correctness."]],"p":"Reduce PostgreSQL resource cost Spend less where the measurements say the money goes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Measure the top consumers first.\n\nFind the true sources of database waste (PG13)\nMeasure which tables, indexes, queries and maintenance activities consume the most storage, execution time and write resources. Distinguish useful capacity from avoidable waste, including unused indexes, row churn, bloat, poor plans and excessive scans. Recommend changes based on observed workload and realistic savings, not generic optimization rules.\n\n2. If needed: PG06 for write churn; PG14 when growth is the driver; P03 for one slow query.\n\nStop rewriting data that hasn't changed (PG06)\nInvestigate how much database write activity actually changes meaningful information. Find repeated upserts, unchanged updates, unnecessary delete-and-reinsert operations, repeated index maintenance and cascading refreshes. Measure their cost where practical and determine which writes can be eliminated without changing correctness, history or recovery behavior.\n\nWhat will become expensive as the database grows? (PG14)\nUse actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.\n\nQueries that grow badly (P03)\nFind database queries whose cost grows disproportionately with records, tenants, or relationships. Examine execution plans, indexes, joins, pagination, and application-side filtering.\n\n3. Change: Take the biggest measured savings first. No speculative indexes or partitions.\n\n4. Done when: Workload figures before and after, with no loss of correctness.","rel":["PG06","PG13","PG14","P03"],"tags":"recipe workflow","dmode":"Asks before changing"},{"id":"DBR05","sec":"db","group":"Workflows","t":"Ship or recover safely","why":"A schema change or a restore you have actually tested.","flow":[["Start",["PG17","PG15"],"PG17 for a change about to ship; PG15 for rebuilding or recovery."],["If needed",["G02","R06","PG04"],"G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move."],["Change",[],"Run migrations and restores on a separate database, check compatibility, and plan the recovery."],["Done when",[],"A migration or restore tested on a separate database, and no claim about production that wasn't proved."]],"p":"Ship or recover safely A schema change or a restore you have actually tested.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG17 for a change about to ship; PG15 for rebuilding or recovery.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\nCan we rebuild this database from its sources? (PG15)\nDetermine whether this database can be reconstructed from the repository, migrations, original source material and retained operational records. Identify anything that exists only in production, any transformations that cannot be reproduced, and data that would be permanently lost. Where possible, test the reconstruction on an isolated database and compare the resulting records and relationships.\n\n2. If needed: G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move.\n\nDatabase changes during a deploy (G02)\nTrace what happens during the deployment window when a new database migration or API schema change goes live while previous client bundles, active background workers, or queue consumers are still running. Identify column renames, non-nullable additions, or contract changes that break backwards compatibility before the old code finishes draining.\n\nHalf-finished failures (R06)\nTrace error, timeout and cancellation paths for transactions, locks, file handles, temporary files, worker jobs and network connections. Identify paths that leave resources held or state half-committed, and demonstrate them with controlled failure injection where practical.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Run migrations and restores on a separate database, check compatibility, and plan the recovery.\n\n4. Done when: A migration or restore tested on a separate database, and no claim about production that wasn't proved.","rel":["PG04","PG15","PG17","G02","R06"],"tags":"recipe workflow","dmode":"Asks before changing"},{"id":"M01","sec":"think","group":"Thinking prompts","t":"Deeper, not bigger","p":"I want the professional-grade version of this task, not a larger version. Look at what I'm trying to accomplish and tell me what a genuinely excellent practitioner would notice, investigate, or verify that I've overlooked. Start with the original evidence instead of just relying on existing summaries. Identify the methods that would materially improve the result and the independent evidence that would establish whether it's correct. Then improve the assignment accordingly. Keep the objective and scope intact. Don't add process or complexity just to make the work sound more sophisticated.","use":"Use it before you hand an agent a task you only half know how to describe.","aka":"Professional-grade, not larger","dmode":"Depends on the task"},{"id":"M02","sec":"think","group":"Thinking prompts","t":"Prove it wrong","p":"Assume the proposed solution is wrong. Find the strongest evidence against it before recommending we proceed.","use":"Use it when an agent's plan sounds right and you can't see why it might be wrong.","aka":"Falsification","dmode":"Asks before changing"},{"id":"M03","sec":"think","group":"Thinking prompts","t":"Root cause first","p":"Don't fix the visible symptom yet. Work backward through the system until you can explain why it occurred and what other behavior shares that cause.","use":"Use it the second time the same kind of bug shows up.","aka":"Root cause","dmode":"Report only"},{"id":"M04","sec":"think","group":"Thinking prompts","t":"Simpler first","p":"Solve this by making the existing system simpler. First determine whether we can remove a layer, rule, dependency, or special case rather than add something.","use":"Use it when the proposed fix adds a new setting, table or service.","aka":"Complexity reduction","dmode":"Changes code"},{"id":"M05","sec":"think","group":"Thinking prompts","t":"Let the expert decide","p":"Treat the technical decisions as yours to make. Apply established engineering standards, investigate uncertainties, and escalate only genuine product or risk decisions.","use":"Use it when an agent keeps asking you technical questions you can't judge.","aka":"Expert delegation","rel":["PG16"],"dmode":"Depends on the task"},{"id":"M06","sec":"think","group":"Thinking prompts","t":"Check it independently","p":"Design a way to prove your solution works that doesn't depend on the assumptions, code, or tests you just created.","use":"Use it before you accept 'tests pass' as proof that something works.","aka":"Independent verification","dmode":"Changes code"},{"id":"M07","sec":"think","group":"Thinking prompts","t":"Spec without the interview","p":"Turn my request into a compact working specification: desired outcome, actual scope, meaningful exclusions, observable acceptance criteria, and stopping point. Resolve technical ambiguity from the repository and authoritative references yourself; ask me only for product preferences, permissions, or genuine tradeoffs you cannot determine independently. Then execute if the task is authorized and ready.","use":"The default way to start a real task. The opposite of /grill-me.","aka":"Outcome-bound spec without needless interview","rel":["PG16"],"dmode":"Changes code"},{"id":"M08","sec":"think","group":"Thinking prompts","t":"Reproduce, measure, prove","p":"Before repairing a suspected defect or performance problem, establish a reproducible failing case or measurable baseline. Find the root cause, implement the narrowest defensible fix, rerun an independent check, and report the before/after evidence. If you can't measure or reproduce it, say what evidence is missing instead of claiming a win.","use":"Use it in the second session, after a read-only investigation found a real problem.","dmode":"Changes code"},{"id":"M09","sec":"think","group":"Thinking prompts","t":"Compare three options","p":"Do not implement the first viable approach you find. Present three genuinely distinct ways to solve this problem: (1) the smallest, most conservative patch to the existing code, (2) the cleanest long-term structural design, and (3) a subtractive approach that removes an existing constraint, layer, or edge case. Compare their blast radius, testability, and failure modes, recommend one, and wait for my decision.","use":"Use it for decisions that will be expensive to undo.","aka":"Three-way tradeoff","dmode":"Asks before changing"},{"id":"M10","sec":"think","group":"Thinking prompts","t":"Handoff note before you stop","p":"Prepare a compact, self-contained technical checkpoint so a fresh agent session can resume this work cold. Document only: (1) verified facts and current system state, (2) approaches already tested and why they were ruled out, (3) exact files and uncommitted changes in flight, and (4) the single next falsifiable step. Summarize system ground truth, not our conversation history.","use":"Use it before the agent compacts (shrinks its memory of the chat) or a long session ends. /pre-compact does the full version.","aka":"Cold-start handoff checkpoint","dmode":"Writes notes only"},{"id":"M11","sec":"think","group":"Thinking prompts","t":"Thorough and bold","p":"Go past the first answer. For each claim you make, check the original evidence (the code, the data or the docs) and say which claims you verified and which you assumed. Then give one clear recommendation, the strongest argument against it, and the result that would change your mind.","use":"Add it to any prompt when you want depth and a firm recommendation, with the checking shown.","dmode":"Depends on the task"},{"id":"M12","sec":"think","group":"Thinking prompts","t":"Deepen modules, simplify interfaces","p":"Deepen modules and simplify interfaces.","use":"Use it as a cleanup pass on each pull request, or on a schedule for overdue maintenance. It pushes the agent to merge duplicated code, put core logic in one place and cut lines. Shared by Chris (@_khrus) on X on 7 Nov 2026; the idea is John Ousterhout's, from A Philosophy of Software Design, and Matt Pocock pointed him to it. /improve-codebase-architecture is the longer version: a scan, a report and an interview.","aka":"Deep modules (Ousterhout)","src":"https://x.com/_khrus/status/2118971805885239777","rel":["EC04","A03","M04"],"dmode":"Changes code"},{"id":"EC01","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/engineer","cmd":"/engineer","p":"/engineer","why":"Describe what's going on and it picks one starting move from this guide (an investigation prompt, an installed skill, or a plain prompt with nothing to install) and says why. In Codex it's $engineer.","rel":[],"dmode":"Depends on the task"},{"id":"EC35","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/database","cmd":"/database","p":"/database","why":"Describe a PostgreSQL problem in plain words and it picks one database prompt from this library, says why, and runs it read-only when it can reach the code and database. In Codex it's $database.","rel":["PG00","PG01","PG02","PG03","PG04","PG05","PG06","PG07","PG08","PG09","PG10","PG11","PG12","PG13","PG14","PG15","PG17","PG16"],"dmode":"Report only"},{"id":"EC36","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/engineering-setup","cmd":"/engineering-setup","p":"/engineering-setup","why":"Explains in plain words whether /engineer and /database should start on their own, then saves your answer to your Claude Code settings after showing the change. Claude Code only; takes effect next session.","rel":[],"dmode":"Changes code"},{"id":"EC02","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/diagnosing-bugs","cmd":"/diagnosing-bugs","p":"/diagnosing-bugs","why":"For hard bugs and slowdowns. Builds a check that fails on the bug, shrinks it, ranks likely causes, adds logging, fixes it with a test that keeps it from coming back, then cleans up.","rel":["P01","R05","A06","G06"],"dmode":"Changes code"},{"id":"EC03","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/tdd","cmd":"/tdd","p":"/tdd","why":"Writes the tests first, one small working slice at a time. Agrees with you where the tests will hook into the code before writing any.","rel":["R03","T02","T06"],"dmode":"Changes code"},{"id":"EC04","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/improve-codebase-architecture","cmd":"/improve-codebase-architecture","p":"/improve-codebase-architecture","why":"Looks at recently busy parts of the code for modules that add little behind their interface, writes a before/after HTML report to the temp folder, then interviews you about one.","rel":["A01","A03","A05","M12"],"dmode":"Writes notes only"},{"id":"EC05","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.5.0","t":"/grill-me","cmd":"/grill-me","p":"/grill-me","why":"Asks rounds of numbered questions, each w ore than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/audit-context-building","cmd":"/audit-context-building","p":"/audit-context-building","why":"Reads code one function at a time and records what each one assumes, before any bug hunt starts.","rel":["T03","A04","A07"],"dmode":"Writes notes only"},{"id":"EC22","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/goal-prompt","cmd":"/goal-prompt","p":"/goal-prompt","why":"Drafts /goal commands with a checkable finish line and limits on when to stop.","rel":[],"dmode":"Advice"},{"id":"EC23","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.0 · public","t":"/experience-architecture:diagnose","cmd":"/experience-architecture:diagnose","p":"/experience-architecture:diagnose","why":"Start here for any complaint about navigation, the Back button, filters, shared links or too many pages. Finds the causes, says whether the page structure is the problem, and checks its own file references before reporting.","rel":["A08","R07","A01"],"dmode":"Report only"},{"id":"EC24","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.0 · public","t":"/experience-architecture:rethink","cmd":"/experience-architecture:rethink","p":"/experience-architecture:rethink","why":"For questions like whether a page should exist, where a feature belongs, or whether to add a tab. Gives a recommendation, and for a real structural problem two or three options with a clickable prototype and a move-over plan that keeps old links working.","rel":["A08","A05"],"dmode":"Asks before changing"},{"id":"EC25","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.0 · public","t":"/experience-architecture:verify","cmd":"/experience-architecture:verify","p":"/experience-architecture:verify","why":"Proves behaviour in a browser and saves the user journeys as a repeat check that ends PASS, FAIL or EXPLORATORY. Typed values and secrets stay out of the logs.","rel":["R07","T01","G06"],"dmode":"Changes code"},{"id":"EC26","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"built into Claude Code","t":"/code-review","cmd":"/code-review","p":"/code-review","why":"Checks a set of changes or a PR for bugs, at an effort level you pick. Run it at high or above before marking a PR ready.","rel":["D06"],"dmode":"Report only"},{"id":"EC27","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"built into Claude Code","t":"/security-review","cmd":"/security-review","p":"/security-review","why":"Security review of the not-yet-merged changes on the current branch.","rel":["T03","G03"],"dmode":"Report only"},{"id":"EC28","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"built into Claude Code","t":"/simplify","cmd":"/simplify","p":"/simplify","why":"Looks over changed code for things to reuse or simplify, and makes the fixes.","rel":["A03"],"dmode":"Changes code"},{"id":"EC29","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"plugin","t":"/ci-optimizer:ci-check","cmd":"/ci-optimizer:ci-check","p":"/ci-optimizer:ci-check","why":"Checks CI workflow files (the automatic build and test runs) for speed, cost and safety problems.","rel":["I03","T04"],"dmode":"Report only"},{"id":"EC30","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"plugin","t":"/ci-optimizer:ci-timings","cmd":"/ci-optimizer:ci-timings","p":"/ci-optimizer:ci-timings","why":"Finds the slowest jobs and steps, and flaky tests (ones that pass and fail at random), from recent CI runs.","rel":["I03"],"dmode":"Report only"},{"id":"EC31","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"working-style plugin","t":"/harsh-review","cmd":"/harsh-review","p":"/harsh-review","why":"Blunt critique, ranked by how serious each problem is, then the small fixes it is sure of.","rel":["D06"],"dmode":"Changes code"},{"id":"EC32","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"working-style plugin","t":"/viewport-proof","cmd":"/viewport-proof","p":"/viewport-proof","why":"Takes screenshots at phone, tablet and desktop sizes and says whether it's ready to ship.","rel":["T01"],"dmode":"Report only"},{"id":"EC34","sec":"ecmd","group":"Other commands that help","gnote":"Built-in Claude Code commands and other plugins that cover parts of this guide. The review commands run only when you type them.","badge":"working-style plugin","t":"/recommend","cmd":"/recommend","p":"/recommend","why":"Lays out the options and tradeoffs, then recommends one.","rel":["A05","M09"],"dmode":"Advice"},{"id":"UI001","sec":"dcmd","group":"Impeccable","sub":"Set up and plan","badge":"plugin · v4.8.0","gnote":"The broadest design toolkit. One skill, /impeccable, with about two dozen sub-commands for building, reviewing and refining real UI on the web and in native iOS and Android apps. It reads PRODUCT.md and DESIGN.md in your project before every task, and its design detector checks UI edits automatically.","best":"Ongoing work in a real project, where every design pass should know your users and brand.","skipw":"Throwaway one-off pages, or any project where you have not run init yet.","note":"Run init once per project first. 4.8.0 has the same commands as 4.7.1; its design-check hooks now run natively on Windows. New in 4.7.1: /impeccable on its own suggests what to do next for this project. A big new page can start from three image mockups you choose between before any code (when image generation is available). adapt and audit follow Apple's and Google's platform rules for native apps. teach is another name for init, and craft is an old name for an ordinary build request. Its animate is separate from Emil's /animate.","t":"/impeccable","cmd":"/impeccable","p":"/impeccable","why":"Typed alone, it looks at where this project stands and suggests the next command. If there is no PRODUCT.md yet, it suggests init first.","dmode":"Advice"},{"id":"UI002","sec":"dcmd","group":"Impeccable","sub":"Set up and plan","badge":"plugin · v4.8.0","gnote":"The broadest design toolkit. One skill, /impeccable, with about two dozen sub-commands for building, reviewing and refining real UI on the web and in native iOS and Android apps. It reads PRODUCT.md and DESIGN.md in your project before every task, and its design detector checks UI edits automatically.","best":"Ongoing work in a real project, where every design pass should know your users and brand.","skipw":"Throwaway one-off pages, or any project where you have not run init yet.","note":"Run init once per project first. 4.8.0 has the same commands as 4.7.1; its design-check hooks now run natively on Windows. New in 4.7.1: /impeccable on its own suggests what to do next for this project. A big new page can start from three image mockups you choose between before any code (when image generation is available). adapt and audit follow Apple's and Google's platform rules for native apps. teach is another name for init, and craft is an old name for an ordinary build request. Its animate is separate from Emil's /animate.","t":"/impeccable init","cmd":"/impeccable init","p":"/impeccable init","why":"One-time setup for a project. It asks you questions, then writes PRODUCT.md (who uses it, the brand, the guiding principles), which every other command reads.","dmode":"Changes code"},{"id":"UI003","sec":"dcmd","group":"Impeccable","sub":"Set up and plan","badge":"plugin · v4.8.0","gnote":"The broadest design toolkit. One skill, /impeccable, with about two dozen sub-commands for building, reviewing and refining real UI on the web and in native iOS and Android apps. It reads PRODUCT.md and DESIGN.md in your project before every task, and its design detector checks UI edits automatically.","best":"Ongoing work in a real project, where every design pass should know your users and brand.","skipw":"Throwaway one-off pages, or any project where you have not run init yet.","note":"Run init once per project first. 4.8.0 has the same commands as 4.7.1; its design-check hooks now run natively on Windows. New in 4.7.1: /impeccable on its own suggests what to do next for this project. A big new page can start from three image mockups you choose between before any code (when image generation is available). adapt and audit follow Apple's and Google's platform rules for native apps. teach is another name for init, and craft is an old name for an ordinary build request. Its animate is separate from Emil's /animate.","t":"/impeccable shape","cmd":"/impeccable shape","p":"/impeccable shape the billing settings page","why":"Plans how a page should work and look before any code is written. It asks a few questions and writes a design brief for you to approve. For a new page or a new look, it then makes three image mockups, yo gn as the lighter option. The pack's non-design skills (documents, decks, MCP and skill building) are left out of this guide.","t":"example-skills:webapp-testing","cmd":"example-skills:webapp-testing","p":"example-skills:webapp-testing the signup flow on localhost:3000","why":"Tests a web app running on your own computer with Playwright (a browser robot): screenshots, console logs, how the UI behaves.","dmode":"Report only"},{"id":"UI082","sec":"dcmd","group":"Anthropic example-skills","sub":"Building and testing","badge":"plugin · namespaced","gnote":"Anthropic's sample skills. Call them as example-skills:\u003cname> followed by what you want.","best":"Quick themes, art, GIFs, and Playwright tests (automated browser clicks) of an app running on your computer.","skipw":"Setting the visual direction of real product UI. Hallmark and Impeccable are stronger there.","note":"frontend-design overlaps with Hallmark and Impeccable. For new pages prefer Hallmark; use frontend-design as the lighter option. The pack's non-design skills (documents, decks, MCP and skill building) are left out of this guide.","t":"example-skills:web-artifacts-builder","cmd":"example-skills:web-artifacts-builder","p":"example-skills:web-artifacts-builder a multi-view artifact with routing","why":"Builds claude.ai artifacts with many parts, using React, Tailwind and shadcn/ui. Not for simple pages.","dmode":"Changes code"},{"id":"UI083","sec":"dcmd","group":"Fix writing","sub":"Command","badge":"design-kit plugin","gnote":"One command for text you dislike. It works out what kind of text it is, reads the project's voice and word list, picks the right rules from Humanizer, Sepia, Stop Slop or Impeccable clarify, and scores it with slop-guard before and after.","best":"Any section of text you just want fixed without picking a skill.","skipw":"A whole docs folder at once. Run Vale first to find the worst files.","note":"Reads PRODUCT.md, DESIGN.md, CLAUDE.md and Vale's accepted words when they exist, s  tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-refactor","cmd":"/sepia:sepia-refactor","p":"/sepia:sepia-refactor the postmortem draft","why":"Makes small edits in place and keeps your structure.","dmode":"Changes code"},{"id":"UI095","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-recreate","cmd":"/sepia:sepia-recreate","p":"/sepia:sepia-recreate this blog post","why":"Rewrites the whole piece from the same facts.","dmode":"Changes code"},{"id":"UI096","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-write","cmd":"/sepia:sepia-write","p":"/sepia:sepia-write release notes for v2.3","why":"Writes a new piece under the rules for its format.","dmode":"Changes code"},{"id":"UI097","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-hemingway","cmd":"/sepia:sepia-hemingway","p":"/sepia:sepia-hemingway revise this short story","why":"Fiction writing in a spare, Hemingway-style voice.","dmode":"Changes code"},{"id":"UI098","sec":"dcmd","group":"slop-guard","sub":"Commands","badge":"skill + CLI · v0.5.0","gnote":"A rule-based checker that scores text 0 to 100 for formulaic AI writing. No AI does the judging, so the same text gets the same score every time.","best":"A quick, objective check on a draft, a README, or a whole docs folder before you ship it.","skipw":"Repo-wide style rules you want enforced on every PR. Vale does that.","note":"","t":"/slop-guard","cmd":"/slop-guard","p":"/slop-guard README.md","why":"Runs the slop-guard checker on a file, folder or pasted text and explains the top problems.","dmode":"Report only"},{"id":"UI099","sec":"dcmd","group":"slop-guard","sub":"Commands","badge":"skill + CLI · v0.5.0","gnote":"A rule-based checker that scores text 0 to 100 for formulaic AI writing. No AI does the judging, so the same text gets the same score every time.","best":"A quick, objective check on a draft, a README, or a whole docs folder before you ship it.","skipw":"Repo-wide style rules you want enforced on every PR. Vale does that.","note":"","t":"sg -v \u003cpath>","cmd":"sg -v \u003cpath>","p":"sg -v docs/*.md","why":"The slop-guard checker itself, run in a terminal.","dmode":"Report only"},{"id":"RC01","sec":"recipe","group":"Design recipes","t":"New landing page","why":"From blank to a shipped page that does not look templated.","steps":[["/impeccable init","once per project, so later passes know the brand"],["/hallmark \u003cprompt>","build the page in a chosen genre"],["/break-ui","stress the hero and cards with ugly data"],["/web-design-guidelines \u003cpath>","rule check before shipping"],["/impeccable polish","final spacing and detail pass"]],"p":"New landing page. From blank to a shipped page that does not look templated.\nRun these in order, and check in with me between steps:\n1. /impeccable init: once per project, so later passes know the brand\n2. /hallmark \u003cprompt>: build the page in a chosen genre\n3. /break-ui: stress the hero and cards with ugly data\n4. /web-design-guidelines \u003cpath>: rule check before shipping\n5. /impeccable polish: final spacing and detail pass","dmode":"Changes code"},{"id":"RC02","sec":"recipe","group":"Design recipes","t":"New dashboard or tool","why":"Product screens with a design system that stays consistent next session.","steps":[["/impeccable shape","agree the screen's job and layout first"],["/interface-design","build it and save system.md"],["/break-ui","long names, zero rows, huge numbers"],["/impeccable harden","error, loading and empty states"],["/interface-design:design-review","strict approval pass"]],"p":"New dashboard or tool. Product UI with a system that stays consistent next session.\nRun these in order, and check in with me between steps:\n1. /impeccable shape: agree the screen's job and layout first\n2. /interface-design: build it and save system.md\n3. /break-ui: long names, zero rows, huge numbers\n4. /impeccable harden: error, loading and empty states\n5. /interface-design:design-review: strict approval pass","dmode":"Changes code"},{"id":"RC03","sec":"recipe","group":"Design recipes","t":"This page kind of stinks","why":"Find out why, then fix the worst of it. Stays inside your design system.","steps":[["/impeccable critique \u003cpage>","scored review: what's wrong and what to fix first"],["/impeccable typeset","if the critique flagged hierarchy or type"],["/impeccable layout","if it flagged spacing or structure"],["/impeccable colorize","if it flagged flat or muddy color"],["/impeccable polish","tidy up after the bigger passes"]],"p":"This page kind of stinks. Find out why, then fix the worst of it. Stays inside your design system.\nRun these in order, and check in with me between steps:\n1. /impeccable critique \u003cpage>: scored review: what's wrong and what to fix first\n2. /impeccable typeset: if the critique flagged hierarchy or type\n3. /impeccable layout: if it flagged spacing or structure\n4. /impeccable colorize: if it flagged flat or muddy color\n5. /impeccable polish: tidy up after the bigger passes","dmode":"Changes code"},{"id":"RC04","sec":"recipe","group":"Design recipes","t":"Rethink it, rules off","why":"Let it suggest new fonts, colors and hierarchy even if that breaks the design system.","steps":[["/impeccable critique \u003cpage>, ignore DESIGN.md and suggest new fonts, colors and hierarchy","a critique that isn't held to the current system"],["/prototype \u003cpage> x3","three different directions to look at side by side"],["/impeccable bolder","push the winner further"],["/impeccable document","save the new look as the design system"]],"p":"Rethink it, rules off. Let it suggest new fonts, colors and hierarchy even if that breaks the design system.\nRun these in order, and check in with me between steps:\n1. /impeccable critique \u003cpage>, ignore DESIGN.md and suggest new fonts, colors and hierarchy: a critique that isn't held to the current system\n2. /prototype \u003cpage> x3: three different directions to look at side by side\n3. /impeccable bolder: push the winner further\n4. /impeccable document: save the new look as the design system","dmode":"Changes code"},{"id":"RC24","sec":"recipe","group":"Design recipes","t":"Restructure, then redesign","why":"When the pages and the look both need rethinking. Settle which pages exist first, then design them, with the current design system open to change.","steps":[["/experience-architecture:diagnose","what is wrong with the pages and navigation, and why; reads only"],["/experience-architecture:rethink \u003cgoal>","two or three structures in a clickable prototype; you pick one"],["/experience-architecture:rethink, build the option I picked","moves pages and links one safe step at a time, old links kept working"],["/prototype \u003cmain page> x3, ignore DESIGN.md","three new looks for the new structure, side by side"],["/impeccable document","save the winning look as the design system"],["/impeccable polish","carry the new look across the remaining pages"]],"p":"Restructure, then redesign. When the pages and the look both need rethinking. Settle which pages exist first, then design them, with the current design system open to change.\nRun these in order, and check in with me between steps:\n1. /experience-architecture:diagnose: what is wrong with the pages and navigation, and why; reads only\n2. /experience-architecture:rethink \u003cgoal>: two or three structures in a clickable prototype; you pick one\n3. /experience-architecture:rethink, build the option I picked: moves pages and links one safe step at a time, old links kept working\n4. /prototype \u003cmain page> x3, ignore DESIGN.md: three new looks for the new structure, side by side\n5. /impeccable document: save the winning look as the design system\n6. /impeccable polish: carry the new look across the remaining pages","dmode":"Changes code"},{"id":"RC05","sec":"recipe","group":"Design recipes","t":"It looks AI-generated","why":"Rescue a bland or generic screen without starting over.","steps":[["/interface-design:design-deslop","strip the generic tells"],["/impeccable typeset","real type hierarchy"],["/impeccable bolder","give it a point of view"],["/impeccable polish","tidy what the bigger passes left"]],"p":"It looks AI-generated. Rescue a bland or generic screen without starting over.\nRun these in order, and check in with me between steps:\n1. /interface-design:design-deslop: strip the generic tells\n2. /impeccable typeset: real type hierarchy\n3. /impeccable bolder: give it a point of view\n4. /impeccable polish: tidy what the bigger passes left","dmode":"Changes code"},{"id":"RC06","sec":"recipe","group":"Design recipes","t":"Motion done properly","why":"Add animation where it helps and nowhere else.","steps":[["/find-animation-opportunities","read-only list of where motion earns its place"],["/animate","build the chosen ones"],["/review-animations","check against the ten standards"],["/animation-performance","only if anything drops frames"]],"p":"Motion done properly. Add animation where it helps and nowhere else.\nRun these in order, and check in with me between steps:\n1. /find-animation-opportunities: read-only list of where motion earns its place\n2. /animate: build the chosen ones\n3. /review-animations: check against the ten standards\n4. /animation-performance: only if anything drops frames","dmode":"Changes code"},{"id":"RC07","sec":"recipe","group":"Design recipes","t":"Pre-ship check","why":"Catch problems before users do. The first three only report.","steps":[["/impeccable audit","accessibility, performance, theming, scored"],["/web-design-guidelines \u003cpath>","file:line rule findings"],["example-skills:webapp-testing","click through the real flow in a browser"],["/impeccable polish","fix what the reports found"]],"p":"Pre-ship check. Catch problems before users do. The first three only report.\nRun these in order, and check in with me between steps:\n1. /impeccable audit: accessibility, performance, theming, scored\n2. /web-design-guidelines \u003cpath>: file:line rule findings\n3. example-skills:webapp-testing: click through the real flow in a browser\n4. /impeccable polish: fix what the reports found","dmode":"Changes code"},{"id":"RC08","sec":"recipe","group":"Design recipes","t":"Feels right on a phone","why":"Make a web app feel like an installed app instead of
