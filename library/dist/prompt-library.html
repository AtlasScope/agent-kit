roup":"Thinking prompts","t":"Thorough and bold","p":"Go past the first answer. For each claim you make, check the original evidence (the code, the data or the docs) and say which claims you verified and which you assumed. Then give one clear recommendation, the strongest argument against it, and the result that would change your mind.","use":"Add it to any prompt when you want depth and a firm recommendation, with the checking shown.","dmode":"Depends on the task","line":"Asks for a thorough answer that says what was checked and what was assumed, and ends with one firm recommendation."},{"id":"M12","sec":"think","group":"Thinking prompts","t":"Deepen modules, simplify interfaces","p":"Run a cleanup pass on the code touched by this branch or recent change. Look for logic duplicated in multiple places, functions whose callers need to know internal details, and thin pass-through wrappers that add indirection without value. Merge duplicates, put the core logic behind one clear entry point, and keep each interface simpler than the work inside it. Keep external behavior identical: run the existing tests before and after, and skip anything you cannot verify is safe. Summarize what you merged, moved, or deleted in plain English first, with file paths underneath.","use":"Use it as a cleanup pass on each pull request, or on a schedule for overdue maintenance. It pushes the agent to merge duplicated code, put core logic in one place and cut lines. Shared by Chris (@_khrus) on X on 7 Nov 2026; the idea is John Ousterhout's, from A Philosophy of Software Design, and Matt Pocock pointed him to it. /improve-codebase-architecture is the longer version: a scan, a report and an interview.","aka":"Deep modules (Ousterhout)","src":"https://x.com/_khrus/status/2118971805885239777","rel":["EC04","A03","M04"],"dmode":"Changes code","line":"Runs a focused cleanup pass over recently changed code to merge duplicated logic and hide messy internals behind one clear entry point."},{"id":"X01","sec":"inv","group":"Explore","mode":"read","t":"Promises the product doesn't keep","line":"Reads every claim your product makes in web pages, pricing tables, buttons, emails, and legal text, then checks whether the code actually keeps each promise.","p":"First read every user-facing promise in this repository: marketing and pricing copy, onboarding screens, button labels, confirmation and error messages, email templates, help text, and terms/privacy pages. A promise is anything a user could rely on (such as \"cancel anytime\", \"we'll email you when ready\", \"saved automatically\", \"permanently deleted\", \"refunded within 5 days\", or \"private to your team\"). Then trace the code and config responsible for keeping each promise on both normal paths and failure paths (failed payment, bounced email, crashed job, mobile browser). Classify each as Kept, Kept on happy path only, Not kept, or Unverifiable from repo (needs manual/dashboard check). Rank broken promises by trust or legal harm.","ev":"A table of promises listing where each is stated (file:line), where code enforces it (file:line or \"nowhere\"), its verdict, and for the top three broken ones a concrete scenario showing how a user notices.","skip":"An internal prototype with no public pages, user-facing emails, or billing.","blind":"Read the actual user-facing copy, email templates, and error strings before inspecting backend code — skipping copy misses the broken promises.","fresh":true},{"id":"X02","sec":"inv","group":"Explore","mode":"read","t":"Your first support tickets","line":"Reads your main user flows and predicts the confusing screens, vague error messages, and dead ends most likely to generate support emails.","p":"Walk this product's main user journeys in the code (sign-up, core workflow, billing, account settings, cancellation) and predict up to fifteen real support tickets users will send. Look only for issues grounded in existing code: dead-end error messages that give no next step, states with no escape hatch, buttons that silently do nothing, emails that contradict the screen, hidden limits, and intended behavior that looks broken. Write each ticket in a frustrated user's plain voice, cite the exact code behind it, and propose the smallest fix (often clearer wording, an empty state, or a confirmation). Stop once the real code-backed issues run out instead of padding to fifteen. Rank by how many users will hit each one.","ev":"Up to fifteen ranked tickets in user language, each tied to a specific screen, message, or state (file:line), expected frequency, and the smallest fix that prevents it.","skip":"A personal tool used only by you.","blind":"Never invent generic complaints like \"the app feels slow.\" Every ticket must cite an actual message, missing state, or code path in this repository.","fresh":true},{"id":"X03","sec":"inv","group":"Explore","mode":"read","t":"How a clever user games you","line":"Finds loopholes an ordinary signed-in customer could exploit without hacking — infinite trials, stacked coupons, browser-only limits, or running up your AI/SMS bill.","p":"Think like a clever, opportunistic customer with a normal account and no hacking tools. Audit the code for ways they can get paid features for free or run up your bills: repeating free trials with fresh emails, reusing or stacking discount/referral codes, bypassing usage limits enforced only in browser code, timing upgrades/downgrades to dodge charges, keeping access after refunds or chargebacks, sharing accounts or abusing free invites, and triggering unbounded per-use costs (AI calls, SMS, emails, file storage, exports). For each loophole, give the exact user steps, whether the server enforces the rule today, a rough monthly cost if 100 users did it, and whether fixing it is a small code change or a pricing/product policy call.","ev":"Each abuse path with reproduction steps, current enforcement (file:line or \"missing\"), rough cost at 100 abusive users, and whether it needs code or a product decision.","skip":"A completely free app with no usage caps and no metered per-action costs.","blind":"Stay focused on business-logic and billing loopholes ordinary users can trigger — classic security vulnerabilities like SQL injection belong in the Security checks.","fresh":true},{"id":"X04","sec":"inv","group":"Explore","mode":"read","t":"Features you could delete","line":"Finds unlinked pages, untouched settings, stale feature flags, and dead integrations that cost maintenance while helping almost nobody.","p":"Identify features, screens, settings, feature flags, integrations, legacy plan tiers, export formats, or unfinished experiments that could be deleted with minimal user impact. Use whatever real evidence is accessible — routes with no navigation links, analytics events, database row counts, logs, flag config, and git history. For each candidate, assess its upkeep cost (code, tests, dependencies, support burden), the evidence it is unused, who could still reach it (including direct URLs, email links, bookmarks, or cron jobs), and what removal takes. Recommend the top three cuts with the best maintenance-saved-to-risk ratio.","ev":"A ranked list of deletion candidates with usage evidence (query, count, or analytics check — marking anything that requires your live analytics dashboard), upkeep cost, potential impact, and the top three to remove first.","skip":"A brand-new product under a few months old with no real user history yet.","blind":"Code with zero internal callers can still be hit via bookmarked URLs, email links, webhooks, or scheduled jobs. Check every entry point before calling a feature dead.","fresh":true},{"id":"X05","sec":"inv","group":"Explore","mode":"read","t":"Follow one dollar","line":"Traces a single customer payment from checkout through webhooks, database rows, access grants, receipts, refunds, and chargebacks to spot where money or access goes wrong.","p":"Trace a single dollar from the moment a customer pays through every system that records or reacts to it: checkout, payment provider, webhooks, database records, feature access grants, receipts/emails, and revenue reporting. Then trace the unhappy paths: declined card, payment retry, duplicate webhook, out-of-order webhook (arriving before the user or checkout row exists), partial refund, full refund, chargeback, mid-cycle plan change, cancellation, and non-default currency. At each step, identify the source of truth, what happens on failure or retry, and where your records or user access can fall out of sync with the payment provider.","ev":"A step-by-step trace of the happy path and each unhappy path with handler locations (file:line), source of truth per step, and every gap where money can be double-counted, lost, or mismatched against granted access.","skip":"A product that takes no payments, or links out to a hosted payment page and stores zero payment state.","blind":"Do not stop after tracing successful checkouts. Duplicate and out-of-order webhooks plus refunds and chargebacks are where real billing bugs hide.","fresh":true},{"id":"X06","sec":"inv","group":"Explore","mode":"read","t":"What one more customer costs","line":"Calculates what each additional active user costs you across hosting, AI models, email, storage, and APIs, and flags features whose cost outruns your subscription price.","p":"Calculate the marginal monthly cost of adding one typical active customer. List every paid service this product uses (hosting, functions, database, file storage, bandwidth, AI models, email, SMS, search, error tracking, third-party APIs) and trace from code what user actions trigger charges. Estimate monthly usage per active customer using logs or database stats where available, stating assumptions clearly where not. Compare total per-user cost against each pricing tier, and highlight features whose cost scales faster than revenue (such as unthrottled AI calls, full-size image uploads, or unlimited free-tier exports). Fetch current published vendor prices if you have web access and cite the URL; if you cannot verify live pricing, mark every price clearly as an estimate for me to confirm on the vendor's pricing page.","ev":"A cost-per-user breakdown by service and feature with triggering code (file:line), stated assumptions, verified vs. estimated prices, margin per plan, and the two or three features that hurt most at 10x users.","skip":"A flat-fee static product with zero metered services and no paid plans.","blind":"Never present memorized pricing as confirmed fact. Cite a live pricing source or mark the number as an unverified estimate.","fresh":true},{"id":"X07","sec":"inv","group":"Explore","mode":"read","t":"If a vendor doubles its price or disappears","line":"Shows how tightly your app is wired to each outside vendor, how hard it would be to leave on 30 days' notice, and one cheap safeguard for the top two risks.","p":"Map this product's dependence on every external vendor, platform, or API (hosting, database, auth, payments, email, AI providers, app stores, analytics, and third-party SDKs). For each, measure how deeply it is embedded: how many files import or call it directly, whether one internal wrapper isolates it, whether your data can be cleanly exported, and which core features stop without it. Stress-test three scenarios for each vendor: price doubles, terms ban your use case, or it shuts down with 30 days' notice. Rank vendors by potential damage and suggest one cheap hedge for the top two without proposing a migration today.","ev":"A vendor table listing file touch count, single wrapper (yes/no), data exportability, features lost on outage, estimated switch effort, and one low-cost hedge for each of the top two risks.","skip":"A small project using only one or two standard services already isolated behind clean wrappers.","blind":"Do not recommend migrating off vendors immediately. Give a clear risk picture and small, practical hedges.","fresh":true},{"id":"AD08","sec":"inv","group":"Explore","mode":"read","t":"Emails and messages people actually receive","line":"Audits every email, text, or notification your app sends for broken links, placeholder wording, wrong sender details, double sends, and silent delivery failures.","p":"Find every email, SMS, push notification, or in-app message this application sends. For each one, read the actual template and trigger code and check: what triggers it, whether retries or webhooks can send it twice, whether links inside it could point to localhost or a broken URL in production, what sender name and reply-to address it uses, whether marketing or digest messages include a working unsubscribe link, whether placeholder or embarrassing wording remains, and what happens when the email or SMS provider rejects or bounces it.","ev":"A list of every outgoing message with its trigger (file:line), template path, link and wording issues, retry/duplicate risk, and a short checklist of DNS or provider dashboard checks (such as SPF, DKIM, DMARC, or verified sender domain) that cannot be verified from the repo.","skip":"An app that sends no emails, texts, or notifications.","blind":"Agents check that a send function exists and skip reading the actual subject line, body text, and link URL builder. Inspect the rendered text and URL construction for every template.","fresh":true},{"id":"AD11","sec":"inv","group":"Explore","mode":"read","t":"Build it, buy it, or skip it?","line":"Before you ask an agent to build a big feature from scratch, checks whether an existing tool, a simpler manual step, or skipping it makes more sense for a solo builder.","p":"Before we build the feature I am describing, evaluate three paths for a solo builder who wants low ongoing maintenance: (1) build it inside this codebase, (2) use an established service or library that already fits our stack, or (3) ship a much simpler or manual version first until usage proves it needs software. Inspect the repository first so your comparison reflects our actual stack, existing dependencies, and hosting limits. For each option, compare upfront work, ongoing maintenance and edge cases I will own forever (security, compliance, retries, deliverability, edge cases), vendor lock-in, and rough cost. Recommend one option and state what would change your mind.","ev":"A plain-English comparison of the three options grounded in this repo's stack (citing package.json or equivalent config), the hidden maintenance traps of building it ourselves, and one clear recommendation.","skip":"A tiny feature unique to this product's core value where no off-the-shelf tool applies.","blind":"Coding agents default to \"we can build this easily\" because writing the first version is fast while owning edge cases for two years is invisible. Price the two-year maintenance burden up front.","fresh":true},{"id":"X08","sec":"inv","group":"Explore","mode":"read","t":"The app's own AI calls","line":"Audits every runtime AI model call inside your app for prompt-injection traps, runaway costs, retired models, missing output checks, and silent slowdowns.","p":"Audit every place this application calls an AI model at runtime. For each call check: (1) model ID and whether it is deprecated or nearing retirement, (2) what untrusted input enters the prompt (user text, scraped pages, uploaded files, emails) and its prompt-injection exposure, (3) what the model's output can trigger (display text, tool calls, database writes, emails, charges), (4) timeouts, retries, and fallback behavior when the provider is slow or down, (5) schema/length/allowlist validation on outputs before use, (6) cost per call and calls triggered per user action, (7) whether personal user data is sent to the model provider, and (8) whether any eval or test detects answer quality dropping. Rank findings by severity: unauthorized actions first, cost blowups second, silent quality degradation third.","ev":"Every runtime model call (file:line) with model ID, untrusted inputs, downstream actions triggered by output, timeout/fallback, output validation, estimated calls per action, and ranked risks.","skip":"An application that makes zero AI API calls at runtime.","blind":"Do not stop at reading the prompt string. Trace where the model's response actually flows and what actions it can execute.","fresh":true},{"id":"X09","sec":"inv","group":"Explore","mode":"read","t":"Things that break on a date","line":"Builds a timeline of everything set to expire or fail automatically — certificates, API keys, app store renewals, startup credits, retiring model versions, and hardcoded dates.","p":"Find everything in this project that will break on a future calendar date without any code change. Check: TLS certificates and signing keys, expiring API tokens and OAuth secrets, app store certificates and OAuth verification renewals, domain renewals, free-tier or startup credits expiring, retiring vendor APIs/SDKs/AI model IDs referenced in code, hardcoded years or date cutoffs, scheduled jobs with end dates, and growing counters or storage quotas nearing limits. Put everything on one timeline, soonest first, stating how you found each date and whether any automated alert warns ahead of time. Separate dates verified from code/config from dates you cannot see that I must check in a named dashboard.","ev":"One chronological risk timeline listing each item, verified date (or \"check in [named dashboard]\"), evidence (file:line or command), what breaks when it hits, and whether any advance warning exists.","skip":"A brand-new local prototype with no deployed domain, external API keys, or scheduled jobs.","blind":"Never guess expiry dates you cannot inspect. Mark every dashboard-only renewal clearly for manual verification.","fresh":true},{"id":"X10","sec":"inv","group":"Explore","mode":"read","t":"How you'd find out it's broken","line":"Checks your core user flows one by one to show which outages would alert you within minutes and which you'd only learn about from an angry user.","p":"List the five to ten critical jobs this product must keep working (sign-in, checkout, outgoing emails, core data reads/writes, nightly jobs, imports). For each one, answer directly: if it stopped working at 2am, how would I find out and how long would it take? Inspect only what actually exists in code and config — error trackers, alerting rules, uptime checks, health endpoints, failed-payment hooks, and swallowed exceptions — and flag external alerting dashboards you cannot inspect from the repo. Classify each flow as: alerts within minutes, noticed within a day, or only discovered when a user complains. For each blind spot, propose the single smallest signal that catches it (one alert, one heartbeat check, or one daily count check).","ev":"A table of critical flows showing current detection (file:line, dashboard to verify, or \"none\"), expected delay before you notice, and one lightweight alert for each gap.","skip":"A pre-launch prototype with no external users yet.","blind":"Writing to a log file nobody alerts on does not count as monitoring. Check who actually gets notified and how.","fresh":true},{"id":"X11","sec":"inv","group":"Explore","mode":"read","t":"Defaults nobody chose","line":"Exposes invisible framework and hosting defaults your app runs on — session lifetimes, upload limits, timeouts, cache lengths, rate limits, and email headers — and flags the risky ones.","p":"Audit settings left at their framework, library, or hosting defaults that materially affect users, security, or cost: session duration and idle logout, password and reset-token expiry, upload size caps, request timeouts, cache headers, rate limits, retry counts, default time zone/locale/currency, pagination sizes, email sender and reply-to, image storage settings, log retention, backup schedules, data region, and hard vs. soft deletes. Report only defaults that could plausibly hurt this product. Verify each default value against the installed version's source code in `node_modules` (or equivalent lockfile/package source) or official docs; mark anything you could not verify locally as unconfirmed.","ev":"A focused list of risky defaults showing the setting, current value and where you confirmed it (file:line, installed package source, or doc reference), plain-English user impact, and a suggested explicit value.","skip":"Every major runtime, auth, upload, timeout, and retention setting is already explicitly configured in one documented config file.","blind":"Framework defaults change between major versions. Verify against the exact version installed instead of quoting from memory.","fresh":true},{"id":"X12","sec":"inv","group":"Explore","mode":"read","t":"Where people's personal data ends up","line":"Tracks every piece of personal information you collect across databases, logs, error trackers, analytics, emails, and AI calls, and checks what it takes to delete a user completely.","p":"Trace all personal user data from collection (forms, sign-up, billing, uploads, analytics, IP/device metadata, support tools) to every destination it reaches: database tables, file buckets, server logs, error trackers, session recordings, analytics, email/CRM tools, AI API calls, exports, and backups. For each destination, note retention, access scope, and whether data leaves to a third party (flagging external tool settings that need manual dashboard checks). Then trace a real account-deletion request: list every place user data would need to be removed from and whether code handles it today. Highlight sensitive data logged in plain text, unused fields still being collected, and any mismatch with your privacy page.","ev":"A map from each collected personal field to every storage/external destination (file:line), a deletion checklist separating automated cleanup from manual steps, and any mismatch with the privacy page.","skip":"A local or anonymous tool with zero accounts, forms, analytics, or personal data.","blind":"Check server logs, error trackers, and analytics calls first — personal data leaks there far more often than in primary database tables.","fresh":true},{"id":"X13","sec":"inv","group":"Explore","mode":"read","t":"Things you may not be allowed to ship","line":"Checks fonts, icons, images, third-party packages, and copied snippets for licenses that restrict commercial use or require attribution.","p":"Audit everything shipped in this project for licensing or usage restrictions: package licenses in lockfiles (especially copyleft licenses like GPL/AGPL in closed-source products, or non-commercial/source-available licenses in paid apps), code snippets copied without attribution, web/app font files and their license terms, images/icons/illustrations/audio in asset folders, third-party logos or brand assets, AI-generated media whose source tool has commercial terms, and scraped or external datasets. For each flagged item, state the license or provenance found, whether this usage fits, and the next step (attribute, replace, purchase a license, or verify). Flag uncertain items for human or legal review without giving legal advice.","ev":"Every asset or package with a potential license issue (file path and where the license was found), whether current use fits, and the concrete action needed, separating clear fixes from items needing human confirmation.","skip":"A private personal script nobody else will see, download, or pay for.","blind":"Do not stop after scanning `package.json`. Fonts, icon packs, downloaded images, and pasted code snippets in asset/source folders are where real license problems usually hide.","fresh":true},{"id":"X14","sec":"inv","group":"Explore","mode":"read","t":"If you disappeared tomorrow","line":"Finds every account, dashboard setting, manual habit, and secret that lives only in your head or on your computer, and drafts a one-page emergency runbook.","p":"Imagine I became unreachable tomorrow and a capable developer had to keep this product running using only this repository. Identify everything missing from the repo: external accounts and billing ownership (hosting, domain, database, payments, email, app stores), dashboard-only secrets and settings, manual recurring work (deploys, renewals, exports, support replies, data fixes), external cron jobs, undocumented code quirks, and anything tied to my personal machine. For each gap, note what breaks and how soon, plus the smallest fix (a repo doc, script, shared password vault entry, or backup owner). Format the actionable output as a clean one-page emergency runbook naming where each secret lives (names only, never values).","ev":"Single points of failure ranked by how quickly each breaks, a draft one-page runbook covering accounts, deploys, manual tasks, and secret locations (names only, never secret values), and a short list of account-ownership questions only I can fill in.","skip":"A disposable weekend experiment with no external accounts, users, or ongoing operations.","blind":"Never read, print, or copy secret values into the runbook. Record only variable names and which dashboard or password manager holds them.","fresh":true},{"id":"X15","sec":"inv","group":"Explore","mode":"read","t":"What agents keep getting wrong here","line":"Mines your git history for reverts and fix-on-fix commits to spot mistakes coding agents keep repeating, and drafts exact lines for `AGENTS.md` or `CLAUDE.md` to prevent them.","p":"Analyze this repository's git history to uncover mistakes coding agents keep repeating. Look for reverts, rapid follow-up fix commits, files that repeatedly change together yet live far apart, and edits to generated files or broken conventions. Group recurring mistakes by root cause (undocumented rule, generated file, required rebuild step, misleading name, synced pair of files, broken local test). For each recurring cause, cite two or three commit hashes as proof and draft one or two crisp lines for `AGENTS.md`/`CLAUDE.md` — or an automated check — that would have prevented it. Skip anything already clearly documented.","ev":"Recurring causes ranked by frequency, supporting commit hashes, and exact proposed additions or edits for your instruction file (marked New or Replaces).","skip":"A new repository with fewer than roughly fifty commits of history.","blind":"Reject vague platitudes like \"write clean tests.\" Every proposed rule must trace directly to real commits in this repository.","fresh":true},{"id":"X16","sec":"inv","group":"Explore","mode":"read","t":"The first bad day","line":"Writes a grounded, hour-by-hour preview of the most likely serious outage, data loss, security leak, or surprise bill waiting in your current setup — and the one fix worth doing this week.","p":"From the actual code, config, deploy setup, data model, and third-party dependencies in this repository, identify the three likeliest ways this product suffers its first serious incident: data loss or corruption, prolonged outage, security/privacy leak, or a surprise usage bill. Take the #1 likeliest scenario and write a grounded pre-mortem incident report: exact trigger, hour-by-hour timeline, how you find out, what compounds the damage, what gets lost, recovery time, and impact. Every single step in the timeline must cite a real file, setting, or missing safeguard in this repo (or explicitly flag a dashboard setting to check). End with three preventive fixes ordered by effort, naming the single one worth doing this week.","ev":"Three ranked incident risks with triggers, one evidence-backed incident timeline citing real files/settings at every step, and three preventive fixes with effort estimates.","skip":"A throwaway prototype with no users, no stored data worth keeping, and no metered billing.","blind":"Do not write dramatic fiction. Every link in the incident chain must be possible under this repository's actual code and configuration.","fresh":true},{"id":"AD10","sec":"inv","group":"Explore","mode":"read","t":"Can you get your data back if something goes wrong?","line":"Checks whether your database, uploaded files, and user content are actually backed up and restorable — whatever database or host you use.","p":"Audit how this product protects against accidental data loss across every store it uses (SQLite, Postgres, Supabase, Firebase, Convex, cloud file storage, or external SaaS data). From the repository, infrastructure config, and scripts, trace: what destructive operations exist in code or admin tools (hard deletes, cascades, overwrites, migration drops), whether soft-delete or undo exists for user-triggered deletions, what backup or point-in-time recovery settings are declared in config, and what data lives in places with no backup configured. Clearly separate what you verified in the repository from backup settings that live only in a hosting dashboard and require my check.","ev":"Every data store and file bucket found (file:line), the destructive paths that can wipe data permanently, what backup/restore mechanism is visible in config, and a short checklist of dashboard settings I must confirm and one safe restore drill to run.","skip":"A stateless tool or static site that stores no user data or uploaded files.","blind":"Agents assume a managed database host includes tested backups by default. Free tiers often have no point-in-time recovery or short retention, and file buckets (avatars, uploads) are frequently unbacked-up even when the database is. Flag every assumption that needs dashboard verification.","fresh":true},{"id":"X17","sec":"think","group":"Explore","dmode":"Advice","t":"Mark your guesses","line":"Forces the agent to label every claim as Checked, Inferred, or Guessed so you can tell verified facts from confident assumptions.","use":"Use it when you can't tell whether an agent actually looked or only sounds sure, especially before acting on what it says.","p":"Separate what you verified from what you assumed. In your answer, tag every factual claim as Checked (you ran it, read the file, or measured it — state how), Inferred (it follows from something you checked — state what), or Guessed (unverified). Before replying, verify any Guessed claim that your recommendation depends on. List any remaining guesses clearly along with what would change if they turned out wrong. Never state a guess in the same confident tone as a checked fact.","fresh":true},{"id":"AD03","sec":"think","group":"Thinking prompts","t":"Stop and untangle","line":"Stops an agent that has been going in circles, maps out what was tried and what failed, and proposes one clean way back to a working state.","p":"Stop editing files. Step back and untangle where we are right now. Check git status and git diff against the last known working commit, then tell me in plain English: (1) what the original goal was, (2) every fix we already tried and what happened, (3) which uncommitted changes are half-finished patches that should be reverted, and (4) the single cleanest path forward from a clean base. Wait for my approval before reverting or editing anything.","fresh":true,"dmode":"Asks before changing","use":"The agent has spent several turns patching a bug, each fix broke something else, and you have lost track of what changed."},{"id":"X18","sec":"think","group":"Explore","dmode":"Asks before changing","t":"Plan the failure","line":"Makes the agent imagine the shipped change has already gone wrong, list the likeliest causes specific to your project, and add safeguards before editing.","use":"Use it before a change that would be painful to undo: a migration, a payment change, a launch or a large rewrite.","p":"Before you start, imagine this change is already shipped and has gone badly wrong. List up to five of the likeliest causes specific to this project, such as a false assumption, an untested edge case, a nearby feature broken by the edit, an unexpected bill, or a user doing something unintended. Stop as soon as the real risks run out instead of padding the list. For each risk, state how we would spot it early and what your plan does to prevent it. Show me that plan before changing files. When the work finishes, report which risks you eliminated and which remain possible.","fresh":true},{"id":"X19","sec":"think","group":"Explore","dmode":"Advice","t":"Teach me what you just did","line":"Wraps up a completed task with a short plain-English explanation of what changed, what could go wrong, and how to test it yourself, plus two quick check-in questions.","use":"Use it on any change you'll have to live with, especially when you don't read the code yourself.","p":"When you finish, explain what you changed so I could describe it to someone else and spot trouble later. Assume I understand the product and do not read code. In under 250 words of plain English, cover: what the problem was, what you changed and why you picked this over the main alternative, what a user will notice, what could still go wrong and how I would spot it, and one concrete thing I can open, click, or check myself to confirm it works. End with two short questions to verify I understood the parts that matter most.","fresh":true},{"id":"X20","sec":"think","group":"Explore","dmode":"Asks before changing","t":"Who notices this change","line":"Maps everyone and everything affected by a change beyond the code — active users, saved bookmarks, emails already sent, search engines, cached copies, and connected services — and plans the transitions.","use":"Use it before renaming, moving or removing anything people or other systems rely on: a page, a field, a price, an email or an API.","p":"Before making this change, list everyone and everything that will feel its impact beyond the files you edit: users on each plan, people mid-task during deploy, saved links and bookmarks, links inside emails already sent, search engines, analytics and reports, external apps or scripts calling this, cached responses, older client or app versions still running, in-flight background jobs, and admins or support. For each item that applies to this project, explain what they will experience and whether it needs a redirect, a migration, a notice, or temporary backwards compatibility. Show me the list before editing anything, include the agreed code transitions when you build the change, and separate what you handled from what needs manual action from me.","fresh":true},{"id":"AD01","sec":"think","group":"Thinking prompts","t":"Stay inside the lines","line":"Keeps the agent strictly inside the task you asked for so it does not refactor neighbouring files, reformat code, or upgrade packages on the side.","p":"Stay strictly inside the task I asked for. Do not refactor neighbouring code, rename unrelated variables, reformat untouched files, delete comments, or upgrade dependencies unless the task cannot work without it. If you spot a separate bug or cleanup opportunity while working, leave it untouched and list it at the end under \"Spotted outside scope\" with the file and line so I can decide whether to do it next. Before finishing, check the diff and revert any accidental edit outside scope.","fresh":true,"dmode":"Asks before changing","use":"Past changes touched files you didn't expect, or you are editing a delicate area right before shipping."},{"id":"AD02","sec":"think","group":"Thinking prompts","t":"Show the plan and wait","line":"Makes the agent explain its plan in plain product terms and stop for your approval before editing a single file.","p":"Do not edit any files yet. Inspect the codebase and tell me your plan in plain English for someone who knows the product and does not read code. Cover what will change for a user, which areas of the product are touched, any tradeoffs or product choices I need to make, and what could break. Keep it under 200 words, end with any questions that need my call, and wait for my yes before making edits.","fresh":true,"dmode":"Asks before changing","use":"You want to approve the approach before the agent touches code, especially on a big or unfamiliar change."},{"id":"EC01","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/engineer","cmd":"/engineer","p":"/engineer","why":"Describe what's going on and it picks one starting move from this guide (an investigation prompt, an installed skill, or a plain prompt with nothing to install) and says why. In Codex it's $engineer.","rel":[],"dmode":"Depends on the task","line":"Takes your plain-English description of a bug, slowdown, or worry and picks the single best starting prompt or skill from this library, explaining why. (In Codex: `$engineer`.)","gets":"Depends on the check it selects. It tells you before starting."},{"id":"EC35","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/database","cmd":"/database","p":"/database","why":"Describe a PostgreSQL problem in plain words and it picks one database prompt from this library, says why, and runs it read-only when it can reach the code and database. In Codex it's $database.","rel":["PG00","PG01","PG02","PG03","PG04","PG05","PG06","PG07","PG08","PG09","PG10","PG11","PG12","PG13","PG14","PG15","PG17","PG16"],"dmode":"Report only","line":"Takes your plain-English description of a PostgreSQL problem, picks the right database investigation from this library, and runs it read-only. (In Codex: `$database`.)","gets":"A report. Nothing changes."},{"id":"EC36","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer and /database routers plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/engineering-setup","cmd":"/engineering-setup","p":"/engineering-setup","why":"Explains in plain words whether /engineer and /database should start on their own, then saves your answer to your Claude Code settings after showing the change. Claude Code only; takes effect next session.","rel":[],"dmode":"Asks before changing","line":"Walks you through two settings for Claude Code — whether `/engineer` and `/database` can activate automatically from plain chat, and whether they keep a local pick log — and saves your choice after confirmation."},{"id":"EC02","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/diagnosing-bugs","cmd":"/diagnosing-bugs","p":"/diagnosing-bugs","why":"For hard bugs and slowdowns. Builds a check that fails on the bug, shrinks it, ranks likely causes, adds logging, fixes it with a test that keeps it from coming back, then cleans up.","rel":["P01","R05","A06","G06"],"dmode":"Changes code"},{"id":"EC03","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/tdd","cmd":"/tdd","p":"/tdd","why":"Writes the tests first, one small working slice at a time. Agrees with you where the tests will hook into the code before writing any.","rel":["R03","T02","T06"],"dmode":"Changes code"},{"id":"EC04","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/improve-codebase-architecture","cmd":"/improve-codebase-architecture","p":"/improve-codebase-architecture","why":"Looks at recently busy parts of the code for modules that add little behind their interface, writes a before/after HTML report to the temp folder, then interviews you about one.","rel":["A01","A03","A05","M12"],"dmode":"Writes notes only","line":"Finds parts of the code that add complexity without doing much, writes a before-and-after report, then talks the changes through with you."},{"id":"EC05","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/grill-me","cmd":"/grill-me","p":"/grill-me","why":"Asks rounds of numbered questions, each with a suggested answer, until every open question in a plan is settled. For product direction, not routine fixes.","rel":["A01"],"dmode":"Advice"},{"id":"EC06","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/grill-with-docs","cmd":"/grill-with-docs","p":"/grill-with-docs","why":"The same interview, but it writes terms into GLOSSARY.md and records each settled decision as an ADR (a short decision record).","rel":["A02","D05"],"dmode":"Writes notes only","line":"The same question-and-answer session as /grill-me, but it also writes down the terms you agree on and each decision you settle, so later sessions keep them."},{"id":"EC07","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/research","cmd":"/research","p":"/research","why":"A background agent answers a question from original sources and saves a Markdown note with citations in the repo.","rel":[],"dmode":"Writes notes only"},{"id":"EC08","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/retro","cmd":"/retro","p":"/retro","why":"Reviews a session and suggests changes to the agent's setup: how it finds its way around, its checks, its instruction files and what its tools cost.","rel":["G01"],"dmode":"Advice"},{"id":"EC09","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/wizard","cmd":"/wizard","p":"/wizard","why":"Writes a bash script that walks you through the steps only you can do, like dashboards, secrets and switchovers.","rel":[],"dmode":"Changes code","line":"Writes a short script that walks you through the steps only you can do, such as dashboard settings, secrets and switching services over."},{"id":"EC10","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/to-questionnaire","cmd":"/to-questionnaire","p":"/to-questionnaire","why":"Turns a decision you can't make alone into a questionnaire for the person who can.","rel":[],"dmode":"Writes notes only"},{"id":"EC11","sec":"ecmd","group":"Engineering kit","gnote":"The engineering-kit plugin in AtlasScope/agent-kit: the /engineer router plus 14 of Matt Pocock's skills, each read in full, pinned to a reviewed commit, and set to run only when you type them. Install it in Claude Code or Codex, or enable it for cloud sessions in a repo's .claude/settings.json.","badge":"plugin · v1.7.0","t":"/wait-what","cmd":"/wait-what","p":"/wait-what","why":"Asks the agent to explain its last message again in plain words.","rel":[],"dmode":"Advice"},{"id":"EC12","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/insecure-defaults:audit","cmd":"/insecure-defaults:audit","p":"/insecure-defaults:audit","why":"Finds unsafe defaults: fallback secrets, default passwords, switches that let everything through when they fail, weak encryption, loose access rules and debug details leaking out.","rel":["T05","S06","R02"],"dmode":"Report only"},{"id":"EC13","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/supply-chain-risk-auditor","cmd":"/supply-chain-risk-auditor","p":"/supply-chain-risk-auditor","why":"Checks your direct dependencies and the ones in the lockfile for security warnings, abandoned projects and risky publishers.","rel":["T04","I06"],"dmode":"Report only","line":"Checks the outside packages your project uses for known security problems, abandoned projects and risky publishers."},{"id":"EC14","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/agentic-actions-auditor","cmd":"/agentic-actions-auditor","p":"/agentic-actions-auditor","why":"Checks GitHub Actions that run Claude, Codex or Gemini for exposed tokens and prompt injection (hidden instructions in issues and PRs that the AI might follow).","rel":["T04"],"dmode":"Report only"},{"id":"EC15","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/differential-review:diff-review","cmd":"/differential-review:diff-review","p":"/differential-review:diff-review","why":"Security review of a set of code changes, using git history and counting how many callers each change could affect.","rel":["T03","G02"],"dmode":"Report only","line":"Security review of a set of code changes, using their history and how many other places each change could affect."},{"id":"EC16","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/sharp-edges","cmd":"/sharp-edges","p":"/sharp-edges","why":"Finds APIs that are easy to misuse and configuration options that are dangerous.","rel":["T05"],"dmode":"Report only"},{"id":"EC17","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/variant-analysis","cmd":"/variant-analysis","p":"/variant-analysis","why":"After one bug is found, hunts for the other places with the same root cause.","rel":["M03"],"dmode":"Report only"},{"id":"EC18","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/property-based-testing","cmd":"/property-based-testing","p":"/property-based-testing","why":"Writes and reviews property tests (tests that throw many generated inputs at a rule) with fast-check or Hypothesis.","rel":["R03","R04","T02"],"dmode":"Changes code"},{"id":"EC19","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/dimensional-analysis","cmd":"/dimensional-analysis","p":"/dimensional-analysis","why":"Finds bugs from mixed-up units and decimal scaling by labeling each value with its unit.","rel":["G05","D02"],"dmode":"Report only"},{"id":"EC20","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a TypeScript, Postgres and GitHub Actions setup; none adds a hook or a server. These can start on their own when the topic comes up. Some run several agents at once, which costs more than a single pass.","badge":"11 plugins · trailofbits/skills","t":"/spec-to-code-compliance","cmd":"/spec-to-code-compliance","p":"/spec-to-code-compliance","why":"Checks code against the document that specifies it, one requirement at a time.","rel":["D01","D02","A02"],"dmode":"Report only"},{"id":"EC21","sec":"ecmd","group":"Trail of Bits","gnote":"Security skills from Trail of Bits' official marketplace, installed one plugin at a time. Picked for a Ty -architecture:diagnose","p":"/experience-architecture:diagnose","why":"Start here for any complaint about navigation, the Back button, filters, shared links or too many pages. Finds the causes, says whether the page structure is the problem, and checks its own file references before reporting.","rel":["A08","R07","A01"],"dmode":"Report only","line":"Investigates broken navigation, confusing menus, Back-button bugs, reset filters, and broken shared links, stating whether the page structure itself needs rethinking.","gets":"A report. Nothing changes."},{"id":"EC24","sec":"ecmd","group":"Experience architecture","gnote":"The experience-architecture plugin in AtlasScope/agent-kit. Three skills that check how an app's pages, navigation, URLs and remembered settings serve its users. They read the code, prove behaviour in a real browser, judge whether the structure itself is the problem, and explain it in plain English. Read-only until you pick an option and say go. Works as a plugin in Claude Code and Codex, and in Cursor as /experience-architecture-diagnose, -rethink and -verify. Cloud sessions load it once a repo enables it in .claude/settings.json. In its tests it was best at judging structure; plain Claude found more individual bugs on the largest test app.","badge":"plugin · v0.4.1 · public","t":"/experience-architecture:rethink","cmd":"/experience-architecture:rethink","p":"/experience-architecture:rethink","why":"For questions like whether a page should exist, where a feature belongs, or whether to add a tab. Gives a recommendation, and for a real structural problem two or three options with a clickable prototype and a move-over plan that keeps old links working.","rel":["A08","A05"],"dmode":"Asks before changing","line":"Answers structural questions (\"should these two pages merge?\", \"where does this feature belong?\") with concrete options, a clickable prototype for major changes, and a transition plan that keeps old links working.","gets":"Recommendations and  direction. Hallmark and Impeccable handle that.","note":"The first time you call most of these, they reply with one line and wait for your question.","t":"/mobile-native","cmd":"/mobile-native","p":"/mobile-native the checkout page","why":"Makes a web app feel like an installed app on a phone: tap flashes, the full-screen height bug, inputs that zoom the page, the notch, pull-to-refresh.","dmode":"Changes code"},{"id":"UI073","sec":"dcmd","group":"Emil Kowalski skills","sub":"Libraries and platform","badge":"15 skills","gnote":"Motion, polish and frontend craft from Emil Kowalski. The review, find and improve skills only read and do not change code unless you ask.","best":"Animation, polishing components, testing worst cases and choosing libraries.","skipw":"Choosing a whole page's visual direction. Hallmark and Impeccable handle that.","note":"The first time you call most of these, they reply with one line and wait for your question.","t":"/write-swift","cmd":"/write-swift","p":"/write-swift fix this data race","why":"Modern Swift for Apple apps: Swift 6 concurrency (code safely running at the same time), value types, Swift Testing, memory management (ARC) and performance.","dmode":"Changes code"},{"id":"UI100","sec":"dcmd","group":"Motion kit","sub":"Commands","badge":"motion-kit plugin","gnote":"One command for interface motion, written for Agent Kit. It measures before it judges: a motion inventory from the code and frame-by-frame captures from a real browser. It runs only when you type it.","best":"Deciding how a product should move, building one animation properly, and reviewing or fixing existing motion with evidence.","skipw":"Layout, color and type problems, and WebGL or 3D showpieces.","note":"The mode word is optional: /motion with a plain request picks the mode and says which. Frame captures use Playwright if the machine already has it, and the agent's own browser tools otherwise.","t":"/motion","cmd":"/motion","p":"/motion the dropdowns feel slow and each one opens differently","why":"One command for anything that moves. Say what you want and it picks the mode (set up, storyboard, build, review or fix), says which, and starts. Typed alone, it reports how the project moves today and suggests three next steps.","dmode":"Changes code","line":"Front door for all animation work — describe what you want and it picks setup, storyboard, build, review, or fix. Typed alone, it audits current motion and suggests three next steps.","gets":"Depends on the mode it picks (reports only when typed alone or reviewing; edits code when building or fixing)."},{"id":"UI101","sec":"dcmd","group":"Motion kit","sub":"Commands","badge":"motion-kit plugin","gnote":"One command for interface motion, written for Agent Kit. It measures before it judges: a motion inventory from the code and frame-by-frame captures from a real browser. It runs only when you type it.","best":"Deciding how a product should move, building one animation properly, and reviewing or fixing existing motion with evidence.","skipw":"Layout, color and type problems, and WebGL or 3D showpieces.","note":"The mode word is optional: /motion with a plain request picks the mode and says which. Frame captures use Playwright if the machine already has it, and the agent's own browser tools otherwise.","t":"/motion setup","cmd":"/motion setup","p":"/motion setup","why":"Reads how the project moves today and proposes one small set of durations, curves and springs, showing which existing values fold into which. After you approve, it writes MOTION.md and the token file. It changes no animations.","dmode":"Asks before changing","line":"Audits existing transitions and proposes one small, consistent set of durations, curves, and springs, writing `MOTION.md` and motion tokens after you approve.","gets":"A plan first, then writes `MOTION.md` and token files after you say yes. Existing animations stay untouched."},{"id":"UI102","sec":"dcmd","group":"Motion kit","sub":"Commands","badge":"mot /fix-writing","p":"/fix-writing README.md:12-40","why":"Paste the text or point at a file and line range. It picks the right tools and rules for you.","dmode":"Changes code","line":"Cleans up stiff, wordy, or AI-sounding copy in pasted text or a file you point to, choosing the right editing rules automatically.","gets":"Rewrites the pasted text or edits the text file you name."},{"id":"UI084","sec":"dcmd","group":"Humanizer","sub":"Command","badge":"plugin · v3.1.0","gnote":"Rewrites AI-sounding writing so it reads like a person wrote it, without changing what it says. Based on Wikipedia's list of signs of AI writing.","best":"PR descriptions, READMEs, release notes, landing copy and emails that read as machine-made.","skipw":"UI labels and error messages (use /impeccable clarify), or whole folders of docs (use Vale to find the problems first).","note":"","t":"/humanizer","cmd":"/humanizer","p":"/humanizer rewrite this PR description","why":"Removes signs of AI writing: not-X-but-Y contrasts, one-line closers, staged openers, forced lists of three, dashes everywhere, inflated claims, sales language, stock AI words, bold labels, filler.","dmode":"Changes code"},{"id":"UI085","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:setup","cmd":"/vale:setup","p":"/vale:setup","why":"Installs Vale (a writing checker), writes .vale.ini, downloads its style rules and does a first run. Only for a repo with no Vale setup yet.","dmode":"Changes code"},{"id":"UI086","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:triage","cmd":"/vale:triage","p":"/vale:triage vale is too noisy in this repo","why":"Turns a huge first run into a decision for each rule: fix, downgrade or switch off. Gives a short plan in order.","dmode":"Report only"},{"id":"UI087","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:fix","cmd":"/vale:fix","p":"/vale:fix the docs folder","why":"Runs Vale and fixes the error-level problems, one pull request per file. Leaves warnings and suggestions for you.","dmode":"Changes code"},{"id":"UI088","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:vocab","cmd":"/vale:vocab","p":"/vale:vocab stop flagging our product names","why":"Adds your own terms (product names, APIs, jargon) to a word list so spell check stops flagging them.","dmode":"Changes code"},{"id":"UI089","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"/vale:ci","cmd":"/vale:ci","p":"/vale:ci run vale on pull requests","why":"Sets Vale to run automatically: in GitHub Actions, as a check before each commit, or in another runner.","dmode":"Changes code"},{"id":"UI090","sec":"dcmd","group":"Vale","sub":"Commands","badge":"plugin · v0.1.0","gnote":"A writing checker for Markdown files in a repo, using the ai-tells package (about 140 rules for AI writing patterns).","best":"Checking every doc in a repo at once, and stopping new AI-sounding writing from creeping in.","skipw":"Rewriting one paragraph by feel. Humanizer is quicker for that.","note":"First runs are loud (thousands of alerts, mostly semicolons, em dashes and lists of three), so run triage before fix.","t":"vale \u003cpath>","cmd":"vale \u003cpath>","p":"vale docs/","why":"The Vale checker itself, run in a terminal from the repo's main folder.","dmode":"Report only"},{"id":"UI091","sec":"dcmd","group":"Stop Slop","sub":"Command","badge":"skill · hardikpandya","gnote":"A strict rulebook Claude follows while it writes, so AI tells never make it in. It scores the draft 1 to 10 on directness, rhythm, trust, authenticity and density, and revises anything under 35 of 50.","best":"Writing something new that has to sound human from the first draft: posts, landing copy, bios, emails.","skipw":"Technical docs and anythin  and a confidence."],"repro":["Reproducer only","You may add a failing test or a small reproduction script for the highest-risk finding. Do not change application code, data or configuration."],"change":["Propose a fix","After reporting, propose the smallest fix for the top confirmed finding as a diff for my review. Do not apply it to production, run migrations, or delete anything."]},"scope":{"repo":["Whole repo",""],"branch":["This branch","Limit this to files changed on the current branch (git diff main...HEAD) and their direct callers."],"slice":["One slice first","Start with one high-traffic route, module or entity. Report on that slice, then stop before scanning the rest."]},"footer":"End with a table I can paste into my playbook, one row per finding:\n| ID | Project | Verdict (Clean / Suspect / Confirmed) | Evidence | False-positive notes |"},"routines":[["After a big feature or change","Check the whole path people use through what changed, what it touches, and that nothing old broke.","Stick to what changed. A small change doesn't need a check of everything."],["Weekly, if something changed","Recent changes that show signs of slowing down, failing at random, or deploy or accuracy trouble.","Skip it when nothing important was merged and nothing looks different."],["Monthly","Problems you already know about: tests that fail at random, risky packages, wasted check time, work done over and over.","Start with the known problem areas. Don't rerun checks on things that haven't changed."],["Quarterly","Whether the overall design still fits, how much growth it can take, who owns what, and old shortcuts that now cost you.","Only when the system or the evidence has changed."],["After something breaks","The real cause, a test that shows the problem, and a fix for the shared cause.","Stop once it can't happen again. Don't set up anything permanent by default."]],"stages":[["start","Start a project","Do these once per project, before any design work. Everything later reads what they write.",[["Teach Claude who the users are and what the brand is","/impeccable init"],["Write down the design system the code already has","/impeccable document"],["Styles have drifted into copies of each other","/impeccable extract"],["Repo docs need a prose linter","/vale:setup"],["Get a design check after every UI edit","/impeccable hooks on|off|status"],["Not sure where to start in this project","/impeccable"],["Decide once how this product should move","/motion setup"]]],["plan","Plan","Before any code. Agree what the screen is for and look at a few options.",[["Plan a new screen before writing code","/impeccable shape"],["See a few real directions before committing","/prototype","/impeccable generate"],["Choose a library for a task","/pick-ui-library"],["Don't know the name for an effect","/animation-vocabulary"],["Settle a design argument with a quick test","/lean-ux"],["Understand why people stop coming back","/improve-retention","/hooked-ux"],["Plan a hero or page entrance before coding it","/motion storyboard"]]],["build","Build","Pick the builder that matches what you are making.",[["A marketing or landing page","/hallmark \u003cprompt>","example-skills:frontend-design"],["A dashboard, admin screen or tool","/interface-design"],["First-run flow or empty states","/impeccable onboard"],["One interaction that has to feel exactly right","/animate","/impeccable animate"],["Touch, drag, sheets and springs","/apple-design"],["A native iPhone screen","/ios-hig-design","/swiftui-pro"],["A chart or dashboard tile","/dataviz"],["A big multi-view artifact","example-skills:web-artifacts-builder"],["A real image: hero, illustration, texture","/image"]]],["review","Review","Get a second opinion before changing anything. Most of these only report back.",[["This page kind of stinks. Tell me why.","/impeccable critique \u003cpage>"],["Rethink it, even if it breaks the design system","/impeccable critique \u003cpage>, ignore DESIGN.md","/prototype \u003cpage> x3"],["Review a whole screen's UX","/impeccable critique","/interface-design:design-review"],["Review one component's polish","/emil-design-eng"],["Accessibility and best-practice rules","/web-design-guidelines \u003cfile-or-pattern>","/impeccable audit"],["See what breaks with ugly data","/break-ui"],["Click through the real flow in a browser","example-skills:webapp-testing"],["Check existing motion","/review-animations","/motion review"],["Be brutal about it, then fix the easy things","/harsh-review","/steve-jobs-design-review"],["A usability audit by the book","/ux-heuristics"],["Prove it works at every screen size","/viewport-proof"]]],["refine","Refine the look","It works, but it doesn't look right yet.",[["It looks AI-generated","/interface-design:design-deslop","/impeccable bolder"],["Too busy or cluttered","/impeccable distill","/impeccable quieter"],["Type feels off","/impeccable typeset","/web-typography"],["I want to choose a palette and see the options","/palette-builder","/oklch-skill"],["Palette scale, dark mode or contrast","/oklch-skill","/color-expert"],["Spacing and rhythm feel off","/impeccable layout"],["Flat and gray","/impeccable colorize"],["Tune one element live in the running app","/impeccable live"],["Find where motion would help","/find-animation-opportunities","/motion review"],["Add a little personality","/impeccable delight"],["Buttons and toggles feel dead","/microinteractions","/impeccable animate"],["Make it cinematic","/top-design","/impeccable overdrive"],["Hierarchy looks amateur","/refactoring-ui","/impeccable layout"]]],["ship","Harden and ship","Odd cases, speed, phones, and the final pass.",[["Edge cases, errors, loading and empty states","/impeccable harden"],["Confusing labels and error messages","/impeccable clarify","/ux-writing"],["Landing copy that has to convert","/copywriting","/cro"],["Make a web app feel native on iPhone","/mobile-native","/impeccable adapt"],["A native iOS or Android app follows the platform rules","/impeccable audit","/impeccable adapt"],["Slow page or heavy bundle","/impeccable optimize"],["Animation stutters","/animation-performance","/motion fix"],["Final pass before shipping","/impeccable polish"]]],["writing","Words","READMEs, pull request descriptions, docs and emails.",[["I hate how this text reads. Just fix it.","/fix-writing"],["Write something new that can't sound like AI","/stop-slop","/sepia:sepia-write"],["This text sounds like AI wrote it","/humanizer","/sepia:sepia-refactor"],["Release notes, PR replies or a postmortem","/sepia:sepia"],["How AI-sounding is this draft, by the numbers?","/slop-guard"],["Find AI-sounding prose across a repo","vale \u003cpath>","/vale:triage"],["Fix the error-level alerts","/vale:fix"],["Vale flags a correct product name","/vale:vocab"],["Lint docs on every pull request","/vale:ci"]]]],"overlaps":[["Review a built UI",[["/impeccable critique","Scores the whole screen's usability and layout, and tests it as different kinds of users"],["/interface-design:design-review","A strict quality review with a pass-or-fail bar"],["/emil-design-eng","Fine polish on one component"],["/hallmark audit \u003cpath>","Checks marketing pages against Hallmark's minimum standard"]],"Critique for a whole screen. Design-review for app screens you want held to a high bar. Emil for one component. Hallmark audit only for pages Hallmark would build."],["Rule and accessibility checks",[["/web-design-guidelines \u003cpath>","Vercel's current rule list, with the file and line for each problem"],["/impeccable audit","Accessibility, speed and light and dark themes, ranked from most to least urgent"]],"Guidelines for a quick checklist with clear answers. Audit when you also want speed and themes checked and ranked."],["Build a new page",[["/hallmark \u003cprompt>","Marketing pages in many different styles"],["/interface-design","App screens, saving the design rules for next time"],["example-skills:frontend-design","Quick and light, nothing to set up first"],["/impeccable shape","Knows your project once you have run init"]],"Hallmark for anything the public will see. Interface Design for tools and dashboards. Frontend-design for quick throwaways."],["Animation",[["/animate","Builds one animation carefully, following Emil Kowalski's order of decisions"],["/impeccable animate","Motion as part of a broader design pass"],["/apple-design","Motion that follows your finger: swipes, drags and springs"],["/motion","Agent Kit's own motion command: checks its work with frame captures and keeps one set of values in MOTION.md"]],"/animate for one interaction you want exactly right. Impeccable animate for a light pass over a screen. Apple-design when touch and drag are involved. /motion when you want the result checked frame by frame, or the whole product's motion made consistent."],["Variants to choose from",[["/prototype","Three or more different versions of something new"],["/impeccable generate","Several versions of something that already exists"],["/impeccable live","Swaps versions in live while your app runs"]],"Prototype when the idea is new. Generate or live when the thing exists and you are fine-tuning it."],["Make it less generic",[["/interface-design:design-deslop","Removes the signs that AI made it"],["/impeccable bolder","Gives it a clear point of view"],["/impeccable delight","Adds small touches of personality"]],"Deslop first to remove the defaults, then bolder. Delight last, and only a little."],["Fix AI-sounding writing",[["/fix-writing","Picks the right one of these for you"],["/humanizer","Rewrites one piece of text"],["/stop-slop","Strict rules while you write something new"],["/sepia:sepia","Knows formats like release notes, pull request replies and incident write-ups"],["/slop-guard","Gives a score only and never edits"],["/vale:fix","Rule-based fixes across a whole repo"],["/impeccable clarify","Words in the app: labels, buttons and error messages"]],"Not sure? /fix-writing chooses. Stop-slop to write clean from the start. Humanizer to fix a draft, especially one with facts in it. Sepia when the format matters. Slop-guard to measure. Vale across many files. Clarify for words inside the app."],["Be critical about a design",[["/impeccable critique","A scored usability review that changes nothing"],["/harsh-review","Blunt, backed by evidence, and makes the small fixes"],["/steve-jobs-design-review","Only about simplicity and focus"],["/ux-heuristics","Usability checked against Nielsen's ten rules"],["/interface-design:design-review","A quality bar for app screens"]],"Critique to understand what is wrong. Harsh review when you want it said bluntly and the easy fixes done. Steve Jobs review to decide what to cut. Heuristics for usability. Design-review for dashboards."],["Color and type",[["/impeccable colorize","Adds color as part of a design pass"],["/palette-builder","Compares whole palettes on your own screens, for you to choose"],["/oklch-skill","Exact color steps, dark mode and readable contrast"],["/impeccable typeset","Fonts and text sizes as part of a design pass"],["/web-typography","Choosing and pairing fonts, size steps and how fonts load, in depth"]],"Impeccable for a pass over a screen. The palette builder when the person wants to choose the colors. The specialists when you need exact values or a font decision."],["Words in the interface vs on the page",[["/impeccable clarify","Fixes wording as part of a design pass"],["/ux-writing","The full rules for small app text: errors, empty screens and tone"],["/copywriting","Wording that sells on marketing pages"],["/fix-writing","Any writing, and picks the right rules"]],"Clarify for a quick pass. UX writing when the app's wording is the whole job. Copywriting when the page has to sell. Fix-writing for anything that isn't app text or marketing."],["Phones and native apps",[["/impeccable adapt","Changes the layout to fit each screen size"],["/mobile-native","Makes a web app feel like an app on a phone: taps, the notch, full-height screens"],["/ios-hig-design","Apple's patterns for a real iPhone app"],["/swiftui-pro","Reviews SwiftUI code"],["/viewport-proof","Proves it works at each size and changes nothing"]],"Adapt and mobile-native for websites on phones. HIG and SwiftUI Pro for a real iPhone app. Viewport proof only to prove the result before you ship."]],"reading":[{"t":"Harness design for long-running application development","by":"Anthropic","url":"https://www.anthropic.com/research/harness-design-long-running-apps","idea":"Planner, builder and evaluator roles, independent QA and file handoffs for multi-hour builds, with their costs.","str":"Primary, vendor research","st":"Link opens (checked 6 Nov)"},{"t":"Getting started with loops","by":"Anthropic","url":"https://claude.com/resources/articles/getting-started-with-loops","idea":"Turn-based, goal-based and time-based loops, how each verifies itself, and usage limits.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Claude Code best practices","by":"Anthropic","url":"https://code.claude.com/docs/en/best-practices","idea":"Current guidance on context files, planning, tool use and verification. Use this over secondhand summaries.","str":"Primary, official docs","st":"Link opens (checked 6 Nov)"},{"t":"Rethinking skills and prompts for GPT-6 Astra","by":"OpenAI","url":"https://developers.openai.com/blog/rethinking-skills-and-prompts-for-gpt-6-astra","idea":"Short triggers, progressive disclosure, and why long AGENTS.md files and skill piles hurt. Read before adding skills.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Harness engineering","by":"OpenAI","url":"https://openai.com/index/harness-engineering/","idea":"Making repositories legible to agents, enforcing architecture mechanically, removing complexity.","str":"Primary, vendor essay","st":"Site blocks automated checks; open it yourself"},{"t":"Agent pull requests are everywhere: here's how to review them","by":"GitHub blog","url":"https://github.blog/ai-and-ml/generative-ai/agent-pull-requests-are-everywhere-heres-how-to-review-them/","idea":"How to review generated code and decide how much to trust it.","str":"Primary, vendor blog","st":"Link opens (checked 6 Nov)"},{"t":"Technology Radar: mattpocock/skills","by":"Thoughtworks, 4 Nov 2026","url":"https://www.thoughtworks.com/en-au/radar/tools/mattpocock-skills","idea":"Places the skills in Trial, not Adopt, and warns against adopting whole skill libraries uncritically.","str":"Independent assessment","st":"Link opens (checked 6 Nov)"},{"t":"Skills for real engineers","by":"Matt Pocock","url":"https://github.com/mattpocock/skills","idea":"Small composable skills split into ones you type and ones the agent reaches for.","str":"Primary source code","st":"Repo read in full for the kit, 6 Nov"},{"t":"A Philosophy of Software Design","by":"John Ousterhout","url":"https://web.stanford.edu/~ouster/cgi-bin/book.php","idea":"Deep modules (a lot of behavior behind a small interface) and designing it twice. The source of M12; Matt Pocock's codebase-design skill builds on both ideas.","str":"Primary, book","st":"Not checked from here; open it yourself"},{"t":"“Deepen modules and simplify interfaces”","by":"Chris (@_khrus), 7 Nov 2026","url":"https://x.com/_khrus","idea":"The one-line prompt in M12, run on every pull request and nightly. Credits Ousterhout's book and Matt Pocock.","str":"Practitioner post, author's claims","st":"Profile link; the post is from 7 Nov 2026"},{"t":"Trail of Bits skills","by":"Trail of Bits","url":"https://github.com/trailofbits/skills","idea":"Security and assurance skills, each its own plugin, many with evals.","str":"Primary source code","st":"Chosen plugins scanned, 6 Nov"},{"t":"Superpowers","by":"Jesse Vincent","url":"https://github.com/obra/superpowers","idea":"A full development method: brainstorm, plan, subagent build, verify before claiming done.","str":"Primary source code","st":"Inspected, 6 Nov; not
