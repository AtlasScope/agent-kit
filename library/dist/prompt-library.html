<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prompt Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Three ways in (Prompts, Skills, Recipes), each a short list of categories, each category a list you can read top to bottom.
   Colour says only which kind of thing you are looking at: green prompts, blue skills, pink recipes. Amber is for actions. */
:root {
  --bg: #ECEAE4; --surface: #FFFFFF; --sunk: #E4E1DA; --hover: #DEDAD1;
  --line: #B9B3A6; --line-soft: #D2CEC4;
  --ink: #0B0A08; --ink-2: #26231E; --ink-3: #4F4A41;
  --accent: #8A4B00; --on-accent: #FFFFFF; --accent-soft: #F6E6CF;
  --k-prompt: #00704A; --k-skill: #1849C4; --k-recipe: #BF1F5E; --on-k: #FFFFFF;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --lift: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(28,22,10,.07), 0 6px 14px -6px rgba(28,22,10,.10), 0 20px 34px -22px rgba(28,22,10,.22);
  --risk: #B42318;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #070707; --surface: #1A1917; --sunk: #0F0E0D; --hover: #2A2825; --line: #4C4740; --line-soft: #34312C;
  --ink: #FFFFFF; --ink-2: #E6E2DA; --ink-3: #BDB7AB;
  --accent: #F5A524; --on-accent: #120C02; --accent-soft: #2A1F0E;
  --k-prompt: #4BF0A8; --k-skill: #8CB6FF; --k-recipe: #FF7FB2; --on-k: #0B0B0A;
  --lift: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.7);
  --risk: #FF8A75;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -0.008em; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); text-underline-offset: 3px; }
svg.i { width: 16px; height: 16px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-inline: 32px; } }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-soft); }
.top .wrap { display: flex; align-items: center; gap: 10px 24px; min-height: 64px; }
.brand { all: unset; cursor: pointer; font-size: 18px; font-weight: 600; letter-spacing: -0.025em; white-space: nowrap; }
.brand b { color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: none; height: 38px; padding: 0 13px; border-radius: 9px; color: var(--ink-3); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 600; }
.search { position: relative; margin-left: auto; flex: 0 1 360px; min-width: 0; }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 0 38px 0 36px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
main .wrap { padding-block: 36px 96px; }

/* Shared */
.kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--c); letter-spacing: 0.01em; }
.kicker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
h1.title { margin: 6px 0 0; font-size: clamp(28px, 3.4vw, 38px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--ink-2); font-size: 16.5px; max-width: 62ch; text-wrap: pretty; }
.back { all: unset; cursor: pointer; display: none; align-items: center; gap: 6px; color: var(--ink-3); font-size: 14px; font-weight: 500; margin-bottom: 14px; min-height: 40px; }
.back:hover { color: var(--ink); }
.back svg { transform: rotate(180deg); }
.copy { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line-soft)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); color: var(--c); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.copy:hover, .copy:focus-visible { background: var(--c); border-color: var(--c); color: var(--on-k); }
.copy .ok, .cmdchip .ok { display: none; } .copy.copied .ok, .cmdchip.copied .ok { display: block; } .copy.copied .cp, .cmdchip.copied .cp { display: none; }
.cmdchip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 13px; letter-spacing: 0; color: var(--ink); }
.cmdchip:hover { border-color: var(--c); }
.cmdchip svg { width: 13px; height: 13px; opacity: .6; }
.tag { font-size: 12px; font-weight: 600; padding: 0 8px; line-height: 20px; border-radius: 999px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); white-space: nowrap; }
.mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--on-k); background: var(--k-prompt); padding: 0 8px 0 6px; border-radius: 999px; line-height: 20px; white-space: nowrap; }
.mark svg { width: 12px; height: 12px; }
.risk { color: var(--risk); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: inherit; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.code { font-family: var(--mono); font-size: .93em; letter-spacing: 0; }
@media (pointer: coarse) { .copy, .cmdchip, .tabs button, .search input { min-height: 44px; } }

/* Home: three doors */
.home-head { max-width: 760px; }
.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
.kind { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-soft); border-top: 4px solid var(--c); box-shadow: var(--lift); }
.kind:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); border-top-color: var(--c); }
.kind:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
.kind h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 10px; }
.kind h2 .n { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--c); letter-spacing: 0; }
.kind .def { margin: 0; font-size: 15.5px; font-weight: 600; color: var(--ink); }
.kind .more { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.kind .eg { margin: auto 0 0; padding-top: 12px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 13.5px; }
.kind .go { color: var(--c); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.homegrid { display: flex; flex-direction: column; }
.complaints { margin-top: 44px; }
ol.steps .stepcopy { margin-left: 8px; vertical-align: 1px; font-family: var(--sans); font-size: 12.5px; letter-spacing: 0; padding: 2px 9px; min-height: 28px; }
@media (pointer: coarse) { ol.steps .stepcopy { min-height: 44px; } }
.complaints h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.complaints p { margin: 4px 0 14px; color: var(--ink-3); }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 14px; }
.qchip:hover { border-color: var(--accent); color: var(--ink); }

/* Overview of categories */
.cats-sec { margin-top: 36px; }
.cats-sec > h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.cats-sec > p { margin: 2px 0 14px; color: var(--ink-3); max-width: 70ch; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.cat { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); box-shadow: var(--lift); }
.cat:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.cat:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.cat b { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; display: flex; align-items: baseline; gap: 8px; }
.cat b .n { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--c); letter-spacing: 0; }
.cat span { color: var(--ink-2); font-size: 14px; }
.cat.quiet { box-shadow: none; background: transparent; border-style: dashed; }
.tips { margin-top: 28px; padding: 18px 20px; border-radius: 16px; background: color-mix(in srgb, var(--c) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line-soft)); }
.tips h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
.tips ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px 20px; counter-reset: t; }
.tips li { counter-increment: t; font-size: 14px; color: var(--ink-2); }
.tips li b { display: block; color: var(--ink); font-size: 14.5px; }
.tips li b::before { content: counter(t) ". "; color: var(--c); }

/* Category page: rail + list */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 110px); overflow-y: auto; padding: 0 4px 12px 0; }
.rail .all { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13.5px; font-weight: 500; padding: 4px 10px 10px; }
.rail .all:hover { color: var(--ink); }
.rail .all svg { transform: rotate(180deg); }
.rail h3 { margin: 14px 0 6px 10px; font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.rail .r { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
.rail .r .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
.rail .r:hover { background: var(--hover); color: var(--ink); }
.rail .r:focus-visible { outline: 2px solid var(--c); }
.rail .r[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--c), var(--lift); }
.cathead { margin-bottom: 22px; max-width: 70ch; }
.cathead h1 { margin: 4px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
.cathead p { margin: 6px 0 0; color: var(--ink-2); }
.cathead .how { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; color: var(--ink-3); font-size: 14px; }
.sub { margin: 30px 0 10px; font-size: 15px; font-weight: 600; color: var(--ink-2); }

/* One item: name, what it does, when to use it, what you get back, Copy. Open it for the full text. */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; box-shadow: var(--lift); padding: 16px 18px; scroll-margin-top: 90px; }
.item.hl { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent), var(--lift); }
.it-head { display: flex; align-items: flex-start; gap: 14px; }
.it-name { flex: 1; min-width: 0; }
.it-name h3 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.35; overflow-wrap: anywhere; }
.it-name h3.code { font-family: var(--mono); font-size: 15px; letter-spacing: 0; }
.it-what { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; max-width: 72ch; text-wrap: pretty; }
.it-when { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); max-width: 72ch; }
.it-when b { color: var(--ink); font-weight: 600; }
.it-meta { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--ink-3); }
.it-meta .kdot { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; }
.it-meta .kdot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.foot-copy { display: none; }
.toggle { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-left: auto; color: var(--ink-2); font-size: 13.5px; font-weight: 500; min-height: 28px; }
.toggle:hover { color: var(--ink); }
.toggle:focus-visible { outline: 2px solid var(--c); border-radius: 4px; }
.toggle svg { transform: rotate(90deg); transition: transform .18s; }
.toggle[aria-expanded="true"] svg { transform: rotate(-90deg); }
.more-box { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.more-box > * { align-self: stretch; }
.more-box > .copy { align-self: flex-start; }
pre.text { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line-soft); font-family: var(--sans); font-size: 14px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.facts { margin: 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 0; }
.facts dt, .facts dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.facts dt { color: var(--ink-3); padding-right: 14px; }
.facts dd { color: var(--ink-2); overflow-wrap: anywhere; }
.facts code { font-family: var(--mono); font-size: 13px; }
.closest { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
ol.steps { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
ol.steps li::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c); width: 24px; height: 24px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); display: grid; place-items: center; }
ol.steps li > span { padding-top: 2px; }
ol.steps .stp { font-weight: 600; color: var(--ink); }
ol.steps .stp.code { font-family: var(--mono); font-size: 13px; letter-spacing: 0; font-weight: 500; }
ol.steps .kd { display: inline-block; margin: 0 2px 0 6px; font-size: 11.5px; font-weight: 600; color: var(--k); }

/* Search */
.res-sec { margin-top: 28px; }
.res-sec h2 { margin: 0 0 10px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.res-sec h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.res-sec h2 .n { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--ink-3); }

footer.foot { margin-top: 72px; padding-top: 16px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; }
footer.foot p { margin: 0; max-width: 80ch; }
.src { padding: 12px 0; border-top: 1px solid var(--line-soft); }
.src h3 { margin: 0; font-size: 15px; } .src p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: 10px; z-index: 60; }

@media (max-width: 960px) {
  .kinds { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .back { display: inline-flex; }
}
@media (max-width: 760px) {
  .complaints { order: -1; margin: 24px 0 8px; }
  .top { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .top .wrap { flex-wrap: wrap; padding-block: 12px; min-height: 0; gap: 10px; }
  .search { order: 2; flex: 1 1 100%; margin: 0; }
  .tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .tabs button { justify-content: center; height: 48px; font-size: 14.5px; }
  main .wrap { padding-block: 24px calc(100px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .kind { padding: 18px; } .kind h2 { font-size: 21px; }
  .item { padding: 14px; }
  .it-head { flex-direction: column; gap: 10px; }
  .head-copy { display: none; }
  .it-meta .foot-copy { display: inline-flex; order: 9; flex: 1 1 100%; }
  .it-meta .toggle { order: 10; margin: 0 auto; }
  .facts { grid-template-columns: minmax(0, 1fr); } .facts dd { border-top: 0; padding-top: 0; }
  footer.foot { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .toggle svg { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <button type="button" class="brand" id="brand">Prompt Library<b>.</b></button>
    <nav class="tabs" id="tabs" aria-label="Kinds"></nav>
    <div class="search" role="search">
      <svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5l3.25 3.25" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search, or describe the problem" aria-label="Search the library" autocomplete="off" spellcheck="false">
      <button type="button" class="clear" id="clear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<p class="sr" id="status" role="status" aria-live="polite"></p>

<script type="application/json" id="library">{"entries":[{"id":"A01","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Status hidden in a pile of flags","p":"Find implicit state machines where a feature's lifecycle is scattered across separate boolean flags, conditionals, and UI checks instead of one explicit status. Identify reachable invalid combinations and unclear transitions.","why":"Finds features whose real status is spread across a pile of yes/no flags, so combinations that should be impossible can happen.","ev":"For each affected feature, its flags and transitions (file:line), plus at least one concrete reachable invalid combination showing how a user or system event produces it.","skip":"Features already use a single explicit status enum checked in one place.","mode":"read","top":"split","scope":"wide","tools":"Repository access only.","kit":["/improve-codebase-architecture","/grill-me"],"rel":["A06","G06","R03"],"imp":"H","blind":"Do not flag every boolean field as a state machine. Report only flag combinations that are actually reachable and cause bugs.","aka":"Implicit state machines","line":"Finds features tracking status through scattered yes/no flags (`isPaid`, `isCancelled`, `isPending`) that allow impossible combinations to happen."},{"id":"A02","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Meaning drift across the stack","p":"Trace one core business concept end to end across the UI, API, database schema, and background jobs. If I did not name a specific concept, pick the single most central entity in this product and state which one you chose. Find every place its meaning, fields, nullability, or validation rules shift between layers.","why":"Shows where one word (a task, a fund, a run) means slightly different things in different parts of the app.","ev":"One table for that concept listing each layer, its name/type/column, its validation rules, and file:line, with every mismatch clearly flagged.","skip":"A simple concept that exists in only one layer of the app.","mode":"read","top":"split","scope":"wide","tools":"Repository access and read-only access to the database layout.","kit":["/grill-with-docs","/spec-to-code-compliance"],"rel":["D01","D03","G03"],"imp":"H","blind":"Tracing five concepts at once produces a vague essay. Keep the trace tightly focused on one concept.","aka":"Semantic drift through the stack","line":"Checks whether one core business word (like \"order\", \"project\", or \"member\") means slightly different things in the UI, API, database, and background jobs."},{"id":"A03","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Layers that don't earn their keep","p":"Find code abstractions that add indirection without real benefit: single-use wrappers, generic factories, deep inheritance, and pass-through utilities that make changes harder to follow than plain direct code. Separate dead weight from thin adapters that legitimately isolate an unstable third-party SDK or create a test boundary.","why":"Finds extra layers of code you could delete so the code, and the agents reading it, get simpler.","ev":"Each removal candidate (file:line), how many callers it has, what deleting it would inline or simplify, and which tests would update.","skip":"A small, direct codebase or one that just went through a cleanup pass.","mode":"read","top":"single","scope":"wide","tools":"Repository access only.","kit":["/improve-codebase-architecture","/simplify"],"rel":["A05","M04","PG10"],"imp":"H","blind":"Do not flag thin boundary wrappers around external payment, email, or AI SDKs as useless — those protect against vendor changes.","aka":"Abstractions past their usefulness","line":"Identifies unnecessary wrappers, factories, and pass-through helpers you can delete so the codebase is smaller and easier for agents to edit safely."},{"id":"A04","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Two systems that disagree","p":"Find places where the same fact is stored in more than one place — across database tables, derived columns, caches, browser storage, or external services like billing or search. For each pair, trace which copy is authoritative, how they stay in sync, what sequence of failures makes them diverge, and which copies actually earn their keep for speed or history.","why":"Finds data kept in two places (a saved copy and a table, the browser and the server) that can quietly disagree.","ev":"Each duplicated fact with its authoritative source and copies (file:line), how updates propagate, a concrete failure sequence that causes drift, and whether the extra copy should stay or be removed.","skip":"Every fact lives in one place, or caches are rebuilt cleanly on every read.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","kit":["/audit-context-building"],"rel":["R05","G06","D02","PG05","PG11"],"imp":"H","aka":"Competing sources of truth","line":"Finds facts stored in two places (database vs. Stripe, table vs. cache, client state vs. server) that can quietly drift out of sync."},{"id":"A05","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Old design choices that now cost you","p":"Examine the codebase and git history for early architectural choices that were reasonable when the project started and now create measurable friction: recurring bugs, repeated workarounds, or slow feature work. Separate real operational liabilities from out-of-fashion tech preferences.","why":"Separates old design choices that now cost real time or bugs from ones that are only out of fashion.","ev":"Each architectural liability with its original rationale, concrete evidence of today's cost (repeated bug fixes, workarounds, slow paths, or commits), and the smallest practical path forward.","skip":"A brand-new codebase under a couple of months old with little change history.","mode":"read","top":"single","scope":"wide","tools":"Repository and its git history.","kit":["/improve-codebase-architecture","/recommend"],"rel":["A03","P05"],"imp":"M","aka":"Obsolete architectural assumptions","line":"Pinpoints early technical shortcuts that made sense on day one and now cause recurring bugs, workarounds, or slow delivery."},{"id":"A06","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Code that relies on lucky timing","p":"Find asynchronous operations whose correctness relies on events arriving in a lucky order without an explicit lock, sequence check, or state guard. Trace scheduling, retries, cancellation, and concurrent writes; reproduce the highest-risk case and propose the smallest enforceable contract.","why":"Finds code that only works because things usually happen in the right order.","ev":"Each assumed ordering, what real-world event can break it (retry, slow network, double click, webhook burst), and a reproducible case for the highest-risk bug.","skip":"Strictly sequential scripts with no concurrent requests, timers, webhooks, or background tasks.","mode":"repro","top":"split","scope":"wide","tools":"Repository; a way to run the code locally to reproduce the problem.","kit":["/diagnosing-bugs"],"rel":["R05","A01","G04"],"imp":"H","aka":"Implicit ordering contracts","line":"Finds background steps, requests, or UI events that silently assume one thing finishes before another without enforcing it."},{"id":"A07","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Timers and connections nobody closes","p":"Map external side effects and resource lifecycles across this application: connections, subscriptions, listeners, timers, streams, cache entries and background workers. Find unclear ownership, incomplete cleanup and operations that outlive their intended scope. Prioritize evidenced leaks or correctness risks over stylistic patterns.","why":"Finds timers, listeners and connections that nobody clearly owns or shuts off.","ev":"Each resource with where it is created, who should release it, and the path where it is not released.","skip":"Short-lived scripts and one-off server functions that keep nothing running between calls.","mode":"read","top":"single","scope":"wide","tools":"Repository access; memory snapshots help confirm.","kit":["/audit-context-building"],"rel":["P07","R06"],"imp":"H","aka":"Side-effect and resource ownership"},{"id":"AD07","sec":"inv","group":"Explore","mode":"read","t":"Sign-up, sign-in, and locked-out users","line":"Traces every way someone creates an account, signs in, resets a password, switches devices, or deletes an account, and finds where people can get locked out or keep access they shouldn't have.","p":"Trace the full account lifecycle in this application: sign-up, email verification, password sign-in, magic links, OAuth/social login, password reset, email change, session refresh and expiry, sign-out, role or team revocation, and account deletion. Look for ways a real person gets stuck or locked out (expired links with no resend button, case-sensitive email mismatches, OAuth colliding with an existing password account, redirect loops after sign-in, sessions dropping on refresh) and ways revoked users keep access (cached tokens, active sessions that survive password change or removal). Check both code and auth provider configuration where visible in the repo.","ev":"A walkthrough of each account flow with file:line, every lockout or leftover-access failure found, and any auth provider settings that live outside the repo and need my check in a named dashboard.","skip":"A public tool or static site with no accounts or sign-in.","blind":"Agents test only the happy sign-in path. Trace duplicate emails across sign-in methods, expired tokens, and what happens to open browser tabs after a user is removed or changes their password.","fresh":true},{"id":"A08","sec":"inv","group":"Architecture and hidden complexity","gk":"A","t":"Screens that fight how people work","p":"Map this product's pages, routes, and navigation against the real jobs users come to do. Look for pages that should merge, shrink into a tab or panel, or go away; competing menus pointing to the same destinations; and workflows users must piece together across multiple screens. State clearly whether the underlying page structure causes two or more of these issues; if not, keep the structure and recommend local fixes.","why":"Finds when confusing screens are a symptom of how the product is organised rather than a list of separate bugs.","ev":"A verdict per page (keep, merge, demote, or retire) with evidence, the two to five root causes behind user confusion, and today's site map beside the proposed one.","skip":"A tiny app with fewer than five screens, or a navigation redesign that just shipped with no user feedback yet.","mode":"read","top":"split","scope":"wide","tools":"Repository; the app running locally with test accounts for the browser checks.","kit":["/experience-architecture:diagnose","/experience-architecture:rethink"],"rel":["A05","R07","A02"],"imp":"H","blind":"Do not propose a full redesign for isolated screen bugs. Recommend structural changes only when one cause explains multiple problems.","aka":"Structure that fights the users' work","line":"Checks whether confusing screens are caused by how pages and menus are organized overall, then proposes a cleaner site map if the structure itself is the problem."},{"id":"P01","sec":"inv","group":"Performance and scale","gk":"P","t":"Slowest journeys, end to end","p":"Trace and measure the five slowest or heaviest user journeys from browser interaction to database response. Look for unnecessary network round trips, sequential waterfalls, slow queries, repeated work, heavy synchronous handlers blocking other requests, and quadratic loops over growing collections. Measure each step's share of total latency before ranking fixes.","why":"Shows where the seconds go on the paths people actually use.","ev":"A measured timing breakdown per journey (browser network timing, server timing, query plan, or event-loop delay) showing each step's share of total time, ranked by impact.","skip":"Every main flow already feels fast and server/database bills are flat.","mode":"read","top":"split","scope":"wide","tools":"Browser developer tools or Playwright recordings, server logs or timing data, and the database's query plan (EXPLAIN).","kit":["/diagnosing-bugs"],"rel":["P02","P03","M08"],"imp":"H","blind":"Reading code statically guesses at latency and flags tiny loops that never matter. Require actual measurements at realistic data sizes before ranking anything.","aka":"Expensive journeys","line":"Measures your five slowest user flows from button click to database reply and pinpoints which steps burn the most time."},{"id":"P02","sec":"inv","group":"Performance and scale","gk":"P","t":"Steps that wait for no reason","p":"Audit asynchronous hot paths for two opposite problems: (1) independent operations waiting sequentially when they could safely run in parallel without breaking ordering, rate limits, or database transaction boundaries, and (2) parallel fan-outs or queues running with no concurrency cap that could exhaust connection pools, memory, or external API limits at realistic scale.","why":"Finds steps that wait for each other to finish when they could run at the same time.","ev":"For each sequential chain, the current measured duration, why the steps are independent, and any shared transaction or rate limit to respect; for each unbounded fan-out, its maximum width on realistic data next to the downstream limit and a recommended cap.","skip":"Fast paths finishing in a few milliseconds, or fixed tiny lists with no external or database pressure.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a timing script to measure the result afterward.","kit":["/diagnosing-bugs"],"rel":["P09","A06","M08"],"imp":"H","blind":"Wrapping awaits in Promise.all breaks when calls share a single database transaction or hit a rate-limited API. Check transaction scopes, pool sizes, and vendor rate limits before recommending parallelism.","aka":"Sequential asynchronous work","line":"Finds slow chains of steps running one after another that could safely run together, as well as parallel batches with no cap that could overload your database or APIs."},{"id":"P03","sec":"inv","group":"Performance and scale","gk":"P","t":"Queries that grow badly","p":"Find database queries whose execution cost grows disproportionately as rows, users, tenants, or relationships increase. Inspect query plans, missing or unused indexes, N+1 joins, unbounded pagination, and filtering done in application memory instead of the database.","why":"Finds the database queries that will be the first to slow down as tables grow.","ev":"Each suspect query (file:line), its EXPLAIN ANALYZE output (or query plan) at realistic row counts, the exact scaling bottleneck, and the proposed index or query rewrite. If a safe non-production copy exists, note whether the rewrite can be benchmarked there in a follow-up step.","skip":"Projects with only tiny, fixed-size tables (such as settings or short lookup lists).","mode":"read","top":"single","scope":"narrow","tools":"Read-only database access with EXPLAIN (the database's query plan). A Neon or Supabase branch copy for anything heavier.","kit":[],"rel":["P01","P05","P06","PG13"],"imp":"H","aka":"Query scaling","line":"Identifies database queries that are fine with sample data and will bog down as rows, users, or accounts pile up."},{"id":"P04","sec":"inv","group":"Performance and scale","gk":"P","t":"Work repeated for nothing","p":"Find expensive computations, queries, API calls, or UI renders that run repeatedly even though their inputs have not changed. Measure how often each runs and what it costs before considering caching, memoization, batching, or incremental updates.","why":"Finds work redone on every request or screen redraw when nothing it depends on changed.","ev":"Each repeated operation (file:line), how often it runs, how often its inputs actually change, its measured cost, and — if you recommend caching — exactly how and when that cache gets invalidated.","skip":"Operations that are already cheap, where caching would add stale-data bugs for negligible gain.","mode":"read","top":"single","scope":"wide","tools":"A profiler or request logs to count repeats.","kit":[],"rel":["A04","P01","PG06"],"imp":"H","blind":"Every cache creates a second source of truth. Reject any caching proposal that cannot explain invalidation cleanly.","aka":"Repeated expensive work","line":"Spots expensive calculations, fetches, or renders that rerun on every click or request even when their inputs never changed."},{"id":"P05","sec":"inv","group":"Performance and scale","gk":"P","t":"What breaks at ten times the size","p":"Model what happens when this product's stored data and concurrent active users grow tenfold. Use real table counts, request rates, query plans, and hosting/database plan limits to identify the first bottlenecks that break or spike cost.","why":"Names the first thing to break if the project takes off, before it does.","ev":"Current baseline sizes and rates (marking anything estimated), projected 10x numbers, the exact ceiling each bottleneck hits (connection pool, query time, storage quota, rate limit, or plan tier), and the threshold at which you should actually fix it.","skip":"A personal tool or fixed-audience app with flat usage and no growth expected.","mode":"read","top":"single","scope":"wide","tools":"Database stats, hosting plan limits, current traffic numbers.","kit":[],"rel":["P03","P09"],"imp":"M","aka":"Tenfold growth stress","line":"Projects your current numbers tenfold to show which database limit, hosting cap, or code bottleneck fails first if growth takes off."},{"id":"P06","sec":"inv","group":"Performance and scale","gk":"P","t":"Loops that blow up with big data","p":"Identify potentially quadratic or worse operations in frequently used code paths, including nested joins in application memory, copy-on-every-iteration patterns and repeated scans. Determine realistic input sizes and benchmark the highest-impact candidates before changing their algorithms.","why":"Finds loops inside loops that are fine at 50 rows and painful at 50,000.","ev":"Each candidate with realistic input size and a benchmark at that size; ignore candidates whose real inputs stay small.","skip":"Code whose inputs are small and capped by design.","mode":"read","top":"single","scope":"narrow","tools":"A speed-test setup. The experimental agent-complexity-optimizer scanner can suggest places to look.","kit":[],"rel":["P03","M08"],"imp":"H","blind":"Static scanners flag nested loops over tiny arrays. Without real sizes the list is mostly noise.","aka":"Growth complexity analysis"},{"id":"P07","sec":"inv","group":"Performance and scale","gk":"P","t":"Memory that keeps growing","p":"Investigate sustained memory growth and leaked resources across the browser and server: unbounded caches, unremoved event listeners, timers and intervals never cleared, unclosed database or network connections, leaked streams or subscriptions, detached DOM nodes, and retained closures or request payloads. Validate top suspects with repeatable growth checks or heap snapshots where available.","why":"Finds why a page or process gets slower or crashes the longer it runs.","ev":"Each leak or unclosed resource with where it is created (file:line), who should clean it up, the path where cleanup is skipped, and heap-snapshot or growth evidence for the top suspects.","skip":"Short-lived scripts or stateless functions with flat memory usage over time.","mode":"read","top":"single","scope":"narrow","tools":"Chrome DevTools memory snapshots or Node --inspect.","kit":["/diagnosing-bugs"],"rel":["A07"],"imp":"H","aka":"Allocation and memory retention","line":"Finds unclosed timers, listeners, connections, and growing caches that make a tab or server sluggish or crash the longer it stays running."},{"id":"P08","sec":"inv","group":"Performance and scale","gk":"P","t":"One slow step that blocks the rest","p":"Find synchronous work performed in latency-sensitive asynchronous handlers, including filesystem operations, parsing, compression, large serialization and CPU-heavy transforms. Measure event-loop impact and identify safe offloading, batching or scheduling fixes.","why":"Finds one slow step that makes every other request wait in line behind it.","ev":"Event-loop delay or long-task measurements tied to the specific handler.","skip":"Background scripts where nothing else shares the process.","mode":"read","top":"single","scope":"narrow","tools":"Node profiler or the browser's Performance panel.","kit":[],"rel":["P01","P04"],"imp":"H","aka":"Event loop and blocking I/O"},{"id":"P09","sec":"inv","group":"Performance and scale","gk":"P","t":"Parallel work with no limit","p":"Examine places where work is parallelized or queued without explicit limits. Find cases where a speed optimization could overwhelm rate limits, memory, connection pools or a downstream service; propose and test concurrency bounds with realistic load.","why":"Finds work run in parallel with no limit, which can swamp the database connections or an outside service.","ev":"Each fan-out with its maximum width at realistic input, the downstream limit, and a load test with a bound.","skip":"Parallel work over a fixed, small list.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a load-testing script pointed at a non-production copy.","kit":[],"rel":["P02","G04"],"imp":"H","aka":"Concurrency boundedness"},{"id":"R01","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Safe to run twice?","p":"Find write operations, webhooks, imports, and user actions that cannot safely run twice or resume after an interruption. Examine duplicate requests, webhook retries, out-of-order arrivals, idempotency keys, unique constraints, and transaction boundaries. Do not assume an ON CONFLICT clause alone guarantees safe reruns; check side effects like emails, charges, and counters too.","why":"Finds actions that do damage when they run twice: double sends, double charges, duplicate rows.","ev":"Each unsafe operation (file:line), what triggers a retry or duplicate, what happens on a second run, and whether a key, constraint, or lock currently prevents damage.","skip":"Read-only apps that never write records, send messages, or charge cards.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only access to the database layout.","kit":["/diagnosing-bugs"],"rel":["R05","R06","D04","PG08"],"imp":"H","aka":"Retry and idempotency failures","line":"Finds actions — charges, emails, webhooks, imports, and form submits — that cause double-billing, duplicate sends, or corrupted rows if retried."},{"id":"R02","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Fallbacks that look like real data","p":"Trace every place the application quietly substitutes a default, zero, null, stale value, or empty list when a request, query, or calculation fails. Determine whether a user could mistake that fallback for valid, up-to-date information.","why":"Finds screens that show a confident zero or an empty list when the real answer is 'we could not load this'.","ev":"Each silent fallback with its trigger, what appears on screen, and whether anything alerts the user that loading failed.","skip":"Every error path already displays a clear error or unavailable state on screen.","mode":"read","top":"single","scope":"wide","tools":"Repository; the app running to see what users see.","kit":["/insecure-defaults:audit"],"rel":["D01","T05","S06"],"imp":"H","aka":"Misleading fallbacks","line":"Finds places where an error quietly turns into a normal-looking zero, empty list, or stale value so users never know loading failed."},{"id":"R03","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Rules the data never enforces","p":"Identify critical business invariants this product assumes (such as non-negative balances, unique ownership, valid status combinations, or plan limits) that are enforced only in UI code or never enforced at all. Recommend the right enforcement layer (database constraint, schema validation, or server check) and write a test demonstrating how the top rule can be broken today.","why":"Finds the rules everyone assumes (one owner per task, no negative balance) that nothing actually checks.","ev":"Each unenforced rule, where the app assumes it (file:line), where it should be enforced, and a failing test proving it can be violated today.","skip":"Core rules are already enforced by database constraints and server-side checks.","mode":"repro","top":"single","scope":"wide","tools":"Repository; a test database or branch copy.","kit":["/property-based-testing","/tdd"],"rel":["A01","T02"],"imp":"H","aka":"Unenforced invariants","line":"Uncovers core business rules everyone assumes are true (such as \"no negative balance\" or \"one owner per account\") that neither the server nor database actually blocks."},{"id":"R04","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Dates, times and time zones","p":"Audit how this application handles dates and time: time zones, daylight saving transitions, day boundaries, expirations, scheduled jobs, client-versus-server clock skew, and historical date queries.","why":"Finds the date bugs that show up twice a year, at midnight, or in another time zone.","ev":"Each time-sensitive path with the time zone it assumes, plus a failing test at a daylight saving change and around midnight in both UTC and your users' primary time zone.","skip":"Features that never store, compare, schedule, or display dates or times.","mode":"repro","top":"single","scope":"wide","tools":"Repository; tests with the clock fixed to a set time.","kit":["/property-based-testing"],"rel":["D03"],"imp":"M","aka":"Time handling","line":"Hunts down date and clock bugs around midnight, daylight saving shifts, expirations, and users in other time zones."},{"id":"R05","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Updates that overwrite each other","p":"Find race conditions and lost-update paths across concurrent UI edits, API calls, caches, webhooks, and background jobs. Prove real risks with a concrete reproduction instead of listing theoretical possibilities.","why":"Finds updates that overwrite newer data because two things wrote at once.","ev":"Each confirmed race (file:line) with a runnable test or script that reproduces the lost update.","skip":"Single-user records written by only one synchronous code path.","mode":"repro","top":"split","scope":"wide","tools":"Repository; a local or branch-copy database to reproduce the problem.","kit":["/diagnosing-bugs"],"rel":["A06","A04","R01","PG05"],"imp":"H","blind":"Agents list theoretical race conditions freely. Count only races backed by a concrete reproduction or an exact reachable sequence.","aka":"Races and stale writes","line":"Finds places where two tabs, users, webhooks, or jobs edit the same record at once and the slower one silently wipes out the newer change."},{"id":"R06","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Half-finished failures","p":"Trace error, timeout, and cancellation paths for database transactions, locks, file handles, temporary files, background jobs, and external network calls. Find paths that leave resources held open or data half-committed when something fails midway, and demonstrate the highest-risk case with controlled failure injection where practical.","why":"Finds what is left behind when something fails halfway.","ev":"Each failure path, what gets left half-committed or held open, and a reproduction for the highest-risk case.","skip":"Simple stateless endpoints or scripts that perform a single atomic read or write with no multi-step state.","mode":"repro","top":"single","scope":"wide","tools":"Repository; a way to force errors in tests.","kit":["/diagnosing-bugs"],"rel":["A07","R01","I04"],"imp":"H","aka":"Partial resource cleanup on failure","line":"Traces what gets left stuck or half-saved when an action crashes, times out, or gets cancelled midway."},{"id":"R07","sec":"inv","group":"Correctness and reliability","gk":"R","t":"Lost place: Back, refresh and shared links","p":"Check whether this application preserves the user's place. In a local or staging browser (never production with real accounts), open lists, filters, tabs, modals, and detail records, then test Back, Forward, page refresh, opening links in a new tab, and opening copied URLs in a fresh session both signed out and as another user. Trace every lost filter, scroll jump, wiped draft, broken Back action, or wrong landing screen to the code that owns that state.","why":"Finds the everyday friction where Back closes the wrong thing, a filter resets, or a pasted link opens the wrong view.","ev":"Each tested journey (start, action, expected result, observed result) with the file:line owning the state and a clear PASS or FAIL verdict.","skip":"A simple static site with no filters, panels, drafts, or signed-in views.","mode":"read","top":"single","scope":"narrow","tools":"The app running locally or on staging with test accounts; Playwright, which the plugin looks for and asks before installing.","kit":["/experience-architecture:diagnose","/experience-architecture:verify"],"rel":["T01","A08","G06"],"imp":"H","blind":"Even ordinary page loads can trigger background writes in some apps. Run browser checks only against local development or safe staging test accounts.","line":"Tests Back, Forward, page refresh, new tabs, and shared URLs to find where filters reset, drafts disappear, or pasted links land on the wrong screen."},{"id":"T01","sec":"inv","group":"Testing and security","gk":"T","t":"Unit tests that give false comfort","p":"Find critical user journeys that have extensive unit-test coverage but insufficient evidence that they work end to end. Strengthen the smallest set of tests that closes the real gaps.","why":"Finds features whose automated checks all pass and that still break for real people.","ev":"Each journey with what the tests cover, what they skip (real auth, real DB, real browser), and the one added check.","skip":"User paths already covered by a browser test.","mode":"repro","top":"single","scope":"wide","tools":"Playwright or the in-app browser for the full start-to-finish check.","kit":["/tdd","/viewport-proof"],"rel":["T02","T06","I02"],"imp":"H","aka":"False confidence from unit tests"},{"id":"T02","sec":"inv","group":"Testing and security","gk":"T","t":"Tests that can't fail","p":"Find tests that would continue passing if the underlying feature stopped working. Examine mocks, fixtures, assertions, and tests that merely reproduce implementation details.","why":"Finds tests that pass no matter what.","ev":"For each suspect test, break the feature on purpose and show the test still passes.","skip":"Brand-new test suites written before the code.","mode":"repro","top":"single","scope":"wide","tools":"Repository and the test runner.","kit":["/property-based-testing","/tdd"],"rel":["T06","T01"],"imp":"H","aka":"Tests that cannot fail meaningfully"},{"id":"T03","sec":"inv","group":"Testing and security","gk":"T","t":"Outside input reaching sensitive actions","p":"Trace every untrusted external input — forms, URL parameters, file uploads, headers, webhooks, and AI model outputs — from entry point to sensitive operations (database writes, auth changes, billing, file access, admin actions, outbound requests). Check for missing authorization or ownership checks, tenant isolation gaps, injection vectors, and unsafe parsing.","why":"Follows input from outsiders to the places it can do harm.","ev":"Each risky path listing its entry point, checks along the way, the sensitive operation reached, and the exact missing safeguard (file:line).","skip":"A completely static site with zero backend endpoints, forms, uploads, webhooks, or stored user data.","mode":"read","top":"split","scope":"wide","tools":"Repository access.","kit":["/security-review","/audit-context-building","/differential-review:diff-review"],"rel":["T05","S06","G03"],"imp":"H","aka":"Input-to-sensitive-operation tracing","line":"Traces every form field, upload, URL parameter, webhook, and AI output from entry to sensitive actions to find missing permission or safety checks."},{"id":"T04","sec":"inv","group":"Testing and security","gk":"T","t":"Risk from outside packages","p":"Audit dependency and CI supply-chain exposure: known security advisories matching installed versions, package install scripts, GitHub Actions or CI workflows triggered by untrusted pull requests, overly broad workflow permissions, and which jobs can read deployment secrets.","why":"Checks what a harmful outside package or pull request could reach.","ev":"Active advisories matched to installed versions, packages with lifecycle install scripts, workflow permission gaps (file:line), and a map of which CI jobs can access which secrets.","skip":"A zero-dependency repository with no automated CI or deployment workflows.","mode":"read","top":"single","scope":"narrow","tools":"The lockfile (exact package list), automated build workflow files, npm audit or the auditor skill.","kit":["/supply-chain-risk-auditor","/agentic-actions-auditor","/ci-optimizer:ci-check"],"rel":["I06","I03"],"imp":"H","aka":"Supply-chain exposure","line":"Audits installed third-party packages and automated GitHub/CI workflows for known vulnerabilities, risky install scripts, and overly broad secret permissions."},{"id":"T05","sec":"inv","group":"Testing and security","gk":"T","t":"Security checks that fail open","p":"Audit every authentication, authorization, rate-limit, and webhook-signature check for fail-open behavior: cases where a missing environment variable, null user object, thrown exception, network timeout, or malformed request results in access being granted instead of denied.","why":"Finds security checks that let people in when something goes wrong.","ev":"Each security gate (file:line) and what happens on missing config, thrown error, and malformed input, backed by a code trace or safe test request.","skip":"A public static app with no authentication, permissions, private endpoints, or webhooks.","mode":"read","top":"single","scope":"narrow","tools":"Repository; the app running locally in demo mode.","kit":["/insecure-defaults:audit","/sharp-edges"],"rel":["S06","T03","R02"],"imp":"H","aka":"Fail-open security paths","line":"Finds sign-in, permission, or webhook checks that accidentally let people through when a setting is missing, a service errors out, or a request is malformed."},{"id":"T06","sec":"inv","group":"Testing and security","gk":"T","t":"What the tests really prove","p":"Audit the test suite covering this product's critical user journeys. Look for three failure modes: (1) heavy unit-test coverage that mocks away real auth, database, or browser behavior so broken integrations still pass, (2) assertions that test implementation details or cannot fail meaningfully when user behavior breaks, and (3) critical flows with no end-to-end check at all. For the single highest-risk gap, write one independent test that would catch a real user-facing regression.","why":"Asks what each test really proves, then adds one check that would catch a real break.","ev":"For each critical journey, what existing tests actually exercise versus what they mock or skip (file:line), any toothless tests found and why they pass on broken code, and the one added check for the top gap.","skip":"Every critical user flow is already covered by end-to-end checks that run against real storage and have caught real regressions.","mode":"repro","top":"single","scope":"narrow","tools":"Repository and test runner.","kit":["/tdd","/property-based-testing"],"rel":["T02","T01","M06"],"imp":"H","aka":"Test claims versus real evidence","line":"Checks what your tests actually prove about key user flows, exposes mocked-out or toothless tests that still pass when features break, and adds one real check for the biggest gap.","blind":"Do not modify application code to \"test the tests.\" Prove toothless assertions by tracing the mocked boundary or writing an independent test against the real requirement."},{"id":"S06","sec":"inv","group":"Testing and security","gk":"T","t":"Settings that differ in production","p":"Audit configuration and environment variables across local development, CI, preview, and production. Find ambiguous fallbacks, test-mode switches that could stay on, fail-open permissions, and behavior that silently changes when a variable is unset. Check actual code and deployment config files instead of trusting README examples. Never print or expose secret values.","why":"Finds settings that behave differently in production than anyone expects.","ev":"A table of environment-sensitive settings (variable names only, never values), where each is read (file:line), its fallback when missing, and what breaks or shifts across environments.","skip":"A local-only tool with a single environment and no deployment settings.","mode":"read","top":"single","scope":"narrow","tools":"Vercel settings list (names only, never values), automated build config, the code that reads each setting.","kit":["/insecure-defaults:audit"],"rel":["T05","I05","G02"],"imp":"H","blind":"Never print secret values in output or logs. Report only variable names, code paths, and whether a setting exists.","aka":"Configuration and secure default drift","line":"Compares local, preview, and production configuration to catch missing environment variables and defaults that behave differently once live."},{"id":"I01","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Duplicate tools and stale caches","p":"Inventory the development environment's browser runtimes, caches, SDKs, package managers, and duplicate installations. Identify obsolete or wasteful components, assess dependencies, and propose a safe cleanup.","why":"Finds disk space and confusion spent on duplicate developer tools and stale saved files on your computer.","ev":"Each component with size, version, what depends on it, and whether deleting it is safe and reversible.","skip":"When disk space is fine and builds are stable.","mode":"read","top":"single","scope":"narrow","tools":"A terminal on your computer.","kit":[],"rel":["I07"],"imp":"M","blind":"Treat every deletion as a proposal. Shared runtimes break other apps silently.","aka":"Toolchain and cache hygiene"},{"id":"I02","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Why production might not match main","p":"Trace a code change from merge to live users: build steps, database migrations, deployment triggers, CDN or app caches, background workers, and mobile/client updates. Identify every point where a deploy step can silently skip, fail, or serve stale code without alerting anyone.","why":"Lists every way 'merged' can fail to mean 'live'.","ev":"The actual release pipeline step by step with its config files (file:line), and for each step how it can fail or stay stale silently.","skip":"You already mapped this pipeline recently and nothing in hosting, builds, or migrations changed since.","mode":"read","top":"single","scope":"narrow","tools":"Automated build and Vercel config, deployment history (read-only).","kit":[],"rel":["G02","I05","PG15"],"imp":"H","aka":"Merge-to-production trace","line":"Traces every step from merging code to users seeing it live, exposing caches, manual deploys, or skipped migrations that leave production stale."},{"id":"I03","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Check time that catches nothing","p":"Analyze CI and deployment workflows against the real failures they catch. Look for duplicated build/install steps, missing caches, redundant checks, and expensive jobs that add little confidence over faster checks.","why":"Finds paid automated-check minutes spent on checks that never catch anything.","ev":"Each CI job (file:line) with its typical duration, run frequency, whether recent runs caught real bugs (where run history is accessible), and the highest-impact speedup or cut.","skip":"CI runs finish in a minute or two and cost nothing.","mode":"read","top":"single","scope":"narrow","tools":"GitHub Actions run history via gh.","kit":["/ci-optimizer:ci-timings","/ci-optimizer:ci-check"],"rel":["T04"],"imp":"H","aka":"CI cost versus confidence","line":"Reviews your automated CI checks to spot slow, expensive, or duplicated jobs that burn minutes without catching real bugs."},{"id":"I04","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Background jobs that hang or stop halfway","p":"Audit every scheduled job, cron task, and background worker for hangs, overlapping runs, partial updates, missing timeouts, unsafe retries, and deploy interruptions.","why":"Finds scheduled jobs and background workers that can hang, overlap or stop halfway.","ev":"Each job (file:line) with its schedule or trigger, timeout, lock/overlap protection, what happens if it crashes midway, and how a failure is reported.","skip":"Projects with no scheduled tasks, queues, or background workers.","mode":"read","top":"single","scope":"narrow","tools":"Repository, the scheduled jobs in vercel.json, logs.","kit":[],"rel":["R06","R01","G02"],"imp":"H","aka":"Blocking and partial background jobs","line":"Audits scheduled tasks and background queues to see what happens when a job hangs, overlaps with the next run, or dies during a deploy."},{"id":"I05","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Dashboard and repo out of sync","p":"Compare infrastructure, hosting, cron, and environment settings declared in this repository against live configuration where read-only CLI or API access exists. Where dashboard state cannot be inspected from here, list the exact settings and dashboards I need to compare by hand. Flag drift that creates security, billing, or deploy risk.","why":"Finds where the hosting dashboard and the repo disagree.","ev":"Each declared setting (file:line) next to its live value (or \"check in [named dashboard]\"), highlighting every mismatch that affects uptime, security, or deploys.","skip":"Every hosting and database setting is managed purely from code with no manual dashboard overrides.","mode":"read","top":"single","scope":"narrow","tools":"Vercel and database dashboards or MCP tools, read-only.","kit":[],"rel":["S06","I02"],"imp":"M","aka":"Infrastructure drift","line":"Compares infrastructure settings declared in your code against what is actually configured in your hosting or cloud dashboards."},{"id":"I06","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Packages nobody uses, or that work by luck","p":"Audit declared dependencies for unused packages, undeclared imports satisfied only through transitive dependencies, and heavy libraries imported for trivial functionality. Check runtime code, config files (Next, Vite, PostCSS, Tailwind, ESLint), CLI scripts, and dynamic imports before calling any package unused.","why":"Finds packages nobody uses and packages that work only by accident.","ev":"Each flagged package with every reference found (including configs and scripts), its install or bundle cost, and whether removal or replacement is safe.","skip":"A tiny repo with only a handful of dependencies, or one that just finished a dependency cleanup.","mode":"read","top":"single","scope":"narrow","tools":"Repository; a package checker such as knip or depcheck if already present.","kit":["/supply-chain-risk-auditor"],"rel":["T04"],"imp":"H","blind":"Simple import scanners falsely flag packages loaded by build configs, PostCSS/Tailwind plugins, or CLI scripts. Verify those paths before recommending removal.","aka":"Ghost and phantom dependencies","line":"Finds installed dependencies nothing uses anymore, imports working only by accident through another package, and huge libraries kept for one tiny helper."},{"id":"I07","sec":"inv","group":"Infrastructure and environment","gk":"I","t":"Old runtimes and when support ends","p":"Inventory actual versions and dependencies of Playwright, Puppeteer, system Chrome, Chromium caches and Electron apps. Verify current vendor-supported and security-fix thresholds rather than trusting hard-coded version numbers. Distinguish safe disposable caches from app-owned runtimes and report the rollback path before any cleanup.","why":"Finds old browser runtimes on your computer and which are safe to remove, before a cleanup breaks an app that needs them.","ev":"Each runtime with version, owner app, support status from the vendor, size, and a rollback path.","skip":"When browser tests are stable and disk space is fine.","mode":"read","top":"single","scope":"narrow","tools":"A terminal on your computer; vendor release pages.","kit":[],"rel":["I01"],"imp":"M","blind":"Do not delete shared runtimes or force a system Chrome until every dependent app is known.","aka":"Runtime inventory and support lifecycle"},{"id":"AD05","sec":"inv","group":"Explore","mode":"read","t":"Did the agent actually finish this?","line":"Checks a completed feature or branch for classic coding-agent shortcuts: placeholder data, dead buttons, stubbed functions, skipped error states, and weakened tests.","p":"Audit the current branch (or the feature I name) for incomplete or faked implementation. Look for hardcoded or mock data left in real paths, stubbed or empty handlers, buttons or links wired to nothing, TODO/FIXME placeholders, swallowed errors (empty catch blocks), skipped or loosened tests, missing loading/empty/error states, and requirements from my request that were silently dropped. Check every changed file and trace each user action from the UI to storage and back.","ev":"A list of every shortcut, stub, dead control, weakened test, or dropped requirement with file:line and what a user would see if it shipped today, or a clear confirmation of every path you verified end to end.","skip":"A pure documentation change with no UI, logic, or test edits.","blind":"Agents skim for TODO comments and miss handlers that quietly return fake success or render static sample items. Trace the actual data flow for every new screen and action.","fresh":true},{"id":"AD06","sec":"inv","group":"Explore","mode":"read","t":"How this whole product works","line":"Draws a plain-English map of your app — its screens, user roles, stored data, scheduled jobs, and outside services — so you can see how the pieces connect without reading code.","p":"Read the repository and build a plain-English map of how this product actually works today, written for the owner who directs changes and does not read code. Cover: (1) the main user roles and what each can see or do, (2) the key screens and how users move between them, (3) the core data records stored and how they relate, (4) every background job or scheduled task, (5) every external service or API the app depends on, and (6) where the highest-risk logic lives (payments, auth, writes, AI calls). Base every statement on the code and config files present today, ignoring outdated README descriptions.","ev":"A one-page plain-English system map covering those six areas, with key entry-point file paths listed underneath so I can point future sessions to the right folder.","skip":"A single-file script or a repo that already has an up-to-date plain-English architecture map verified against today's code.","blind":"Agents copy stale descriptions from README.md. Verify every screen, service, and table directly from source and config files, and flag any place the docs disagree with the code.","fresh":true},{"id":"D01","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Missing vs zero vs stale","p":"Find where this application blurs the difference between missing, zero, unavailable, estimated, stale, and not applicable. Trace how each state is stored, how totals or averages handle it, and what appears on screen.","why":"Finds where 'we don't know' turns into 0 and then into a wrong total.","ev":"Each affected field (file:line), how absence is stored, how calculations treat it, what users see, and any chart or total it distorts.","skip":"Simple records with no optional numeric fields or aggregations.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","kit":["/spec-to-code-compliance"],"rel":["R02","D02","G05"],"imp":"H","aka":"Missing versus zero versus stale","line":"Spots places where \"unknown\", \"not loaded\", or \"not applicable\" quietly turns into `0` and corrupts averages, charts, or totals."},{"id":"D02","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Where did this number come from?","p":"Trace each important derived number shown to users back to its raw source records, transformation logic, filters, and assumptions. Recompute a representative sample independently from raw inputs without relying on the existing calculation code to check itself. Flag discrepancies in definitions, units, dates, or source selection, and distinguish one-off errors from shared calculation bugs.","why":"Checks that every number on screen can be traced back to a source document.","ev":"For each key metric: its raw inputs, formula location (file:line), an independent recomputation on at least one real or sample record, and any disagreement ranked by impact.","skip":"Every displayed number is stored and shown verbatim with no calculation or aggregation.","mode":"read","top":"split","scope":"wide","tools":"Repository, read-only database, and the source documents the numbers come from.","kit":["/spec-to-code-compliance","/dimensional-analysis"],"rel":["D01","D03","G05","PG01"],"imp":"H","aka":"Derived-metric provenance","line":"Traces every calculated number on screen back to its raw source records and recomputes an example independently to prove it is right."},{"id":"D03","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Old records, new meanings","p":"Find historical records whose meaning shifts when today's rules, categories, tax rates, plan limits, or schemas are applied retroactively. Check whether the system can still reproduce what a past record or report showed on an earlier date, distinguishing later source corrections from later rule changes. Recommend the smallest reliable fix without over-engineering full bitemporal storage unless truly required.","why":"Finds old records that read differently once today's rules are applied to them.","ev":"Each rule or classification that affects past records (file:line), which historical data predates it, concrete examples of how old records read today, and the smallest way to preserve historical accuracy.","skip":"An app with no historical reporting or evolving categories/pricing rules.","mode":"read","top":"single","scope":"wide","tools":"Read-only database access, history of database changes.","kit":[],"rel":["R04","D02","PG04"],"imp":"H","aka":"Historically changing meaning","line":"Checks whether changing a rule, plan tier, or category today accidentally rewrites what historical records meant in the past."},{"id":"D04","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Imports that fail quietly","p":"Audit every data import, CSV upload, and external sync for records that can be silently skipped, duplicated, overwritten, or linked to the wrong entity without raising an error. Check matching keys, conflict handling, partial failures, and summary logging.","why":"Finds rows that go missing or land on the wrong record during import, with no error.","ev":"Each import step (file:line) with its matching key, conflict rule, what gets logged on skip or mismatch, and whether counts-in are reconciled against counts-stored.","skip":"Apps where all data is entered one record at a time through forms, with no batch imports or syncs.","mode":"read","top":"single","scope":"narrow","tools":"Repository, import logs, read-only database.","kit":[],"rel":["R01","D05"],"imp":"H","aka":"Silent ingestion errors","line":"Audits CSV uploads, syncs, and data imports for rows that get dropped, overwritten, duplicated, or attached to the wrong record without throwing an error."},{"id":"D05","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Links between records worth adding","p":"Identify where data relationships have greater analytical value than isolated fields. Find missing links, broken historical continuity, and relationships the source evidence cannot actually support.","why":"Finds links between records worth adding, and ones the evidence does not support.","ev":"Each relationship with its source evidence, current coverage, and gaps.","skip":"When the data layout is still changing weekly.","mode":"read","top":"single","scope":"wide","tools":"Read-only database access, source documents.","kit":["/grill-with-docs"],"rel":["D04","D03","PG03"],"imp":"H","aka":"Relationship and historical value"},{"id":"D06","sec":"inv","group":"Data integrity and analytics","gk":"D","t":"Code health, with proof","p":"Run a focused code-health audit calibrated to this repository's real conventions and operational risks. Every finding must cite a specific file:line, runnable command, trace, or commit; reject generic style preferences. Return a short ranked list of under fifteen repairable problems, each graded by confidence and user/maintenance impact.","why":"A general health check of the code that refuses findings without evidence.","ev":"Under fifteen ranked issues, each with file:line or a reproducible command, confidence, impact, and the smallest sensible fix.","skip":"You already have a specific symptom that fits a narrower investigation.","mode":"read","top":"single","scope":"wide","tools":"Repository access.","kit":["/harsh-review","/code-review"],"rel":["M02","T06"],"imp":"H","aka":"Evidence-required code-health audit","line":"Runs a disciplined codebase health check that drops style nitpicks and returns a short ranked list of concrete, repairable problems backed by proof."},{"id":"G01","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Out-of-date agent instructions","p":"Compare every agent instruction and project doc file (`AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `SKILL.md`, `README.md`, and architecture notes) against the real directory layout, package scripts, and current code patterns. Flag stale rules referencing deleted files, replaced libraries, broken commands, or retired conventions.","why":"Finds instructions that send agents to files and patterns that no longer exist.","ev":"Each stale instruction with its file:line and the current repository fact it contradicts, plus the exact replacement or deletion proposed.","skip":"You have no agent instruction files yet, or you just audited and updated them.","mode":"read","top":"single","scope":"narrow","tools":"Repository access.","kit":["/retro"],"rel":["M10"],"imp":"H","aka":"Context-file drift","line":"Checks `AGENTS.md`, `CLAUDE.md`, `.cursorrules`, and project docs against the actual repo to catch outdated paths, deleted commands, and dead patterns that mislead agents."},{"id":"G02","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Database changes during a deploy","p":"Review the pending database migration or API schema change against the current live schema, previous release's queries, active background workers, and deployment sequence. Check whether it preserves existing data, causes table locks, breaks older client bundles or workers still draining during deploy (such as column renames, drops, or non-nullable additions), and whether a real rollback or recovery path exists. Never assume reverting app code alone rolls back a schema change.","why":"Checks that each database change works with the old code that is still live while a release finishes.","ev":"The migration diff (file:line), every query or consumer affected, how old and new app versions coexist during rollout, lock and rollback risks, and results from replaying the migration on a separate test copy if available.","skip":"The pending change touches no database schema, functions, policies, or shared API contracts.","mode":"read","top":"single","scope":"narrow","tools":"Repository, migrations folder, previous release tag.","kit":["/differential-review:diff-review"],"rel":["I02","S06","PG17"],"imp":"H","aka":"Migration and rolling-deploy skew","line":"Checks a pending database or API change to verify existing records survive, running users and old app versions don't break mid-deploy, and a real rollback path exists.","avoid":"Claiming rollback is safe solely because application code can be reverted.","iso":true},{"id":"AD04","sec":"inv","group":"Explore","mode":"read","t":"Walk me through what changed before I merge","line":"Explains an entire branch or pull request in plain English, flags edits outside your original request, and gives you a short manual test checklist you can click through yourself.","p":"Inspect the current branch diff against the default branch (or the pull request I name) and explain it for a product owner who does not read code. Group the changes by what a user or operator will experience, call out any file touched outside the stated goal, flag risky areas (data writes, permissions, billing, migrations, config changes, deleted checks), and write a five-minute manual click-test checklist I can run myself to verify the change works and did not break nearby flows.","ev":"A plain-English summary of user-visible and behind-the-scenes changes, a list of any out-of-scope edits with file paths, the top risks with file:line, and a numbered checklist of exact screens and actions for me to test.","skip":"A single-line wording fix or a branch with no changes against the de
