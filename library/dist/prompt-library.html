hing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:audit","sec":"keen","group":"Find out what is wrong","t":"/keen audit","cmd":"/keen audit","use":"They want measurements, not opinions: can everyone read it, press it and use it","kind":"Report","line":"Measures a screen against published standards and reports what passes, what fails and who each failure stops. Measurements and yes-or-no checks only. For an opinion on whether the design works, the job is critique.","full":"You are doing one design job on this project's interface: audit. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# audit\n\nMeasures a screen against published standards and reports what passes, what fails and who each failure stops. Measurements and yes-or-no checks only. For an opinion on whether the design works, the job is `critique`.\n\nReport only. Changes nothing. Asks nothing.\n\n## The idea\n\nA critique is a judgment and two good designers can disagree with it. An audit is a measurement: the text either stands out enough from its background or it does not. The value of this job is that every line in the result is something the person could check again tomorrow and get the same answer. So nothing goes in the result that was not measured or checked by a stated method, and anything you could not check is listed as not measured, never as a pass.\n\nAn audit that passes does not mean the screen works. A page can meet every standard and still confuse people; `critique` judges that. Say so in the report when everything passes.\n\n## Steps\n\n1. **Open the screen** at 390 wide as a touch device and at 1440 wide, in the state a real person usually sees.\n2. **Run the measuring script** at each width, and once more at 320 wide for sideways scrolling, before any full-page capture. Then capture. `node \u003cskill-dir>/scripts/measure.mjs` prints a script; run that inside the page with the tool's way of running JavaScript in a page. It returns counts and the first 25 examples of each failure, with where each one sits on the page. It reads the page and changes nothing.\n3. **Do the checks the script cannot do**, marked \"by hand\" in the table below. Write a short script for the repetitive ones, such as tabbing through every control. For each, say in the report how you checked it. Also look at every piece of text the script lists under `overPictureNotMeasured`.\n4. **Measure speed** if the tool can: load the page fresh, press the screen's main control once, and read the three numbers in the speed table. Speed only counts on a built, production copy of the product. On a development copy the numbers run slow: give them as a rough reading, do not call them a pass or a fail, and say so. If you cannot measure, say so under \"Not checked\". Do not estimate.\n5. **Rank** by who is stopped, using the order below.\n6. **Report** on the Keen page, with the worst failures pinned on the screenshot. The script gives each failure's position in pixels; a pin wants a percentage of the image.\n\n## What is measured\n\nAccessibility criteria are from the Web Content Accessibility Guidelines 2.2, level AA unless marked.\n\n| Check | Passes when | How | Standard |\n|---|---|---|---|\n| Text stands out from its background | 4.5 to 1, or 3 to 1 for text of 24px and up (18.66px and up if bold) | Script: `text.lowContrast` | 1.4.3 |\n| Text over a photo, video or drawing | 4.5 to 1 at its worst point, meaning the lightest or darkest colour that fills a real part of the text box, not a single speck | Script lists these under `text.overPictureNotMeasured`. Capture the area with the words hidden and compare the text colour with the lightest and darkest parts behind it, or say you could not | 1.4.3 |\n| Controls are big enough to hit | 24 by 24 CSS pixels, or smaller with clear space around it. A link inside a sentence is exempt | Script: `controls.under24`, which already applies both exceptions | 2.5.8 |\n| Every control has a name | A screen reader has words to say for each button, link and field | Script: `controls.unnamed`. A placeholder is not a name | 4.1.2, 3.3.2 |\n| Pictures have a text alternative | Each picture that carries meaning has one; decoration has an empty one | Script: `picturesWithoutText` | 1.1.1 |\n| Headings form an outline | One main heading, no skipped levels | Script: `headings` | 1.3.1 |\n| No sideways scrolling | Nothing wider than the screen at 320 wide | Script: `sidewaysScroll`, from the 320 run | 1.4.10 |\n| Zoom is allowed | The page does not block pinch zoom | Script: `zoomBlocked` | 1.4.4 |\n| The page says what language it is in | So a screen reader pronounces it correctly | Script: `languageSet` | 3.1.1 |\n| Usable with a keyboard | Tab reaches every control in an order that follows the page, and the screen's main job can be finished | By hand: tab through and do the job | 2.1.1, 2.4.3 |\n| You can see where you are | A clearly visible outline on the focused control, never hidden behind a fixed header or bar | By hand, while tabbing | 2.4.7, 2.4.11 |\n| Meaning does not rest on colour alone | Errors, required fields and status have an icon, text or shape as well | By hand: look at each coloured signal | 1.4.1 |\n| Text can grow | At 200 percent browser zoom everything is readable and nothing is cut off | By hand: zoom and capture. If the tool cannot zoom, halve both the width and the height of an ordinary laptop window (1280 by 800 becomes 640 by 400), which lays the page out the same way, say that is what you did, and list text enlargement itself as not checked | 1.4.4 |\n| Nothing moves forever without a way to stop it | Anything that starts by itself, runs longer than five seconds and sits beside other content can be paused, stopped or hidden on the page | Script: `noise.endlessMovement` counts looping animations only. Also look by hand for a video that plays by itself, a drawing that animates, and any animation longer than five seconds; then look for the control | 2.2.2 (A) |\n| A mistake or a failure is said in words that stay | When something goes wrong (a refused copy, a field left empty, a request that failed), a message says what happened, stays until the person has dealt with it, and is announced to a screen reader | By hand: cause each failure you can reach and wait ten seconds | 3.3.1, 4.1.3 |\n| Movement can be turned off | With the reduce-motion setting on, nothing slides, zooms or loops | By hand, if the tool can set it | 2.3.3 (AAA) |\n\nSpeed, from Google's Core Web Vitals. \"Good\" is the published threshold.\n\n| Number | What a person feels | Good |\n|---|---|---|\n| Largest Contentful Paint | How long until the main thing on the screen appears | 2.5 seconds or less |\n| Interaction to Next Paint | How long the page takes to react to a tap | 200 milliseconds or less |\n| Cumulative Layout Shift | How much things jump around while loading | 0.1 or less |\n\nPhone comfort. This is guidance from the platform owners, not part of the standard, so it is reported separately and never as a failed check.\n\n| Check | Guidance | How |\n|---|---|---|\n| Controls fit a fingertip | 44 by 44 points (Apple) or 48 by 48 (Material), or the project's own minimum if DESIGN.md gives one | Script: `controls.under44`, from the touch run at 390 only. Ignore it at desktop widths |\n\nSay which controls fall short, not only how many: the main action being too small matters; footer links a few points short hardly does.\n\nConsistency. These are counts, not failures. Compare each with DESIGN.md first: a count that matches the written system is fine however high it is. Only a count the project's own notes do not explain suggests anything. Then check the values themselves, not only how many there are: each corner shape, font family and text style the script lists, against the ones DESIGN.md names for that kind of element. A button with square corners where the file says pills is a mismatch even when the count looks right.\n\n| Count | From the script | Usually means |\n|---|---|---|\n| Different text sizes | `variety.textSizes` | More than six on one screen: sizes are being chosen by eye |\n| Font families | `variety.fontFamilies` | More than two: something was pasted in from elsewhere |\n| Text colours and background colours | `variety.textColours`, `variety.backgroundColours` (the same colour at different strengths counts once) | High numbers: no shared palette |\n| Corner shapes | `variety.cornerShapes` | More than three: no shared set of shapes |\n| Smallest text | `variety.smallestText` | Under 12px is hard to read for many people |\n\n## Ranking\n\n1. **Stops someone completely**: a control with no name, a job that cannot be finished by keyboard, zoom blocked, focus you cannot see.\n2. **Makes it hard for many**: low contrast on text people must read, targets under 24, sideways scrolling, text that will not grow, and a main action smaller than a fingertip on a phone.\n3. **Slows everyone**: any speed number outside \"good\".\n4. **Untidy**: unexplained consistency counts, skipped headings, minor controls short of the fingertip guidance.\n\nWithin a level, the failure that appears most often comes first.\n\n## What to report\n\n- **The verdict in one sentence that leads with who is stopped**, then the count. \"Keyboard and screen-reader users cannot finish a booking: 3 of the 16 accessibility checks fail, 12 pass and 1 could not be measured.\" Count the 16 accessibility rows only. A row that was not measured is neither a pass nor a fail. When nobody is stopped, say that first.\n- **A table of every check**: pass, fail with the count (\"8 of 95 pieces of text\"), or not measured with the reason. On the Keen page it goes under `details`; the failures are the `problems`.\n- **The failures, ranked**, each with what a person experiences, one named example from the screen, and the standard it comes from.\n- **Next steps**, each failure group matched to the job that fixes it: contrast to `/keen colour`, small text and too many sizes to `/keen type`, small targets and sideways scrolling to `/keen adapt`, missing names, keyboard and zoom to `/keen harden`, the consistency counts to `/keen polish`. A speed failure on a production copy goes to `/keen optimize`.\n\nDo not turn the result into a score out of 100. A score hides which people are stopped.\n\n## Report\n\nFollow the report shape in SKILL.md. \"What happened\" is the verdict. Teach each term the first time it appears: most people have never heard \"contrast ratio\" or \"Layout Shift\". Under Details, a few lines summarising the script's output for each width, with the numbers that matter. Keep the full output in a temporary folder outside the project and say it is there if they want it. Under \"Not checked\", every row you could not measure, and every state of the screen you did not open.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` f ement with everything else stepped back.\n- **Who it speaks to.** A first-time visitor or someone who uses it every day.\n\n## Rules\n\n- **Different in kind.** If a stranger could not tell two versions apart at thumbnail size, they are one version.\n- **Real, not mocked.** Each version runs in the real product with real content, so what the person picks is what they get.\n- **Every version is one you would ship.** No straw options built to make the favourite look good.\n- **Every version passes the basics.** Readable text, controls big enough to press, nothing scrolling sideways. Measure with `node \u003cskill-dir>/scripts/measure.mjs`, running what it prints inside the page.\n- **Nothing a person can do is missing** from any version.\n- **Every version obeys DESIGN.md and the notes in the code.** If the most interesting direction would break one, build it anyway only as the third version, and say on its step which rule it breaks, so the person chooses it knowingly.\n- **Leave no trace.** Nothing from the versions not chosen stays in the code.\n\n## Report\n\nFollow the report shape in SKILL.md. Before the pick, \"What happened\" says three versions were built and put back, and \"What you need to do\" is to pick one. After the pick, a new page shows before and after and says what changed in plain words. Under Details, the files changed and the patch files removed. Under \"Not checked\", states and widths of the chosen version you did not capture.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond b ), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:distill","sec":"keen","group":"Change what is on the screen","t":"/keen distill","cmd":"/keen distill","use":"The screen is crowded, busy or hard to scan","kind":"Edits","line":"Makes a crowded screen simple by taking things away, so the one thing the screen is for stands out.","full":"You are doing one design job on this project's interface: distill. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# distill\n\nMakes a crowded screen simple by taking things away, so the one thing the screen is for stands out.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nA screen is crowded when things that matter a little are shown as loudly as the thing that matters most. Distilling is deciding what the screen is for and making everything else quieter, later or gone. Making things smaller so they all fit is the opposite of this job.\n\n## Steps\n\n1. **Name the screen's one job** from PRODUCT.md or from the screen itself. Write it in one sentence. If you cannot, stop and suggest `/keen critique`.\n2. **Capture before**, at 390 and 1440 wide.\n3. **List everything on the screen**: every heading, block of text, control, image, badge, divider and box. Take the counts from the measuring script (`onScreen`, and `variety` for text sizes, colours and box styles).\n4. **Sort each item into one of five piles.** When the screen is a list of many like items (a directory, a feed, a table), sort each part of one item, and each thing around the list, not every item: the question is what one row needs to show.\n   - **Keep**: the job cannot be done without it.\n   - **Quiet**: useful, but it should not compete. Less weight, less colour, less contrast, smaller.\n   - **Later**: needed sometimes. Move it behind one click: a \"more\" menu, an expandable row, a second step, a details view.\n   - **Merge**: two things that say or do nearly the same. One survives.\n   - **Cut**: decoration, repetition, explanation of the obvious, borders and boxes that group nothing.\n5. **Ask once, if needed.** Anything in the Cut pile that a person can act on (a button, a link, a setting, a filter) is a capability. List those and ask for a yes before removing them. Everything else, go.\n6. **Make the change.**\n   - One primary action. Other actions drop to plain buttons or links.\n   - Group what remains by what belongs together, using space before lines and lines before boxes.\n   - Bring the counts down: aim for three or four text sizes and one accent colour in the part of the screen you are working on, using the project's own values. Sizes that come from the site's shared header and footer are not yours to change here; report the count and leave them.\n   - Rewrite labels that need a sentence of help into labels that do not. Remove the help.\n7. **Capture after**, same sizes, and build the page with the before and after shots.\n\n## Checks before you report\n\n- The screen's one job is still possible, in the same number of steps or fewer. Do it once.\n- Everything moved to Later is still reachable, and you can say where.\n- Nothing was shrunk below the project's smallest text size or below a 24 by 24 CSS pixel tap target (WCAG 2.2, 2.5.8).\n- Keyboard order still follows the visual order.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", give the counts: items on screen before and after, text sizes before and after. Then three short lists in plain words: what went quiet, what moved and where to find it, what was removed. Under Details, the files. Under \"Not checked\", any state or size you did not capture.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:layout","sec":"keen","group":"Change what is on the screen","t":"/keen layout","cmd":"/keen layout","use":"Things are in the wrong place, or nothing stands out","kind":"Edits","line":"Fixes where things sit on a screen: what comes first, what is grouped with what, and how much room each thing gets. Everything stays; its position and weight change.","full":"You are doing one design job on this project's interface: layout. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# layout\n\nFixes where things sit on a screen: what comes first, what is grouped with what, and how much room each thing gets. Everything stays; its position and weight change.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nPeople do not read a screen. They look for the biggest thing, then for what sits near it. Layout is how a screen tells them, without words, what matters most and what belongs together. Two rules carry most of it. Things that are close are read as related, so the space between groups must be clearly larger than the space within them. And size, weight and position are a ranking, so the thing the screen is for must win that ranking outright.\n\nIf the screen has too much on it, layout will not save it. Stop and suggest `/keen distill` first.\n\n## Steps\n\n1. **Name the screen's one job** from PRODUCT.md or the screen. Then rank what is on it: the one thing that matters most, the things that support it, and everything else.\n2. **Capture before**, at 390 and 1440 wide. Look at each capture small (save a copy about 300 pixels wide, or view it zoomed far out) and write down what stands out when you cannot read the words. That is the screen's ranking today.\n3. **Find the project's spacing values**: DESIGN.md, then the theme or token file, then the values used most on this screen. If there is no set, use steps of 4 (4, 8, 12, 16, 24, 32, 48, 64) and say so.\n4. **Work through the six passes** below.\n5. **Capture after**, same sizes, and check the thumbnail again: the thing that matters most should now be what stands out.\n6. **Report** on the Keen page, with the before and after shots.\n\n## The six passes\n\nOn a screen that is a list of equal things (a directory, a gallery, search results), no one item should win. The \"thing that matters most\" is the way in: the search box, the filter, or the first row. Passes 1 and 3 apply to that, and pass 6 does most of the work. Check that no row is left with one stray item at any width.\n\n1. **Order.** Arrange things in the order a person needs them, top to bottom, and in the reading direction of the language. The screen's main thing and its main action appear without scrolling at 390 wide. Whatever is asked for first sits first. On a phone the main action sits where a thumb reaches, in the lower half or fixed at the bottom.\n2. **Grouping.** Things that belong together sit together, and the gap between groups is at least twice the gap inside them. A label sits closer to its own field than to the one above. Group with space first. Add a line only when space is not enough, and a box only when a line is not enough. Remove boxes inside boxes.\n3. **One focal point.** One element per screen is largest or heaviest, and it is the thing the screen is for. Lower everything that competes with it: reduce its size, weight or contrast before raising the winner. Only one button looks like the main button.\n4. **Alignment.** Pick the fewest vertical lines the content can hang from and put every edge on one of them. Left-align text that is read; centre only short, standalone things. Numbers in a column align on the right so they can be compared.\n5. **Room.** Give the most important thing the most space around it. Text that is read runs 45 to 75 characters per line; cap the width when the screen is wider than that. Content does not stretch to fill a wide screen just because the room is there. Every gap comes from the spacing set.\n6. **Scanning.** A list or table lets the eye run down one edge: the thing people look for (a name, a date, an amount) is first in each row and in the same place every time. Repeated items share one structure.\n\n## Checks before you report\n\n- Nothing was removed and nothing was restyled beyond size and weight. Colours and fonts are for `/keen colour` and `/keen type`.\n- The order a keyboard or screen reader moves through the page matches the new visual order (WCAG 2.2, 1.3.2 and 2.4.3). If you moved something on screen, move it in the code. Do not reorder with styling alone.\n- No sideways scrolling at 320 wide (WCAG 2.2, 1.4.10).\n- Every control is still at least 24 by 24 CSS pixels (WCAG 2.2, 2.5.8).\n- The screen's one job takes the same number of steps or fewer. Do it once.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say what stood out before and what stands out now, then what moved, in words a person can check against the screenshots (\"the total is now above the list, not below it\"). Under Details, the files and the spacing values used. Under \"Not checked\", any width or state you did not capture.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the projec ou could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:words","sec":"keen","group":"Change what is on the screen","t":"/keen words","cmd":"/keen words","use":"Labels, buttons or messages are unclear","kind":"Edits text only","line":"Rewrites the words on a screen so a person knows what each thing is, what will happen when they press it, and what to do when something goes wrong.","full":"You are doing one design job on this project's interface: words. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# words\n\nRewrites the words on a screen so a person knows what each thing is, what will happen when they press it, and what to do when something goes wrong.\n\nAggressive. Edits the text on the screen and nothing else. Does the whole screen in one go.\n\n## The idea\n\nThe words on a screen are part of how it works. A button that says \"Submit\" makes a person stop and wonder what is being submitted. A button that says \"Send invoice\" does not. This job covers the words inside the product: headings, labels, buttons, hints, messages, empty screens and confirmations. Sales and marketing pages are a different kind of writing, with a different job; this is not the job for those.\n\n## Steps\n\n1. **Capture before**, at 390 wide, including every message you can reach: an error on each field, the empty state, a confirmation, a success message. Reach them by using the screen: submit it empty, press each button, search for something that is not there. Never press a control that sends, buys, deletes, publishes or changes saved data to see its message; read those in the code. A message you cannot bring up this way, read in the code and list under \"Not checked\".\n2. **Collect every piece of text** on the screen into a list: where it is, what it says, and what it is for. Include text a screen reader hears that is not shown, such as the name of an icon button.\n3. **Find the project's own words.** Read PRODUCT.md, any glossary, and the neighbouring screens. A thing has one name across the whole product. If this screen calls it a \"workspace\" and the next calls it a \"project\", pick the one the product uses most and list the other places under \"What you need to do\". Do not change other screens.\n4. **Rewrite**, using the table and rules below.\n5. **Read every line aloud.** Anything you would not say to a person standing next to you gets rewritten.\n6. **Check the fit.** Longer words can break a layout. Look at 390 wide and fix any text that now wraps badly or is cut off, by shortening the words, not by shrinking the text.\n7. **Capture after** and report on the Keen page with the before and after shots.\n\n## What each kind of text must do\n\n| Text | It must | Before | After |\n|---|---|---|---|\n| Button | Name what happens: a verb and the thing | Submit | Send invoice |\n| Destructive button | Name what is lost | OK | Delete 3 files |\n| Link | Make sense read alone, out of its sentence (WCAG 2.2, 2.4.4) | Click here | See pricing |\n| Field label | Say what to enter, in the user's word for it. Always visible, never only a placeholder (WCAG 2.2, 3.3.2) | Identifier | Order number |\n| Hint | Give the rule before the mistake, beside the field | (none) | At least 12 characters |\n| Error | Say what happened, why if it helps, and what to do now. Beside the field. No blame, no codes (WCAG 2.2, 3.3.1 and 3.3.3) | Invalid input | That card number is one digit short. Check it and try again |\n| Empty screen | Say what belongs here and offer the first step | No data | No invoices yet. Create your first one |\n| Confirmation | Ask the real question and label each button with its result | Are you sure? Yes / No | Delete this project? Its 12 files go too. Delete project / Keep it |\n| Success | Say what happened and what comes next, briefly | Success! | Invoice sent. Payment is due in 14 days |\n| Loading | Say what is happening if it takes more than a moment | Loading... | Checking your bank details |\n| Page heading | Name the screen in the words used to get there | Dashboard overview page | Invoices |\n\n## Rules\n\n- **Their words, not the system's.** Use what a customer would call it. Internal names, database terms and abbreviations nobody outside the team uses come out.\n- **Lead with the point.** Put the word that matters first, so someone scanning down the left edge finds it. \"Password must be 12 characters\" before \"In order to keep your account secure\".\n- **Short, then shorter.** Cut \"please\", \"simply\", \"just\", \"successfully\", \"in order to\" and any sentence that restates the heading. Do not cut the one detail that tells them what to do.\n- **One name per thing, one verb per action.** Not \"delete\" here, \"remove\" there and \"trash\" on the icon.\n- **Say what will happen, not how the system works.** \"We'll email you a receipt\", not \"A receipt will be generated\".\n- **Sentence case.** Capitalise the first word and proper names. Not Every Word.\n- **No blame, no alarm, no jokes in errors.** \"That password doesn't match\", not \"You entered the wrong password\". An exclamation mark almost never helps.\n- **Numbers and dates the way the reader writes them.** \"3 files\", \"12 March\", \"in 2 days\". Never a bare timestamp, and never a count with \"(s)\" on the end.\n- **Calm and plain is the voice** unless PRODUCT.md describes another one. If it does, follow it, and still obey every rule above.\n\n## Limits\n\n- Change text only. Do not move, resize, restyle or remove anything.\n- Find where each piece of text is used before changing it. Text shared with other screens changes only if the new wording is right in every place it appears; say which other places it now shows in.\n- Do not change a legal notice, a price, a name of a plan or anything a contract depends on. List what you would change and why.\n- Do not change the meaning. If you cannot tell what a message is for from the code, leave it and list it.\n- If the product is translated, change only the source language, keep every placeholder and plural form intact, and say that the other languages now need the same pass.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say how many pieces of text changed out of how many, and give the changes a person would notice most, before and after, in the page's `changes` (five at most). Under \"What you need to do\", list anything you left for them: legal text, other screens using a different name for the same thing, messages you could not reach. Under Details, every change as before and after, with its file. Under \"Not checked\", messages you rewrote without seeing them on screen.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:onboard","sec":"keen","group":"Change what is on the screen","t":"/keen onboard","cmd":"/keen onboard","use":"New people get lost or give up before the product is useful to them","kind":"Edits","line":"Designs the first few minutes of a product: what a new person sees before they have any data, and how quickly they get to the first thing worth having.","full":"You are doing one design job on this project's interface: onboard. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# onboard\n\nDesigns the first few minutes of a product: what a new person sees before they have any data, and how quickly they get to the first thing worth having.\n\nInteractive at the start, then aggressive. Edits files.\n\n## The idea\n\nA new person arrives with a reason and no patience. The product they see is the empty one: no projects, no history, no numbers. Most products are designed full and shipped empty. This job designs the empty product on purpose, and shortens the path from arriving to the first real result, the moment the person thinks \"this works for me\". Everything that stands between them and that moment is either removed, postponed or made to earn its place.\n\n## Before you start\n\nAsk once, in one message, with your best guess as the default for each:\n\n- What is the first real result for a new person? One thing they can see or hold, such as \"their first invoice sent\" or \"their own data on the chart\".\n- What does the product truly need from them before that can happen?\n\nIf PRODUCT.md already answers both, do not ask. If it answers one, ask the other. If it names who the newcomer is but not their first result on this screen, propose one and say you did.\n\n## When there is nothing to sign up for\n\nA page anyone can open (a library, a catalogue, a docs page) has no account, no fields and no empty state, so counting screens and fields says nothing. The first result is the first useful thing a stranger does with the page, and what stands in the way is what they are assumed to know. Do this instead of steps 1 to 3:\n\n1. Open the page as someone who has never seen this kind of thing. List every word, control and step the page uses without explaining, up to the first useful action.\n2. For each, decide: say it in one line where it is needed, replace it with a plainer word, or leave it because the audience knows it.\n3. Count two things before and after: how many unexplained things stand before the first action, and how far down the screen that action sits at 390 wide.\n\nThen go on from step 4. An explanation must not push the first action down the screen; if it does, shorten it or put it beside the action.\n\n## Steps\n\n1. **Walk it as a new person.** Create a fresh account, or use the project's way of starting empty. Go from the first screen to the first real result. Capture every screen at 390 wide. Count the screens, the fields to fill in, and the decisions to make. Time it.\n2. **Sort every step and field** on that path: needed for the first result, needed later, or never needed. Be strict. A profile photo, a team name, a phone number and a tour are almost never needed for the first result.\n3. **Shorten the path.** Remove what is never needed. Move what is needed later to the moment it is needed. Fill in what the product can work out or sensibly assume, and let the person change it afterwards.\n4. **Design each empty screen** on the path using the table below.\n5. **Mark the first result.** When it happens, say so plainly and offer the one next thing worth doing. No confetti.\n6. **Walk it again**, capture, count and time it, and report on the Keen page with the first and last screen of each walk as the before and after shots.\n\n## Each kind of first-time moment\n\n| Moment | What it should do |\n|---|---|\n| Sign-up | Ask for the least that will work. Every field you remove brings more people through. Say why you need anything unusual |\n| An empty list or dashboard | Say what will appear here, show what it looks like when full if that helps, and give one button for the first step. Never a blank area or the word \"None\" |\n| A choice the person cannot judge yet | Pick a sensible default and let them change it later. Do not ask a new person to configure something they have not used |\n| A permission (notifications, location, contacts) | Ask at the moment the person does something that needs it, and say what they get. Never on the first screen (Apple's Human Interface Guidelines) |\n| Something to learn | Teach it at the moment it is needed, on the real screen, in one line. A tour before use is skipped and forgotten |\n| Sample content | Offer it if the product is hard to judge empty. Label it as an example and make it easy to clear |\n| Several setup steps | Show how many there are and which are done. Let the person leave and come back without losing anything |\n| The first result | Confirm it in plain words and point to one next step |\n\n## Limits\n\n- Never remove something the law, a payment or security requires. If you are unsure whether a field is one of those, keep it and list it.\n- Removing a field from sign-up is removing a capability from the product's point of view. List every field you plan to remove and get one yes before you start editing.\n- Do not add a tour, a checklist panel or a welcome dialog unless the first walk showed people cannot find the first step without one. One or two lines of explanation on the screen itself, beside the thing they explain, are fine.\n- Everything postponed must still be reachable later. Say where.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", give the three numbers before and after: screens, fields and time to the first result (for a page with nothing to sign up for, the two counts from that section). Under \"What you need to do\", anything postponed that the person must now be asked for somewhere else. Under Details, the files and each field's fate. Under \"Not checked\", sign-up routes you could not walk, such as signing in with another service, and email steps you could not receive.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are sm
