ot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:convert","sec":"keen","group":"Change what is on the screen","t":"/keen convert","cmd":"/keen convert","use":"A landing, pricing or sign-up page is not getting people to act","kind":"Edits","line":"Reworks a landing, pricing or sign-up page so more of the people who arrive understand the offer and take the next step.","full":"You are doing one design job on this project's interface: convert. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# convert\n\nReworks a landing, pricing or sign-up page so more of the people who arrive understand the offer and take the next step.\n\nInteractive at the start, then aggressive. Edits files.\n\n## The idea\n\nA visitor gives a page a few seconds to answer three questions: what is this, is it for me, and what do I do next. A page loses people when the answer to any of them takes work. This job is not about tricks. Countdown timers, fake scarcity and buttons that shame the visitor win a click and lose the customer, and Keen does not add them. It is about removing every reason a person who would have benefited leaves without acting.\n\nNo one can know in advance that a change will lift sign-ups. This job makes the page clearer and says honestly that only a measurement afterwards shows whether it worked.\n\n## Before you start\n\nAsk once, with your best guess as the default for each. Ask only the ones PRODUCT.md leaves open:\n\n- What is the one thing a visitor should do on this page?\n- Who is arriving, and from where: a search, an advert, a recommendation?\n- What proof do you really have: customer numbers, named customers, reviews, results? Only real ones.\n\n## Steps\n\n1. **Capture before**, at 390 and 1440 wide, the whole page. Most visitors are on a phone; judge that one first.\n2. **Take the five-second test.** Look at the first screen for five seconds, look away, and write what the product is, who it is for and what to do next. Whatever you could not write is the first fault.\n3. **Work through the page** with the table below. The table describes a long page. When the page is short on purpose (the project's notes say so, or it is plainly one screen by design), judge only the parts it has; do not add a section the design left out. If a missing part is costing visitors, say so as a finding and let the person decide.\n4. **Measure the basics**: run `node \u003cskill-dir>/scripts/measure.mjs` and run what it prints inside the page, for text that is hard to read and buttons too small to press. A slow page loses visitors before any of this matters; if it is slow, offer `/keen optimize` as the first next step.\n5. **Capture after** and report on the Keen page, with the before and after shots.\n\n## The page, top to bottom\n\n| Part | It works when |\n|---|---|\n| Headline | It says what the visitor gets, in their words, and would not fit a competitor's page unchanged. Not a slogan |\n| Line under the headline | It says who it is for and how it works, in one or two sentences |\n| Main button | There is one action, repeated down the page with the same words each time. The label says what happens (\"Start free trial\"), and what it costs or does not cost is beside it |\n| First screen | On a phone, the headline, the line under it and the button are all visible without scrolling |\n| Picture | It shows the real product doing the thing, not an abstract illustration or a stock photo |\n| Proof | It is specific and real: a named customer, a number with its source, a quoted review. It sits near the button |\n| Benefits | Each is something the visitor gets, followed by the feature that delivers it. Three to five, not twelve |\n| Doubts | The page answers the questions that stop people: price, effort to set up, what happens to their data, how to leave |\n| Form | It asks only for what is needed to start. Every extra field loses people. Errors appear beside the field in plain words |\n| Other links | Nothing on the page competes with the main action. Menus and footers are quiet |\n| End of the page | The offer and the button again, for the person who read everything |\n\n## Rules\n\n- **Nothing invented.** No made-up testimonials, customer counts, logos, ratings or \"as seen in\". If there is no proof yet, the page says what is true and leaves the space out. List what proof would help most.\n- **No pressure tricks.** No false urgency, no pre-ticked boxes, no hidden costs, no guilt in the decline link, no making it hard to say no.\n- **Claims stay as they are unless the person confirms them.** Rewrite for clarity; do not strengthen a promise.\n- **Clear before clever.** If a line needs to be read twice, rewrite it.\n- **The price, if there is one, is easy to find.**\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say what a visitor now learns in the first five seconds that they did not before, and what was cut. In \"What it means\", be plain that this should help and has not been shown to: name the one number to watch (visits that end in the main action) and suggest comparing two weeks before with two weeks after. Under \"What you need to do\", list the proof the page still lacks. Under Details, each change before and after. Under \"Not checked\", how the page performs with real visitors.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product ogether, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:type","sec":"keen","group":"Change how it looks","t":"/keen type","cmd":"/keen type","use":"Text is hard to read, or there are too many sizes","kind":"Edits","line":"Makes the text on a screen easy to read and gives it a clear order: a small set of sizes, each with one purpose.","full":"You are doing one design job on this project's interface: type. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# type\n\nMakes the text on a screen easy to read and gives it a clear order: a small set of sizes, each with one purpose.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nMost of a screen is text, so most of how a screen looks is decided here. Two things go wrong. Text is hard to read: too small, too light, lines too long or too tight. Or text has no order: nine sizes chosen by eye, so nothing tells the reader which line is the heading. The fix for both is a short ladder of sizes where every rung has one purpose and the rungs are far enough apart to tell at a glance.\n\n## Steps\n\n1. **Capture before**, at 390 and 1440 wide.\n2. **Count what is there.** Run `node \u003cskill-dir>/scripts/measure.mjs` and run what it prints inside the page: `variety.textSizes` and `variety.fontFamilies` give every size and family on the screen and how often each is used. Note the weights and line heights in use as well.\n3. **Find the project's own ladder**: DESIGN.md, then the theme or token file. If there is one, this job moves stray text onto it and stops there. If there is none, build one in step 4 and say so.\n4. **Set the ladder.** Give each purpose on this screen one style, and no more purposes than the screen has. Most screens need four or five: a page heading, a section heading, body text, a label, a caption.\n   - Body text is 16px or larger on the web. On a phone, text in a field is never under 16px, because Safari on iPhone zooms the page when a smaller field is tapped.\n   - Each rung is visibly different from the next: at least a fifth larger, or the same size with a clear change of weight. Two sizes one pixel apart read as a mistake.\n   - Two weights are enough, a regular and a bold. Add a third only if the font was drawn with one.\n   - Nothing under 12px.\n5. **Fix the reading.** Apply the table below to every style.\n6. **Fix the fonts**, if they are the problem. One family is enough for most products; two at most, with clear roles (one for headings, one for reading). Keep the project's fonts unless the request was to change them. Check that each font really loads, and that the page does not jump when it does: the stand-in font shown while loading should be close in width to the real one.\n7. **Capture after** and report on the Keen page, with the before and after shots.\n\n## Reading\n\n| What | Aim for | Why |\n|---|---|---|\n| Line length | 45 to 75 characters for text that is read; never over 80 | The eye loses its place on the way back from a long line (WCAG 2.2, 1.4.8) |\n| Line height | About 1.5 for body text, 1.1 to 1.3 for large headings | Long lines need more room; big text needs less |\n| Space after a paragraph | Clearly more than the line height | So a new thought looks like one |\n| Alignment | Left for anything longer than three lines. No justified text | Even word spacing is easier to read than even edges |\n| Capitals | Short labels only, with a little extra space between letters | Sentences in capitals are slow to read |\n| Numbers in columns | Figures of equal width, right-aligned | So amounts can be compared down the column |\n| Heading and what follows | The heading sits closer to its own text than to the text above it | So it reads as a title, not a divider |\n| Text contrast | 4.5 to 1, or 3 to 1 at 24px and up | Light grey text is the commonest way a screen becomes unreadable (WCAG 2.2, 1.4.3) |\n| Size units | Sizes that follow the reader's own text-size setting | So text grows when someone asks their browser or phone for larger text (WCAG 2.2, 1.4.4) |\n| Punctuation | Real quotation marks and apostrophes, and a real multiplication sign and dashes where the content uses them | Straight marks from the keyboard look unfinished at large sizes |\n\n## Checks before you report\n\n- Each purpose uses one style everywhere on the screen. Count the sizes again (`variety.textStyles` lists each style with an example of where it is used). The number should have dropped, unless the screen was already on its ladder; then say so and report only the strays you fixed.\n- At 200 percent zoom nothing is cut off and nothing overlaps (WCAG 2.2, 1.4.4).\n- With line height 1.5, paragraph spacing twice the text size and letter spacing 0.12 of it, no text is clipped (WCAG 2.2, 1.4.12). This catches boxes with a fixed height.\n- No heading is left with a single word alone on its last line where a small width change fixes it.\n- Wording, colours and positions are unchanged. Those are `/keen words`, `/keen colour` and `/keen layout`.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", give the count of text sizes before and after and name the ladder in plain words (\"five sizes: page title, section title, reading text, labels, small print\"). Under Details, each style with its size, weight and line height, and the files changed. Under \"Not checked\", zoom or text-size settings you could not try, and whether you saw the real fonts load.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out ns: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:colour","sec":"keen","group":"Change how it looks","t":"/keen colour","cmd":"/keen colour","use":"Colours clash, mean nothing, or text is hard to see. color works too","kind":"Edits","line":"Gives a screen a small set of colours where each one has a purpose, and makes sure everything can be read. Also answers to /keen color.","full":"You are doing one design job on this project's interface: colour. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# colour\n\nGives a screen a small set of colours where each one has a purpose, and makes sure everything can be read. Also answers to `/keen color`.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nColour on a screen does three jobs: it shows what can be pressed, it shows what state something is in, and it sets the mood. It fails when one colour is asked to do two of those, so that the same blue means \"link\", \"selected\" and \"information\", or when there are so many colours that none of them means anything. The fix is fewer colours, each with one purpose, used the same way everywhere. Most of a good screen is not coloured at all.\n\nThis job does not add colour to a palette that is small on purpose. If DESIGN.md or the code's notes set a limit (\"four colours\", \"no accent but the dots\"), the limit stands; the job is then to find what strays from it and what cannot be read. If the person asked for more colour, say what the rule is and ask whether it is changing before adding any.\n\n## Steps\n\n1. **Capture before**, at 390 and 1440 wide, in light and dark if the product has both.\n2. **Count and measure.** Run `node \u003cskill-dir>/scripts/measure.mjs` and run what it prints inside the page. `variety.textColours` and `variety.backgroundColours` say how many colours are in use. `text.lowContrast` lists every piece of text that fails, with its measured ratio.\n3. **Find the project's palette**: DESIGN.md, then the theme or token file. If there is one, this job moves stray colours onto it, fixes the pairs that fail, and stops. If there is none, build the set in step 4 and say so. If the person wants to choose a new palette from scratch and `/palette-builder` is installed, offer it as the next step and do not invent a brand colour here.\n4. **Give each colour one purpose.**\n\n   | Purpose | How many | Used for |\n   |---|---|---|\n   | Neutrals | One family of greys, eight to ten steps from near white to near black | Backgrounds, text, borders, dividers. Most of the screen |\n   | Accent | One | Things that can be pressed, and the one thing on the screen that matters most |\n   | Status | Up to four: success, warning, danger, information | Only to report state. Never as decoration |\n\n   Anything on the screen that fits none of these loses its colour.\n5. **Build the steps evenly.** When you create or fill in a scale, step the lightness evenly in a colour space made to match what the eye sees, such as OKLCH, which CSS supports. Even steps in ordinary hex values look uneven. Tint the greys slightly toward the accent so they sit together, and keep pure black and pure white for the rare case that needs them.\n6. **Fix every pair that fails**, using the table below. Change the lightness of the weaker colour and keep its hue, so the palette still looks like itself.\n7. **Do the same for dark mode** if the product has one. Dark mode is its own set of pairs, not the light one reversed: surfaces get lighter as they come forward, and strong colours are toned down so they do not glare.\n8. **Capture after**, run the measuring script again, and report on the Keen page with the before and after shots.\n\n## What must be readable\n\nContrast is how much one colour stands out from the colour behind it, as a ratio from 1 to 1 (invisible) to 21 to 1 (black on white).\n\n| Pair | At least | Standard |\n|---|---|---|\n| Text on its background | 4.5 to 1 | WCAG 2.2, 1.4.3 |\n| Text of 24px and up, or 18.66px and up in bold | 3 to 1 | WCAG 2.2, 1.4.3 |\n| The edge of a field, a checkbox, a switch, and any icon that carries meaning | 3 to 1 against what is beside it | WCAG 2.2, 1.4.11 |\n| The outline on the focused control | 3 to 1 against what is beside it | WCAG 2.2, 1.4.11 and 2.4.7 |\n| Text on the accent colour, such as a button label | 4.5 to 1 | WCAG 2.2, 1.4.3 |\n| Placeholder and hint text | 4.5 to 1 | WCAG 2.2, 1.4.3 |\n| Disabled controls | No minimum, but they must still look like they are there | WCAG 2.2, 1.4.3 exception |\n\n## Rules\n\n- **Never colour alone.** About one man in twelve cannot tell red from green. An error has an icon and words as well as red. A required field has a mark. A line on a chart has a label or a pattern. A link inside text is underlined (WCAG 2.2, 1.4.1).\n- **One accent, used sparingly.** If everything pressable is the accent and nothing else is, people learn what can be pressed. One filled accent button per screen.\n- **Status colours mean status.** Red is for danger and failure only. If the brand colour is red, the danger colour needs to look different from it, or carry an icon every time.\n- **Use the name, not the value.** Each colour is defined once, named for its purpose (\"text\", \"border\", \"danger\"), and used by that name. A raw colour value in a screen's own code is a stray.\n- **States come from the set.** Hover, pressed and selected are the next step along the same scale, not a new colour.\n\n## Checks before you report\n\n- The measuring script shows no text below its minimum, in light and in dark. Text over a photo, video or drawing is not measured by the script: it lists each one, and you look at them.\n- The count of colours went down, or stayed the same with every one now from the set.\n- Seen in greyscale, the screen still makes sense: the main action still stands out and every status can still be told apart.\n- Positions, sizes and wording are unchanged.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", give the two numbers a person can hold on to: pieces of text that were hard to read before and after, and colours in use before and after. Leave out a number that did not move. Compare counts at the same width; a part hidden at one width takes its colours with it. Explain contrast once, the first time it appears. Under Details, each pair you changed with its ratio before and after, and the files. Under \"Not checked\", dark mode if you could not see it, text over pictures, and any state you did not open.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:bolder","sec":"keen","group":"Change how it looks","t":"/keen bolder","cmd":"/keen bolder","use":"It looks safe, flat or like every other product","kind":"Edits","line":"Gives a screen that looks safe, flat or like every other product a clear point of view, by committing harder to what the screen is for.","full":"You are doing one design job on this project's interface: bolder. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# bolder\n\nGives a screen that looks safe, flat or like every other product a clear point of view, by committing harder to what the screen is for.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nA bland screen is one where every choice was the middle choice: medium sizes, medium weights, medium grey, everything given equal room. Nothing is wrong and nothing is remembered. Bolder does not mean louder everywhere. It means picking the one thing this screen is about and letting it win by a wide margin, then letting everything else step back so the difference shows. Contrast is the tool: big against small, heavy against light, one colour against none, full against empty.\n\nIf the screen is crowded, bolder makes it worse. Stop and suggest `/keen distill` first.\n\n## Steps\n\n1. **Read who the product is for and how it should feel** in PRODUCT.md and DESIGN.md. Bold for a bank and bold for a game are different things. If neither file says how the product should feel, ask one question: \"Three words for how this should feel to someone seeing it for the first time?\" If nobody can answer, choose three from what the product is for and say which you assumed.\n2. **Name the hero.** The one thing on this screen that should be impossible to miss: a number, a headline, a picture, an action. One, appearing once. On a screen that lists equal things, the hero is never every item's name, because five things made huge are five things competing; it is the page's heading, its one-line promise, or the way in. eir own sake: no gradients, glows, shadows or movement added to look impressive. Bold comes from size, weight, colour and space.\n- Nothing is removed, and nothing the person can do becomes harder to find. The main action is at least as easy to reach as before.\n- If the project's DESIGN.md rules out something a move needs, the file wins. Say which move you held back and why. When colour is ruled out, moves 1, 2 and 4 carry the screen, and the one distinct thing comes from scale or arrangement.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", name the hero and say in plain words what now sets it apart (\"the monthly total is three times larger and the only thing in colour\"). Offer `/keen quieter` as a next step in case it went too far, and say so plainly. Under Details, the values before and after. Under \"Not checked\", any state or width you did not capture.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:quieter","sec":"keen","group":"Change how it looks","t":"/keen quieter","cmd":"/keen quieter","use":"It shouts: too much colour, weight, boxes or movement","kind":"Edits","line":"Calms a screen that shouts: too many colours, weights, borders, shadows or things moving. Everything stays on the screen; it stops competing.","full":"You are doing one design job on this project's interface: quieter. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# quieter\n\nCalms a screen that shouts: too many colours, weights, borders, shadows or things moving. Everything stays on the screen; it stops competing.\n\nAggressive. Edits files. Does the whole screen in one go.\n\n## The idea\n\nA loud screen is one where everything was made to stand out, so nothing does. The person feels it as tiring or cheap without knowing why. Quieter turns down everything that is not the point, so the one thing that should be noticed is noticed without effort. It differs from `distill`: distill takes things away, quieter keeps them and lowers their volume. If there is simply too much on the screen, stop and suggest `/keen distill`.\n\n## Steps\n\n1. **Name what should still be noticed** when you are done: the screen's main thing and its main action. Everything else is a candidate for turning down.\n2. **Capture before**, at 390 and 1440 wide.\n3. **Count the noise.** Run `node \u003cskill-dir>/scripts/measure.mjs` and run what it prints inside the page, for the number of colours, text sizes and corner shapes (`variety`) and of filled buttons, bordered boxes, shadows and endless movement (`noise`). Then count by eye what the script does not: filled buttons, bold runs of text, boxes with borders, shadows, badges, icons, anything that moves without being asked. If the counts are already low, the screen is already quiet: say so, fix only the one or two things that still shout, and report it as a small change.\n4. **Turn things down** in the order below. After each, look again; stop when the main thing is the first thing you see.\n5. **Capture after**, count again, and report on the Keen page with the before and after shots.\n\n## What to turn down, in order\n\n1. **Movement.** Anything that loops, pulses, slides in or plays by itself stops, unless it reports something that is happening now. Movement is the loudest thing on any screen.\n2. **Colour.** Keep the accent for the main action and for things that can be pressed. Status colours stay only where they report a state. Everything else becomes a neutral. Soften large areas of strong colour to a tint.\n3. **Filled shapes.** One filled button. The rest become outlines or plain text buttons. Badges and pills that carry no information lose their fill.\n4. **Bold.** Bold is for headings and for the one or two words in a block that someone scanning must catch. Unbold the rest.\n5. **Lines and boxes.** Replace borders with space where space is enough. Lighten the borders that remain. Remove a box that sits inside another box.\n6. **Shadows and effects.** Keep a shadow only where something really floats above the page, such as a menu or a dialog. Remove gradients, glows and blurs that are there for looks.\n7. **Capitals, icons and exclamation marks.** Sentence case in place of capitals. Icons only where they are recognised faster than the word. No exclamation marks.\n\n## Limits\n\n- Quiet is not faint. Text stays at 4.5 to 1 against its background, or 3 to 1 for large text, and the edges of fields and controls at 3 to 1 (WCAG 2.2, 1.4.3 and 1.4.11). Turning text grey until it fails is the common mistake of this job.\n- A control must still look like something you can press, and the focused control must still show a clear outline (WCAG 2.2, 2.4.7).\n- Errors and warnings stay loud. They are meant to interrupt.\n- Nothing is removed or moved, and no wording changes.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", give the counts that moved, before and after (colours, filled buttons, bordered boxes, endless movement) and say what a person now sees first. Offer `/keen bolder` as a next step in case the screen now feels flat. Under Details, the values changed. Under \"Not checked\", any state you did not capture, and movement if you could not watch the page run.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note  this. The Keen page below turns each next step into something they pick and start."},{"id":"K:polish","sec":"keen","group":"Change how it looks","t":"/keen polish","cmd":"/keen polish","use":"The screen is right but looks unfinished","kind":"Edits","line":"The finishing pass on a screen whose structure is already right. It fixes the small inconsistencies that make good work look unfinished.","full":"You are doing one design job on this project's interface: polish. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# polish\n\nThe finishing pass on a screen whose structure is already right. It fixes the small inconsistencies that make good work look unfinished.\n\nAggressive. Edits files. Does not change what is on the screen, what it says or where things sit.\n\n## When to stop instead\n\nPolish cannot rescue a screen that is crowded, confusing or doing two jobs. If that is what you see, stop, say so in two lines and suggest `/keen distill` or `/keen critique`. Polishing it would hide the problem for a week.\n\n## Steps\n\n1. **Capture before**, at 390 and 1440 wide, plus the main button and one link with the pointer over them and with keyboard focus (press Tab until each is reached, then capture). Two controls are enough; the point is to see whether those states exist and match.\n2. **Find the project's values.** DESIGN.md first, then the theme or token file, then the most common values in the code. Polish means moving stray values onto the project's own scale. If there is no scale, take the values used most often on this screen as the scale and say so. Where DESIGN.md and the screen disagree, DESIGN.md wins: a stray moves to the nearest value the file names, not to whichever stray is most common. If the file's value would look wrong here, leave the stray and list it as a question.\n3. **Go through the eight passes** below, fixing as you go. A pass that finds nothing is finished; on a tidy screen most will. Stop when the passes are done, not when the change looks big enough.\n4. **Capture after** and build the page with the before and after shots.\n\n## The eight passes\n\n1. **Alignment.** Every edge lines up with another edge on purpose. Text baselines in a row match. Icons sit centred on their labels. Look for anything off by one to three pixels.\n2. **Spacing.** Every gap comes from the scale. Things that belong together are closer to each other than to anything else. The same kind of gap is the same size everywhere on the screen.\n3. **Type.** Each text size, weight and line height comes from the scale, and each role (heading, body, label, caption) uses one style. Body text lines run roughly 45 to 75 characters. No orphaned single word under a heading where a small width change fixes it.\n4. **Colour.** Every colour is a named project colour. Greys are from one family. Contrast is at least 4.5 to 1 for text and 3 to 1 for large text and the edges of controls (WCAG 2.2, 1.4.3 and 1.4.11). Measure the ones that look close.\n5. **Shape and depth.** One corner radius per kind of thing. Borders one weight and one colour. Shadows from one set, all cast in the same direction. Nested corners look concentric.\n6. **States.** Every control has hover, pressed, keyboard focus and disabled states, and they are consistent with each other. Focus is clearly visible (WCAG 2.2, 2.4.7). Nothing shifts position when a state changes.\n7. **Images and icons.** One icon set at one stroke weight and size. Images have set proportions so the page does not jump while they load, and they are sharp on a high-density display.\n8. **Edges of the screen.** Consistent page margins. Nothing touching the edge of a phone screen or sitting under a notch or home indicator.\n\n## Limits\n\n- No new components, no layout changes, no copy changes. If a pass turns up something that needs one, list it at the end.\n- Do not introduce a value the project does not already have when an existing one is within a step of it.\n- Leave motion alone.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say how many fixes were made and name the two or three a person would notice. Under Details, list fixes grouped by pass, with the value before and after. Under \"Not checked\", any pass you could not verify by looking, such as focus states with no browser.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its  a screen survive real use: real data, slow connections, mistakes and bad luck. Demo data is short, complete and always loads. Real data is none of those.","full":"You are doing one design job on this project's interface: harden. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# harden\n\nMakes a screen survive real use: real data, slow connections, mistakes and bad luck. Demo data is short, complete and always loads. Real data is none of those.\n\nAggressive. Edits files. Tests each case, fixes what breaks, and shows the result.\n\n## Steps\n\n1. **Find what the screen depends on**: every piece of data it shows, every request it makes, every input it accepts.\n2. **Build the worst-case list** from the table below, keeping only the cases that can happen on this screen. Add any that PRODUCT.md lists under what must never happen.\n3. **Try each case** in a browser or simulator, using whatever the project offers: seed data, a mock, a throttled network, a blocked request, edited values. A browser driven from code can hold back, slow down or fail a single request, which is the quickest way to see a loading or failed state. Before the first case, press something on the screen and confirm it reacts; if a case shows no reaction at all, the page may not be running its scripts, and nothing you see is a result. Capture what you see. Where you cannot produce a case, read the code path and mark it as read, not seen.\n4. **Fix what broke.** Use the project's existing components for empty, loading and error states before writing new ones.\n5. **Try each case again** and capture the result.\n6. **Report** on the Keen page: the worst failing case before and after as the two shots, the cases you fixed in `changes` (what a person saw, and what they see now), the cases left in `also`, and the full table under `details`.\n\n## Worst cases\n\n| Case | Try | It holds when |\n|---|---|---|\n hem.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:adapt","sec":"keen","group":"Make it hold up","t":"/keen adapt","cmd":"/keen adapt","use":"A website works on one screen size and not on others","kind":"Edits","line":"Makes a screen work properly at other sizes and with other ways of pointing: a phone held in one hand, a tablet, a wide monitor, a finger where a mouse was assumed.","full":"You are doing one design job on this project's interface: adapt. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# adapt\n\nMakes a screen work properly at other sizes and with other ways of pointing: a phone held in one hand, a tablet, a wide monitor, a finger where a mouse was assumed.\n\nAggressive. Edits files. Shows every size before and after.\n\n## The idea\n\nAdapting is deciding what matters most at each size and giving it the room. Shrinking the desktop layout until it fits a phone is not adapting, and neither is stretching a phone layout across a monitor.\n\n## Steps\n\n1. **Find out what the product supports.** PRODUCT.md, the project's breakpoints, and whether it is a website, an installed app or both. If they named a size (\"fix it on mobile\"), that size is the target and the others are checked for damage.\n2. **Measure before** at 360, 390, 768, 1024, 1440 and 1920 wide, and at 844 by 390 (a phone on its side). Measure the phone sizes, including the sideways one, as a touch device. Take screenshots only at the target size and at any size where a check fails; a size that passes needs no picture. On a phone size, also capture with the on-screen keyboard open if the screen has a form.\n3. **Walk each size** through the checks below and note every failure.\n4. **Fix**, starting from the smallest size. Use the project's breakpoints and layout tools. Add a breakpoint only where the content breaks, not at a device's width.\n5. **Measure after** at every size, capture the sizes you pictured before, and build the page with the before and after shots of the size that changed most. Name the other sizes you fixed in `changes`.\n\nThe fingertip count (`controls.under44`) matters only where `touch` is true. On a desktop size with a mouse, ignore it. Small controls in the site's shared header and footer are outside this screen: list them, with a count, as a next step for whoever owns those parts.\n\n## Checks at every size\n\n- **Nothing scrolls sideways** and nothing is cut off. Content reflows down to 320 CSS pixels wide (WCAG 2.2, 1.4.10). A wide table or chart may scroll inside its own box, with a visible cue that it does.\n- **The screen's one job is visible without hunting.** On a small screen the main content and main action come first. Secondary panels move below or behind a tap.\n- **Lines of text stay readable**: roughly 45 to 75 characters on large screens, and never so wide they span a monitor.\n- **Nothing depends on hover.** Anything revealed by hovering has a tap or focus equivalent (WCAG 2.2, 1.4.13).\n\n## Checks for small screens and touch\n\n- **Tap targets** are at least 44 by 44 points (Apple's Human Interface Guidelines) or 48 by 48 density-independent pixels (Material Design), with space between neighbours. The floor is 24 by 24 CSS pixels (WCAG 2.2, 2.5.8). Enlarge the tappable area, not necessarily the icon.\n- **The main action is within thumb reach**: lower half of the screen for something used constantly.\n- **Text is at least 16 CSS pixels in form fields**, so a phone browser does not zoom the page when a field is focused.\n- **System areas are respected**: content clears the notch, the rounded corners and the home indicator, and stays visible above the on-screen keyboard.\n- **Navigation fits**: a long horizontal menu becomes a pattern that fits the width, with the current place still shown.\n- **Fields ask for the right keyboard** (email, number, phone) and allow password managers and paste.\n- **Gestures have a visible alternative.** Anything done by swiping or dragging can also be done with a tap (WCAG 2.2, 2.5.7).\n\n## Checks for large screens\n\n- **Content has a maximum width** and extra space is used on purpose: a second column, a persistent side panel, more rows. Not wider gaps alone.\n- **Related things stay near each other.** A button at the far right of a 1920 pixel row is far from the row's label.\n- **Keyboard and pointer are served**: visible focus, sensible tab order, and controls that do not need touch-sized spacing can sit closer.\n\n## Limits\n\n- Keep every capability at every size. If something truly cannot work on a phone, say so and ask before hiding it there.\n- Do not change the look at the size that already worked unless a fix requires it, and list it if so.\n- Native app screens follow the platform's own layout rules. If the project is native, say which of these checks you applied and which you left to the platform.\n\n## Report\n\nFollow the report shape in SKILL.md. \"What happened\" names the sizes that were broken and are now fixed. Then one line per size: fine already, fixed, or still has a problem. Under \"Not checked\", every size and device you could only emulate and not see on real hardware.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the hem, usually because it was designed as a website or built once for two platforms, feels slightly wrong in a way people cannot name. This job finds where the app departs from its platform and brings it back. The sources are the platform owners' own published guidance: Apple's Human Interface Guidelines and Google's Material Design.\n\nThis job is for apps installed on a device, built with the platform's own tools or with a cross-platform one. For a website on a phone, the job is `/keen adapt`.\n\n## Steps\n\n0. **Check it is an installed app.** If the target is a website or a web app in a browser, stop here and name `/keen adapt`.\n1. **Pick the platform**: iPhone and iPad, or Android. If the project ships both and the person did not say, ask which first. Do one, then offer the other as a next step.\n2. **Run the app** in a simulator or emulator. Capture the screen in question in light and dark, at the default text size and at the largest, and on the smallest and largest device the app supports.\n3. **Use it with one hand**, doing the screen's main job. Note every place you reached for something that was not where the platform puts it.\n4. **Check each row** of the table below and fix what departs, using the platform's own controls before custom ones.\n5. **Capture after**, the same set, and report on the Keen page.\n\n## What the platform expects\n\n| Area | iPhone and iPad | Android |\n|---|---|---|\n| Main sections | A tab bar at the bottom, two to five tabs, always visible | A navigation bar at the bottom for three to five places, or a rail or drawer on larger screens |\n| Going back | A back control at the top left, and a swipe from the left edge that always works | The system back gesture or button always works and does what the person expects |\n| Titles and actions | A title at the top, the screen's actions at the top right or in a toolbar | A top app bar with the title, and the main action as a prominent button |\n| Temporary tasks | A sheet that slides up is removed.** Moving an action to where the platform puts it is the job; say where each one went.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say which platform and how many departures were fixed, naming the two or three a person would feel most (\"swiping back now works on every screen\"). Under Details, each fix with the guideline it follows. Under \"Not checked\", a real device, the other platform, haptics, and screen readers if you could not run them.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said
