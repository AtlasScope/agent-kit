installed"},{"t":"Code Health Check Prompt","by":"tinosingh","url":"https://github.com/tinosingh/Code-Health-Check-Prompt","idea":"Every finding needs file:line, command output or a commit; calibrate to the repo; grade confidence. Folded into D06.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Codebase review prompts","by":"markoverano","url":"https://github.com/markoverano/codebase-review-prompts","idea":"A broad performance and maintainability review prompt. Its per-line-count expectations are not used here.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Hacker News","by":"Community","url":"https://news.ycombinator.com/","idea":"Practitioner discussion and critiques of agent tools. Evidence varies thread to thread.","str":"Discussion","st":"Monitor selectively"},{"t":"r/ClaudeCode","by":"Community","url":"https://www.reddit.com/r/ClaudeCode/","idea":"Day-to-day Claude Code tips and failure reports.","str":"Discussion","st":"Monitor selectively"}],"areaBlurb":{"Architecture and hidden complexity":"Spots where the way the code is built invites bugs: status spread across many places, words that change meaning between layers, and layers that cost more than they help.","Performance and scale":"Where time and money go as the data grows. Every claim here needs a measurement before and after.","Correctness and reliability":"What happens when something runs twice, fails, times out or happens in the wrong order, and whether people can tell a stand-in value from the real one.","Testing and security":"What the tests really prove, and where input from outside can reach something sensitive.","Infrastructure and environment":"The path from a merged change to the live site, what automated checks cost, and the computer the agents run on.","Data integrity and analytics":"Telling missing from zero, knowing where each number came from, and records whose meaning changes over time.","Agent harness and modern stack":"Newer kinds of trouble: out-of-date agent instructions, old and new versions running at once after a deploy, data leaking into pages, outside services going down, rounding errors, and screens that show a change before it is saved.","Start here":"One broad look when the database feels hard to trust or costly. If you can already name the problem, skip it and pick the narrower prompt.","Accuracy and evidence":"Proves the data is right, not just valid: rebuilt figures, whole populations, stable identities and past results that still reproduce.","Writes and ingestion":"Who writes what, how often it changes nothing, and whether imports survive retries and corrections.","Schema and dependencies":"Fewer objects, one home for each fact, and a model a new engineer or agent can read.","Performance and maintenance":"Where storage, time and write cost actually go, and what grows expensive first. Every claim needs a measurement.","Rebuild and safe change":"Changes and restores proved on a separate database before anyone relies on them.","Agent decisions":"Turns questions agents keep asking you into rules they can apply themselves.","Workflows":"Short routes through the database prompts for a whole job. Start with the first step and only take the optional ones when the evidence points there.","Motion":"How the interface moves: whether animation follows a system, what it costs, who it leaves out, and where it helps or gets in the way. Each prompt works in any agent. The motion-kit plugin's /motion runs the same checks with frame-by-frame captures."},"sources":{"intro":"Collected from two field guides, one for agent engineering and one for design skills, plus a set of everyday saved prompts. The skills it points to ship in this repo as plugins.","items":[["agent-kit on GitHub","https://github.com/AtlasScope/agent-kit","The design, engineering, experience-architecture and working-style plugins this library refers to, and the source of this page."]]},"dbSymptoms":[["The numbers don't match their source",["PG01","PG02","D02"]],["Records are merged, duplicated or lose history",["PG03","PG04","D05"]],["Imports rewrite everything or run twice",["PG06","PG08","PG07"]],["Nobody knows what writes to a table",["PG05","PG09","R05"]],["Too many views, functions and triggers",["PG10","PG11","PG12"]],["Postgres is slow or costs too much",["PG13","PG14","P03"]],["A migration is about to ship, or a restore is untested",["PG17","PG15","G02"]],["Agents keep asking me to decide",["PG16","M05"]]],"dbTools":{"supabase":["Supabase agent skills","https://github.com/supabase/agent-skills","Official skills for Supabase and Postgres work. Install with: claude plugin marketplace add supabase/agent-skills, then claude plugin install supabase@supabase-agent-skills. Other agents: npx skills add supabase/agent-skills."],"bestpractices":["Postgres best practices skill (Supabase)","https://github.com/supabase/agent-skills/blob/main/skills/supabase-postgres-best-practices/SKILL.md","Rules for queries, indexes, connections, locking and RLS. Works on any Postgres, not only Supabase. Install with: claude plugin install postgres-best-practices@supabase-agent-skills."],"pgss":["pg_stat_statements","https://supabase.com/docs/guides/database/extensions/pg_stat_statements","Postgres extension that counts how often each statement runs and how long it takes. Check it is enabled before trusting its numbers."],"advisors":["Supabase Advisors","https://supabase.com/docs/guides/observability/advisors","Built-in security and performance checks in the Supabase dashboard. Read their output rather than running another scanner."],"hypopg":["HypoPG","https://supabase.com/docs/guides/database/extensions/hypopg","Tests whether an index would help without building it. Optional, and not needed for most investigations."],"pgtap":["pgTAP database tests","https://supabase.com/docs/guides/local-development/testing/overview","SQL tests for rules and RLS policies. Run them on a local or branch database, never production."],"declarative":["Declarative schemas (Supabase)","https://supabase.com/docs/guides/local-development/declarative-database-schemas","Keep the desired schema in files and generate migrations from it. Weigh it against the migration workflow you already have."],"pgdocs":["PostgreSQL documentation","https://www.postgresql.org/docs/current/","The reference for exact behaviour. Check the version your database runs."]},"dbToolsVerified":"2026-11-07","v3":{"tips":[["Ask for a report before a fix","Run an investigation first, read what the agent proved, then approve the fix in a follow-up step."],["Add one working rule to any request","Paste a prompt like \"Prove it wrong\" or \"Mark your guesses\" right after your own request to make the agent more careful."],["One investigation per chat","Paste one check, read the result, and start a fresh chat for the next. Packing several checks into one thread produces shallow answers."]],"promptCats":[{"key":"start","kind":"work","title":"Before it starts","blurb":"Paste one of these after your request so the agent plans carefully before touching code.","ids":["M07","M01","M09","X18","X20","AD01","AD02"]},{"key":"honest","kind":"work","title":"Keep it honest","blurb":"Paste one of these to make the agent prove its claims, trace root causes, and verify its own work.","ids":["M02","M03","M06","M08","X17","AD03"]},{"key":"simple","kind":"work","title":"Keep it simple and decisive","blurb":"Stop the agent from piling on abstractions, and let it handle routine engineering choices without quizzing you.","ids":["M04","M12","M05"]},{"key":"finish","kind":"work","title":"When it's done","blurb":"Close out a task cleanly so you understand what changed and a fresh chat can pick up without losing context.","ids":["M10","X19"]},{"key":"broken","kind":"inv","title":"Something broke or acts oddly","blurb":"Find why features fail unpredictably, leave half-finished messes, or display wrong information.","ids":["R06","R02","R04","G06","G04","A06","AD07"]},{"key":"slow","kind":"inv","title":"Slow or costly","blurb":"Find where time and compute actually go, using measurements before rewriting anything.","ids":["P01","P02","P04","P03","P05","P07"]},{"key":"data","kind":"inv","title":"Numbers and records you can trust","blurb":"Verify that numbers on screen match reality, and catch records that duplicate, clash, or silently drift apart.","ids":["D02","D01","G05","D03","D04","R01","R05","R03","A04","I04"]},{"key":"db","kind":"inv","title":"Postgres database care","blurb":"PostgreSQL-specific checks for heavy schemas, large imports, write churn, database cost, and source rebuilds.","ids":["PG00","PG02","PG03","PG05","PG06","PG07","PG09","PG10","PG12","PG13","PG15"]},{"key":"code","kind":"inv","title":"Code that's hard to change","blurb":"Find the structural tangles making small feature requests slow, fragile, or prone to breaking nearby screens.","ids":["A01","A02","A03","A05"]},{"key":"security","kind":"inv","title":"Security","blurb":"Check whether outsiders can trigger sensitive actions, bypass failed security checks, or read hidden data.","ids":["T03","T05","G03","T04"]},{"key":"ship","kind":"inv","title":"Shipping and production","blurb":"Make sure merged code actually reaches users, environments match expectations, and deploys don't break live sessions.","ids":["I02","S06","I05","G02","AD04","AD09"]},{"key":"health","kind":"inv","title":"Project and agent health","blurb":"Periodic housekeeping for your repo: stale agent instructions, bloated dependencies, wasted CI time, and recurring agent mistakes.","ids":["D06","G01","I06","I03","AD05","AD06","T06","X15"]},{"key":"screens","kind":"inv","title":"Screens, navigation and motion","blurb":"Spot structural navigation confusion, broken Back/refresh flows, and animations that hurt speed, usability, or accessibility.","ids":["A08","R07","MO05","MO02","MO03","MO04","MO06"]},{"key":"product","kind":"inv","title":"Your product and business","blurb":"Check whether your code keeps your product's promises, handles payments cleanly, resists abuse, and makes economic sense.","ids":["X01","X02","X03","X04","X05","X06","X07","AD08","AD11"]},{"key":"risk","kind":"inv","title":"Risks you can't see yet","blurb":"Silent time bombs, blind spots in monitoring, hidden defaults, privacy exposure, and single-person dependencies.","ids":["X08","X09","X10","X11","X12","X13","X14","X16","AD10"]}],"when":{"A01":"A record or screen keeps ending up in a weird combination like \"paid and cancelled and draft at the same time.\"","A02":"Different screens or exports disagree about what counts as an active user, order, or record.","A03":"Simple edits require touching five files, or agents keep getting lost following indirection.","A04":"One screen or tool shows one answer while another screen, database table, or external service shows a different one.","A05":"Your project has matured over several months and every new feature feels like fighting the existing setup.","A06":"A glitch appears randomly under real use and disappears whenever you try to reproduce it slowly.","A07":"The app gets slower or misbehaves the longer it stays open.","A08":"Users keep getting lost, and adding more tabs, drawers, or helper text hasn't made the app clearer.","P01":"People say the app feels sluggish and you do not know whether the bottleneck is the browser, server, or database.","P02":"A page loads pieces one by one, or batch jobs occasionally spike errors and hit rate limits.","P03":"Screens that used to load instantly are getting slower every month as data accumulates.","P04":"Server load, API bills, or screen lag look much higher than your actual user activity explains.","P05":"You are preparing for a launch spike, an enterprise customer, or steady growth and want to know your first ceiling.","P06":"Something is fine with a little data and crawls with a lot.","P07":"The app slows down, uses huge memory, or crashes after staying open for hours or processing many requests.","P08":"One slow request makes everything else wait.","P09":"Jobs run in parallel and sometimes swamp the database or an outside service.","R01":"A slow connection, double click, webhook retry, or restarted job caused something to happen twice.","R02":"A dashboard or list occasionally shows \"0\" or \"Nothing here\" even when you know data exists.","R03":"Weird impossible records keep turning up in the database even though the UI shouldn't allow them.","R04":"Deadlines, billing dates, schedules, or reports look off by a day or break for users in other regions.","R05":"Saved edits mysteriously vanish when two people or a background job touch the same record around the same time.","R06":"An interrupted save, upload, payment, or background job left records or files in a weird half-done state.","R07":"Pressing Back closes the whole screen, refreshing wipes filters, or sharing a link sends someone to the wrong view.","T01":"All the checks pass and features still break for real people.","T02":"You suspect some tests would pass even if the feature were broken.","T03":"Before letting external users submit forms, upload files, connect webhooks, or access other accounts' workspaces.","T04":"You added several packages or automated workflows and want to know what a compromised dependency or pull request could reach.","T05":"You want to confirm that a missing environment variable or auth outage locks people out instead of letting everyone in.","T06":"Your test suite shows green, yet real users still hit broken features after deploys.","S06":"Something works locally or on a preview link and breaks after deploying to production.","I01":"Your computer is short on disk space or tools behave inconsistently.","I02":"A merged fix did not show up on the live site, or you have never mapped your full release path.","I03":"Pull request checks take forever or cost real CI minutes while rarely failing for useful reasons.","I04":"Nightly jobs, email queues, or syncs silently stop running, overlap, or leave partial updates behind.","I05":"You tweaked domains, cron schedules, environment variables, or permissions directly in a hosting dashboard and suspect the repo no longer matches.","I06":"Installs and builds keep getting slower, or your dependency list has grown across many iterations.","I07":"You want to clean up old runtimes without breaking an app that still needs one.","D01":"Totals or charts look skewed and you suspect missing entries are being treated as zero.","D02":"A metric, balance, or total looks suspicious, or an important number has to stand up to scrutiny.","D03":"You changed pricing, categories, or status definitions and past reports or orders suddenly read differently.","D04":"An import or sync reports \"Success\", yet the row count or matched records look wrong.","D05":"You wonder whether records should be linked, such as a customer to their company.","D06":"You want a periodic checkup on overall code quality and don't have one specific bug to chase.","G01":"Coding agents keep referencing deleted folders, old scripts, or patterns you replaced weeks ago.","G02":"You are about to merge a database migration, rename a column, or change an API payload while real users are live.","G03":"You have user accounts, admin flags, or multi-customer data and want to be sure private fields aren't leaking into the browser's network tab.","G04":"Your product depends on external APIs or webhooks and you have never tested how it behaves during an outage.","G05":"Money totals are off by a cent, or rates and percentages occasionally jump by a factor of 100.","G06":"A user edits, deletes, or toggles something, thinks it saved, and discovers after refreshing that it never stuck.","MO01":"Animations feel inconsistent, as if each one was made separately.","MO02":"Drawers, lists, scroll effects, or transitions look choppy on mobile devices or slower laptops.","MO03":"Before launch, if your product uses sliding panels, parallax, looping motion, or entrance animations.","MO04":"Fast clicking makes menus flash, buttons ignore taps mid-transition, or dialogs jump awkwardly.","MO05":"The app feels sluggish or overly bouncy and you suspect animations are getting in users' way.","MO06":"Users press a button twice because they couldn't tell if their action registered, or lose track of where an item went.","PG00":"Your Postgres database feels fragile, slow, or expensive and you want to know the top three things to tackle first.","PG01":"The most important numbers have to be right and you want proof, not reassurance.","PG02":"No errors or constraint failures appear, yet totals or cross-checks across tables feel off.","PG03":"The same customer or product turns up twice under slightly different IDs, or two unrelated records got combined.","PG04":"You need to know what the database said on an earlier date.","PG05":"Unexpected edits appear in key tables and nobody has a complete list of what writes to them.","PG06":"Frequent syncs or upserts drive high Postgres write load, bloat, or bills even when source data barely changes.","PG07":"Your import pipeline has grown multi-staged, fragile, or slow and you want to simplify it without losing auditability.","PG08":"You're afraid to rerun an import or a failed job in case it duplicates data.","PG09":"Updating one rule forces edits in both application code and SQL triggers, or rules keep contradicting each other.","PG10":"Your database has accumulated old views, triggers, or indexes nobody remembers creating.","PG11":"The same fact is stored in several tables and they've drifted apart.","PG12":"Agents routinely query the wrong column or misunderstand how your tables fit together.","PG13":"Your Postgres hosting bill or CPU usage climbed and you want hard numbers on what is driving it.","PG14":"Your data is growing and you want to know what gets expensive and when.","PG15":"Your database aggregates imported data and you want to verify nothing irreplaceable lives only in production.","PG17":"A database change is about to be merged.","PG16":"An agent keeps asking you data questions it could settle with a clear rule.","X01":"Before launching or updating pricing, terms, or onboarding copy, to catch promises the app silently breaks.","X02":"You are about to invite real strangers into your product and want to fix avoidable confusion before launch.","X03":"You offer free trials, referral credits, usage caps, paid seats, or features that cost you money per click.","X04":"Your product has grown cluttered over months and you want safe, evidence-backed candidates to cut.","X05":"You are setting up billing or taking live payments and have never traced failed cards, duplicate webhooks, and refunds end to end.","X06":"You are setting plan prices, adding AI/metered features, or noticing infrastructure bills climb faster than revenue.","X07":"Your app relies on several third-party platforms (auth, database, AI, hosting, payments) and you want to know your biggest lock-in risks.","X08":"Your app calls an LLM or AI API while users interact with it (distinct from using AI to write code).","X09":"Your product has been live for a while and runs on keys, domains, credits, or third-party APIs that expire on their own.","X10":"Your product has live users and you want to catch silent outages before customers report them.","X11":"You built quickly on a starter template or framework and never explicitly configured session length, upload caps, timeouts, or deletion behavior.","X12":"You store emails, names, payments, or user uploads and need to know where personal data leaks or how to honor a deletion request.","X13":"Before launching a paid or public product that uses downloaded fonts, stock assets, icons, datasets, or open-source packages.","X14":"Your product has active users and you are the only person who knows how deploys, renewals, secrets, and billing work.","X15":"Coding agents keep making the same kind of blunder in your repo (editing generated files, forgetting a build command, breaking the same convention).","X16":"Everything seems fine on the surface and you want to surface the biggest lurking operational disaster before users find it.","UI100":"You want help with animations and don't want to remember which sub-command to pick.","UI101":"Before adding more animations, or when every component moves at a different speed.","UI102":"You are designing a complex entrance, onboarding transition, or choreographed sequence.","UI103":"You know the exact animation you want and need it built smoothly.","UI104":"You want an honest diagnosis of your app's animations before changing anything.","UI105":"A specific animation stutters or broke, or `/motion review` flagged issues to repair.","UI083":"Docs, landing copy, release notes, or interface text read like a machine wrote them.","UI108":"You want to explore new color palettes visually on your real product before committing.","EC01":"Something in the codebase feels broken, slow, or risky and you aren't sure which check to run first.","EC35":"Your Postgres database feels slow, costly, or untrustworthy and you want the right check picked for you.","EC36":"Right after installing `engineering-kit` in Claude Code, or whenever you want to turn automatic routing on or off.","EC23":"Users complain about getting lost, too many pages, or Back/refresh losing their spot.","EC24":"You are considering adding a new section, merging pages, or reorganizing navigation.","EC25":"You want real-browser proof that a navigation bug exists or that a fix holds up.","EC37":"Everything technically works, yet the product feels rough or confusing and you want fresh outside eyes.","EC38":"The agent dropped a wall of jargon and you just want a clear briefing on what is happening.","EC34":"You are weighing two or three directions and want a clear opinion with tradeoffs spelled out.","EC31":"You want tough, no-sugarcoating feedback on finished work and are comfortable letting the agent apply small obvious fixes immediately.","EC32":"Before shipping any UI change, to make sure nothing overflows or breaks across screen sizes.","EC26":"Before merging a pull request, for a dedicated bug pass.","EC27":"Your branch touches sign-in, permissions, user data, payments, or external inputs.","EC28":"A feature works and you want a quick cleanup pass over the new code before merging.","RC23":"Animations were added one at a time and the app moves inconsistently.","DBR01":"The data in a Postgres database has to be right, and you want it proved before anything is fixed.","DBR02":"Imports into Postgres are slow, costly or more complicated than they should be.","DBR03":"The schema has filled up with views, functions and tables nobody is sure about.","DBR04":"The Postgres bill or load is higher than it should be.","DBR05":"You are about to change the schema, or you have never tested a restore.","M07":"You know what outcome you want and want the agent to stop quizzing you on technical details.","M01":"You know the goal well enough to describe it, yet suspect you're missing important edge cases or checks.","M09":"A decision would be expensive or painful to reverse later.","X18":"You are about to run a migration, change billing, launch a major feature, or rewrite a core flow.","X20":"You are renaming, moving, or removing a URL, database field, plan price, email flow, or API.","M02":"A proposal sounds smooth and confident, and you want to test whether it holds up under pressure.","M03":"A bug keeps coming back, or the same kind of glitch just appeared in a second place.","M06":"The agent reports \"all tests pass\" and you want real-world proof the feature actually works.","M08":"You are starting a fix session after an earlier read-only investigation confirmed a real bug or slowdown.","X17":"An agent sounds very sure of itself and you need to know what it actually verified before acting.","M04":"The agent wants to add a new config option, database table, helper layer, or external service.","M12":"A feature works, yet the diff left duplicated logic or extra pass-through files behind.","M05":"The agent keeps interrupting you with code-level questions you cannot judge.","M10":"A chat is getting long, you are about to start a fresh thread, or you are pausing mid-task for the day.","X19":"The agent just finished an important change you will have to live with and judge yourself.","AD01":"Past changes touched files you didn't expect, or you are editing a delicate area right before shipping.","AD02":"You want to approve the approach before the agent touches code, especially on a big or unfamiliar change.","AD03":"The agent has spent several turns patching a bug, each fix broke something else, and you have lost track of what changed.","AD04":"An agent finished a branch with many changed files and you want to understand and test it before merging.","AD05":"An agent says a feature is \"done\" and you want proof nothing was faked, skipped, or left half-wired.","AD06":"You are returning to a project after weeks away, taking over code agents wrote, or losing track of how the app fits together.","AD07":"You are preparing to let real users create accounts, or people report login loops, broken reset links, or unexpected sign-outs.","AD08":"Before launch, or whenever users say they never got an email or received a broken link.","AD09":"You are about to share a link to your product on social media, in a newsletter, or on a launch directory.","AD10":"You have real user data (in any database or file store) and have never checked what happens if something gets deleted by mistake.","AD11":"You are tempted to build auth, billing, email, search, analytics, scheduling, or an admin panel from scratch."},"skillGroups":[{"key":"design","title":"Design","plugin":"design-kit","head":"/keen","blurb":"Type `/keen` followed by what you want. It covers 21 focused design jobs, from read-only critiques to targeted visual edits. Typed alone, it inspects where you are and suggests the best starting job.","keen":true,"ids":["UI108","UI083","EC32"],"idsTitle":"Also in the design kit"},{"key":"motion","title":"Motion","plugin":"motion-kit","head":"/motion","blurb":"Commands for everything that moves on screen. Type `/motion` alone for an inventory and suggested next steps, or pick a specific mode below.","ids":["UI100","UI101","UI102","UI103","UI104","UI105"]},{"key":"eng","title":"Engineering","plugin":"engineering-kit","head":"/engineer","blurb":"Describe a technical or database problem in plain words and let the command pick the single best starting check.","ids":["EC01","EC35","EC36"]},{"key":"nav","title":"Navigation and product","plugin":"experience-architecture","head":"/experience-architecture:diagnose","blurb":"Find out why users get lost, decide whether your page structure should change, and prove navigation fixes in a real browser.","ids":["EC37","EC23","EC24","EC25"]},{"key":"work","title":"Working with your agent","plugin":"working-style","blurb":"Commands that control how the agent explains work, makes recommendations, and critiques your product.","ids":["EC38","EC34","EC31"]},{"key":"builtin","title":"Built into Claude Code","plugin":null,"blurb":"Included automatically in Claude Code with nothing to install.","ids":["EC26","EC27","EC28"]}],"recipeGroups":[{"key":"design","title":"Design, motion and navigation","blurb":"Screens, landing pages, motion, and people getting lost.","ids":["RX01","RX02","RX03","RX04","RRC23","RX05","RX09"]},{"key":"fix","title":"Bugs, speed and data","blurb":"Something broke, got slow, or the numbers look wrong.","ids":["RX06","RX07","RX08","RDBR01","RDBR02","RDBR03","RDBR04","RDBR05"]},{"key":"ship","title":"Shipping and running a product","blurb":"Before a change goes out, before you charge money, and keeping it alive.","ids":["RX10","RX11","RX12","AD12","AD13"]}],"recipes":[{"id":"RX01","t":"Design a new screen or product","line":"Takes a screen from a blank idea to a planned, built, critiqued, real-data-tested, and polished result.","when":"You are building a brand-new screen or product area from scratch.","steps":[["K:init","run once per project to write down who it's for and what it should feel like"],["K:shape","plan the screen and choose from three rough layouts before writing code"],["Build from the brief","ask your agent to implement the layout you picked"],["K:critique","catch design flaws while they are still cheap to fix (changes nothing)"],["K:harden","test with long names, missing fields, empty states, and errors"],["K:polish","final pass on alignment, spacing, and rough edges"]],"split":true},{"id":"RX02","t":"Fix a screen that feels off","line":"Diagnoses what isn't working on an existing screen, lets you compare alternatives for the weakest area, strips clutter, and checks every screen size.","when":"An existing screen feels awkward or messy and you aren't sure what to fix first.","steps":[["K:critique","find what's wrong and why (changes nothing)"],["K:variants","compare three versions of the section you dislike most and pick one"],["K:distill","strip clutter if the critique flags crowding"],["K:polish","tidy final spacing and alignment details"],["EC32","verify screenshots at phone, tablet, and desktop widths"]],"split":true},{"id":"RX03","t":"Get a page ready for launch","line":"Hardens a finished screen for messy real data, phones and tablets, accessibility rules, and smooth loading.","when":"A key page looks done on your laptop and needs to hold up for real users across devices.","steps":[["K:harden","handle long text, empty lists, slow loads, and error states"],["K:adapt","make layout and tap targets work on phones, tablets, and wide monitors"],["K:audit","run objective accessibility and readability checks (changes nothing)"],["K:optimize","fix layout jumps or sluggish loads if the page feels slow"],["EC32","capture final proof across phone, tablet, and desktop"]],"split":true},{"id":"RX04","t":"A landing page that gets people to act","line":"Plans the page around one clear user action, tightens the offer and copy, strips AI-sounding phrasing, and finishes the visual polish.","when":"You are building or rescuing a homepage, pricing page, or sign-up page that needs better conversion.","steps":[["K:shape","define who the page is for and the single action you want them to take"],["K:convert","sharpen the value proposition, proof, and calls to action"],["K:words","clarify headings, labels, and button copy"],["UI083","strip stiff or AI-sounding prose"],["K:polish","final visual alignment and spacing pass"]],"split":true},{"id":"RX05","t":"Fix motion that feels off","line":"Cuts decorative animations first, reviews what remains, fixes real stutters, and checks reduced-motion accessibility.","when":"Animations feel distracting, choppy, or excessive across your app.","steps":[["MO05","list decorative or slow repetitive animations to cut or shorten (read-only)"],["UI104","inspect what remains with frame captures (read-only)"],["UI105","repair the choppy or broken animations found in Step 2"],["MO03","verify everything works cleanly when reduced motion is enabled (read-only)"]],"split":true},{"id":"RX06","t":"A bug you can't explain","line":"Traces the real root cause, locks in a failing reproduction first, applies one narrow fix after you approve, verifies it independently, and explains what changed in plain English.","when":"A stubborn or recurring bug keeps resisting quick patches.","steps":[["M03","trace the real cause and everywhere else it applies without editing app code"],["Lock in a failing check","write a minimal test or reproduction script that fails today"],["Apply the narrow fix","fix the confirmed root cause after you approve"],["M06","verify the fix via a real-world path separate from your own unit test"],["X19","get a short plain-English summary and two understanding checks"]],"split":false,"copy":"A bug you can't explain. Trace the root cause, prove it with a failing check, apply the narrowest fix, verify independently, and explain what changed.\n\nRun these steps one at a time. Wait for my yes after each step before moving on. Do not edit application code during Steps 1, 2, 4, or 5.\n\nStep 1 (root cause — read-only): Do not patch the visible symptom yet. Reproduce the bug, trace backward through code and data until you can explain in one or two plain sentences why it happens (with exact file:line or records), and find every other place sharing that cause. Propose one fix that removes the cause everywhere it applies. Wait for my yes.\n\nStep 2 (reproduction — no app edits): Add one minimal failing test or reproduction script that reliably demonstrates the bug today. Do not change application code yet. Show the failing output and wait for my yes.\n\nStep 3 (narrow fix): Implement the smallest fix that removes the proven root cause and makes Step 2's check pass. Do not refactor unrelated code. Wait for my yes.\n\nStep 4 (independent verification): Prove the fix works without relying only on the code or test you just wrote. Exercise the real flow (browser click-through, real endpoint, or real stored data), show the result, and state plainly what it still does not cover.\n\nStep 5 (plain-English wrap-up): In under 250 words for someone who knows the product and does not read code, cover what went wrong, what you changed and why, what users will see, what could still go wrong and how I'd spot it, and one thing I can check myself. End with two short questions to confirm I understood the key parts.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath."},{"id":"RX07","t":"It got slow","line":"Measures where seconds actually go, narrows down waiting chains or repeated work, fixes only the #1 measured bottleneck, and re-measures to prove the speedup.","when":"A screen or workflow feels sluggish and you want measured improvements instead of guesswork.","steps":[["P01","time the slowest user flows from click to database (read-only)"],["P02","check whether independent steps are waiting sequentially (read-only, run if Step 1 shows waterfalls)"],["P04","check for identical work running repeatedly (read-only, run if Step 1 shows repeated queries/renders)"],["Fix only the #1 measured bottleneck","wait for approval, then make one targeted fix"],["Re-measure before vs. after","rerun the exact Step 1 measurement and verify nothing broke"]],"split":false,"copy":"It got slow. Measure where the time goes, fix only the single biggest measured bottleneck, and prove the speedup with before-and-after numbers.\n\nRun these steps one at a time. Wait for my yes after each step. Stay strictly read-only during Steps 1, 2, 3, and 5 — do not edit code, data, or config until I approve Step 4.\n\nStep 1 (measure end to end — read-only): Trace and measure the slowest user journey(s) from browser click to database response, identifying round trips, waterfalls, slow queries, repeated work, blocking synchronous handlers, or large loops. Bring back: a measured timing breakdown showing each step's share of total latency (file:line). If everything is already fast and costs are flat, say so and stop. Watch out: require real measurements, never guesses from static reading.\n\nStep 2 (waiting chains — read-only, skip if Step 1 showed no sequential waits): Inspect the slow path for independent async steps waiting sequentially, and check shared transactions, pool sizes, and API rate limits before recommending parallelism. Bring back: each sequential chain (file:line), its measured time, and constraints to respect.\n\nStep 3 (repeated work — read-only, skip if Step 1 showed no duplicate work): Inspect the slow path for expensive operations repeated with unchanged inputs. Bring back: each repeated call (file:line), frequency, measured cost, and exact cache-invalidation rules if caching is proposed.\n\nStep 4 (fix the #1 bottleneck): After I approve, apply only the smallest fix targeting the single largest measured cost from Steps 1–3.\n\nStep 5 (prove the speedup): Rerun the exact measurement method from Step 1 on realistic input and report exact before-and-after timings alongside an independent check that behavior stayed identical. If the speedup cannot be measured, state what evidence is missing instead of claiming a win.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath."},{"id":"RX08","t":"The numbers look wrong","line":"Traces a suspect figure to its raw inputs, checks whether missing values turned into zero or units drifted, fixes only confirmed bugs, and verifies independently.","when":"A balance, metric, chart, or total on screen disagrees with what you expect.","steps":[["D02","trace the metric to raw inputs and recompute one example (read-only)"],["D01","check whether unknown or missing values are counted as zero (read-only)"],["G05","check cents vs. dollars, percentages, and float rounding (read-only)"],["Fix confirmed causes only","wait for approval, then fix only proven bugs"],["M06","recompute again against raw source records to confirm the fix"]],"split":false,"copy":"The numbers look wrong. Trace a suspect number to its source, check missing-as-zero and unit/rounding bugs, fix only proven causes, and verify independently.\n\nRun these steps one at a time. Wait for my yes after each step. Stay strictly read-only during Steps 1, 2, 3, and 5 — do not edit code, data, or config until I approve Step 4.\n\nStep 1 (source trace — read-only): Trace the suspect metric(s) to raw inputs, transformation logic, filters, and assumptions, and recompute at least one real example independently. Bring back: raw inputs, formula (file:line), and independent recomputation. Stop if displayed numbers are stored verbatim with no calculation.\n\nStep 2 (missing vs zero — read-only): Check where missing, unavailable, stale, or not-applicable values turn into 0 in storage, calculations, or display. Bring back: each affected field (file:line), how absence is stored, how math treats it, and what users see. Stop if no optional numeric fields are involved.\n\nStep 3 (rounding and units — read-only): Trace currency, percentages, and rates across storage, API, and UI for floating-point drift, premature rounding, or scale mismatches (0.05 vs 5.0, cents vs dollars). Bring back: each value's numeric type and unit at every hop (file:line). Stop if no money, rates, or conversions are involved.\n\nStep 4 (fix confirmed causes): After I approve, fix only the causes confirmed in Steps 1–3 and add a test covering each one.\n\nStep 5 (independent check): Verify the fixed calculation directly against raw source records or an independent check outside your new unit tests, show the output, and note anything still uncovered.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath."},{"id":"RX09","t":"People get lost in your product","line":"Experiences your app like a newcomer, diagnoses why people get lost, rethinks page structure only if needed, and proves the fix in a real browser.","when":"Users struggle to find features, get confused by menus, or lose their place on Back/refresh.","steps":[["EC37","click through the running app as a first-time user (changes nothing)"],["EC23","find the root causes behind confusion or broken navigation (changes nothing)"],["EC24","run only if Step 2 proves the page structure itself is the problem"],["EC25","prove the fix works in a real browser and save repeatable checks"]],"split":true},{"id":"RX10","t":"Before you ship a change","line":"Bug and security reviews, a plain-English tour of the change, a blunt critique with small fixes, and screenshots at every screen size.","when":"A meaningful branch is finished and you want thorough checks before merging and deploying.","steps":[["EC26","catch logic bugs in your branch diff (read-only)"],["EC27","catch auth, data-access, or input holes in your diff (read-only)"],["AD04","a plain-English tour of the change, anything outside the request, and a short click-test list (read-only)"],["EC31","blunt severity-ranked critique plus small certain fixes"],["EC32","final screenshots on phone, tablet, and desktop (read-only)"]],"split":true},{"id":"RX11","t":"Before you charge people money","line":"Checks payments end to end, closes obvious loopholes, verifies your per-user margin, and makes sure pricing promises match the code.","when":"You are turning on paid plans for the first time or changing how billing works.","steps":[["X05","trace checkout, webhooks, refunds, retries, and access grants end to end (fresh chat, read-only)"],["X03","find trial, coupon, seat, and usage-limit loopholes (fresh chat, read-only)"],["X06","calculate marginal hosting, AI, and API cost per plan (fresh chat, read-only)"],["X01","verify every claim on your pricing, checkout, and terms pages (fresh chat, read-only)"]],"split":true},{"id":"RX12","t":"Make the project survive without you","line":"Audits everything that depends only on you — single-owner accounts, silent outage blind spots, expiring keys/domains, and repeated agent pitfalls — so you can turn the findings into a runbook, alerts, and updated `AGENTS.md`.","when":"Your product has live users and currently survives only because you personally keep an eye on it.","steps":[["X14","list single-owner accounts, manual chores, and draft a one-page runbook (fresh chat, read-only)"],["X10","spot critical flows that fail silently until a customer complains (fresh chat, read-only)"],["X09","build one timeline of expiring keys, domains, credits, and retiring APIs (fresh chat, read-only)"],["X15","mine git history for recurring agent mistakes and draft `AGENTS.md` rules (fresh chat, read-only)"],["Apply approved updates","commit the runbook, add the smallest alerts, calendar the renewals, and update `AGENTS.md`"]],"split":true},{"id":"RRC23","t":"A motion system for the whole app","fresh":false,"line":"Establishes one consistent set of speeds and curves for your product, reviews existing animations against it, fixes the top three offenders, and re-checks.","when":"Animations were added piecemeal across screens and every component moves differently.","steps":[["UI101","agree on shared durations, curves, and springs and write `MOTION.md`"],["UI104","capture frames and rank what to cut, fix, or add (changes nothing)"],["UI103","rebuild the worst three animations one at a time"],["UI104","re-check the updated flows against `MOTION.md`"]],"split":true,"iso":false},{"id":"RDBR01","t":"Is the data actually right?","fresh":false,"line":"Checks a PostgreSQL database from raw sources up — recomputing key figures, running cross-table sanity checks, spotting duplicate entities, and fixing only proven shared causes.","when":"Important numbers in a Postgres database must be verified before anyone relies on them.","steps":[["Source recomputation & cross-table checks","rebuild key figures from raw inputs and test cross-table totals (read-only)"],["Entity identity & historical meaning","check for split/merged records and retroactive rule changes (read-only)"],["Fix confirmed shared causes","apply targeted fixes plus repeatable SQL/metric checks after approval"],["Independent verification","show before/after recomputed examples and state any remaining source limits"]],"split":false,"copy":"Is the data actually right? Verify key PostgreSQL figures against original sources before changing anything.\n\nRun these steps one at a time. Wait for my yes after each step. Stay read-only during Steps 1, 2, and 4 — never edit production data, schemas, or app code until I approve Step 3.\n\nStep 1 (prove numbers and cross-check tables — read-only): Pick representative important figures and independently reconstruct them from raw sources without trusting existing calculation code. Also test cross-table totals, accounting identities, plausible ranges, and source coverage for data that passes constraints yet is analytically wrong. Bring back: independent rebuilds, failed cross-table reconciliations, affected row counts, and shared causes (file:line). Stop if the database stores only raw entries with no derived figures.\n\nStep 2 (identity & history — read-only, run only if Step 1 points here): Check whether real-world entities (customers, companies, products) were duplicated or wrongly merged across imports, and whether today's rules rewrite past records' historical meaning. Bring back: concrete duplicate/merge examples with the matching rule (file:line), or past records whose meaning shifted.\n\nStep 3 (targeted fix): After I approve, fix only the confirmed shared causes and add SQL or metric regression tests for them.\n\nStep 4 (proof): Show recomputed examples that now match their sources, how many records were affected, and any source gaps stated plainly.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath.","iso":false},{"id":"RDBR02","t":"Make ingestion simpler and cheaper","fresh":false,"line":"Maps everything writing to your Postgres tables, traces one full import end to end, trims redundant steps and no-op writes, and keeps retries safe.","when":"Postgres imports are slow, expensive, fragile on retry, or unnecessarily multi-staged.","steps":[["Map writers & trace one full import","see every writer and cut redundant stages (read-only)"],["Check no-op writes, safe reruns & rule ownership","measure unchanged rewrites, test retries, and untangle split validation (read-only / separate copy)"],["Apply one simplification at a time","keep provenance and correction support intact"],["Verify on reference inputs","prove identical output, less write work, and safe retries on a separate test database"]],"split":false,"copy":"Make ingestion simpler and cheaper. Cut wasted Postgres import work without losing source traceability or safe retries.\n\nRun these steps one at a time. Wait for my yes after each step. Stay read-only during Steps 1 and 2. Anything that changes state (replays or rebuild tests) runs only on a separate database with safe test data, never on production.\n\nStep 1 (map writers & trace one import — read-only): Map every script, job, API, trigger, and function that writes to the target tables, flagging conflicting writers. Then trace one complete import from raw source to final rows to spot redundant parsing, staging tables, duplicate validation, and extra writes. Bring back: a writer map (file:line), one full import trace, and the simplest path that keeps provenance and recovery checkpoints.\n\nStep 2 (churn, retries & split rules — read-only / test copy, run only what applies): Check what share of writes rewrite unchanged rows, whether retries or out-of-order files duplicate/corrupt data (never trusting ON CONFLICT alone), and whether validation rules are duplicated across app code and SQL triggers. Bring back: unchanged-write share, unsafe retry cases (file:line), and clearest rule ownership.\n\nStep 3 (incremental fix): After I approve, simplify one confirmed bottleneck at a time while preserving provenance, intentional timestamps, and correction handling.\n\nStep 4 (verify on a test copy): Prove on a separate database that reference inputs produce identical records with measurably fewer writes and safe reruns.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath.","iso":true},{"id":"RDBR03","t":"Simplify a crowded schema","fresh":false,"line":"Inventories unused Postgres views, triggers, functions, and duplicate tables, untangles confusing names, and verifies safe rollout before retiring anything.","when":"Your Postgres schema has accumulated old views, triggers, and redundant tables nobody dares to delete.","steps":[["Inventory unused database objects","map tables, views, triggers, functions, and real callers (read-only)"],["Check duplicated facts & confusing names","find drifting copies and misleading names (read-only)"],["Check deploy safety before merging","verify old and new app versions coexist and test migrations on a separate database"],["Retire confirmed dead objects","remove complexity with unchanged results for users"]],"split":false,"copy":"Simplify a crowded schema. Retire unused PostgreSQL objects and duplicate storage without breaking live readers.\n\nRun these steps one at a time. Wait for my yes after each step. Stay read-only during Steps 1–3. Any migration replay runs only on a separate database with safe test data, never on production.\n\nStep 1 (inventory objects & consumers — read-only): List tables, views, materialized views, triggers, functions, and indexes that look obsolete or redundant, verifying real consumers including dynamic queries and external readers. Bring back: dependency map, ranked removal candidates, and migration risk. Stop if the schema is small and every object has a known reader.\n\nStep 2 (duplicate facts & naming — read-only, if needed): Check for facts maintained in multiple tables/views that can drift apart, and misleading table or column names causing real bugs or agent errors (skip cosmetic renames). Bring back: authoritative vs. duplicate stores and low-risk boundary fixes.\n\nStep 3 (pre-merge safety check — read-only / test copy): Before removing or changing any object, verify existing records stay intact, running app versions survive rollout, locks are safe, and a real rollback exists. Replay the migration on a separate test database.\n\nStep 4 (apply approved removals): After I approve, ship the smallest safe cleanup and confirm unchanged outputs for users and queries.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath.","iso":true},{"id":"RDBR04","t":"Reduce PostgreSQL resource cost","fresh":false,"line":"Measures which Postgres tables, indexes, queries, and write loops actually drive your bill, cuts the biggest measured waste first, and verifies savings.","when":"Your Postgres compute, storage, or hosting bill is climbing faster than your product's growth.","steps":[["PG13","measure top storage, CPU, bloat, and unused indexes (read-only)"],["Drill into write churn or scaling queries","inspect unchanged rewrites and slow query plans (read-only)"],["Take the top measured saving first","skip speculative indexes or premature partitioning"],["Prove before-and-after savings","compare workload metrics with zero loss of correctness"]],"split":false,"copy":"Reduce PostgreSQL resource cost. Cut measured database waste without breaking queries or adding speculative complexity.\n\nRun these steps one at a time. Wait for my yes after each step. Stay read-only during Steps 1, 2, and 4 — never edit production data, indexes, or queries until I approve Step 3.\n\nStep 1 (measure waste — read-only): Measure which tables, indexes, queries, and maintenance tasks consume the most storage, CPU, and write I/O (unused indexes, bloat, dead tuples, full scans). Bring back: table/index sizes, top statements, index usage counts, EXPLAIN plans, and estimated savings. Stop if usage and cost are already small and flat.\n\nStep 2 (churn & scaling — read-only, run only what Step 1 points to): Measure unchanged row rewrites in write-heavy jobs, and inspect EXPLAIN ANALYZE plans for queries growing badly with row count. Bring back: write-churn share and query plans with realistic row counts.\n\nStep 3 (apply top measured fix): After I approve, implement only the highest-saving measured fix. No speculative indexes or premature partitioning.\n\nStep 4 (verify): Report before-and-after query plans, write/storage figures, and confirmation that query results remain identical.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath.","iso":false},{"id":"RDBR05","t":"Ship or recover safely","fresh":false,"line":"Verifies a risky database migration before deploy — or tests rebuilding/restoring your Postgres database on a separate copy — before anything touches production.","when":"You are about to ship a breaking schema change, or you have never tested recovering your database.","steps":[["Audit the pending migration or rebuild path","inspect rollout safety or source-rebuild completeness (read-only)"],["Check deploy overlap & half-finished failures","verify draining workers, locks, and interrupted transactions (read-only)"],["Rehearse on a separate database","run the migration or restore drill on an isolated copy with safe test data"],["Confirm recovery plan","verify tested results with zero unproved claims about production"]],"split":false,"copy":"Ship or recover safely. Verify a PostgreSQL migration or database rebuild on a separate copy before trusting it in production.\n\nRun these steps one at a time. Wait for my yes after each step. Stay read-only on production at all times — every migration replay or restore test runs only on a separate database with safe test data, never on production.\n\nStep 1 (audit change or rebuild — read-only): For a pending migration, review the diff against the live schema, active consumers, locks, old/new version coexistence, and rollback realism (reverting app code alone is not a schema rollback). For disaster recovery, audit whether the database can be rebuilt from repo migrations, source files, and backups, flagging anything that exists only in production. Bring back: concrete gaps and risks (file:line).\n\nStep 2 (deploy window & partial failures — read-only, if needed): Trace what happens while old client bundles or background workers are still draining during deploy, and check transaction/timeout paths that could leave half-committed data. Bring back: any compatibility break or half-committed failure path (file:line).\n\nStep 3 (isolated rehearsal): On a separate test database only, execute the migration (and rollback plan) or full rebuild/restore, and compare sampled rows and queries before and after.\n\nStep 4 (go/no-go summary): Report what the isolated test proved, any remaining risks or manual steps, and whether it is safe to proceed.\n\nStart your report in plain English: what you found, what it means, and whether I need to do anything. Put files, lines and commands underneath.","iso":true},{"id":"AD12","t":"Unstick an agent that's going in circles","line":"Stops a spiralling bug-fix session, clears out half-broken patches, proves the real cause, fixes only that, and walks you through the final diff.","when":"An agent has tried three fixes in a row, things feel messier than when you started, and you want to regain control.","fresh":true,"steps":[["AD03","freeze edits and see what changed since the last working state"],["M03","in a clean state (or fresh chat), find the real cause with evidence"],["AD01","apply the narrow fix without touching neighbouring files"],["AD04","get a plain-English diff review and click-test list"]],"split":true},{"id":"AD13","t":"Launch your product to strangers","line":"Checks the five things solo builders forget before opening a product to the public: accounts, outgoing emails, public links and previews, likely support questions, and outage alerts.","when":"The product works for you locally and you are about to share it publicly for the first time.","fresh":true,"steps":[["AD07","make sure strangers can get in, reset passwords, and not get stuck"],["AD08","check links, wording, sender config, and double sends"],["AD09","check titles, share cards, favicons, error pages, and crawl rules"],["X02","catch confusing screens and dead ends before people email you"],["X10","make sure an outage reaches you before a customer tells you"]],"split":true}],"home":{"title":"Things to give your coding agent","lede":"For Claude Code, Codex, Cursor or any agent working on your project. Start from what's wrong, or browse the three kinds.","doors":{"Prompts":{"def":"Text you copy and paste. Works in any agent.","more":"Rules that make the agent more careful on any request, and investigations that check one thing about your project and report back without changing it.","eg":"For example: Prove it wrong · Show the plan and wait · Follow one dollar"},"Skills":{"def":"Commands you type, such as /keen. Most need Agent Kit installed.","more":"Each runs a whole job the same way every time. Any /keen job can also be copied as plain instructions for an agent without Agent Kit.","eg":"For example: /keen critique · /motion review · /engineer"},"Recipes":{"def":"Prompts and skills in order, for a bigger job.","more":"Run one step at a time and read the result before the next.","eg":"For example: Fix a screen that feels off · A bug you can't explain"}}},"ledes":{"prompts":"Text you paste into any agent. Nothing to install. Investigations check your project and report back without changing files.","skills":"Commands you type in your agent. Each needs its Agent Kit plugin. Without Agent Kit, open any /keen job and copy its full instructions instead.","recipes":"A bigger job as prompts and skills in order. Some copy as one prompt for a single chat. The ones with commands or several investigations run one step per message, each with its own Copy."}},"keen":[{"id":"K:init","sec":"keen","group":"Set up and plan","t":"/keen init","cmd":"/keen init","use":"Nobody has written down who the product is for","kind":"Writes PRODUCT.md","line":"Writes PRODUCT.md: who the product is for and what it should feel like. Every other job reads it, so a critique judges against this product and not against design in general.","full":"You are doing one design job on this project's interface: init. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# init\n\nWrites PRODUCT.md: who the product is for and what it should feel like. Every other job reads it, so a critique judges against this product and not against design in general.\n\nInteractive. Writes one file.\n\n## If PRODUCT.md already exists\n\nRead it. Do not overwrite it, whatever tool wrote it. Say in three lines what it covers and what is missing from the list below, and ask whether to fill the gaps. Add only what they approve, keeping their wording and structure.\n\n## Steps\n\n1. **Learn what you can without asking.** Read the README, the home or landing screen, the sign-up flow, the navigation labels and any marketing copy. Open the running product if you can. Draft an answer to every item below from what you find.\n2. **Ask only what the project could not tell you.** Put the questions in one message, six at most, each with your drafted answer so a \"yes\" is enough. Typical gaps: who exactly uses it, what they are in the middle of when they open it, and what it must never feel like.\n3. **Write the file once the questions are answered.** The answers are the yes; do not ask again. If the person does not answer, or you are running where nobody can, write it from your drafted answers and mark each guessed line with \"(guessed: check this)\" so it is easy to find.\n\nThe file goes in the project root, beside the README. When the product is one folder of a larger repository, it still goes in the repository root unless an agent instruction file there says each product keeps its own notes.\n\n## What goes in the file\n\nKeep it under one page. Short sentences. No adjectives that could describe any product (\"clean\", \"modern\", \"intuitive\").\n\n- **What it is**, in one sentence a stranger would understand.\n- **Who uses it.** One to three kinds of people, each with what they are trying to get done and how much patience they have. A real example beats a persona.\n- **The moment of use.** Where they are and what they are doing when they open it: at a desk for an hour, or on a phone for ten seconds between other things.\n- **The one thing each main screen is for.** A line per screen. If a screen has two jobs, write both and note it.\n- **How it should feel**, as three plain contrasts: \"calm, not sparse\", \"dense, not cramped\". The second half of each is the mistake to avoid.\n- **What must never happen.** The failures that would cost trust: a wrong number shown as right, a lost draft, a surprise charge.\n- **Products it should sit beside.** Two or three the users already know, and what to take from each.\n\n## Report\n\nFollow the report shape in SKILL.md. The Keen page for this job has no screenshot and no problems: the headline says the file was written, and `also` lists the guessed lines to check. \"What you need to do\" is usually to read the file once and correct anything that sounds wrong. If there is no DESIGN.md, say so under \"Not checked\" and that Keen cannot write one yet.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:document","sec":"keen","group":"Set up and plan","t":"/keen document","cmd":"/keen document","use":"The design exists on screen but is not written down anywhere","kind":"Writes DESIGN.md","line":"Writes down the design the product already has, in a DESIGN.md that every later job reads: its colours, text sizes, spacing, shapes, components and the reasons behind them.","full":"You are doing one design job on this project's interface: document. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# document\n\nWrites down the design the product already has, in a DESIGN.md that every later job reads: its colours, text sizes, spacing, shapes, components and the reasons behind them.\n\nInteractive. Writes or updates DESIGN.md. Changes no screen.\n\n## The idea\n\nEvery editing job in Keen says \"use the project's own values\". When nobody has written them down, each job has to guess them again from the code, and each guess is slightly different. DESIGN.md is the product's memory. It is written from what is really on the screens, by measuring, and not from what anyone meant to build. Where the screens disagree with each other, the file does not record both: it asks which one is right.\n\n## Steps\n\n1. **Pick the screens that matter**: the four to six a person uses most. PRODUCT.md usually says which. If there is already a DESIGN.md, read it first; this job then checks it against the screens and updates it.\n2. **Measure each screen**, at 390 and 1440 wide. Open it, capture it, and run `node \u003cskill-dir>/scripts/measure.mjs`, running what it prints inside the page. Collect the text styles (size, weight and line height), font families, colours and corner shapes with how often each is used; they are under `variety`. Spacing and shadows are not measured: read them from the stylesheet. Read the theme or token file too, if there is one, for the names the code already uses.\n3. **Find the system inside the numbers.** For each kind of value, the ones used often are the system and the ones used once or twice are strays. Write down the system. List the strays separately.\n4. **Find the repeated parts**: buttons, fields, cards, lists, menus, dialogs, messages. For each, note its variants and where a good example lives.\n5. **Collect the decisions.** Read the notes people left in the code and in PRODUCT.md about why something is the way it is. A decision with its reason is the most valuable line in the file, because it stops the next job from undoing it.\n6. **Ask once.** Put every real conflict to the person in one message, each with your recommendation: \"Buttons have 6px corners on four screens and 10px on two. Which is right? I'd say 6px.\" Do not ask about strays that are plainly mistakes.\n7. **Write the file once the conflicts are answered.** The answers are the yes. A conflict nobody answered goes under Open questions with your recommendation; do not ask it a second time in the report. If nobody can answer, write the file from your recommendations and list them all there.\n8. **Check what points at it.** Search the project for mentions of DESIGN.md (PRODUCT.md, the agent instruction files, the README) and say if any now describes something the file does not hold.\n\n## What goes in DESIGN.md\n\nKeep it under 200 lines. Someone should be able to read it in five minutes.\n\n| Section | Holds |\n|---|---|\n| How it should feel | Three or four words, and one sentence on what that rules out |\n| Colour | Each colour's name, value and purpose. Which pairs are used for text, with their measured contrast |\n| Text | The ladder: each style's purpose, size, weight and line height. The font families and where each is used |\n| Space | The set of spacing values, and the usual gap inside a group and between groups |\n| Shape | Corner sizes, border weight and colour, the shadows in use and what each is for |\n| Components | Each repeated part, its variants, and where the best example lives |\n| Words | How the product addresses people, its names for its own things, and any words it avoids |\n| Sizes | The screen widths the product supports and what changes at each |\n| Decisions | Each choice someone made on purpose, with the reason and the date if known |\n| Open questions | Conflicts nobody has settled yet |\n\n## Rules\n\n- **Record what is there.** Do not improve the design in the file. If a colour fails contrast, record it and list it under open questions with the measured ratio.\n- **Purpose before value.** \"Accent: things you can press\" is useful to the next job. A bare value is not.\n- **Plain words.** The owner reads this file too. Explain a term the first time it appears.\n- **Do not copy the code.** Name where the values live and keep the file about meaning.\n- **Keep what was there.** When updating an existing DESIGN.md, keep every decision already written unless the person says it has changed.\n\n## What comes next\n\nOffer as next steps: `/keen extract` if the strays are many, to move them onto the system; `/keen colour` or `/keen type` if the measurements showed text that is hard to read.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say how many screens were measured and what was found in plain numbers (\"five text sizes do most of the work; nine more appear once or twice\"). The Keen page for this job has no screenshot and no problems. \"What you need to do\" is to read the file once; name the open questions that are left, without asking them again. Under Details, the strays with where each appears. Under \"Not checked\", the screens you did not measure.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, d
