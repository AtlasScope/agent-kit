a:sepia-write","p":"/sepia:sepia-write release notes for v2.3","why":"Writes a new piece under the rules for its format.","dmode":"Changes code"},{"id":"UI097","sec":"dcmd","group":"Sepia","sub":"Commands","badge":"plugin · v0.12.4","gnote":"Research-based de-AI writing that fixes how a piece is built as well as its words. Has separate rules for release notes, PR and issue replies, code-review comments, incident write-ups (postmortems), tickets, technical articles and fiction.","best":"Professional writing with a known format, where the structure gives it away: release notes, PR replies, incident write-ups.","skipw":"A quick one-paragraph cleanup. Humanizer is faster.","note":"","t":"/sepia:sepia-hemingway","cmd":"/sepia:sepia-hemingway","p":"/sepia:sepia-hemingway revise this short story","why":"Fiction writing in a spare, Hemingway-style voice.","dmode":"Changes code"},{"id":"UI098","sec":"dcmd","group":"slop-guard","sub":"Commands","badge":"skill + CLI · v0.5.0","gnote":"A rule-based checker that scores text 0 to 100 for formulaic AI writing. No AI does the judging, so the same text gets the same score every time.","best":"A quick, objective check on a draft, a README, or a whole docs folder before you ship it.","skipw":"Repo-wide style rules you want enforced on every PR. Vale does that.","note":"","t":"/slop-guard","cmd":"/slop-guard","p":"/slop-guard README.md","why":"Runs the slop-guard checker on a file, folder or pasted text and explains the top problems.","dmode":"Report only"},{"id":"UI099","sec":"dcmd","group":"slop-guard","sub":"Commands","badge":"skill + CLI · v0.5.0","gnote":"A rule-based checker that scores text 0 to 100 for formulaic AI writing. No AI does the judging, so the same text gets the same score every time.","best":"A quick, objective check on a draft, a README, or a whole docs folder before you ship it.","skipw":"Repo-wide style rules you want enforced on every PR. Vale does that.","note":"","t":"sg -v \u003cpath>","cmd":"sg -v \u003cpath>","p":"sg -v docs/*.md","why":"The slop-guard checker itself, run in a terminal.","dmode":"Report only"},{"id":"RC01","sec":"recipe","group":"Design recipes","t":"New landing page","why":"From blank to a shipped page that does not look templated.","steps":[["/impeccable init","once per project, so later passes know the brand"],["/hallmark \u003cprompt>","build the page in a chosen genre"],["/break-ui","stress the hero and cards with ugly data"],["/web-design-guidelines \u003cpath>","rule check before shipping"],["/impeccable polish","final spacing and detail pass"]],"p":"New landing page. From blank to a shipped page that does not look templated.\nRun these in order, and check in with me between steps:\n1. /impeccable init: once per project, so later passes know the brand\n2. /hallmark \u003cprompt>: build the page in a chosen genre\n3. /break-ui: stress the hero and cards with ugly data\n4. /web-design-guidelines \u003cpath>: rule check before shipping\n5. /impeccable polish: final spacing and detail pass","dmode":"Changes code"},{"id":"RC02","sec":"recipe","group":"Design recipes","t":"New dashboard or tool","why":"Product screens with a design system that stays consistent next session.","steps":[["/impeccable shape","agree the screen's job and layout first"],["/interface-design","build it and save system.md"],["/break-ui","long names, zero rows, huge numbers"],["/impeccable harden","error, loading and empty states"],["/interface-design:design-review","strict approval pass"]],"p":"New dashboard or tool. Product UI with a system that stays consistent next session.\nRun these in order, and check in with me between steps:\n1. /impeccable shape: agree the screen's job and layout first\n2. /interface-design: build it and save system.md\n3. /break-ui: long names, zero rows, huge numbers\n4. /impeccable harden: error, loading and empty states\n5. /interface-design:design-review: strict approval pass","dmode":"Changes code"},{"id":"RC03","sec":"recipe","group":"Design recipes","t":"This page kind of stinks","why":"Find out why, then fix the worst of it. Stays inside your design system.","steps":[["/impeccable critique \u003cpage>","scored review: what's wrong and what to fix first"],["/impeccable typeset","if the critique flagged hierarchy or type"],["/impeccable layout","if it flagged spacing or structure"],["/impeccable colorize","if it flagged flat or muddy color"],["/impeccable polish","tidy up after the bigger passes"]],"p":"This page kind of stinks. Find out why, then fix the worst of it. Stays inside your design system.\nRun these in order, and check in with me between steps:\n1. /impeccable critique \u003cpage>: scored review: what's wrong and what to fix first\n2. /impeccable typeset: if the critique flagged hierarchy or type\n3. /impeccable layout: if it flagged spacing or structure\n4. /impeccable colorize: if it flagged flat or muddy color\n5. /impeccable polish: tidy up after the bigger passes","dmode":"Changes code"},{"id":"RC04","sec":"recipe","group":"Design recipes","t":"Rethink it, rules off","why":"Let it suggest new fonts, colors and hierarchy even if that breaks the design system.","steps":[["/impeccable critique \u003cpage>, ignore DESIGN.md and suggest new fonts, colors and hierarchy","a critique that isn't held to the current system"],["/prototype \u003cpage> x3","three different directions to look at side by side"],["/impeccable bolder","push the winner further"],["/impeccable document","save the new look as the design system"]],"p":"Rethink it, rules off. Let it suggest new fonts, colors and hierarchy even if that breaks the design system.\nRun these in order, and check in with me between steps:\n1. /impeccable critique \u003cpage>, ignore DESIGN.md and suggest new fonts, colors and hierarchy: a critique that isn't held to the current system\n2. /prototype \u003cpage> x3: three different directions to look at side by side\n3. /impeccable bolder: push the winner further\n4. /impeccable document: save the new look as the design system","dmode":"Changes code"},{"id":"RC05","sec":"recipe","group":"Design recipes","t":"It looks AI-generated","why":"Rescue a bland or generic screen without starting over.","steps":[["/interface-design:design-deslop","strip the generic tells"],["/impeccable typeset","real type hierarchy"],["/impeccable bolder","give it a point of view"],["/impeccable polish","tidy what the bigger passes left"]],"p":"It looks AI-generated. Rescue a bland or generic screen without starting over.\nRun these in order, and check in with me between steps:\n1. /interface-design:design-deslop: strip the generic tells\n2. /impeccable typeset: real type hierarchy\n3. /impeccable bolder: give it a point of view\n4. /impeccable polish: tidy what the bigger passes left","dmode":"Changes code"},{"id":"RC06","sec":"recipe","group":"Design recipes","t":"Motion done properly","why":"Add animation where it helps and nowhere else.","steps":[["/find-animation-opportunities","read-only list of where motion earns its place"],["/animate","build the chosen ones"],["/review-animations","check against the ten standards"],["/animation-performance","only if anything drops frames"]],"p":"Motion done properly. Add animation where it helps and nowhere else.\nRun these in order, and check in with me between steps:\n1. /find-animation-opportunities: read-only list of where motion earns its place\n2. /animate: build the chosen ones\n3. /review-animations: check against the ten standards\n4. /animation-performance: only if anything drops frames","dmode":"Changes code"},{"id":"RC07","sec":"recipe","group":"Design recipes","t":"Pre-ship check","why":"Catch problems before users do. The first three only report.","steps":[["/impeccable audit","accessibility, performance, theming, scored"],["/web-design-guidelines \u003cpath>","file:line rule findings"],["example-skills:webapp-testing","click through the real flow in a browser"],["/impeccable polish","fix what the reports found"]],"p":"Pre-ship ch bsite, November 2026."},"symptoms":[["Numbers on screen don't match the source",["D01","D02","A04","G05","PG01"]],["A workflow got slow, or database cost jumped",["P01","P02","P03","P04"]],["Tests are green but production keeps breaking",["T01","T02","I02","S06"]],["Agents break nearby features on small edits",["A01","A02","R03","G01"]],["Things happen twice, or not at all",["R01","R05","D04","I04"]],["Merged but not live, or a deploy broke something",["I02","G02","S06","I05"]],["Worried about who can see or change what",["T03","T05","G03","S06"]],["The app hangs when an outside service is down",["G04","P09","R02","R06"]],["Your computer is full or browser tests are flaky",["I07","I01","T01"]],["Users get lost, or Back and shared links misbehave",["R07","A08","A01","T01"]],["Animations stutter, lag or all feel different",["MO02","MO01","MO04","MO03"]]],"composer":{"mode":{"read":["Read-only","Treat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence."],"repro":["Reproducer only","You may add a failing test or a small reproduction script for the highest-risk finding. Do not change application code, data or configuration."],"change":["Propose a fix","After reporting, propose the smallest fix for the top confirmed finding as a diff for my review. Do not apply it to production, run migrations, or delete anything."]},"scope":{"repo":["Whole repo",""],"branch":["This branch","Limit this to files changed on the current branch (git diff main...HEAD) and their direct callers."],"slice":["One slice first","Start with one high-traffic route, module or entity. Report on that slice, then stop before scanning the rest."]},"footer":"End with a table I can paste into my playbook, one row per finding:\n| ID | Project | Verdict (Clean / Suspect / Confirmed) | Evidence | False-positive notes |"},"routines":[["After a big feature or change","Check the whole path people use through what changed, what it touches, and that nothing old broke.","Stick to what changed. A small change doesn't need a check of everything."],["Weekly, if something changed","Recent changes that show signs of slowing down, failing at random, or deploy or accuracy trouble.","Skip it when nothing important was merged and nothing looks different."],["Monthly","Problems you already know about: tests that fail at random, risky packages, wasted check time, work done over and over.","Start with the known problem areas. Don't rerun checks on things that haven't changed."],["Quarterly","Whether the overall design still fits, how much growth it can take, who owns what, and old shortcuts that now cost you.","Only when the system or the evidence has changed."],["After something breaks","The real cause, a test that shows the problem, and a fix for the shared cause.","Stop once it can't happen again. Don't set up anything permanent by default."]],"stages":[["start","Start a project","Do these once per project, before any design work. Everything later reads what they write.",[["Teach Claude who the users are and what the brand is","/impeccable init"],["Write down the design system the code already has","/impeccable document"],["Styles have drifted into copies of each other","/impeccable extract"],["Repo docs need a prose linter","/vale:setup"],["Get a design check after every UI edit","/impeccable hooks on|off|status"],["Not sure where to start in this project","/impeccable"],["Decide once how this product should move","/motion setup"]]],["plan","Plan","Before any code. Agree what the screen is for and look at a few options.",[["Plan a new screen before writing code","/impeccable shape"],["See a few real directions before committing","/prototype","/impeccable generate"],["Choose a library for a task","/pick-ui-library"],["Don't know the name for an effect","/animation-vocabulary"],["Settle a design argument with a quick test","/lean-ux"],["Understand why people stop coming back","/improve-retention","/hooked-ux"],["Plan a hero or page entrance before coding it","/motion storyboard"]]],["build","Build","Pick the builder that matches what you are making.",[["A marketing or landing page","/hallmark \u003cprompt>","example-skills:frontend-design"],["A dashboard, admin screen or tool","/interface-design"],["First-run flow or empty states","/impeccable onboard"],["One interaction that has to feel exactly right","/animate","/impeccable animate"],["Touch, drag, sheets and springs","/apple-design"],["A native iPhone screen","/ios-hig-design","/swiftui-pro"],["A chart or dashboard tile","/dataviz"],["A big multi-view artifact","example-skills:web-artifacts-builder"],["A real image: hero, illustration, texture","/image"]]],["review","Review","Get a second opinion before changing anything. Most of these only report back.",[["This page kind of stinks. Tell me why.","/impeccable critique \u003cpage>"],["Rethink it, even if it breaks the design system","/impeccable critique \u003cpage>, ignore DESIGN.md","/prototype \u003cpage> x3"],["Review a whole screen's UX","/impeccable critique","/interface-design:design-review"],["Review one component's polish","/emil-design-eng"],["Accessibility and best-practice rules","/web-design-guidelines \u003cfile-or-pattern>","/impeccable audit"],["See what breaks with ugly data","/break-ui"],["Click through the real flow in a browser","example-skills:webapp-testing"],["Check existing motion","/review-animations","/motion review"],["Be brutal about it, then fix the easy things","/harsh-review","/steve-jobs-design-review"],["A usability audit by the book","/ux-heuristics"],["Prove it works at every screen size","/viewport-proof"]]],["refine","Refine the look","It works, but it doesn't look right yet.",[["It looks AI-generated","/interface-design:design-deslop","/impeccable bolder"],["Too busy or cluttered","/impeccable distill","/impeccable quieter"],["Type feels off","/impeccable typeset","/web-typography"],["I want to choose a palette and see the options","/palette-builder","/oklch-skill"],["Palette scale, dark mode or contrast","/oklch-skill","/color-expert"],["Spacing and rhythm feel off","/impeccable layout"],["Flat and gray","/impeccable colorize"],["Tune one element live in the running app","/impeccable live"],["Find where motion would help","/find-animation-opportunities","/motion review"],["Add a little personality","/impeccable delight"],["Buttons and toggles feel dead","/microinteractions","/impeccable animate"],["Make it cinematic","/top-design","/impeccable overdrive"],["Hierarchy looks amateur","/refactoring-ui","/impeccable layout"]]],["ship","Harden and ship","Odd cases, speed, phones, and the final pass.",[["Edge cases, errors, loading and empty states","/impeccable harden"],["Confusing labels and error messages","/impeccable clarify","/ux-writing"],["Landing copy that has to convert","/copywriting","/cro"],["Make a web app feel native on iPhone","/mobile-native","/impeccable adapt"],["A native iOS or Android app follows the platform rules","/impeccable audit","/impeccable adapt"],["Slow page or heavy bundle","/impeccable optimize"],["Animation stutters","/animation-performance","/motion fix"],["Final pass before shipping","/impeccable polish"]]],["writing","Words","READMEs, pull request descriptions, docs and emails.",[["I hate how this text reads. Just fix it.","/fix-writing"],["Write something new that can't sound like AI","/stop-slop","/sepia:sepia-write"],["This text sounds like AI wrote it","/humanizer","/sepia:sepia-refactor"],["Release notes, PR replies or a postmortem","/sepia:sepia"],["How AI-sounding is this draft, by the numbers?","/slop-guard"],["Find AI-sounding prose across a repo","vale \u003cpath>","/vale:triage"],["Fix the error-level alerts","/vale:fix"],["Vale flags a correct product name","/vale:vocab"],["Lint docs on every pull request","/vale:ci"]]]],"overlaps":[["Review a built UI",[["/impeccable critique","Scores the whole screen's usability and layout, and tests it as different kinds of users"],["/interface-design:design-review","A strict quality review with a pass-or-fail bar"],["/emil-design-eng","Fine polish on one component"],["/hallmark audit \u003cpath>","Checks marketing pages against Hallmark's minimum standard"]],"Critique for a whole screen. Design-review for app screens you want held to a high bar. Emil for one component. Hallmark audit only for pages Hallmark would build."],["Rule and accessibility checks",[["/web-design-guidelines \u003cpath>","Vercel's current rule list, with the file and line for each problem"],["/impeccable audit","Accessibility, speed and light and dark themes, ranked from most to least urgent"]],"Guidelines for a quick checklist with clear answers. Audit when you also want speed and themes checked and ranked."],["Build a new page",[["/hallmark \u003cprompt>","Marketing pages in many different styles"],["/interface-design","App screens, saving the design rules for next time"],["example-skills:frontend-design","Quick and light, nothing to set up first"],["/impeccable shape","Knows your project once you have run init"]],"Hallmark for anything the public will see. Interface Design for tools and dashboards. Frontend-design for quick throwaways."],["Animation",[["/animate","Builds one animation carefully, following Emil Kowalski's order of decisions"],["/impeccable animate","Motion as part of a broader design pass"],["/apple-design","Motion that follows your finger: swipes, drags and springs"],["/motion","Agent Kit's own motion command: checks its work with frame captures and keeps one set of values in MOTION.md"]],"/animate for one interaction you want exactly right. Impeccable animate for a light pass over a screen. Apple-design when touch and drag are involved. /motion when you want the result checked frame by frame, or the whole product's motion made consistent."],["Variants to choose from",[["/prototype","Three or more different versions of something new"],["/impeccable generate","Several versions of something that already exists"],["/impeccable live","Swaps versions in live while your app runs"]],"Prototype when the idea is new. Generate or live when the thing exists and you are fine-tuning it."],["Make it less generic",[["/interface-design:design-deslop","Removes the signs that AI made it"],["/impeccable bolder","Gives it a clear point of view"],["/impeccable delight","Adds small touches of personality"]],"Deslop first to remove the defaults, then bolder. Delight last, and only a little."],["Fix AI-sounding writing",[["/fix-writing","Picks the right one of these for you"],["/humanizer","Rewrites one piece of text"],["/stop-slop","Strict rules while you write something new"],["/sepia:sepia","Knows formats like release notes, pull request replies and incident write-ups"],["/slop-guard","Gives a score only and never edits"],["/vale:fix","Rule-based fixes across a whole repo"],["/impeccable clarify","Words in the app: labels, buttons and error messages"]],"Not sure? /fix-writing chooses. Stop-slop to write clean from the start. Humanizer to fix a draft, especially one with facts in it. Sepia when the format matters. Slop-guard to measure. Vale across many files. Clarify for words inside the app."],["Be critical about a design",[["/impeccable critique","A scored usability review that changes nothing"],["/harsh-review","Blunt, backed by evidence, and makes the small fixes"],["/steve-jobs-design-review","Only about simplicity and focus"],["/ux-heuristics","Usability checked against Nielsen's ten rules"],["/interface-design:design-review","A quality bar for app screens"]],"Critique to understand what is wrong. Harsh review when you want it said bluntly and the easy fixes done. Steve Jobs review to decide what to cut. Heuristics for usability. Design-review for dashboards."],["Color and type",[["/impeccable colorize","Adds color as part of a design pass"],["/palette-builder","Compares whole palettes on your own screens, for you to choose"],["/oklch-skill","Exact color steps, dark mode and readable contrast"],["/impeccable typeset","Fonts and text sizes as part of a design pass"],["/web-typography","Choosing and pairing fonts, size steps and how fonts load, in depth"]],"Impeccable for a pass over a screen. The palette builder when the person wants to choose the colors. The specialists when you need exact values or a font decision."],["Words in the interface vs on the page",[["/impeccable clarify","Fixes wording as part of a design pass"],["/ux-writing","The full rules for small app text: errors, empty screens and tone"],["/copywriting","Wording that sells on marketing pages"],["/fix-writing","Any writing, and picks the right rules"]],"Clarify for a quick pass. UX writing when the app's wording is the whole job. Copywriting when the page has to sell. Fix-writing for anything that isn't app text or marketing."],["Phones and native apps",[["/impeccable adapt","Changes the layout to fit each screen size"],["/mobile-native","Makes a web app feel like an app on a phone: taps, the notch, full-height screens"],["/ios-hig-design","Apple's patterns for a real iPhone app"],["/swiftui-pro","Reviews SwiftUI code"],["/viewport-proof","Proves it works at each size and changes nothing"]],"Adapt and mobile-native for websites on phones. HIG and SwiftUI Pro for a real iPhone app. Viewport proof only to prove the result before you ship."]],"reading":[{"t":"Harness design for long-running application development","by":"Anthropic","url":"https://www.anthropic.com/research/harness-design-long-running-apps","idea":"Planner, builder and evaluator roles, independent QA and file handoffs for multi-hour builds, with their costs.","str":"Primary, vendor research","st":"Link opens (checked 6 Nov)"},{"t":"Getting started with loops","by":"Anthropic","url":"https://claude.com/resources/articles/getting-started-with-loops","idea":"Turn-based, goal-based and time-based loops, how each verifies itself, and usage limits.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Claude Code best practices","by":"Anthropic","url":"https://code.claude.com/docs/en/best-practices","idea":"Current guidance on context files, planning, tool use and verification. Use this over secondhand summaries.","str":"Primary, official docs","st":"Link opens (checked 6 Nov)"},{"t":"Rethinking skills and prompts for GPT-6 Astra","by":"OpenAI","url":"https://developers.openai.com/blog/rethinking-skills-and-prompts-for-gpt-6-astra","idea":"Short triggers, progressive disclosure, and why long AGENTS.md files and skill piles hurt. Read before adding skills.","str":"Primary, vendor guide","st":"Link opens (checked 6 Nov)"},{"t":"Harness engineering","by":"OpenAI","url":"https://openai.com/index/harness-engineering/","idea":"Making repositories legible to agents, enforcing architecture mechanically, removing complexity.","str":"Primary, vendor essay","st":"Site blocks automated checks; open it yourself"},{"t":"Agent pull requests are everywhere: here's how to review them","by":"GitHub blog","url":"https://github.blog/ai-and-ml/generative-ai/agent-pull-requests-are-everywhere-heres-how-to-review-them/","idea":"How to review generated code and decide how much to trust it.","str":"Primary, vendor blog","st":"Link opens (checked 6 Nov)"},{"t":"Technology Radar: mattpocock/skills","by":"Thoughtworks, 4 Nov 2026","url":"https://www.thoughtworks.com/en-au/radar/tools/mattpocock-skills","idea":"Places the skills in Trial, not Adopt, and warns against adopting whole skill libraries uncritically.","str":"Independent assessment","st":"Link opens (checked 6 Nov)"},{"t":"Skills for real engineers","by":"Matt Pocock","url":"https://github.com/mattpocock/skills","idea":"Small composable skills split into ones you type and ones the agent reaches for.","str":"Primary source code","st":"Repo read in full for the kit, 6 Nov"},{"t":"A Philosophy of Software Design","by":"John Ousterhout","url":"https://web.stanford.edu/~ouster/cgi-bin/book.php","idea":"Deep modules (a lot of behavior behind a small interface) and designing it twice. The source of M12; Matt Pocock's codebase-design skill builds on both ideas.","str":"Primary, book","st":"Not checked from here; open it yourself"},{"t":"“Deepen modules and simplify interfaces”","by":"Chris (@_khrus), 7 Nov 2026","url":"https://x.com/_khrus","idea":"The one-line prompt in M12, run on every pull request and nightly. Credits Ousterhout's book and Matt Pocock.","str":"Practitioner post, author's claims","st":"Profile link; the post is from 7 Nov 2026"},{"t":"Trail of Bits skills","by":"Trail of Bits","url":"https://github.com/trailofbits/skills","idea":"Security and assurance skills, each its own plugin, many with evals.","str":"Primary source code","st":"Chosen plugins scanned, 6 Nov"},{"t":"Superpowers","by":"Jesse Vincent","url":"https://github.com/obra/superpowers","idea":"A full development method: brainstorm, plan, subagent build, verify before claiming done.","str":"Primary source code","st":"Inspected, 6 Nov; not installed"},{"t":"Code Health Check Prompt","by":"tinosingh","url":"https://github.com/tinosingh/Code-Health-Check-Prompt","idea":"Every finding needs file:line, command output or a commit; calibrate to the repo; grade confidence. Folded into D06.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Codebase review prompts","by":"markoverano","url":"https://github.com/markoverano/codebase-review-prompts","idea":"A broad performance and maintainability review prompt. Its per-line-count expectations are not used here.","str":"Small repo, author's claims","st":"Link opens (checked 6 Nov)"},{"t":"Hacker News","by":"Community","url":"https://news.ycombinator.com/","idea":"Practitioner discussion and critiques of agent tools. Evidence varies thread to thread.","str":"Discussion","st":"Monitor selectively"},{"t":"r/ClaudeCode","by":"Community","url":"https://www.reddit.com/r/ClaudeCode/","idea":"Day-to-day Claude Code tips and failure reports.","str":"Discussion","st":"Monitor selectively"}],"areaBlurb":{"Architecture and hidden complexity":"Spots where the way the code is built invites bugs: status spread across many places, words that change meaning between layers, and layers that cost more than they help.","Performance and scale":"Where time and money go as the data grows. Every claim here needs a measurement before and after.","Correctness and reliability":"What happens when something runs twice, fails, times out or happens in the wrong order, and whether people can tell a stand-in value from the real one.","Testing and security":"What the tests really prove, and where input from outside can reach something sensitive.","Infrastructure and environment":"The path from a merged change to the live site, what automated checks cost, and the computer the agents run on.","Data integrity and analytics":"Telling missing from zero, knowing where each number came from, and records whose meaning changes over time.","Agent harness and modern stack":"Newer kinds of trouble: out-of-date agent instructions, old and new versions running at once after a deploy, data leaking into pages, outside services going down, rounding errors, and screens that show a change before it is saved.","Start here":"One broad look when the database feels hard to trust or costly. If you can already name the problem, skip it and pick the narrower prompt.","Accuracy and evidence":"Proves the data is right, not just valid: rebuilt figures, whole populations, stable identities and past results that still reproduce.","Writes and ingestion":"Who writes what, how often it changes nothing, and whether imports survive retries and corrections.","Schema and dependencies":"Fewer objects, one home for each fact, and a model a new engineer or agent can read.","Performance and maintenance":"Where storage, time and write cost actually go, and what grows expensive first. Every claim needs a measurement.","Rebuild and safe change":"Changes and restores proved on a separate database before anyone relies on them.","Agent decisions":"Turns questions agents keep asking you into rules they can apply themselves.","Workflows":"Short routes through the database prompts for a whole job. Start with the first step and only take the optional ones when the evidence points there.","Motion":"How the interface moves: whether animation follows a system, what it costs, who it leaves out, and where it helps or gets in the way. Each prompt works in any agent. The motion-kit plugin's /motion runs the same checks with frame-by-frame captures."},"sources":{"intro":"Collected from two field guides, one for agent engineering and one for design skills, plus a set of everyday saved prompts. The skills it points to ship in this repo as plugins.","items":[["agent-kit on GitHub","https://github.com/AtlasScope/agent-kit","The design, engineering, experience-architecture and working-style plugins this library refers to, and the source of this page."]]},"dbSymptoms":[["The numbers don't match their source",["PG01","PG02","D02"]],["Records are merged, duplicated or lose history",["PG03","PG04","D05"]],["Imports rewrite everything or run twice",["PG06","PG08","PG07"]],["Nobody knows what writes to a table",["PG05","PG09","R05"]],["Too many views, functions and triggers",["PG10","PG11","PG12"]],["Postgres is slow or costs too much",["PG13","PG14","P03"]],["A migration is about to ship, or a restore is untested",["PG17","PG15","G02"]],["Agents keep asking me to decide",["PG16","M05"]]],"dbTools":{"supabase":["Supabase agent skills","https://github.com/supabase/agent-skills","Official skills for Supabase and Postgres work. Install with: claude plugin marketplace add supabase/agent-skills, then claude plugin install supabase@supabase-agent-skills. Other agents: npx skills add supabase/agent-skills."],"bestpractices":["Postgres best practices skill (Supabase)","https://github.com/supabase/agent-skills/blob/main/skills/supabase-postgres-best-practices/SKILL.md","Rules for queries, indexes, connections, locking and RLS. Works on any Postgres, not only Supabase. Install with: claude plugin install postgres-best-practices@supabase-agent-skills."],"pgss":["pg_stat_statements","https://supabase.com/docs/guides/database/extensions/pg_stat_statements","Postgres extension that counts how often each statement runs and how long it takes. Check it is enabled before trusting its numbers."],"advisors":["Supabase Advisors","https://supabase.com/docs/guides/observability/advisors","Built-in security and performance checks in the Supabase dashboard. Read their output rather than running another scanner."],"hypopg":["HypoPG","https://supabase.com/docs/guides/database/extensions/hypopg","Tests whether an index would help without building it. Optional, and not needed for most investigations."],"pgtap":["pgTAP database tests","https://supabase.com/docs/guides/local-development/testing/overview","SQL tests for rules and RLS policies. Run them on a local or branch database, never production."],"declarative":["Declarative schemas (Supabase)","https://supabase.com/docs/guides/local-development/declarative-database-schemas","Keep the desired schema in files and generate migrations from it. Weigh it against the migration workflow you already have."],"pgdocs":["PostgreSQL documentation","https://www.postgresql.org/docs/current/","The reference for exact behaviour. Check the version your database runs."]},"dbToolsVerified":"2026-11-07","keen":[{"id":"K:init","sec":"keen","group":"Set up and plan","t":"/keen init","cmd":"/keen init","use":"Nobody has written down who the product is for","kind":"Writes PRODUCT.md","line":"Writes PRODUCT.md: who the product is for and what it should feel like. Every other job reads it, so a critique judges against this product and not against design in general.","full":"You are doing one design job on this project's interface: init. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# init\n\nWrites PRODUCT.md: who the product is for and what it should feel like. Every other job reads it, so a critique judges against this product and not against design in general.\n\nInteractive. Writes one file.\n\n## If PRODUCT.md already exists\n\nRead it. Do not overwrite it, whatever tool wrote it. Say in three lines what it covers and what is missing from the list below, and ask whether to fill the gaps. Add only what they approve, keeping their wording and structure.\n\n## Steps\n\n1. **Learn what you can without asking.** Read the README, the home or landing screen, the sign-up flow, the navigation labels and any marketing copy. Open the running product if you can. Draft an answer to every item below from what you find.\n2. **Ask only what the project could not tell you.** Put the questions in one message, six at most, each with your drafted answer so a \"yes\" is enough. Typical gaps: who exactly uses it, what they are in the middle of when they open it, and what it must never feel like.\n3. **Write the file once the questions are answered.** The answers are the yes; do not ask again. If the person does not answer, or you are running where nobody can, write it from your drafted answers and mark each guessed line with \"(guessed: check this)\" so it is easy to find.\n\nThe file goes in the project root, beside the README. When the product is one folder of a larger repository, it still goes in the repository root unless an agent instruction file there says each product keeps its own notes.\n\n## What goes in the file\n\nKeep it under one page. Short sentences. No adjectives that could describe any product (\"clean\", \"modern\", \"intuitive\").\n\n- **What it is**, in one sentence a stranger would understand.\n- **Who uses it.** One to three kinds of people, each with what they are trying to get done and how much patience they have. A real example beats a persona.\n- **The moment of use.** Where they are and what they are doing when they open it: at a desk for an hour, or on a phone for ten seconds between other things.\n- **The one thing each main screen is for.** A line per screen. If a screen has two jobs, write both and note it.\n- **How it should feel**, as three plain contrasts: \"calm, not sparse\", \"dense, not cramped\". The second half of each is the mistake to avoid.\n- **What must never happen.** The failures that would cost trust: a wrong number shown as right, a lost draft, a surprise charge.\n- **Products it should sit beside.** Two or three the users already know, and what to take from each.\n\n## Report\n\nFollow the report shape in SKILL.md. The Keen page for this job has no screenshot and no problems: the headline says the file was written, and `also` lists the guessed lines to check. \"What you need to do\" is usually to read the file once and correct anything that sounds wrong. If there is no DESIGN.md, say so under \"Not checked\" and that Keen cannot write one yet.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call ber that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:document","sec":"keen","group":"Set up and plan","t":"/keen document","cmd":"/keen document","use":"The design exists on screen but is not written down anywhere","kind":"Writes DESIGN.md","line":"Writes down the design the product already has, in a DESIGN.md that every later job reads: its colours, text sizes, spacing, shapes, components and the reasons behind them.","full":"You are doing one design job on this project's interface: document. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# document\n\nWrites down the design the product already has, in a DESIGN.md that every later job reads: its colours, text sizes, spacing, shapes, components and the reasons behind them.\n\nInteractive. Writes or updates DESIGN.md. Changes no screen.\n\n## The idea\n\nEvery editing job in Keen says \"use the project's own values\". When nobody has written them down, each job has to guess them again from the code, and each guess is slightly different. DESIGN.md is the product's memory. It is written from what is really on the screens, by measuring, and not from what anyone meant to build. Where the screens disagree with each other, the file does not record both: it asks which one is right.\n\n## Steps\n\n1. **Pick the screens that matter**: the four to six a person uses most. PRODUCT.md usually says which. If there is already a DESIGN.md, read it first; this job then checks it against the screens and updates it.\n2. **Measure each screen**, at 390 and 1440 wide. Open it, capture it, and run `node \u003cskill-dir>/scripts/measure.mjs`, running what it prints inside the page. Collect the text styles (size, weight and line height), font families, colours and corner shapes with how often each is used; they are under `variety`. Spacing and shadows are not measured: read them from the stylesheet. Read the theme or token file too, if there is one, for the names the code already uses.\n3. **Find the system inside the numbers.** For each kind of value, the ones used often are the system and the ones used once or twice are strays. Write down the system. List the strays separately.\n4. **Find the repeated parts**: buttons, fields, cards, lists, menus, dialogs, messages. For each, note its variants and where a good example lives.\n5. **Collect the decisions.** Read the notes people left in the code and in PRODUCT.md about why something is the way it is. A decision with its reason is the most valuable line in the file, because it stops the next job from undoing it.\n6. **Ask once.** Put every real conflict to the person in one message, each with your recommendation: \"Buttons have 6px corners on four screens and 10px on two. Which is right? I'd say 6px.\" Do not ask about strays that are plainly mistakes.\n7. **Write the file once the conflicts are answered.** The answers are the yes. A conflict nobody answered goes under Open questions with your recommendation; do not ask it a second time in the report. If nobody can answer, write the file from your recommendations and list them all there.\n8. **Check what points at it.** Search the project for mentions of DESIGN.md (PRODUCT.md, the agent instruction files, the README) and say if any now describes something the file does not hold.\n\n## What goes in DESIGN.md\n\nKeep it under 200 lines. Someone should be able to read it in five minutes.\n\n| Section | Holds |\n|---|---|\n| How it should feel | Three or four words, and one sentence on what that rules out |\n| Colour | Each colour's name, value and purpose. Which pairs are used for text, with their measured contrast |\n| Text | The ladder: each style's purpose, size, weight and line height. The font families and where each is used |\n| Space | The set of spacing values, and the usual gap inside a group and between groups |\n| Shape | Corner sizes, border weight and colour, the shadows in use and what each is for |\n| Components | Each repeated part, its variants, and where the best example lives |\n| Words | How the product addresses people, its names for its own things, and any words it avoids |\n| Sizes | The screen widths the product supports and what changes at each |\n| Decisions | Each choice someone made on purpose, with the reason and the date if known |\n| Open questions | Conflicts nobody has settled yet |\n\n## Rules\n\n- **Record what is there.** Do not improve the design in the file. If a colour fails contrast, record it and list it under open questions with the measured ratio.\n- **Purpose before value.** \"Accent: things you can press\" is useful to the next job. A bare value is not.\n- **Plain words.** The owner reads this file too. Explain a term the first time it appears.\n- **Do not copy the code.** Name where the values live and keep the file about meaning.\n- **Keep what was there.** When updating an existing DESIGN.md, keep every decision already written unless the person says it has changed.\n\n## What comes next\n\nOffer as next steps: `/keen extract` if the strays are many, to move them onto the system; `/keen colour` or `/keen type` if the measurements showed text that is hard to read.\n\n## Report\n\nFollow the report shape in SKILL.md. In \"What happened\", say how many screens were measured and what was found in plain numbers (\"five text sizes do most of the work; nine more appear once or twice\"). The Keen page for this job has no screenshot and no problems. \"What you need to do\" is to read the file once; name the roof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- ** e instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# shape\n\nPlans a screen or feature that does not exist yet, before any of it is built. The result is a short brief and three rough layouts to choose from.\n\nInteractive. Writes one file, the brief, after a yes. Builds nothing.\n\n## The idea\n\nMost screens that need a critique later were built before anyone decided what they were for. Ten minutes here is cheaper than any job that fixes a screen afterwards. Shape answers four things in this order: who is here, what they came to do, what they need in front of them to do it, and how it could be arranged. The arrangement comes last on purpose.\n\n## Before you start\n\nRead PRODUCT.md and DESIGN.md. Look at two or three screens the product already has, so the new one belongs with them. If there is no PRODUCT.md, stop and suggest `/keen init`.\n\n## Steps\n\n1. **Ask once.** Put every question below that the project's files and the request do not already answer into a single message, each with your best guess as the default, so the person can reply \"yes to all\" or correct one. Skip any you can answer yourself. Ask the five that matter most, never more.\n   - Who lands on this screen, and what did they just do before arriving?\n   - What is the one thing they come here to do? What tells them they are done?\n   - What do you already have to show them? Real things that exist today, not things that would be nice. If the content does not exist yet, who will write it and keep it current?\n   - What must never happen on this screen?\n   - Is anything fixed: a deadline, an existing screen it must match, a phone-first audience?\n2. **Write the screen's job in one sentence.** \"A returning customer reorders last month's box in two taps.\" If the sentence needs \"and\", it is two screens. Say so and ask which comes first.\n3. **List the content, ranked.** Everything the person needs to see or do, in three groups: needed to do the job, helpful, and can wait for another screen. Use real examples from the product where they exist, with a realistic longest and shortest case. Nothing goes on the list because screens of this kind usually have it.\n4. **Walk the path.** Number the steps from arriving to done. Then name the states this screen will have: nothing yet, loading, a failure, too much, not allowed. One line each on what the person sees.\n5. **Sketch three arrangements that differ in kind**, not in decoration. They should disagree about what comes first or how the work is split, for example one long page, a step at a time, or a list beside a detail. Draw each as a plain grey wireframe: boxes, real labels, no colour, no styling, at phone width first. Draw them in a temporary folder outside the project, as whatever you can turn into a picture fastest (a throwaway page opened in the browser is fine), and take one screenshot of each. The pictures are what the person sees; the throwaway files are not handed over. For each, one line on what it is best at and one on what it costs.\n6. **Recommend one** and say why in two lines, tied to the job sentence.\n7. **Show it** on the Keen page.\n   - `verdict`: the job sentence.\n   - `shots`: the three sketches, captioned A, B and C with each one's name.\n   - `steps`: one per arrangement, the recommended one marked suggested. The label is the arrangement's name, the why is what it is best at and what it costs, and the command is `/keen shape \u003cscreen>: write the brief for arrangement A (\u003cits name>)`.\n   - `also`: the content needed to do the job, most important first. The path and the states go under `details` now and into the brief next.\n   - No `problems`.\n8. **When they pick, write the brief.** The pick arrives as that command, from the page or typed. Write it to `docs/design/\u003cscreen>.md`, or wherever the project already keeps this kind of note. It holds the job sentence, the ranked content, the path, the states and the chosen arrangement with its sketch. Under 60 lines. This is the file the build reads.\n\n## Rules\n\n- **No visual design.** No colours, fonts or polish in the sketches. Anything that looks finished gets judged on how it looks, and the question here is what goes where.\n- **Real content only.** A sketch with placeholder text hides the problems real text causes. If the real content does not exist yet, write the most realistic example you can and mark it as made up.\n- **Small first.** Draw the phone arrangement before the wide one. What survives at 390 wide is what matters.\n- **Count the steps.** Each arrangement says how many taps the job takes. Fewer is better only when nothing needed is hidden to get there.\n\n## What comes next\n\nOffer these as next steps once the brief is written:\n\n1. Build the screen from the brief. Give the person a plain request they can start: \"Build the \u003cscreen> from the brief at \u003cpath>, using the product's existing components.\"\n2. After it is built, `/keen harden` for the states the brief lists, then `/keen polish`.\n\n## Report\n\nFollow the report shape in SKILL.md. \"What happened\" names the screen's job and the arrangement recommended. \"What you need to do\" is to pick an arrangement. Under \"Not checked\", anything in the brief that rests on a guess you made for the person.\n\n## Rules for every job\n\n1. **Look at the real screen.** Open it in a browser or simulator and take screenshots. If the live product will not open or sits behind a sign-in, look for a way to run it on this computer with sample data (the README and the project's agent instructions usually say how) before giving up. If you cannot run it at all, say so in the first line, work from the code, and say at the end that nothing was seen. A page that shows but does not react is not running: press one control and see it respond before judging how anything behaves (a development server often works only at the exact address it printed when it started). If the request names something the screen does not have (\"the filters\" on a page with none), say so in one line and work on what is there.\n2. **Read the project's own rules.** AGENTS.md or CLAUDE.md, PRODUCT.md and DESIGN.md come before your taste (in a long file, read the general rules and search for the screen's name; you do not need every section), and so do the notes written in the code of the screen you are working on. Read those notes before you judge or change it. The person outranks their own notes: when they ask for a change, or start a step from the worksheet, that is the decision, even if an older note says otherwise. Say in one line which note you are changing, make the change, and update the note so the code and its notes still agree. Stop only when the request rests on something that turned out not to be true (the thing you said was broken is not broken): say so, and offer what is actually worth doing instead. Where the project has a colour, size or spacing value, use it. Keen never authorizes a commit, merge or deploy.\n3. **Ask once, then go.** If something must be decided by the person, ask every such question together before you start, then finish without stopping. A job that only reports asks at most one question. A job that edits says what it will do in five lines or fewer (skip this when the change is one or two lines) and starts, unless the session-start note says ask before edits is on, in which case it waits for a yes.\n4. **Stay inside the target.** Change the screen or component they named. List anything you noticed elsewhere at the end. Do not fix it. A part this screen shares with other screens (a card, a header, a shared style) is inside the target only when the change is right everywhere that part appears; check those places, or leave it and list it.\n5. **Never remove something a person can do.** Hiding, moving or merging a control is design work. Deleting a capability needs a yes first.\n6. **Leave nothing worse.** After an edit, compare the after with the before as a stranger would, at both sizes. Anything that got worse is fixed or undone before you report. The report never lists damage you could see and chose to ship.\n7. **Do not manufacture work.** When the screen already does what the job is for, say so in the first line, fix only what is actually off, and report a small change as a small change.\n8. **One job.** If the job turns out to be the wrong one (asked to polish a screen whose structure is the problem), stop, say so in two lines and name the job that fits. That is the whole reply: no report and no Keen page, only the two lines and the command for the right job. Do this before starting anything up.\n\n## The report\n\nEvery job ends with this, in this order.\n\n```text\nWhat happened: \u003cone or two sentences>\nWhat it means: \u003cwhat is different for the people using the product>\n\n\u003cWhat the job found or changed, in the form its own file asks for: a critique's problems, an audit's table, an edit's before and after. Leave this out when the two lines above say it all.>\n\nWhat you need to do: \u003c\"Nothing\", or \"Pick a next step\" followed by the next steps below>\nProof: \u003cwhat to look at: the page, the screenshots, the numbers>\n\nDetails\n\u003cfiles and lines changed, commands run, values used>\n\nNot checked: \u003cwhat you could not see or test>\n```\n\nLeave out nothing from \"Not checked\". A report that claims more than was tested is worse than a short one.\n\nA short report is a good report. When a screen does its job, say so and list only what you found. Do not stretch one small finding to the length of a page in trouble.\n\n### Writing the report\n\nThe reader runs the product and may never have opened its code. Write for them, then check the draft against these before sending it. If a skill named `fix-writing` appears in this tool's list of skills, apply its rules to the report as well.\n\n- **No commands, file names, code or settings names above the Details line**, with one exception: the commands offered as next steps. Say what you did in ordinary words: \"I ran the product on this computer with its built-in sample data\", not the command that did it. The command goes under Details.\n- **Use the words on the screen.** Call things what the product calls them (\"the Needs you list\"), not what the code calls them.\n- **A number comes with what it means, and with what it is a number of.** \"61 of 95 buttons are smaller than a fingertip can hit reliably\" before \"under 44 points\". Say which things they are when that changes how much it matters: twelve footer links a few points short is not the same finding as the main button being too small.\n- **When a technical term has to appear, teach it once, in one sentence, the first time.** \"Contrast is how much the text stands out from what is behind it; 4.5 to 1 is the level the accessibility standard asks for.\" After that, use it freely. Never stack two unexplained terms in one sentence.\n- **Details are for the person who wants them.** Keep them complete and exact, and put them where they can be skipped: collapsed if the page can collapse, last if it cannot.\n- **Short.** If a sentence would survive being cut, cut it.\n\n### Next steps\n\nWhen there is something to do next, do not hand over one command as a line of text. Offer up to three next steps, chosen for this screen from what you found, and list them in the order they should run.\n\nFor each: the command, one plain line on what it will do, and one on why it ranks where it does. Mark the most valuable one as the suggestion. If it is not first in the list, say in one line what has to come before it and why.\n\nWhen two or more belong together, say in one line why they run in the order listed. The order that wastes the least work is: remove (`distill`), arrange (`layout`), reword (`words`), then style (`type`, `colour`, `bolder` or `quieter`), then make it hold up (`harden`, `adapt` or `native`, `optimize`), and `polish` last, because every earlier job changes what there is to polish. `extract` runs after the look is settled. Running several still means one job at a time, with a report after each.\n\nLook past Keen too. When what you found is not a design problem (a slow screen, a number that looks wrong, pages that duplicate each other), offer the Agent Kit command that handles it as a next step, in the same list, if it appears in this tool's list of commands (if you cannot see that list, offer it and say which kit it needs): `/motion` for movement, `/engineer` for speed and code problems, `/database` for wrong or slow data.\n\nThe person never has to type any of this. The Keen page below turns each next step into something they pick and start."},{"id":"K:critique","sec":"keen","group":"Find out what is wrong","t":"/keen critique","cmd":"/keen critique","use":"Something feels off and they want to know what and why","kind":"Report","line":"Says what is wrong with a screen, in order of how much it matters, and which job would fix each thing.","full":"You are doing one design job on this project's interface: critique. Follow these instructions. Where a step mentions a Keen script or worksheet you do not have, do the same thing by hand and say so in the report.\n\n# critique\n\nSays what is wrong with a screen, in order of how much it matters, and which job would fix each thing.\n\nReport only. Changes nothing. Asks at most one question.\n\n## Before you start\n\nIf PRODUCT.md does not say what this screen is for and you cannot tell from the screen, ask that one question and stop: \"What is the one thing someone comes to this screen to do?\" Every judgment below depends on the answer.\n\n## Steps\n\n1. **Capture it.** Screenshots at 390 and 1440 wide, in the state a real person usually sees. Also look at the narrowest width the project says it supports (320 if it does not say) and at a phone on its side (844 by 390). Anything the screen hides or drops at those sizes is a finding. If the screen has an empty, loading or error state you can reach, capture those too.\n2. **Say what kind of screen it is.** One line, because it decides which questions below weigh most.\n   - **It asks for something**: an install, a sign-up, a payment, a contact. Trust and the main action matter most.\n   - **It is for doing a task**: a form, an editor, a settings page, a dashboard. Status, mistakes and the way back matter most.\n   - **It is for finding something**: a list, a library, search results. Whether the thing can be found matters most.\n\n   A screen can be two of these, such as a list that leads to an install. Name the one the person arrives for first.\n3. **Use it, do not only look at it.** Most of what a critique misses is invisible in a screenshot.\n   - **Do the screen's one job from start to finish**, as the person in PRODUCT.md would (the main one, if it names several). Do not stop at the press. Follow it to where the person ends up, and capture each step. If the action sends, buys, deletes or publishes, stop before that point and read what it does in the code. When the job continues on another screen, follow it there: how well this screen hands over is part of this critique. Report what you find at the far end as where the action leads, and leave a full critique of that screen for its own run.\n   - **Compare what you were told with what you got.** What did the label promise, and what happened? If something was copied, saved, sent or filled in for you, is it what was shown on screen, word for word? Read the clipboard or the field; do not assume. If the tool will not let you read the clipboard, read what the code copies, and list the copy itself under \"Not checked\".\n   - **Try to make every message untrue.** For each message the screen shows (\"Copied\", \"Saved\", \"3 results\", \"Up to date\"), do the thing twice, do the other option, wait a minute, go back, reload the page. A message that can be wrong is a fault however small it looks.\n   - **Then do it as a second person**: someone on a phone if you began on a computer, and someone who uses this every day if you began as a newcomer. Note where each of you hesitated or ended up somewhere useless.\n   - **Press everything that looks pressable**, and note anything that looks pressable and is not, or is pressable and does not look it. Follow every link once: two links with different names that land on the same place, or one name that leads to two places, is a finding.\n   - **Search for something.** If the screen has no search of its own, the site's search is this screen's search. Use a word that should match many items and see whether it shows them all or says how many it left out.\n4. **Find out why it is the way it is, before you judge anything.** This step is not optional and the screenshots do not replace it. Read, in this order:\n   - PRODUCT.md and DESIGN.md, for anything said about this screen. Write down every rule in them that applies here, including the things they forbid. You will check the screen against each one in question 6.\n   - The screen's own source: the component file and its stylesheet. Read the notes written in them. People record decisions there (\"phones: the message sits at the top, with the horizon below\", \"40px for a finger\") that appear nowhere else.\n   - What a control does when used, from the code, when you are not going to press it.\n\n   Then sort every finding into one of two kinds. A **fault** is something no note explains or that contradicts the project's own notes. A **question** is something a written decision covers: report it as \"your notes say X; the cost of that is Y; is that still what you want?\", never as a problem. A fault gets a next step. A question may get one too, as long as the step says in plain words that it changes a choice already written down and what that choice was, so the person presses it knowing. A critique that turns up only questions says so plainly; that is a real result.\n\n   Three cases need care:\n   - **A note that only describes.** \"On a phone the card shows its job and Copy\" says what the code does. It is a decision only if it gives a reason, names a trade-off, or is written in PRODUCT.md or DESIGN.md. A description does not turn a fault into a question.\n   - **Notes that disagree.** The note nearest the screen and most recently written is the current decision. A stale section elsewhere is itself a finding: list it under what you noticed elsewhere.\n   - **A decision that gets in the way of the screen's one job.** It is still a question, and it still takes one of the three places if it earns it. Say plainly that it is deliberate and what it costs.\n\n   List the decisions you read under Details, with where each is written, so the person can see what the critique respected. List the rules too, each marked kept or broken. Two written rules that contradict each other on this screen is a finding in itself.\n5. **Judge it against the ten questions**, in this order. Answer every one, even when the answer is \"yes, fine\": a question skipped is how a real problem gets missed. Write a one-line answer to each of the ten under Details. A critique without the rule list and the ten answers is not finished; they are what shows nothing was skipped.\n6. **Rank.** Keep the three problems that most get in the way of the screen's job. A problem that blocks the job, or leaves the person with something other than what they were told, outranks any number that only look untidy. Keep up to five more as one line each.\n7. **Report**, on the Keen page described in SKILL.md, with each problem pinned on the screenshot it appears in.\n\n## The ten questions\n\n1. **Can a newcomer say what this screen is for within five seconds?** Look at it, look away, and write down what you remember. If the purpose is not among it, that is the first problem.\n2. **Is there one clear place to look first?** Blur your eyes or shrink the screenshot to a thumbnail. What stands out should be the thing that matters most. Several things competing at the same weight is a hierarchy problem. Two controls styled as the main action is the commonest form of it.\n3. **Does the main action do what its label says, and is it obvious and reachable?** One primary action, visually distinct, within reach of a thumb on a phone. Its label names what will happen. From step 3: what happened is what the label said, and what the person was handed is what the screen showed them.\n4. **Does the person know what happens next?** Before they act: what it will do, what it costs, what it touches, and how to undo it. After: where they are, what just happened, and what to do now. A screen that hands the person to another tool, another device or a later step says what that step will look like.\n5. **Is there a reason to believe it?** For a screen that asks for something, the reasons sit near the ask: who made it, what it costs, how many use it, what it will do to their computer or their data, how to back out. Only real ones count. For any screen: is every message true every time, from step 3?\n6. **Does it keep the product's own rules?** Go down the list of rules you wrote from PRODUCT.md and DESIGN.md and check each one against the screen, including what they forbid. A screen breaking its own written rule is a fault with the rule as its evidence. Then the unwritten kind: the same thing looks and is named the same everywhere on the screen. Count the distinct text sizes, colours, corner shapes and spacing values; a count the notes do not explain is evidence. Compare what is built with what the notes name, value by value: each corner shape, font and text size the measuring script reports against the ones DESIGN.md lists. A count is not enough.\n7. **Does it speak the user's language?** Labels a user would say out loud. No name the team invented left unexplained where a newcomer meets it first. (Nielsen's heuristics: match with the real world.)\n8. **Can the person find the thing they came for?** If the screen holds more than a screenful of items: is there a way to search or narrow them on the screen itself, does a search show everything it found or say how many it left out, can two items be told apart by their names, and is anything reachable only by already knowing what it is called?\n9. **Does it hold up outside the ideal case?** Empty, loading, error, very long text, no image, a refused permission. A missing state is a finding. On a phone: is anything the person needs before acting folded away while the action stays visible?\n10. **Can everyone use it?** Text contrast of at least 4.5 to 1, or 3 to 1 for large text and for the edges of controls (WCAG 2.2, 1.4.3 and 1.4.11). Tap targets at least 24 by 24 CSS pixels (WCAG 2.2, 2.5.8), and 44 points on a phone (Apple's guidelines). A visible focus outline when moving through the page with the keyboard. Nothing told apart by colour alone (WCAG 2.2, 1.4.1). Measure these with the script described under Measuring in SKILL.md; do not estimate them. If an audit of this screen was run in this conversation and the screen has not changed since, use its numbers. The measuring script cannot see meaning carried by colour alone (a dot, a tint, a red border with no words): look for it yourself, in light and in dark.\n\n## What to report\n\n- **A verdict in one sentence.** Honest, specific to this screen. \"The page does three jobs at once, so the one that matters gets lost.\"\n- **What kind of screen it is**, in a few words, with the verdict.\n- **The three problems**, most important first. For each: what a user experiences, where it is on the screenshot, the evidence (a count, a measured ratio, the step where you hesitated), and the job that fixes it, from the job tables in SKILL.md. If no Keen job fits, say what kind of work it is.\n- **Also found**, up to five more, one line each, so nothing real is lost to the limit of three.\n- **What is working**, two items at most,
