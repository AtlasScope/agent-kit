fault branch.","blind":"Agents summarize commit messages instead of reading the actual diff. Read the real diff line by line and flag anything the commits forgot to mention.","fresh":true},{"id":"AD09","sec":"inv","group":"Explore","mode":"read","t":"Links, previews, and what Google sees","line":"Checks page titles, social share previews, favicons, 404/error pages, broken internal links, and search-engine settings before you share your site publicly.","p":"Audit this web application's public-facing metadata, share previews, error pages, and crawl settings. Check: page titles and meta descriptions across public routes (flag missing, duplicate, or placeholder defaults like \"Create Next App\"); Open Graph and Twitter/X preview tags and whether their image URLs resolve with absolute production URLs; favicon and app icons; custom 404 and 500 error pages; broken internal links or redirects; canonical URLs, sitemap, and robots.txt (flag accidental noindex tags or blocked public pages, as well as private or admin routes accidentally exposed to crawlers).","ev":"A table of public routes with title, description, share image status, and indexability, plus every missing icon, broken link, default error page, or robots/noindex problem with file:line.","skip":"A private internal tool or native-only app with no public web pages.","blind":"Relative share-image paths and staging noindex headers often pass local testing and break in production. Check how the base URL and environment flags resolve in production config.","fresh":true},{"id":"G03","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Hidden data anyone can read","p":"Inspect API responses, Server Component props, SSR serialization payloads, and RPC returns sent from server to browser. Find places where full database rows or internal objects (internal flags, private emails, other tenants' IDs, tokens, audit metadata, or large unused blobs) are shipped to the client and merely left unrendered in the UI.","why":"Finds data sent to the browser that the screen hides but anyone can read.","ev":"Each over-exposed payload (file:line) showing the fields sent over the wire, the fields the screen actually uses, and every field that should stay on the server.","skip":"Static public pages with no server payloads or private user data.","mode":"read","top":"single","scope":"narrow","tools":"Browser network panel or curl against a local server.","kit":["/security-review"],"rel":["T03","A02"],"imp":"H","aka":"Wire-boundary over-fetching","line":"Checks API responses and server-rendered page data for private database fields sent to the browser and merely hidden from view."},{"id":"G04","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"When an outside service goes down","p":"Assume each external API, AI provider, or webhook source this product depends on hangs for 30 seconds, returns 429 or 503 for an hour, or delivers a burst of out-of-order webhooks when it recovers. Trace whether database transactions or connection pools stay held open during those calls, and whether core user flows degrade cleanly or lock up.","why":"Asks what happens to the app when an outside API, an AI provider or a service that sends it updates goes down.","ev":"Each external dependency with its timeout, retry behavior, resources held open while waiting, and what the user sees during an outage.","skip":"A self-contained app that makes no outbound API calls and receives no webhooks.","mode":"read","top":"single","scope":"wide","tools":"Repository; a local run with outside services made to fail on purpose.","kit":["/diagnosing-bugs"],"rel":["P09","A06","R02"],"imp":"H","aka":"Third-party outage blast radius","line":"Maps what happens to your app when Stripe, an AI provider, email, or another third-party API hangs, rate-limits you, or goes offline."},{"id":"G05","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Rounding and unit mix-ups","p":"Trace every calculation involving money, percentages, basis points, quantities, weights, or rates across storage, API payloads, math helpers, and UI formatting. Flag binary floating-point arithmetic used where exact integer or decimal math is required, premature rounding that compounds across sums, and unclear unit conventions (such as cents versus dollars, or 0.05 versus 5.0 for 5%).","why":"Finds money and percentage values that change scale or lose precision along the way.","ev":"Each tracked value with its unit and numeric type at every layer (file:line), highlighting every hop where units shift or rounding loses accuracy.","skip":"Products that handle no money, rates, percentages, or converted units.","mode":"read","top":"single","scope":"wide","tools":"Repository and read-only access to the database layout.","kit":["/dimensional-analysis"],"rel":["D02","D01"],"imp":"H","aka":"Numerical precision and unit drift","line":"Catches pennies lost to floating-point math, percentages off by 100x (`0.05` vs `5`), and cents-versus-dollars mismatches across layers."},{"id":"G06","sec":"inv","group":"Agent harness and modern stack","gk":"G","t":"Screens showing a change that was refused","p":"Trace every flow where the interface updates local state or cache optimistically before the server confirms the write. Show what happens to screen accuracy, queued actions, and error notices when the server rejects the request, times out, or returns different canonical values.","why":"Finds screens that show a change right away and keep showing it after the server refused it.","ev":"Each optimistic UI flow, what happens when the server rejects or drops the request, and a failing test or screenshot showing any unrolled-back state.","skip":"Every write waits for server confirmation before updating the screen.","mode":"repro","top":"single","scope":"narrow","tools":"In-app browser or Playwright set to block or alter requests.","kit":["/diagnosing-bugs"],"rel":["A04","A01"],"imp":"M","aka":"Optimistic UI rollback failure","line":"Checks features that update the screen immediately before the server responds, to see if rejected saves stay stuck on screen looking saved."},{"id":"MO01","sec":"inv","group":"Motion","gk":"MO","t":"Motion nobody chose","p":"List every animation and transition in this codebase with its duration, easing and animated properties. Count the distinct durations and the distinct easing curves. Find values used only once, transitions that name no property or no easing, and places that should share a value and do not. Propose the smallest set of shared durations and curves that covers what exists, and show which existing values map to which.","why":"Shows whether the app's motion follows a system or was typed one animation at a time.","ev":"A table of distinct durations and curves with counts, each outlier with file:line, and a mapping from existing values to a proposed set of about four durations and three curves.","skip":"Apps with a handful of animations, or a motion token file that everything already uses.","mode":"read","top":"single","scope":"wide","tools":"Repository access only.","kit":["/motion"],"rel":["MO02","MO05"],"imp":"M","blind":"Agents propose a token system and start migrating. Ask for the mapping only; migrating is a separate change.","aka":"Motion value sprawl"},{"id":"MO02","sec":"inv","group":"Motion","gk":"MO","t":"Animations that cost frames","p":"Find animations and transitions that trigger expensive layout or paint work per frame (animating width, height, top, left, margin, padding, heavy shadows or blurs, or driving styles from scroll/pointer events through React or component state). For the worst three candidates, record the interaction in a browser with CPU throttling enabled and report layout counts and dropped frames. Propose a cheaper alternative (such as transform or opacity) and note any visual tradeoff.","why":"Finds the animations that stutter on slower phones and laptops, and what each one costs.","ev":"Each expensive animation (file:line and animated property), plus throttled browser measurements (layout count and long frames) for the top three offenders before any code change.","skip":"Motion is limited to simple color, transform, or opacity transitions on small elements.","mode":"read","top":"split","scope":"wide","tools":"Repository; the app running locally and a browser with performance tooling (DevTools or Playwright).","kit":["/motion"],"rel":["MO01","MO04","P01"],"imp":"H","blind":"Code search flags every height transition, including tiny accordions that cost almost nothing. Measure before recommending a rewrite.","aka":"Layout and paint cost of animation","line":"Finds animations that trigger expensive browser recalculations and stutter on phones or older laptops, backed by throttled performance recordings."},{"id":"MO03","sec":"inv","group":"Motion","gk":"MO","t":"Motion with no off switch","p":"Audit how this product behaves when the user's operating system requests reduced motion (`prefers-reduced-motion: reduce`). List every animation that translates, scales, rotates, or loops and check whether it has a reduced-motion fallback. Flag content that stays invisible if an entrance animation is skipped, auto-playing motion lasting over five seconds without a pause control, and drag/swipe gestures lacking a button or keyboard alternative. For each gap, specify the sensible reduced-motion replacement (usually a brief opacity fade or instant change).","why":"Finds motion that can make people dizzy or lock them out, and content that disappears when animation is turned off.","ev":"Every moving animation (file:line) and its reduced-motion handling, results from a browser check with reduced motion emulated showing anything that still moves or disappears, and the WCAG rule behind each gap (2.2.2, 2.3.1, 2.3.3, 2.5.1, or 2.5.7).","skip":"A personal prototype nobody else will use, or an app with zero movement animations.","mode":"read","top":"single","scope":"wide","tools":"Repository; a browser that can emulate prefers-reduced-motion.","kit":["/motion"],"rel":["MO02","MO05"],"imp":"H","blind":"Dropping one global CSS rule that sets all durations to 0ms can hide animated content or break state callbacks. Check what each real transition becomes.","aka":"Reduced-motion coverage","line":"Checks how the app behaves when a user turns on \"Reduce Motion\" on their phone or computer, catching dizzying loops, trapped gestures, and content that fails to appear."},{"id":"MO04","sec":"inv","group":"Motion","gk":"MO","t":"Animations that restart, block or never finish","p":"Find animations and transitions that break when users act quickly instead of waiting for them to finish. Check for keyframe animations that restart abruptly on rapid triggers, exit animations skipped because elements unmount immediately, clicks or keyboard input blocked until a transition ends, focus shifting only after an animation completes, and end states that snap back to a different resting style. Reproduce up to three of the most reachable cases by re-triggering mid-animation, and propose the smallest fix for each.","why":"Finds motion that works in a demo and breaks under fast, real use.","ev":"Each broken case (file:line), the exact rapid-input sequence that triggers it, what the user sees (restart, jump, ignored click, or missing exit), and a reproduction for the worst one.","skip":"Apps whose only transitions are simple hover and focus color shifts.","mode":"repro","top":"split","scope":"wide","tools":"Repository; the app running locally with a browser to trigger interactions quickly.","kit":["/motion"],"rel":["MO02","MO06"],"imp":"H","aka":"Interruption and completion defects","line":"Catches animations that look fine when clicked slowly and break under fast, impatient real-world clicking — restarting awkwardly, ignoring taps, or vanishing without exiting."},{"id":"MO05","sec":"inv","group":"Motion","gk":"MO","t":"Motion with no job","p":"Inventory every animation and transition in this product and state what concrete job it does for the user: confirming input, showing where an element came from or went, orienting navigation, indicating loading, or highlighting a state change. Flag every animation that conveys nothing or runs so frequently that it slows people down (menus, tooltips, keyboard-driven actions). Recommend remove, shorten, or keep for each with one sentence of reasoning. Do not propose adding new animations.","why":"Produces a list of animations to delete or shorten, which is usually the cheapest way to make an app feel faster.","ev":"A table with one row per animation: location (file:line), how often a user triggers it daily, the job it performs (or \"none\"), and remove, shorten, or keep.","skip":"An app with almost no motion — check \"State changes with no feedback\" instead.","mode":"read","top":"single","scope":"wide","tools":"Repository; the running app helps.","kit":["/motion"],"rel":["MO01","MO06"],"imp":"M","blind":"Do not defend decorative delays as \"polish.\" If an animation teaches the user nothing and slows them down, mark it for removal or shortening.","aka":"Purposeless and over-frequent motion","line":"Audits every animation and lists the decorative or repetitive ones to delete or shorten so the interface feels snappier right away."},{"id":"MO06","sec":"inv","group":"Motion","gk":"MO","t":"State changes with no feedback","p":"Walk the product's main user flows and list up to ten moments where the interface changes with no visible feedback: a button press with no response, a deleted row vanishing abruptly, a panel appearing with no spatial cue, a multi-second wait with no loading indicator, or a save/error that happens silently. Exclude rapid, high-frequency actions users trigger dozens of times per minute. Rank the gaps by how much confusion each causes, and write a one-line motion spec (what changes, duration, and reduced-motion behavior) for each.","why":"Finds the few places where a small animation would remove real confusion.","ev":"Up to ten ranked moments with their user flow, component (file:line), what leaves the user guessing, and a one-line feedback spec.","skip":"You just finished a motion pass, or the complaint is that the app already moves too much (check \"Motion with no job\" instead).","mode":"read","top":"single","scope":"narrow","tools":"Repository and the running app.","kit":["/motion"],"rel":["MO05","MO04"],"imp":"M","blind":"Do not suggest animating every state change. Limit the list to ten moments at most where missing feedback creates real user doubt.","aka":"Missing interaction feedback","line":"Finds the few high-impact moments where something saves, deletes, or shifts silently and leaves users wondering if their click worked."},{"id":"PG00","sec":"db","group":"Start here","gk":"PG","t":"Make this database easier to trust and operate","p":"Study how this PostgreSQL database actually works today — schema, relationships, data sources, reads, writes, background jobs, migrations, and consumers — using the live database state, repository, and operational evidence instead of documentation alone.\n\nIdentify the few root problems driving the most complexity, wasted work, data-quality risk, and operating cost. Focus on data correctness, reliable writes, duplicated logic, unused database objects, historical accuracy, and clarity for future maintenance.\n\nRank findings by measured impact. Separate confirmed problems from theoretical worries, and recommend changes that simplify the database instead of adding new infrastructure or recurring review processes.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: A short ranked list of confirmed problems, each naming the tables, writers, and readers involved, the proof (query plans, counts, or source checks), and the smallest change that helps.\n\nIf this describes the project, say so and stop instead: You already know the exact Postgres issue and should run the narrower prompt for it, or this project does not use PostgreSQL.\n\nAvoid: Turning a one-time audit into ongoing process or extra infrastructure.","why":"The broad starting point when the database feels hard to trust or costly, and you can't yet name one problem.","ev":"A short ranked list of confirmed problems, each with the tables, writers and consumers involved, and the proof: query plans, samples, counts or a check against the source.","skip":"You already know the specific problem. Go straight to the narrower prompt for it.","avoid":"Turning one look into a standing review, a new process or automated governance.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: query statistics (pg_stat_statements) and, on Supabase, the built-in Advisors.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["PG01","PG05","PG10","PG13"],"tags":"database health, postgres health, simplify database, clean up database, healthier database, overall database review, supabase, neon, start here","refs":["supabase","pgss","advisors"],"line":"Runs one high-level check across a PostgreSQL database and ranks the handful of root issues causing most of the slowness, cost, or data-quality risk."},{"id":"PG01","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Can we independently prove these numbers?","p":"Take a representative set of important figures from this database and independently reconstruct them from their original sources. Don't rely on the existing calculation code to verify itself. Find discrepancies in definitions, source selection, units, dates, classifications, and relationships. Determine which errors are isolated and which come from shared logic, then rank corrections by analytical impact.","why":"Important figures may be wrong even though their lineage is documented.","ev":"Samples from the original sources, an independent rebuild of each figure, each disagreement classified, how many records it affects, and the shared causes.","skip":"The figures are copied straight from the source with no calculation applied.","avoid":"Checking a value with the same code or source reading that produced it.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and the original source documents.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D02","D01","PG02","PG04"],"tags":"wrong numbers, incorrect numbers, inaccurate data, figures don't match, doesn't match the source, reconciliation, recompute, verify metrics, data provenance","line":"Rebuilds your most important figures from the original sources to prove whether the database has them right."},{"id":"PG02","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Find data that is internally consistent but wrong","p":"Look for data in this PostgreSQL database that passes schema constraints and validation yet is analytically wrong. Test cross-table totals, accounting identities, historical continuity, plausible ranges, and expected source coverage. Separate real errors from intentional differences in reporting periods, granularity, or definitions.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Failed cross-table reconciliations, broken identities, and unexpected gaps with example rows and how many records are affected.\n\nIf this describes the project, say so and stop instead: The database stores only raw user-entered records with no derived figures, aggregations, or multi-table reconciliations.\n\nAvoid: Flagging intentional differences in reporting periods or definitions as bugs without checking them first.","why":"Every check passes, but totals or outputs still look implausible.","ev":"Cross-table reconciliations, identities and expected-population comparisons that fail, with source samples and how much data is affected.","skip":"There is no derived or analytical output, only records stored as entered.","avoid":"Calling different grains, as-of dates or reporting bases errors without checking their definitions.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: pgTAP on a local or branch database, to turn confirmed rules into tests.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D01","R03","PG01","PG03"],"tags":"totals are wrong, rows are valid but wrong, inaccurate data, sanity checks, reconciliation, implausible values, missing records","refs":["pgtap"],"line":"Checks cross-table totals, accounting identities, and realistic ranges to catch data that passes every database rule yet is still factually wrong."},{"id":"PG03","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Find where records silently change identity","p":"Trace how real-world entities are identified, matched, and linked across imports, source documents, and PostgreSQL tables. Find distinct entities merged by mistake, identical entities duplicated under separate IDs, and historical links that broke across updates. Identify the matching rule responsible and how many rows are affected before proposing fixes.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Confirmed duplicate groups and false merges with their source IDs, the matching rule (file:line), affected row counts, and a repeatable query that surfaces them.\n\nIf this describes the project, say so and stop instead: Every data source shares one stable external ID and nothing is matched by name or fuzzy rules.\n\nAvoid: Merging records solely because their names look similar.","why":"Sources use aliases, changing identifiers, share classes or inconsistent names for the same thing.","ev":"Likely duplicates and false merges with their source IDs, the matching rule behind each, the records affected and a counterexample you can rerun.","skip":"Every source shares one stable identifier and nothing is matched by name.","avoid":"Merging entities just because their names look alike.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D05","D04","A02","PG02"],"tags":"duplicates, merged records, share classes merged, entity matching, wrong company, identity, dedupe","line":"Catches real-world entities (customers, companies, products) that got split into duplicate rows or accidentally merged into one across imports."},{"id":"PG04","sec":"db","group":"Accuracy and evidence","gk":"PG","t":"Reproduce what the database believed in the past","p":"Choose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.","why":"Past reports, backfills, restatements or changed classification rules matter.","ev":"Two or more past checkpoints, when each record was true and when it was known, the source revisions, and changes you can demonstrate.","skip":"Nobody needs past results to stay reproducible.","avoid":"Requiring bitemporal storage everywhere. Work out what is actually needed before choosing a structure.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D03","R04","PG01","PG15"],"tags":"historical report changed, old data meanings, as-of, restatement, backfill, point in time, history rewritten","line":"Checks whether you can still reproduce what the database said on an earlier date, after the data or the rules changed."},{"id":"PG05","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Map every place that writes to the database","p":"Map every code path that creates, updates, or deletes rows in the core PostgreSQL tables: API endpoints, scripts, scheduled jobs, database functions, triggers, and automated agents. Show which writer owns each column, where writers overlap, and where two writers can overwrite or contradict each other. Recommend the simplest ownership model the current design supports.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: A writer-to-table-and-column map (with triggers and downstream consumers), plus every overlapping or conflicting write path.\n\nIf this describes the project, say so and stop instead: Each table is written by a single clear code path.\n\nAvoid: Treating multiple writers as a bug automatically; focus on paths that actually conflict or leave ownership unclear.","why":"Several jobs, functions, APIs or agents change the same data, or nobody is sure who owns it.","ev":"A map from each writer to its tables and columns, then to triggers, side effects and consumers, with the cases where writers overlap or conflict.","skip":"One code path writes each table.","avoid":"Treating every extra writer as wrong. Find the paths that actually conflict.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","R05","PG06","PG09"],"tags":"what writes to this table, mysterious overwrites, who owns this field, multiple writers, write ownership","line":"Lists every API route, script, trigger, background job, and agent that writes to your core tables, highlighting where two writers can collide."},{"id":"PG06","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Stop rewriting data that hasn't changed","p":"Measure how much PostgreSQL write activity actually changes meaningful data. Look for repeated upserts rewriting identical rows, unnecessary delete-and-reinsert batches, needless index churn, and cascading refreshes. Identify writes that can be skipped safely without losing audit history, intentional last-seen timestamps, or recovery behavior.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: Write volume stats, the share of writes that leave row values unchanged, dead-tuple or bloat figures where measurable, and before/after comparisons on a separate test copy if available.\n\nIf this describes the project, say so and stop instead: Write volume is low, or every write updates actually changed values.\n\nAvoid: Suppressing deliberate last-seen timestamps, trigger side effects, or version counters that downstream logic relies on.","why":"Upserts and updates run at high volume, imports are costly, or vacuum and write-ahead log churn look high.","ev":"Statement counts, the share of writes that really change a row, dead-row and churn figures, index and WAL effects where measurable, and before-and-after tests on a copy.","skip":"Write volume is small, or every write is a change that has to happen.","avoid":"Suppressing deliberate last-seen timestamps, trigger side effects, version counters or refreshes that are meant to happen.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy for before-and-after tests. Helps: query statistics (pg_stat_statements).","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P04","P09","PG05","PG07","PG13"],"tags":"too many upserts, write amplification, upserts identical rows, unchanged updates, rewriting everything, nightly reload, dead tuples, wal","refs":["pgss","bestpractices"],"iso":true,"line":"Measures how many database writes actually change data versus needlessly rewriting identical rows and inflating Postgres storage and billing."},{"id":"PG07","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Is our ingestion process more complicated than necessary?","p":"Trace one complete data-ingestion run from raw source files or APIs to final PostgreSQL tables. Identify redundant parsing, unnecessary staging tables, repeated validation, duplicate reads, and consolidatable writes. Propose the simplest pipeline that preserves accuracy, source traceability, failure recovery, and re-processing of corrections.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: One end-to-end trace from source to final rows, every duplicated step (file:line), the checkpoints recovery relies on, and a simpler pipeline proposal verified against the same outputs on a test copy where practical.\n\nIf this describes the project, say so and stop instead: Data arrives in one straightforward step directly into its target table.\n\nAvoid: Stripping away provenance records or recovery checkpoints that let you trace or replay bad imports.","why":"The import pipeline is long, slow to correct, or does the same work at several stages.","ev":"One real trace from source to final rows, the work done twice, the checkpoints, a shorter path, and checks that the shorter path gives the same results and still replays.","skip":"The pipeline is already one short step from source to table.","avoid":"Removing evidence, provenance or checkpoints that recovery depends on.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only database access and a separate copy to check the shorter path against.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["D04","PG05","PG06","PG08","PG09"],"tags":"ingestion, etl, import pipeline, simplify pipeline, sprawling pipeline, data pipeline","iso":true,"line":"Follows one full data import from raw source to final Postgres tables and cuts out redundant parsing, intermediate tables, and double work."},{"id":"PG08","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Can we rerun everything without damaging the data?","p":"Examine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.","why":"Imports get retried, schedulers overlap, files are replayed, or runs fail halfway.","ev":"Replay scenarios with their conflict keys, interrupted-run cases, before-and-after data comparisons and a safe way to resume.","skip":"Every import runs once, by hand, with nothing to retry.","avoid":"Calling an import safe to rerun just because the SQL has ON CONFLICT.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: an isolated database for replay tests, and pgTAP.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["R01","R06","PG05","PG07"],"tags":"failed run duplicates records, retry, replay, idempotent import, rerun safely, backfill twice, duplicate import","refs":["pgtap"],"iso":true,"line":"Checks whether rerunning an import or a failed job can duplicate or damage data, and how to make reruns safe."},{"id":"PG09","sec":"db","group":"Writes and ingestion","gk":"PG","t":"Find where write logic should live","p":"Trace where records are validated, transformed, and written across application code, PostgreSQL functions, triggers, constraints, and background workers. Find rules duplicated across layers or buried where they are hard to test and evolve. Recommend one clear ownership boundary for each rule, without biasing either toward or away from putting logic inside Postgres.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Each rule with every layer that enforces it (file:line), duplicated or conflicting checks, testability tradeoffs, and the simplest ownership boundary.\n\nIf this describes the project, say so and stop instead: All write rules already live cleanly in one layer with no database triggers or stored procedures.\n\nAvoid: Defaulting blindly to stored procedures or insisting everything move out of Postgres.","why":"Business rules are split across SQL, triggers, edge functions, server routes and workers.","ev":"Each rule with the layers that enforce it, the current owner, duplicated checks, how testable each place is, transaction limits and what a change would touch.","skip":"Each rule already lives in exactly one place.","avoid":"Automatically favouring stored procedures, or automatically moving everything out of the database.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","PG05","PG07","PG10"],"tags":"trigger or app code, validation in trigger, business logic in database, edge function, stored procedure, duplicate validation","line":"Untangles validation and business rules split across app code, Postgres triggers, SQL functions, and background jobs, and picks one clear home for each."},{"id":"PG10","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Which database objects no longer earn their keep?","p":"Inventory the tables, views, materialized views, functions, triggers, and indexes in this PostgreSQL database. Flag obsolete, redundant, or overlapping objects and unnecessary dependency chains. Verify actual readers and dynamic callers before suggesting removal, and rank candidates by complexity eliminated and migration risk.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: A dependency map of database objects, usage stats where available, ranked removal candidates, and the migration risk for each.\n\nIf this describes the project, say so and stop instead: A small schema where every table, view, and index has a known active reader.\n\nAvoid: Marking objects unused without checking dynamic SQL, reporting tools, or external database consumers.","why":"The list of views, functions and triggers has grown hard to reason about.","ev":"A map of objects, what depends on them and who uses them, the removal candidates, migration risks and how much complexity goes away.","skip":"The schema is small and every object has a known reader.","avoid":"Deleting objects that look unused but are called dynamically or by outside clients.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access to the catalog, plus the repository and any outside clients.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A03","I06","PG09","PG11","PG12"],"tags":"unused views, dead views, unused functions, schema cleanup, too many views, triggers, database clutter, drop unused","refs":["bestpractices"],"line":"Inventories your Postgres views, materialized views, triggers, functions, and indexes to flag unused or redundant objects and what removing each would risk."},{"id":"PG11","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Are we storing the same truth multiple times?","p":"Find concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.","why":"Caches, aggregates, materialized views or derived columns drift from the raw facts.","ev":"The authoritative source and each copy, how each is refreshed, examples of drift, and what each copy costs readers and writers.","skip":"Each fact is stored once.","avoid":"Rejecting all denormalisation. Copies kept for speed or history can be worth it.","mode":"read","top":"split","scope":"wide","tools":"Repository and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A04","D02","PG05","PG10"],"tags":"stale view, materialized view out of date, duplicate data, cache disagrees, derived column, denormalized, source of truth","line":"Finds the same facts stored in several places that have drifted apart, and says which copy to trust."},{"id":"PG12","sec":"db","group":"Schema and dependencies","gk":"PG","t":"Can the schema be easier to understand without losing depth?","p":"Review this PostgreSQL schema's structure and naming as if onboarding a senior engineer unfamiliar with the repo. Identify misleading table or column names, tables mixing unrelated responsibilities, inconsistent naming conventions, and hidden relationships. Recommend only the least disruptive improvements (such as views, comments, or targeted boundary cleanups) that reduce confusion without losing historical detail or triggering risky migrations.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Specific schema confusions tied to real bugs or agent mistakes, a clear entity map, and low-risk naming or boundary fixes.\n\nIf this describes the project, say so and stop instead: The schema is small and neither you nor your agents have misread it recently.\n\nAvoid: Proposing cosmetic renames or wide migrations that break live queries for minor tidy-ups.","why":"New developers or agents keep misunderstanding names, concepts or relationships.","ev":"The specific confusions, the work they affect, a schema map, and the least disruptive naming or boundary fixes.","skip":"Nobody has misread the schema recently.","avoid":"Cosmetic renames and broad migrations with no shown maintenance benefit.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository and read-only database access. Helps: declarative schema files, if the project uses them.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["A02","G01","PG10","PG11"],"tags":"agents can't understand schema, confusing table names, schema map, naming conventions, data model clarity","refs":["declarative"],"line":"Spots confusing table names, overloaded columns, and tangled schema boundaries that keep tripping up people and coding agents."},{"id":"PG13","sec":"db","group":"Performance and maintenance","gk":"PG","t":"Find the true sources of database waste","p":"Measure which PostgreSQL tables, indexes, queries, and background maintenance tasks consume the most storage, CPU, and write I/O. Separate necessary capacity from avoidable waste — unused indexes, table bloat, row churn, bad query plans, and unnecessary full scans. Base every recommendation on observed workload stats.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Top table and index sizes, highest-cost queries, index usage counts, dead-row/bloat metrics, EXPLAIN output for top offenders, and expected savings per change.\n\nIf this describes the project, say so and stop instead: Postgres storage, CPU, and billing are small and steady.\n\nAvoid: Judging index usefulness by grepping code alone, or optimizing read speed while ignoring write overhead.","why":"The bill is high, CPU or disk usage is high, storage keeps growing, or you suspect bloat.","ev":"Table and index sizes, the top statements, usage counts, dead-row and maintenance figures, EXPLAIN output and the savings you expect.","skip":"Usage and cost are small and steady.","avoid":"Judging an index from a code search alone, or looking only at query time and ignoring write cost.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access and query statistics (pg_stat_statements). Helps: Supabase Advisors, and HypoPG to test an index without building it.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","I03","PG06","PG14"],"tags":"postgres costs, database bill, supabase performance, slow postgres, bloat, unused indexes, high cpu, storage growing","refs":["pgss","advisors","hypopg","bestpractices"],"line":"Measures which Postgres tables, unused indexes, bloated rows, and heavy queries consume the most storage, CPU, and money."},{"id":"PG14","sec":"db","group":"Performance and maintenance","gk":"PG","t":"What will become expensive as the database grows?","p":"Use actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.","why":"Fact or history tables are growing fast, or you need to plan capacity.","ev":"Current row counts and growth rates, the workload assumed, the size at which each operation becomes a bottleneck, and costs before and after at a realistic scale.","skip":"Data volume is small and flat.","avoid":"Partitioning or new layers without a measured or credible need.","mode":"read","top":"split","scope":"wide","tools":"Needs: read-only database access. Helps: query statistics (pg_stat_statements) and HypoPG.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["P03","P05","PG13"],"tags":"ten times the data, growth, capacity planning, partitioning, scale, slow as it grows","refs":["pgss","hypopg"],"line":"Estimates when each table and query will get slow or expensive as the data grows."},{"id":"PG15","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Can we rebuild this database from its sources?","p":"Determine whether this PostgreSQL database can be rebuilt from the repository, migration files, original source materials, and retained records. Flag anything that exists only in production, manual fixes that cannot be replayed, and data that would be lost forever. Where feasible, test rebuilding onto an isolated test database and compare sampled rows and relationships against production.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: The exact inputs and migration sequence required to rebuild, any irreplaceable production-only state, and a sampled comparison from an isolated rebuild if run.\n\nIf this describes the project, say so and stop instead: The database is either a disposable cache or holds primary user-authored records backed up via snapshots instead of rebuilt from external sources.\n\nAvoid: Testing restores against production, or treating the existence of backup files as proof they restore cleanly.","why":"You worry about disaster recovery, production-only state, or whether the data could be rebuilt.","ev":"The exact inputs needed to rebuild, the migration chain, a sampled comparison of a rebuilt copy against production, and the gaps that can't be recovered.","skip":"The database is a disposable cache you can refill at any time.","avoid":"Running a destructive restore against production, or treating a list of backups as proof they restore.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only production access and a separate database you are allowed to build into.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["I02","D02","PG04","PG17"],"tags":"backup restore, disaster recovery, rebuild database, outage, reproduce production, restore test","refs":["pgtap"],"iso":true,"line":"Checks whether your Postgres database could be recreated from scratch using your repo, migrations, and raw source files, and exposes what exists only in production."},{"id":"PG17","sec":"db","group":"Rebuild and safe change","gk":"PG","t":"Are our database changes safe before we merge?","p":"Review this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.","why":"A migration, or a change to functions, views, RLS, types or column meaning, is about to ship.","ev":"The migration diff, the consumers it touches, how old and new app versions coexist during rollout, locks and rollback, and a replay on a separate database.","skip":"The change touches no schema, functions or policies.","avoid":"Claiming a rollback exists because the application code can be reverted.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, read-only access to the live schema and a separate database to replay the migration. Helps: pgTAP and, on Supabase, Advisors and branches.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["G02","I02","S06","PG15"],"tags":"safe migrations, migration review, can this migration ship, schema change, rls change, breaking change, rollback","refs":["pgtap","advisors","declarative","bestpractices"],"iso":true,"line":"Checks a database change before you merge it: what it touches, whether the running app survives it, and how to undo it."},{"id":"PG16","sec":"db","group":"Agent decisions","gk":"PG","t":"Which decisions should an expert agent make without me?","p":"Find recurring database decisions that agents currently escalate to me, including field classification, record matching, write conflicts, source precedence and schema choices. Determine which can be resolved through established standards, existing precedent and authoritative evidence. Make the decision rules reusable, identify their limits, and reserve escalation for genuine product or risk decisions.","why":"Agents keep asking you to classify fields, match records or pick between sources.","ev":"The kinds of question that repeat, the standards and precedents that settle them, each rule with its exceptions, and where escalation really belongs.","skip":"Agents rarely escalate database questions.","avoid":"Inventing accounting, source-precedence or product policy where no authority exists.","mode":"read","top":"split","scope":"wide","tools":"Needs: the repository, past agent transcripts or notes, and read-only database access.","plat":"Any PostgreSQL host: Supabase, Neon, RDS, Cloud SQL or self-hosted.","rel":["M05","M07","G01","PG01","PG09"],"tags":"agent keeps asking me, stop asking me to classify, escalations, decision rules, classify every record","line":"Writes down the rules an agent can use to settle the data questions it keeps asking you."},{"id":"DBR01","sec":"db","group":"Workflows","t":"Is the data actually right?","why":"Prove the numbers before fixing anything.","flow":[["Start",["PG01","PG02"],"PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong."],["If needed",["PG03","PG04"],"PG03 for identity gaps; PG04 when the meaning of past records matters."],["Change",[],"Fix only the confirmed shared causes, and add SQL or metric tests for them."],["Done when",[],"Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly."]],"p":"Is the data actually right? Prove the numbers before fixing anything.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG01 when a figure disagrees with its source; PG02 when everything validates but still looks wrong.\n\nCan we independently prove these numbers? (PG01)\nTake a representative set of important figures from this database and independently reconstruct them from their original sources. Don't rely on the existing calculation code to verify itself. Find discrepancies in definitions, source selection, units, dates, classifications, and relationships. Determine which errors are isolated and which come from shared logic, then rank corrections by analytical impact.\n\nFind data that is internally consistent but wrong (PG02)\nLook for data in this PostgreSQL database that passes schema constraints and validation yet is analytically wrong. Test cross-table totals, accounting identities, historical continuity, plausible ranges, and expected source coverage. Separate real errors from intentional differences in reporting periods, granularity, or definitions.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Failed cross-table reconciliations, broken identities, and unexpected gaps with example rows and how many records are affected.\n\nIf this describes the project, say so and stop instead: The database stores only raw user-entered records with no derived figures, aggregations, or multi-table reconciliations.\n\nAvoid: Flagging intentional differences in reporting periods or definitions as bugs without checking them first.\n\n2. If needed: PG03 for identity gaps; PG04 when the meaning of past records matters.\n\nFind where records silently change identity (PG03)\nTrace how real-world entities are identified, matched, and linked across imports, source documents, and PostgreSQL tables. Find distinct entities merged by mistake, identical entities duplicated under separate IDs, and historical links that broke across updates. Identify the matching rule responsible and how many rows are affected before proposing fixes.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Confirmed duplicate groups and false merges with their source IDs, the matching rule (file:line), affected row counts, and a repeatable query that surfaces them.\n\nIf this describes the project, say so and stop instead: Every data source shares one stable external ID and nothing is matched by name or fuzzy rules.\n\nAvoid: Merging records solely because their names look similar.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Fix only the confirmed shared causes, and add SQL or metric tests for them.\n\n4. Done when: Recomputed examples that now match, an estimate of how much data was affected, and any source limits stated plainly.","rel":["PG01","PG02","PG03","PG04"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order: prove the numbers are right, then fix only what was confirmed."},{"id":"DBR02","sec":"db","group":"Workflows","t":"Make ingestion simpler and cheaper","why":"Less work per import, without losing provenance or corrections.","flow":[["Start",["PG05","PG07"],"PG05 when it is unclear who writes what; otherwise PG07."],["If needed",["PG06","PG08","PG09"],"PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places."],["Change",[],"Make the smallest change to one cause at a time, keeping provenance and corrections."],["Done when",[],"The same results for reference inputs, measurably less work, and retries that do no harm."]],"p":"Make ingestion simpler and cheaper Less work per import, without losing provenance or corrections.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG05 when it is unclear who writes what; otherwise PG07.\n\nMap every place that writes to the database (PG05)\nMap every code path that creates, updates, or deletes rows in the core PostgreSQL tables: API endpoints, scripts, scheduled jobs, database functions, triggers, and automated agents. Show which writer owns each column, where writers overlap, and where two writers can overwrite or contradict each other. Recommend the simplest ownership model the current design supports.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: A writer-to-table-and-column map (with triggers and downstream consumers), plus every overlapping or conflicting write path.\n\nIf this describes the project, say so and stop instead: Each table is written by a single clear code path.\n\nAvoid: Treating multiple writers as a bug automatically; focus on paths that actually conflict or leave ownership unclear.\n\nIs our ingestion process more complicated than necessary? (PG07)\nTrace one complete data-ingestion run from raw source files or APIs to final PostgreSQL tables. Identify redundant parsing, unnecessary staging tables, repeated validation, duplicate reads, and consolidatable writes. Propose the simplest pipeline that preserves accuracy, source traceability, failure recovery, and re-processing of corrections.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: One end-to-end trace from source to final rows, every duplicated step (file:line), the checkpoints recovery relies on, and a simpler pipeline proposal verified against the same outputs on a test copy where practical.\n\nIf this describes the project, say so and stop instead: Data arrives in one straightforward step directly into its target table.\n\nAvoid: Stripping away provenance records or recovery checkpoints that let you trace or replay bad imports.\n\n2. If needed: PG06 for writes that change nothing; PG08 for replay or correction failures; PG09 for validation done in several places.\n\nStop rewriting data that hasn't changed (PG06)\nMeasure how much PostgreSQL write activity actually changes meaningful data. Look for repeated upserts rewriting identical rows, unnecessary delete-and-reinsert batches, needless index churn, and cascading refreshes. Identify writes that can be skipped safely without losing audit history, intentional last-seen timestamps, or recovery behavior.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: Write volume stats, the share of writes that leave row values unchanged, dead-tuple or bloat figures where measurable, and before/after comparisons on a separate test copy if available.\n\nIf this describes the project, say so and stop instead: Write volume is low, or every write updates actually changed values.\n\nAvoid: Suppressing deliberate last-seen timestamps, trigger side effects, or version counters that downstream logic relies on.\n\nCan we rerun everything without damaging the data? (PG08)\nExamine the ingestion and correction workflows under retries, interrupted runs, duplicate source files, out-of-order arrivals and repeated execution. Demonstrate where these cases produce duplicate records, lost corrections, partial results or unnecessary rewrites. Find the smallest durable approach that makes each operation safely repeatable.\n\nFind where write logic should live (PG09)\nTrace where records are validated, transformed, and written across application code, PostgreSQL functions, triggers, constraints, and background workers. Find rules duplicated across layers or buried where they are hard to test and evolve. Recommend one clear ownership boundary for each rule, without biasing either toward or away from putting logic inside Postgres.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Each rule with every layer that enforces it (file:line), duplicated or conflicting checks, testability tradeoffs, and the simplest ownership boundary.\n\nIf this describes the project, say so and stop instead: All write rules already live cleanly in one layer with no database triggers or stored procedures.\n\nAvoid: Defaulting blindly to stored procedures or insisting everything move out of Postgres.\n\n3. Change: Make the smallest change to one cause at a time, keeping provenance and corrections.\n\n4. Done when: The same results for reference inputs, measurably less work, and retries that do no harm.","rel":["PG05","PG06","PG07","PG08","PG09"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to make imports cheaper and simpler without losing where the data came from."},{"id":"DBR03","sec":"db","group":"Workflows","t":"Simplify a crowded schema","why":"Fewer objects with the same outcomes.","flow":[["Start",["PG10"],"Inventory objects and their real consumers."],["If needed",["PG11","PG12","PG17"],"PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships."],["Change",[],"Confirm consumers before retiring anything, and keep old and new versions working during rollout."],["Done when",[],"Less complexity with unchanged results for users and data."]],"p":"Simplify a crowded schema Fewer objects with the same outcomes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Inventory objects and their real consumers.\n\nWhich database objects no longer earn their keep? (PG10)\nInventory the tables, views, materialized views, functions, triggers, and indexes in this PostgreSQL database. Flag obsolete, redundant, or overlapping objects and unnecessary dependency chains. Verify actual readers and dynamic callers before suggesting removal, and rank candidates by complexity eliminated and migration risk.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: A dependency map of database objects, usage stats where available, ranked removal candidates, and the migration risk for each.\n\nIf this describes the project, say so and stop instead: A small schema where every table, view, and index has a known active reader.\n\nAvoid: Marking objects unused without checking dynamic SQL, reporting tools, or external database consumers.\n\n2. If needed: PG11 for copies of the same fact; PG12 for confusing names; PG17 before any schema change ships.\n\nAre we storing the same truth multiple times? (PG11)\nFind concepts and values maintained in multiple tables, materialized views, caches or derived columns. Trace which representation is authoritative, why each copy exists, how it stays synchronized, and what happens when the copies disagree. Recommend which duplication is justified by performance or history and which should be removed.\n\nCan the schema be easier to understand without losing depth? (PG12)\nReview this PostgreSQL schema's structure and naming as if onboarding a senior engineer unfamiliar with the repo. Identify misleading table or column names, tables mixing unrelated responsibilities, inconsistent naming conventions, and hidden relationships. Recommend only the least disruptive improvements (such as views, comments, or targeted boundary cleanups) that reduce confusion without losing historical detail or triggering risky migrations.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Specific schema confusions tied to real bugs or agent mistakes, a clear entity map, and low-risk naming or boundary fixes.\n\nIf this describes the project, say so and stop instead: The schema is small and neither you nor your agents have misread it recently.\n\nAvoid: Proposing cosmetic renames or wide migrations that break live queries for minor tidy-ups.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\n3. Change: Confirm consumers before retiring anything, and keep old and new versions working during rollout.\n\n4. Done when: Less complexity with unchanged results for users and data.","rel":["PG10","PG11","PG12","PG17"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to cut the views, functions and tables you don't need, with the same results."},{"id":"DBR04","sec":"db","group":"Workflows","t":"Reduce PostgreSQL resource cost","why":"Spend less where the measurements say the money goes.","flow":[["Start",["PG13"],"Measure the top consumers first."],["If needed",["PG06","PG14","P03"],"PG06 for write churn; PG14 when growth is the driver; P03 for one slow query."],["Change",[],"Take the biggest measured savings first. No speculative indexes or partitions."],["Done when",[],"Workload figures before and after, with no loss of correctness."]],"p":"Reduce PostgreSQL resource cost Spend less where the measurements say the money goes.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: Measure the top consumers first.\n\nFind the true sources of database waste (PG13)\nMeasure which PostgreSQL tables, indexes, queries, and background maintenance tasks consume the most storage, CPU, and write I/O. Separate necessary capacity from avoidable waste — unused indexes, table bloat, row churn, bad query plans, and unnecessary full scans. Base every recommendation on observed workload stats.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nBring back: Top table and index sizes, highest-cost queries, index usage counts, dead-row/bloat metrics, EXPLAIN output for top offenders, and expected savings per change.\n\nIf this describes the project, say so and stop instead: Postgres storage, CPU, and billing are small and steady.\n\nAvoid: Judging index usefulness by grepping code alone, or optimizing read speed while ignoring write overhead.\n\n2. If needed: PG06 for write churn; PG14 when growth is the driver; P03 for one slow query.\n\nStop rewriting data that hasn't changed (PG06)\nMeasure how much PostgreSQL write activity actually changes meaningful data. Look for repeated upserts rewriting identical rows, unnecessary delete-and-reinsert batches, needless index churn, and cascading refreshes. Identify writes that can be skipped safely without losing audit history, intentional last-seen timestamps, or recovery behavior.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: Write volume stats, the share of writes that leave row values unchanged, dead-tuple or bloat figures where measurable, and before/after comparisons on a separate test copy if available.\n\nIf this describes the project, say so and stop instead: Write volume is low, or every write updates actually changed values.\n\nAvoid: Suppressing deliberate last-seen timestamps, trigger side effects, or version counters that downstream logic relies on.\n\nWhat will become expensive as the database grows? (PG14)\nUse actual table sizes, row growth, query plans and workload patterns to identify the first database operations likely to become disproportionately expensive as data grows. Evaluate indexing, partitioning, pagination, aggregation and retention only where the evidence justifies them. Show what scale would trigger a change rather than optimizing everything prematurely.\n\nQueries that grow badly (P03)\nFind database queries whose execution cost grows disproportionately as rows, users, tenants, or relationships increase. Inspect query plans, missing or unused indexes, N+1 joins, unbounded pagination, and filtering done in application memory instead of the database.\n\n3. Change: Take the biggest measured savings first. No speculative indexes or partitions.\n\n4. Done when: Workload figures before and after, with no loss of correctness.","rel":["PG06","PG13","PG14","P03"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to lower the Postgres bill where the measurements say the money goes."},{"id":"DBR05","sec":"db","group":"Workflows","t":"Ship or recover safely","why":"A schema change or a restore you have actually tested.","flow":[["Start",["PG17","PG15"],"PG17 for a change about to ship; PG15 for rebuilding or recovery."],["If needed",["G02","R06","PG04"],"G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move."],["Change",[],"Run migrations and restores on a separate database, check compatibility, and plan the recovery."],["Done when",[],"A migration or restore tested on a separate database, and no claim about production that wasn't proved."]],"p":"Ship or recover safely A schema change or a restore you have actually tested.\nWork through this in order and check in with me after each step. Stay read-only until I approve a change.\n\n1. Start: PG17 for a change about to ship; PG15 for rebuilding or recovery.\n\nAre our database changes safe before we merge? (PG17)\nReview this database change against the live schema, existing consumers, prior migrations and deployment process. Establish whether it preserves current records, supports old and new application versions during rollout, and can be verified on an isolated database. Identify the smallest necessary migration and a realistic recovery path before approving it.\n\nCan we rebuild this database from its sources? (PG15)\nDetermine whether this PostgreSQL database can be rebuilt from the repository, migration files, original source materials, and retained records. Flag anything that exists only in production, manual fixes that cannot be replayed, and data that would be lost forever. Where feasible, test rebuilding onto an isolated test database and compare sampled rows and relationships against production.\n\nTreat this as a read-only investigation. Do not edit code, data, configuration, credentials or infrastructure. Report each finding with file:line or a command I can rerun, and a confidence.\n\nAnything that changes state, such as a rebuild, replay or migration test, runs only on a separate database with safe test data, never on production.\n\nBring back: The exact inputs and migration sequence required to rebuild, any irreplaceable production-only state, and a sampled comparison from an isolated rebuild if run.\n\nIf this describes the project, say so and stop instead: The database is either a disposable cache or holds primary user-authored records backed up via snapshots instead of rebuilt from external sources.\n\nAvoid: Testing restores against production, or treating the existence of backup files as proof they restore cleanly.\n\n2. If needed: G02 for deploy timing; R06 for half-finished failures; PG04 when past results must not move.\n\nDatabase changes during a deploy (G02)\nReview the pending database migration or API schema change against the current live schema, previous release's queries, active background workers, and deployment sequence. Check whether it preserves existing data, causes table locks, breaks older client bundles or workers still draining during deploy (such as column renames, drops, or non-nullable additions), and whether a real rollback or recovery path exists. Never assume reverting app code alone rolls back a schema change.\n\nHalf-finished failures (R06)\nTrace error, timeout, and cancellation paths for database transactions, locks, file handles, temporary files, background jobs, and external network calls. Find paths that leave resources held open or data half-committed when something fails midway, and demonstrate the highest-risk case with controlled failure injection where practical.\n\nReproduce what the database believed in the past (PG04)\nChoose important historical records and determine whether the system can reproduce what was known and reported at a specific past date, using the definitions and evidence available then. Distinguish later source corrections from later classification changes. Find where current logic silently rewrites historical meaning and recommend the smallest reliable solution.\n\n3. Change: Run migrations and restores on a separate database, check compatibility, and plan the recovery.\n\n4. Done when: A migration or restore tested on a separate database, and no claim about production that wasn't proved.","rel":["PG04","PG15","PG17","G02","R06"],"tags":"recipe workflow","dmode":"Asks before changing","line":"Several database prompts in order to ship a schema change, or test a restore, safely."},{"id":"M01","sec":"think","group":"Thinking prompts","t":"Deeper, not bigger","p":"Give me the thorough, senior-level version of this task without expanding its scope. Look at what I'm trying to accomplish and identify what an experienced practitioner would check, question, or verify that I overlooked. Inspect the original code and data instead of relying on summaries. Name the specific checks or evidence that will prove the result is right, then refine the task plan accordingly. Keep the objective and scope tight, and skip extra process that adds complexity without improving the result.","use":"Use it before you hand an agent a task you only half know how to describe.","aka":"Professional-grade, not larger","dmode":"Depends on the task","line":"Has the agent point out what a experienced engineer would check or verify that you left out, then tighten the plan without growing the scope."},{"id":"M02","sec":"think","group":"Thinking prompts","t":"Prove it wrong","p":"Before we proceed, try to prove the proposed plan wrong. List the key assumptions it relies on, search the code, data, logs, and documentation for evidence against each one, and run the fastest check or test that could break it. Report which assumptions held, which failed, and which you could not check. If any failed, explain what changes and propose the smallest adjustment. Recommend going ahead only if nothing you found contradicts the plan.","use":"Use it when an agent's plan sounds right and you can't see why it might be wrong.","aka":"Falsification","dmode":"Asks before changing","line":"Tells the agent to actively hunt for evidence that its own plan will fail before you approve it."},{"id":"M03","sec":"think","group":"Thinking prompts","t":"Root cause first","p":"Do not patch the visible symptom yet. Reproduce the problem first, then trace backward through code and data until you can explain in one or two plain sentences why it happens, citing the exact files, lines, or records involved. Search the codebase for every other place that shares the same cause. Report the cause, the proof, and every affected location. Then propose one fix that removes the underlying cause everywhere it applies, plus a check that fails if it returns. Wait for my yes before editing.","use":"Use it the second time the same kind of bug shows up.","aka":"Root cause","dmode":"Report only","line":"Stops the agent from patching symptoms; it must reproduce the bug, trace the exact cause, and find everywhere else that same cause lives."},{"id":"M04","sec":"think","group":"Thinking prompts","t":"Simpler first","p":"Before adding any new code, layer, setting, table, or dependency, look for something you can remove instead. Check whether deleting a redundant wrapper, special case, duplicate path, or unused rule solves the problem or makes it simpler. Only if removal cannot solve it, propose the smallest addition that works and justify each new piece. Judge options by how little there will be to understand and maintain next month, avoiding unnecessary moving parts.","use":"Use it when the proposed fix adds a new setting, table or service.","aka":"Complexity reduction","dmode":"Changes code","line":"Makes the agent try solving the problem by removing an existing layer, setting, or special case before adding anything new."},{"id":"M05","sec":"think","group":"Thinking prompts","t":"Let the expert decide","p":"Make the technical decisions yourself the way a senior engineer on this project would: follow the repository's existing patterns first, then established standards and official documentation, and inspect the codebase when unsure instead of asking me. Bring me only choices about product behavior, user impact, ongoing cost, or risks I must accept — each with your recommendation and how hard it is to change later. At the end, list the technical choices you made in one line each so I have a record.","use":"Use it when an agent keeps asking you technical questions you can't judge.","aka":"Expert delegation","rel":["PG16"],"dmode":"Depends on the task","line":"Tells the agent to make routine technical decisions on its own and escalate only product, cost, or risk calls to you."},{"id":"M06","sec":"think","group":"Thinking prompts","t":"Check it independently","p":"Prove this works without relying only on the code or unit tests you just wrote. Pick an independent check that will actually fail if the fix is broken: walk through the running app like a real user, call the real endpoint, inspect the real stored data, compare against an outside source, or write a check from the original requirement without reading your implementation. Run that check, show the actual output, and state plainly what it still does not cover.","use":"Use it before you accept 'tests pass' as proof that something works.","aka":"Independent verification","dmode":"Changes code","line":"Requires the agent to prove a fix works using a path that cannot pass just because its own tests agree with its own code."},{"id":"M07","sec":"think","group":"Thinking prompts","t":"Spec without the interview","p":"Turn my request into a short working specification: desired outcome, what is in scope, what is explicitly out of scope, observable acceptance criteria, and where to stop. Resolve technical questions yourself by reading the repository and primary documentation. Ask me only about product behavior, permissions, or tradeoffs you cannot decide from the codebase. Show me the short spec first and wait for my yes before editing files unless I already told you to proceed immediately.","use":"The default way to start a real task. The opposite of /grill-me.","aka":"Outcome-bound spec without needless interview","rel":["PG16"],"dmode":"Changes code","line":"Turns your request into a short, checkable plan with clear boundaries, answering technical questions from the codebase before asking you anything."},{"id":"M08","sec":"think","group":"Thinking prompts","t":"Reproduce, measure, prove","p":"Before editing anything to fix this bug or slowdown, create a reproducible failing case or a measured baseline. Trace the root cause, apply the narrowest fix that removes it, rerun an independent check, and report the exact before-and-after evidence. If you cannot reproduce or measure the problem, stop and tell me what evidence is missing instead of claiming it is fixed.","use":"Use it in the second session, after a read-only investigation found a real problem.","dmode":"Changes code","line":"Enforces a strict before-and-after loop: capture a failing case or baseline measurement first, apply the smallest fix, then rerun an independent check."},{"id":"M09","sec":"think","group":"Thinking prompts","t":"Compare three options","p":"Do not implement the first workable idea you think of. Lay out three meaningfully different ways to solve this: (1) the smallest conservative patch to the existing code, (2) the cleanest long-term design, and (3) a subtractive option that removes an existing layer, constraint, or special case. For each option, compare what else it could break, how easy it is to test, and how it fails. Recommend one in plain English and wait for my decision before editing anything.","use":"Use it for decisions that will be expensive to undo.","aka":"Three-way tradeoff","dmode":"Asks before changing","line":"Forces the agent to propose three distinct approaches (a minimal patch, a clean long-term fix, and a version that removes complexity) and recommend one before coding."},{"id":"M10","sec":"think","group":"Thinking prompts","t":"Handoff note before you stop","p":"Write a compact, self-contained technical handoff so a fresh agent session can resume this work cold. Include only: (1) verified facts and current system state, (2) approaches already tried and why they were ruled out, (3) exact files modified and any uncommitted changes in flight, and (4) the single next verifiable step. Record ground truth from the repository and commands run, skipping conversational recap.","use":"Use it before the agent compacts (shrinks its memory of the chat) or a long session ends. /pre-compact does the full version.","aka":"Cold-start handoff checkpoint","dmode":"Writes notes only","line":"Produces a compact, factual status note so a fresh agent session can resume right where this one stopped."},{"id":"M11","sec":"think","g
