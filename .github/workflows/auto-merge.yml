# Turns on auto-merge (squash) for the owner's pull requests when they open or
# leave draft. GitHub then merges once every required check and rule on main is
# satisfied. Off unless the repository variable AUTO_MERGE is "on" (the kill
# switch: Settings > Secrets and variables > Actions > Variables). Add the label
# "no-auto-merge" to keep a PR open; drafts are skipped.
#
# When a PR is already mergeable, `gh pr merge --auto` merges at once, and it
# fails with "Base branch was modified" if main moved in the same moment. That
# one error is retried a few times; before each retry the PR is read again, and
# the run stops quietly if it gained "no-auto-merge", went back to draft, or is
# no longer open. Any other error fails the run. tests/workflows/ runs this
# script against a stub `gh`.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      vars.AUTO_MERGE == 'on' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.event.pull_request.html_url }}
          ATTEMPTS: "4"
          RETRY_DELAY: "10"
        run: |
          attempt=1
          while :; do
            if [ "$attempt" -gt 1 ]; then
              pr=$(gh pr view "$URL" --json state,isDraft,labels \
                --jq '[.state, (.isDraft | tostring), (any(.labels[]; .name == "no-auto-merge") | tostring)] | join(" ")')
              read -r state draft optout <<< "$pr"
              if [ "$state" != "OPEN" ]; then echo "PR is $state now; nothing to do."; exit 0; fi
              if [ "$draft" = "true" ]; then echo "PR went back to draft; skipping."; exit 0; fi
              if [ "$optout" = "true" ]; then echo "PR is labeled no-auto-merge; skipping."; exit 0; fi
            fi
            out=$(gh pr merge "$URL" --auto --squash --delete-branch 2>&1) && rc=0 || rc=$?
            [ -n "$out" ] && printf '%s\n' "$out"
            [ "$rc" -eq 0 ] && exit 0
            case "$out" in
              *"Base branch was modified"*) ;;
              *) exit "$rc" ;;
            esac
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "::error::main kept moving; gave up after $attempt attempts."
              exit "$rc"
            fi
            echo "main moved during the merge; retrying in $((RETRY_DELAY * attempt))s."
            sleep $((RETRY_DELAY * attempt))
            attempt=$((attempt + 1))
          done
