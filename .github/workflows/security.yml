# Security scans whose results show up in GitHub, so they can be read and fixed
# per PR. Two required checks:
# - osv: known-vulnerable dependencies in every lockfile in the repo (seconds).
# - codeql: static analysis of the JavaScript/TypeScript code. Alerts land in
#   Security > Code scanning and on the PR.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    name: osv
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - "**/node_modules"
              - "library/dist"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
