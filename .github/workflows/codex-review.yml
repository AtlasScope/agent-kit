# Required check "codex-review": passes once a Codex review has finished.
# Codex keeps one summary comment on the PR with a hidden state block
# (codex-review-state:v1) and edits it from "running" to done; it also leaves a
# review with inline findings, or a thumbs-up when it finds nothing. A Codex
# security review, when one runs, must finish with no unresolved findings. Findings
# are review threads, and main requires every thread resolved before merge, so
# "fixed or dismissed" is enforced there, not here.
name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

env:
  CODEX_LOGIN: chatgpt-codex-connector[bot]

jobs:
  codex-review:
    name: codex-review
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: codex-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Look for a Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          api() { gh api --paginate "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          reviews=$(api "pulls/$PR/reviews" "[.[] | select(.user.login == env.CODEX_LOGIN)] | length")
          thumbs=$(api "issues/$PR/reactions" "[.[] | select(.user.login == env.CODEX_LOGIN and .content == \"+1\")] | length")
          # Latest state block from Codex's summary comment (code review and security review).
          state=$(api "issues/$PR/comments" '.[] | select(.user.login == env.CODEX_LOGIN) | .body' \
            | sed 's/&#123;/{/g; s/&#125;/}/g' \
            | grep -o 'codex-review-state:v1 {.*} -->' | tail -1 \
            | sed 's/^codex-review-state:v1 //; s/ -->$//')
          field() { [ -n "$state" ] && printf '%s' "$state" | jq -r "$1 // \"\"" 2>/dev/null || true; }
          status=$(field .code_review.status)
          sec_status=$(field .security_review.status)
          sec_open=$(field .security_review.has_unresolved_findings)
          echo "Codex reviews: $reviews, thumbs-up: $thumbs, code review: ${status:-none}, security review: ${sec_status:-none} (unresolved findings: ${sec_open:-n/a})"
          case "$status:$sec_status" in
            running:*|queued:*|pending:*|in_progress:*|*:running|*:queued|*:pending|*:in_progress)
              echo "::error::Codex is still reviewing this PR."; exit 1 ;;
          esac
          if [ "$sec_open" = "true" ]; then
            echo "::error::Codex security review has unresolved findings. Fix them or resolve them on the PR."
            exit 1
          fi
          if [ -n "$status" ] || [ $((reviews + thumbs)) -gt 0 ]; then
            echo "Codex has finished reviewing. Unresolved findings still block merge until resolved."
            exit 0
          fi
          echo "::error::Waiting for a Codex review. If none arrives, comment '@codex review' on the PR."
          exit 1

  # A Codex comment or thumbs-up does not fire pull_request_review, and checks from
  # issue_comment runs land on main rather than the PR. So when Codex comments,
  # re-run the PR's latest check run instead.
  rerun-on-codex-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run codex-review for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codex-review.yml/runs?head_sha=$sha&per_page=20" \
            --jq '[.workflow_runs[] | select(.event != "issue_comment")][0].id // empty')
          if [ -z "$run" ]; then echo "No codex-review run for $sha yet"; exit 0; fi
          gh run rerun "$run" --repo "$GITHUB_REPOSITORY"
