# Fast checks for pull requests. One job, named "ci", which branch rules require.
# It always reports, and skips the steps whose files the PR does not touch, so a
# docs-only PR finishes quickly. Catalog content gets site validation and a
# production build; site behavior changes also get browser smoke journeys.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find changed areas
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Use statuses as well as paths: a modified nested reference is not site data,
          # but an added/removed file can change the skill folder's published file list.
          diff=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')
          files=$(printf '%s\n' "$diff" | cut -f2,3 | tr '\t' '\n' | sed '/^$/d')
          structural=$(printf '%s\n' "$diff" | awk -F '\t' '$1 != "modified" {print $2; if ($3 != "") print $3}')
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          changed_shape() { printf '%s\n' "$structural" | grep -qE "$1" && echo true || echo false; }
          all=$(has '^\.github/workflows/ci\.yml$')
          # GitHub caps the PR-files API at 3000; never silently skip checks on a huge change.
          [ "$(printf '%s\n' "$diff" | wc -l)" -ge 3000 ] && all=true
          skillshape=$(changed_shape '^kits/[^/]+/plugins/')
          content=$(has '^(library/(library\.json|copy\.mjs)$|CREDITS\.md$|kits/[^/]+/(THIRD_PARTY\.md$|plugins/[^/]+/(\.claude-plugin/plugin\.json$|skills/[^/]+/(SKILL\.md|LICENSE)$)))')
          [ "$skillshape" = true ] && content=true
          runtime=$(has '^site/(app/|components/|lib/|public/|db/|next\.config\.ts$|proxy\.ts$|package(-lock)?\.json$|tsconfig\.json$|scripts/(build-content|design-jobs|migrate)\.mjs$)')
          unit=$(has '^(site/tests/[^/]+|tests/library/page)\.mjs$')
          browser=$(has '^site/tests/smoke/')
          [ "$runtime" = true ] && browser=true
          build=false
          [ "$runtime" = true ] || [ "$content" = true ] || [ "$browser" = true ] && build=true
          [ "$runtime" = true ] || [ "$content" = true ] && unit=true
          site=false
          [ "$build" = true ] || [ "$unit" = true ] && site=true
          library=$(has '^(library/(library\.json|audit\.json|build\.mjs|check\.mjs|copy\.mjs|template\.html|dist/)|tests/library/(copy\.test|page)\.mjs$|kits/(design-kit|engineering-kit)/scripts/|kits/design-kit/plugins/design-kit/skills/(keen/(SKILL\.md$|jobs/)|design/references/(catalog|recipes|situations)\.md$)|kits/engineering-kit/plugins/engineering-kit/skills/(engineer/references/(start-here|investigations)\.md$|database/references/prompts\.md$))')
          routing=$(has '^(library/library\.json$|tests/routing/|kits/[^/]+/plugins/[^/]+/(\.claude-plugin/plugin\.json$|skills/[^/]+/(SKILL\.md$|agents/openai\.yaml$))|kits/design-kit/plugins/design-kit/skills/design/references/recipes\.md$)')
          [ "$skillshape" = true ] && routing=true
          checker=$(has '^(library/(check\.mjs|build\.mjs|template\.html)$|kits/(design-kit|engineering-kit)/scripts/|tests/library/)')
          public=$(has '^(kits/|library/library\.json$|scripts/check-public|[A-Z]+\.md$)')
          catalog=$(has '^(\.claude-plugin/|\.agents/|scripts/(check-catalog|sync-page)|tests/sync-page|kits/[^/]+/plugins/[^/]+/(\.(claude|codex)-plugin/plugin\.json$|README\.md$|skills/[^/]+/(SKILL\.md|scripts/(worksheet|evidence)\.mjs|references/evidence\.md)$))')
          [ "$skillshape" = true ] && catalog=true
          motion=$(has '^kits/motion-kit/plugins/motion-kit/skills/motion/(scripts|tests)/')
          keen=$(has '^kits/design-kit/plugins/design-kit/skills/keen/(scripts|tests)/')
          engineer=$(has '^kits/engineering-kit/plugins/engineering-kit/skills/engineer/(scripts|tests)/')
          database=$(has '^kits/engineering-kit/plugins/engineering-kit/skills/database/(scripts|tests)/')
          studio=$(has '^kits/studio-kit/plugins/studio-kit/skills/studio/(scripts|src|tests)/|^kits/design-kit/plugins/design-kit/skills/palette-builder/scripts/palette\.mjs$')
          ea=$(has '^kits/experience-architecture/(plugins/experience-architecture/scripts/|tests/(data/|journeys/|proposals/|[^/]+\.test\.mjs$)|fixtures/(northwind|fernway|kestrel)/|package(-lock)?\.json$)')
          [ "$all" = true ] && site=true build=true unit=true browser=true library=true routing=true checker=true public=true catalog=true motion=true keen=true engineer=true database=true studio=true ea=true
          # A required check always reports, but irrelevant changes need no checkout or install.
          checkout=false
          for flag in "$site" "$library" "$routing" "$checker" "$public" "$catalog" "$motion" "$keen" "$engineer" "$database" "$studio" "$ea"; do
            [ "$flag" = true ] && checkout=true
          done
          for name in site build unit browser library routing checker public catalog motion keen engineer database studio ea checkout; do
            echo "$name=${!name}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v7
        if: steps.changes.outputs.checkout == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.checkout == 'true'
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.changes.outputs.site == 'true' && 'npm' || '' }}
          cache-dependency-path: site/package-lock.json

      - name: Check shipped files for personal references
        if: steps.changes.outputs.public == 'true'
        run: node scripts/check-public.mjs

      - name: Check the plugin catalogs, manifests and skill folders
        if: steps.changes.outputs.catalog == 'true'
        run: |
          node scripts/check-catalog.mjs
          node --test tests/sync-page.test.mjs

      - name: Check the prompt library
        if: steps.changes.outputs.library == 'true'
        run: node library/check.mjs

      - name: Check the routing cases
        if: steps.changes.outputs.routing == 'true'
        run: node tests/routing/check.mjs

      - name: Test the library verifier's failure and non-mutation behavior
        if: steps.changes.outputs.checker == 'true'
        run: node --test tests/library/check-read-only.test.mjs

      - name: Test that the portable library copies what library/copy.mjs composes
        if: steps.changes.outputs.library == 'true'
        run: node --test tests/library/copy.test.mjs

      # The capture tests need a browser. Playwright goes in a folder outside the checkout, because the
      # script will not load a copy from inside the project it is looking at.
      - name: Install a browser for the motion-kit and Keen browser tests
        if: steps.changes.outputs.motion == 'true' || steps.changes.outputs.keen == 'true'
        run: |
          version="$(node -p "require('./site/package.json').devDependencies.playwright")"
          npm install --prefix "$RUNNER_TEMP/motion-playwright" --no-audit --no-fund "playwright@$version"
          "$RUNNER_TEMP/motion-playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "MOTION_PLAYWRIGHT_DIR=$RUNNER_TEMP/motion-playwright" >> "$GITHUB_ENV"

      - name: Test the motion-kit scripts
        if: steps.changes.outputs.motion == 'true'
        env:
          MOTION_REQUIRE_BROWSER: "1"
        run: node --test "kits/motion-kit/plugins/motion-kit/skills/motion/tests/*.test.mjs"

      - name: Test the Keen scripts
        if: steps.changes.outputs.keen == 'true'
        env:
          KEEN_REQUIRE_BROWSER: "1"
        run: node --test "kits/design-kit/plugins/design-kit/skills/keen/tests/*.test.mjs"

      - name: Test the Studio Kit build and checks
        if: steps.changes.outputs.studio == 'true'
        run: node --test "kits/studio-kit/plugins/studio-kit/skills/studio/tests/*.test.mjs"

      # The instruments read and clone Git repositories they make in temp folders; they need git, no browser.
      - name: Test the engineer instruments
        if: steps.changes.outputs.engineer == 'true'
        run: node --test "kits/engineering-kit/plugins/engineering-kit/skills/engineer/tests/*.test.mjs"

      # A real PostgreSQL and real psql: the runner has both installed with the service stopped. The tests create
      # and drop their own schema and roles, so they connect as postgres, with a password made for this run so the
      # dblink check can connect back over TCP. AGENT_KIT_REQUIRE_PG turns an unreachable database into a failure.
      - name: Test the database scripts against PostgreSQL
        if: steps.changes.outputs.database == 'true'
        env:
          AGENT_KIT_REQUIRE_PG: "1"
        run: |
          sudo systemctl start postgresql.service
          pg_isready --host=127.0.0.1 --timeout=30
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          (cd / && sudo -u postgres psql -X -q --command="ALTER ROLE postgres PASSWORD '$password'")
          psql --version
          AGENT_KIT_PG_URL="postgres://postgres:$password@127.0.0.1:5432/postgres" \
            node --test "kits/engineering-kit/plugins/engineering-kit/skills/database/tests/*.test.mjs"

      - name: Test Experience Architecture's deterministic toolkit
        if: steps.changes.outputs.ea == 'true'
        working-directory: kits/experience-architecture
        # The browser scenarios require a running fixture app. Keep them opt-in; do
        # not skip the static, privacy, transition and installer regressions.
        run: node --test "tests/*.test.mjs"

      - name: Prepare site content
        if: steps.changes.outputs.site == 'true'
        working-directory: site
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run content

      - name: Test site logic
        if: steps.changes.outputs.unit == 'true'
        working-directory: site
        run: node --test "tests/**/*.test.mjs"

      # Next's production build already runs TypeScript validation.
      - name: Build the site
        if: steps.changes.outputs.build == 'true'
        working-directory: site
        run: npx next build

      - name: Run browser smoke journeys
        if: steps.changes.outputs.browser == 'true'
        working-directory: site
        run: |
          if [ -z "${MOTION_PLAYWRIGHT_DIR:-}" ]; then npx playwright install --with-deps chromium; fi
          npm run smoke
