# Fast checks for pull requests. One job, named "ci", which branch rules require.
# It always reports, and skips the steps whose files the PR does not touch, so a
# docs-only PR finishes in seconds. Site changes also get a production build and
# browser smoke journeys (home, prompt, skill) at desktop and phone sizes.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find changed areas
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          all=$(has '^\.github/workflows/')
          site=$(has '^(site|library|kits)/')
          library=$(has '^(library|kits/engineering-kit|kits/design-kit)/')
          public=$(has '^(kits/|library/|scripts/check-public|[A-Z]+\.md$)')
          catalog=$(has '^(kits/|\.claude-plugin/|\.agents/|scripts/check-catalog)')
          [ "$all" = true ] && site=true library=true public=true catalog=true
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "catalog=$catalog" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.changes.outputs.site == 'true' || steps.changes.outputs.library == 'true' || steps.changes.outputs.public == 'true' || steps.changes.outputs.catalog == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.site == 'true' || steps.changes.outputs.library == 'true' || steps.changes.outputs.public == 'true' || steps.changes.outputs.catalog == 'true'
        with:
          node-version: 22
          cache: ${{ hashFiles('site/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: site/package-lock.json

      - name: Check shipped files for personal references
        if: steps.changes.outputs.public == 'true'
        run: node scripts/check-public.mjs

      - name: Check the plugin catalogs, manifests and skill folders
        if: steps.changes.outputs.catalog == 'true'
        run: node scripts/check-catalog.mjs

      - name: Check the prompt library
        if: steps.changes.outputs.library == 'true'
        run: node library/check.mjs

      - name: Typecheck the site
        if: steps.changes.outputs.site == 'true' && hashFiles('site/package.json') != ''
        working-directory: site
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run content
          npm run typecheck
          node --test "tests/**/*.test.mjs"

      - name: Build the site and run browser smoke journeys
        if: steps.changes.outputs.site == 'true' && hashFiles('site/package.json') != ''
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npx next build
          npm run smoke
