.m-solid{background:var(--ac);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.16px) var(--ac)}
.m-satin{background:radial-gradient(130% 110% at 50% -40%,rgba(255,255,255,.3),transparent 64%),linear-gradient(180deg,var(--ach),var(--acl));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px color-mix(in oklch,var(--acl),#000 50%),0 calc(var(--dp)*.16px) calc(var(--dp)*.44px) calc(var(--dp)*-.2px) var(--ac)}
.m-glass{color:var(--glassfg);background:color-mix(in oklch,var(--ac) calc(var(--tint)*1%),rgba(255,255,255,var(--fa)));backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.7);-webkit-backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.7);box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--rim)*.5)),inset 0 0 0 1px rgba(255,255,255,calc(var(--rim)*.3)),0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.24px) rgba(0,0,0,.7)}
.m-outline{color:var(--ac);box-shadow:inset 0 0 0 calc(var(--rim)*2px) var(--ac)}
.m-tint{color:var(--ac);background:color-mix(in oklch,var(--ac) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--ac) 32%,transparent)}
.m-ink{color:#0b0e0d;background:#f6f8f7;box-shadow:0 calc(var(--dp)*.16px) calc(var(--dp)*.4px) calc(var(--dp)*-.2px) rgba(0,0,0,.6)}
.m-gborder{color:var(--glassfg);background:linear-gradient(rgba(10,13,12,.6),rgba(10,13,12,.6)) padding-box,linear-gradient(135deg,var(--ach),#4aa8ff 55%,#b07bff) border-box;border:calc(var(--rim)*2px) solid transparent}
.m-chrome{color:#10151a;background:linear-gradient(110deg,#e9eef2,#fff 25%,#aeb8c0 50%,#f4f7f9 75%,#cfd7dd);box-shadow:inset 0 1px 0 #fff,0 calc(var(--dp)*.2px) calc(var(--dp)*.44px) calc(var(--dp)*-.2px) rgba(0,0,0,.7)}
.m-gel{background:linear-gradient(180deg,color-mix(in oklch,var(--ach) 85%,transparent),color-mix(in oklch,var(--acl) 72%,transparent));box-shadow:inset 0 2px 2px rgba(255,255,255,.7),inset 0 -4px 8px rgba(0,60,20,.3),0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.2px) var(--ac)}
.m-gel .gls::before{content:"";position:absolute;left:12%;right:12%;top:3px;height:40%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.7),transparent)}
.m-slab{background:var(--ac);box-shadow:0 1px 0 var(--acl),0 2px 0 var(--acl),0 3px 0 var(--acl),0 4px 0 var(--acl),0 5px 0 var(--acl),0 calc(var(--dp)*.1px + 4px) 14px rgba(0,0,0,.5)}
:where(.m-slab):active{transform:translateY(4px)}
.m-neo{color:var(--ac);background:#101312;box-shadow:inset 3px 3px 8px rgba(0,0,0,.8),inset -2px -2px 6px rgba(255,255,255,.08)}
.m-neon{color:var(--ach);background:color-mix(in oklch,var(--ac) 6%,transparent);box-shadow:inset 0 0 0 calc(var(--rim)*2.5px) var(--ac),0 0 calc(var(--dp)*.3px) -2px var(--ac),inset 0 0 14px -6px var(--ac);text-shadow:0 0 10px var(--ac)}
.m-pastel{color:oklch(.3 .06 var(--H));background:color-mix(in oklch,var(--ac) 22%,#fff);box-shadow:0 calc(var(--dp)*.3px) calc(var(--dp)*.6px) calc(var(--dp)*-.3px) var(--ac),inset 0 -3px 0 color-mix(in oklch,var(--ac) 30%,#fff)}
.m-brutal{color:#0b0e0d;background:var(--ac);box-shadow:4px 4px 0 #fff,4px 4px 0 calc(var(--rim)*2.5px) #0b0e0d}
.m-brutal:active{box-shadow:1px 1px 0 #fff,1px 1px 0 1.5px #0b0e0d}
:where(.m-brutal):active{transform:translate(3px,3px)}
.m-bevel{color:var(--glassfg);background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.04));backdrop-filter:blur(calc(var(--blur)*1px));-webkit-backdrop-filter:blur(calc(var(--blur)*1px));box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(255,255,255,.1),0 calc(var(--dp)*.28px) calc(var(--dp)*.6px) calc(var(--dp)*-.3px) #000}
.m-holo{color:#0b0e0d;background:linear-gradient(115deg,#ffd1f0,#c7f3ff,#d8ffc9,#ffe9b8,#ffd1f0);background-size:300% 100%;background-position:0 0;transition:background-position .9s var(--ease),transform var(--tt,.25s var(--ease)),box-shadow .3s var(--ease),filter .2s,opacity .25s;box-shadow:inset 0 1px 0 #fff,0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.2px) #9fe}
.m-holo:hover{background-position:100% 0}
.m-mesh{color:#071410;background:var(--ac)}
.m-mesh .fx{background:radial-gradient(60% 90% at 15% 20%,var(--ach),transparent 60%),radial-gradient(60% 90% at 85% 80%,oklch(.8 .17 var(--H2)),transparent 60%);background-size:200% 200%;animation:meshm calc(8s*var(--spd)) ease-in-out infinite alternate}
@keyframes meshm{to{background-position:100% 100%}}
.m-frost{color:#0b0e0d;background:rgba(255,255,255,.72);backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.6);-webkit-backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.6);box-shadow:inset 0 1px 0 #fff,0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.24px) rgba(0,0,0,.5)}
.m-smoked{color:#fff;background:rgba(8,10,10,.55);backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.4);-webkit-backdrop-filter:blur(calc(var(--blur)*1px)) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.1),0 calc(var(--dp)*.2px) calc(var(--dp)*.5px) calc(var(--dp)*-.24px) #000}
.m-dashed{color:var(--ac);background:color-mix(in oklch,var(--ac) 8%,transparent);border:calc(var(--rim)*2.4px) dashed color-mix(in oklch,var(--ac) 80%,transparent)}
/* colour modes */
.cm-duo.m-solid,.cm-duo.m-slab{background:linear-gradient(120deg,var(--ac),var(--ac2))}
.cm-duo.m-satin{background:radial-gradient(130% 110% at 50% -40%,rgba(255,255,255,.3),transparent 64%),linear-gradient(120deg,var(--ach),var(--ac2))}
.cm-duo.m-gel{background:linear-gradient(120deg,color-mix(in oklch,var(--ach) 85%,transparent),color-mix(in oklch,var(--ac2) 72%,transparent))}
.cm-duo.m-pastel{background:linear-gradient(120deg,color-mix(in oklch,var(--ac) 22%,#fff),color-mix(in oklch,var(--ac2) 22%,#fff))}
.cm-rainbow.m-solid,.cm-rainbow.m-slab,.cm-rainbow.m-gel,.cm-rainbow.m-pastel{color:#10151a;background:linear-gradient(120deg,oklch(.8 .17 20),oklch(.86 .16 90),oklch(.82 .18 150),oklch(.78 .15 230),oklch(.75 .18 310))}
.cm-rainbow.m-satin{color:#10151a;background:radial-gradient(130% 110% at 50% -40%,rgba(255,255,255,.3),transparent 64%),linear-gradient(120deg,oklch(.8 .17 20),oklch(.86 .16 90),oklch(.82 .18 150),oklch(.78 .15 230),oklch(.75 .18 310))}
/* gloss, shine and spotlight live on .gls so they never fight a material or idle layer */
.pv .gls{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% -30%,rgba(255,255,255,calc(var(--gloss)*.5)),transparent 60%)}
.m-outline .gls,.m-tint .gls,.m-neon .gls,.m-dashed .gls,.m-neo .gls,.m-ink .gls,.m-chrome .gls,.m-brutal .gls,.m-gborder .gls{background:none}
.pv .gls::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);opacity:0;transition:left .7s var(--ease),opacity .2s}
.h-shine .gls::after{opacity:1}
@media (hover:hover){.h-shine:hover .gls::after{left:130%}}
.h-spot .gls::before{content:"";position:absolute;inset:0;background:radial-gradient(90px 60px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 70%);opacity:0;transition:opacity .2s}
.h-spot:hover .gls::before{opacity:1}
.pv .fx2{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
/* idle motion. Whole-button moves use translate/scale/rotate so hover and press transforms still work on top. */
.i-sheen .fx::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:sweep calc(5s*var(--spd)) ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.i-breathe{animation:breathe calc(3.6s*var(--spd)) ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.18) drop-shadow(0 0 14px var(--ac))}}
.i-orbit::before,.i-prism::before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a),transparent 0 62%,var(--ach) 80%,#fff 88%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin calc(3.4s*var(--spd)) linear infinite;pointer-events:none}
.i-prism::before{background:conic-gradient(from var(--a),#ff6b9a,#ffd166,#2fe27a,#4aa8ff,#b07bff,#ff6b9a)}
@keyframes spin{to{--a:360deg}}
.i-aurora .fx{background:linear-gradient(120deg,transparent,rgba(120,180,255,.5),rgba(190,120,255,.5),transparent);background-size:300% 100%;animation:flow calc(7s*var(--spd)) linear infinite}
@keyframes flow{to{background-position:300% 0}}
.i-bob{animation:bob calc(4s*var(--spd)) ease-in-out infinite}
@keyframes bob{50%{translate:0 -4px}}
.i-sonar::before,.i-sonar::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1.5px solid var(--ac);animation:sonar calc(2.8s*var(--spd)) ease-out infinite;pointer-events:none}
.i-sonar::after{animation-delay:calc(1.4s*var(--spd))}
@keyframes sonar{from{transform:scale(1);opacity:.8}to{transform:scale(1.3,1.6);opacity:0}}
.i-shimmer .t{background:linear-gradient(100deg,currentColor 30%,#fff 45%,currentColor 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh calc(3.2s*var(--spd)) linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-100% 0}}
.i-dot .lb::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--ach);box-shadow:0 0 0 0 var(--ach);animation:ping calc(2s*var(--spd)) ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 .9em transparent}}
.i-sparkle .fx::before,.i-sparkle .fx::after,.l-sparkle::before,.l-sparkle::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff,60px 12px 0 #fff,-40px -8px 0 #fff;left:30%;top:30%;animation:tw calc(2.6s*var(--spd)) ease-in-out infinite;opacity:0}
.i-sparkle .fx::after,.l-sparkle::after{left:62%;top:60%;animation-delay:1.1s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.4)}}
.i-smoke .fx::before{content:"";position:absolute;width:60%;height:140%;top:-20%;left:0;border-radius:50%;background:var(--ach);filter:blur(16px);opacity:.5;animation:smoke calc(6s*var(--spd)) ease-in-out infinite alternate}
@keyframes smoke{to{transform:translateX(70%) scale(1.3)}}
.i-blob{animation:blob calc(7s*var(--spd)) ease-in-out infinite}
@keyframes blob{50%{border-radius:58% 42% 45% 55%/45% 58% 42% 55%}}
.i-beat{animation:beat calc(2.4s*var(--spd)) ease-in-out infinite}
@keyframes beat{0%,100%{scale:1}8%{scale:1.045}16%{scale:1}24%{scale:1.03}32%{scale:1}}
.i-scan .fx::after,.l-scan::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,#fff,transparent);top:-2px;animation:scan calc(3.4s*var(--spd)) ease-in-out infinite}
@keyframes scan{to{top:100%}}
.i-caustic .fx::before,.i-caustic .fx::after{content:"";position:absolute;width:55%;height:120%;border-radius:50%;filter:blur(14px);opacity:.6;animation:orbit2 calc(5s*var(--spd)) linear infinite}
.i-caustic .fx::before{background:var(--ach)}.i-caustic .fx::after{background:#7ab8ff;animation-delay:calc(-2.5s*var(--spd))}
@keyframes orbit2{0%{transform:translate(-10%,-20%)}25%{transform:translate(120%,-20%)}50%{transform:translate(120%,20%)}75%{transform:translate(-10%,20%)}100%{transform:translate(-10%,-20%)}}
.i-wave .fx::before{content:"";position:absolute;left:-50%;width:200%;height:140%;top:50%;background:radial-gradient(50% 40% at 25% 0,color-mix(in oklch,var(--ach) 60%,transparent) 98%,transparent) 0 0/50% 100% repeat-x;animation:wave calc(4.5s*var(--spd)) linear infinite}
@keyframes wave{to{transform:translateX(25%)}}
.i-bubbles .fx::before,.l-bubbles::before{content:"";position:absolute;bottom:-6px;left:20%;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:60px 0 0 -1px rgba(255,255,255,.45),130px 0 0 1px rgba(255,255,255,.5);animation:rise2 calc(4s*var(--spd)) linear infinite}
@keyframes rise2{to{transform:translateY(-70px);opacity:0}}
.i-underglow{animation:glowp calc(4s*var(--spd)) ease-in-out infinite}
@keyframes glowp{50%{filter:drop-shadow(0 8px 18px var(--ac)) brightness(1.08)}}
.i-march::before{content:"";position:absolute;inset:-4px;border-radius:inherit;border:1.5px dashed var(--ac);animation:marchb calc(1.6s*var(--spd)) ease-in-out infinite alternate;pointer-events:none}
@keyframes marchb{to{opacity:.2}}
.i-glare .fx::after,.l-glare::after{content:"";position:absolute;inset:-50%;background:conic-gradient(from var(--a),transparent 0 70%,rgba(255,255,255,.35) 85%,transparent);animation:spin calc(4s*var(--spd)) linear infinite}
.i-jelly{animation:jelly calc(4s*var(--spd)) ease-in-out infinite}
@keyframes jelly{0%,86%,100%{scale:1}90%{scale:1.08 .92}94%{scale:.97 1.04}97%{scale:1.02 .99}}
.i-sway{animation:sway calc(3.6s*var(--spd)) ease-in-out infinite alternate}
@keyframes sway{from{rotate:-1.2deg}to{rotate:1.2deg}}
.i-flicker{animation:flick calc(6s*var(--spd)) infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.7}96%{opacity:1}97%{opacity:.8}}
.i-pan{background-size:220% 100%!important;animation:pan calc(5s*var(--spd)) ease-in-out infinite alternate}
@keyframes pan{to{background-position:100% 0}}
.l-edge{box-shadow:inset 0 1.5px 0 var(--ach);animation:edgeb calc(3.6s*var(--spd)) ease-in-out infinite}
@keyframes edgeb{50%{box-shadow:inset 0 1.5px 0 #fff,inset 0 8px 16px -10px var(--ach)}}
.if-nudge svg{animation:nudge calc(2.4s*var(--spd)) ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.if-spin svg{animation:rot calc(6s*var(--spd)) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.if-bounce svg{animation:bnc calc(1.8s*var(--spd)) ease-in-out infinite}
@keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.if-pulse svg{animation:pls calc(2s*var(--spd)) ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.25)}}
.ti{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:rgba(0,0,0,.2);margin-left:-.5em}.ti.r{margin:0 -.5em 0 0}
.ti svg{width:1.05em;height:1.05em}
.pv.leaf{border-radius:calc(var(--h)/2) 6px calc(var(--h)/2) 6px}
.pv.circ{width:var(--h);padding:0}.pv.circ .t{display:none}
/* hover (pointer devices only), press and focus */
@media (hover:hover){
.h-lift:hover{transform:translateY(-2px);filter:brightness(1.06)}
.h-rise:hover{transform:translateY(-3px);filter:brightness(1.05)}
.h-scale:hover{transform:scale(1.06)}
.h-glow:hover{box-shadow:0 0 34px -2px var(--ac),inset 0 0 0 1px rgba(255,255,255,.3)}
.h-brighten:hover{filter:brightness(1.12)!important}
.h-invert:hover{background:#fff!important;color:#0b0e0d!important;box-shadow:none;-webkit-text-fill-color:currentColor}
.h-wobble:hover{animation:wobble .5s ease}
.h-nudge:hover svg{transform:translateX(3px)}.h-nudge[data-icon=download]:hover svg{transform:translateY(2px)}
.h-ring:hover{box-shadow:0 0 0 4px color-mix(in oklch,var(--ac) 40%,transparent)}
}
@keyframes wobble{25%{rotate:-2deg}50%{rotate:2deg}75%{rotate:-1deg}}
.p-sink:active{transform:scale(.95)!important}
.p-squish:active{transform:scale(1.06,.92)!important}
.p-bounce{--tt:.35s var(--spring)}.p-bounce:active{transform:scale(.92)!important}
.p-flash:active{filter:brightness(1.4)!important}
.p-3d:active{transform:translateY(3px) perspective(300px) rotateX(8deg)!important}
.p-ring:active{box-shadow:0 0 0 8px color-mix(in oklch,var(--ac) 45%,transparent)!important}
.pv .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.pv .hf{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.35);transition:width .2s}
.pv.holding .hf{width:100%;transition:width 1s linear}
:is(.f-accent:focus-visible,.f-accent.kf){outline-color:var(--ach)}:is(.f-white:focus-visible,.f-white.kf){outline-color:#fff}
:is(.f-glow:focus-visible,.f-glow.kf){outline:none;box-shadow:0 0 0 3px #000,0 0 0 5px var(--ach),0 0 24px var(--ac)}
/* entrance */
.e-fade{animation:efade .7s var(--ease) both}.e-up{animation:eup .7s var(--ease) both}.e-scale{animation:escale .6s var(--spring) both}.e-blur{animation:eblur .8s var(--ease) both}.e-spring{animation:espring .8s var(--spring) both}
@keyframes efade{from{opacity:0}}@keyframes eup{from{opacity:0;transform:translateY(24px)}}@keyframes escale{from{opacity:0;transform:scale(.7)}}@keyframes eblur{from{opacity:0;filter:blur(14px)}}@keyframes espring{from{opacity:0;transform:translateY(40px) scale(.9)}}
/* after press */
.pv.copied{background:#fff!important;color:#08210f!important;backdrop-filter:none;filter:none;-webkit-text-fill-color:currentColor}
.pv.copied::before,.pv.copied::after{animation:none}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ringp::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:ringp .9s var(--ease) forwards;pointer-events:none}
@keyframes ringp{0%{box-shadow:0 0 0 0 var(--ac)}100%{box-shadow:0 0 0 22px transparent}}
.pv .spinner{width:1.1em;height:1.1em;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
.pv.prog .fx::after{content:"";position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.4);animation:fillw 1.1s var(--ease) forwards}
@keyframes fillw{from{width:0}to{width:100%}}
.pt{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:burst .8s var(--ease) forwards;z-index:2}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* the button's column inside the device screen */
.unit{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:calc(var(--col,440px) + 2*var(--gut,16px));padding:0 var(--gut,16px);box-sizing:border-box}
/* layouts */
.row{display:inline-flex;gap:var(--gap,2px);align-items:stretch;max-width:100%}
.row.gap{gap:8px}
.row.dock{padding:6px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.row .pv.l{border-radius:var(--r) calc(var(--r)*.25) calc(var(--r)*.25) var(--r)}
.row .pv.r{border-radius:calc(var(--r)*.25) var(--r) var(--r) calc(var(--r)*.25);padding:0 calc(var(--h)*.3)}
.row .pv.m{border-radius:calc(var(--r)*.25)}
.row.dl .pv+.pv{box-shadow:inset 1px 0 0 rgba(0,0,0,.28)}
.row.dn .pv.l{border-radius:var(--r) 0 0 var(--r)}.row.dn .pv.m{border-radius:0}.row.dn .pv.r{border-radius:0 var(--r) var(--r) 0}
.chipa{display:inline-flex;gap:6px;align-items:center;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(0,0,0,.22);font-size:.85em}
.chipa i{width:1.4em;height:1.4em;border-radius:50%;display:grid;place-items:center;font-size:.7em;font-style:normal;color:#fff}
.tri{position:relative;display:inline-grid;grid-template-columns:repeat(var(--n,3),1fr);padding:4px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.tri button{all:unset;cursor:pointer;position:relative;z-index:1;padding:8px 16px;font-weight:600;font-size:13px;text-align:center;color:#fff}
.tri button.on{color:#06210f}
.tri .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));border-radius:999px;background:var(--ac);transition:transform .45s var(--spring)}
.pair .pv+.pv{box-shadow:inset 1px 0 0 rgba(0,0,0,.2)}
.achips,.logos{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ac{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);transition:all .25s var(--spring)}
.ac.on{background:var(--ac);color:var(--on);box-shadow:none;transform:scale(1.05)}
.lg2{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .3s var(--spring),box-shadow .2s}
.lg2.on{box-shadow:0 0 0 2px #000,0 0 0 4px var(--ach);transform:scale(1.1)}
.expand{display:inline-flex;gap:6px;align-items:center;max-width:0;opacity:0;overflow:hidden;transition:max-width .5s var(--ease),opacity .3s,margin .4s;margin-left:0}
.expand.open{max-width:360px;opacity:1;margin-left:8px}
.nx{font-size:12px;color:#c4cdc9;margin:0;max-width:260px;text-align:center}
.lnk{color:var(--ach);font-size:14px;font-weight:600;text-decoration:none;animation:rise .5s var(--spring) both}
.agents{display:flex;flex-direction:column;gap:8px;width:100%;max-width:230px}
.agents .pv{opacity:0;transform:translateY(16px);animation:rise .5s var(--spring) forwards;width:100%;justify-content:space-between}
.agents .pv:nth-child(2){animation-delay:.07s}.agents .pv:nth-child(3){animation-delay:.14s}
@keyframes rise{to{opacity:1;transform:none}}
/* menu */
.menu{position:absolute;z-index:30;left:50%;transform:translateX(-50%);top:calc(100% + 8px);width:min(280px,86vw);max-width:86vw;max-height:200px;overflow:auto;padding:7px;border-radius:var(--mr);background:color-mix(in oklab,#1b1f1e,transparent 12%);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 30px 60px -20px #000;transition:all .35s var(--spring);transform-origin:top center;color:#f3f5f4;text-align:left;font-family:var(--font)}
.menu.shut{opacity:0;transform:translateX(-50%) scale(.92) translateY(-8px);pointer-events:none}
.menu.solid{background:#1b1f1e}
.menu.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto!important;max-width:none;transform:none;border-radius:var(--mr) var(--mr) 0 0}
.menu.sheet.shut{transform:translateY(100%);opacity:1}
.menu button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:calc(var(--mr) - 8px);cursor:pointer;font-weight:500;font-size:14px}
.menu button:hover,.menu button.on{background:color-mix(in oklch,var(--ac) 22%,transparent)}
.menu .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.menu .kbd{margin-left:auto;font:12px var(--mono);color:#8c9693}
.menu small{display:block;font-weight:400;font-size:12px;color:#8c9693}
.menu.d-compact button{padding:5px 10px}.menu.d-roomy button{padding:14px 12px}
.menu.hi-solid button.on{background:var(--ac);color:var(--on)}
.menu.hi-outline button.on{background:none;box-shadow:inset 0 0 0 1.5px var(--ac)}
.menu.grid .lst{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.menu.grid .lst button{flex-direction:column;text-align:center;padding:14px 6px}
.menu.pills .lst{display:flex;flex-wrap:wrap;gap:6px}
.menu.pills .lst button{width:auto;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:7px 12px}
.menu.command .srch{padding:10px 12px;font-size:14px;color:#8c9693;border-radius:14px;background:rgba(0,0,0,.25);margin-bottom:6px}
.menu.ma-slide.shut{transform:translateX(-50%) translateY(-18px)}.menu.ma-fade.shut{transform:translateX(-50%)}
/* done screens */
.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(5,6,6,.94);color:#f3f5f4;transform:translateY(100%);transition:transform .55s var(--ease)}
.overlay.in{transform:none}
.overlay .chk{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#06210f;display:grid;place-items:center;box-shadow:0 0 34px -4px var(--ac);transform:scale(.4);opacity:0}
.overlay.in .chk{animation:pop .55s .15s var(--spring) forwards}
@keyframes pop{to{transform:none;opacity:1}}
.overlay h4{margin:0;font-size:22px;letter-spacing:-.03em}.overlay small{color:#8c9693}
.overlay.sheetm{inset:auto 0 0 0;justify-content:flex-start;border-radius:26px 26px 0 0;background:rgba(22,25,24,.97);box-shadow:none;transform:translateY(120%);padding:22px 18px 18px}
.overlay.sheetm.in{transform:none;box-shadow:0 0 0 200vmax rgba(0,0,0,.45)}
.toast{position:absolute;z-index:10;left:12px;right:12px;bottom:12px;border-radius:22px;padding:10px 10px 10px 12px;background:rgba(30,34,33,.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 20px 40px -10px #000;display:flex;align-items:center;gap:10px;transform:translateY(130%);transition:transform .6s var(--spring);color:#f3f5f4;text-align:left}
.toast.in{transform:none}
.toast.top{top:12px;bottom:auto;transform:translateY(-140%)}.toast.top.in{transform:none}
.toast b{display:block;font-size:14px}.toast span.s{font-size:12px;color:#9aa5a1}
.toast .dot{width:24px;height:24px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:#06210f;flex:none}

/* ===== Palette module. Layout only: every colour is written inline from the palette being drawn ===== */
.pl-mini{position:relative;box-sizing:border-box;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left}
.pl-mini *{box-sizing:border-box}
.pl-bar{display:block;flex:none;border-radius:2px;max-width:100%}
.pl-col{display:flex;flex-direction:column;gap:5px;min-width:0}
.pl-row{display:flex;align-items:center;gap:7px;margin-top:3px}
.pl-dots{display:flex;gap:4px}.pl-dots i{width:6px;height:6px;border-radius:50%}
.pl-card{display:flex;flex-direction:column;gap:6px;border-radius:7px;padding:7px}
.pl-field{display:flex;align-items:center;height:13px;padding:0 4px;border-radius:4px}
.pl-btn{display:inline-grid;place-items:center;height:17px;padding:0 9px;border-radius:5px}

/* The shell's frame lays a drawing out at full size before scaling it down; centre the track too, or a drawing wider
   than its tile sits off to the right. Scoped to this module's drawings (the general fix belongs in studio.css). */
.art:has(> .art-in > .pl-mini){place-content:center}

/* a tile: a tiny page */
.pl-mini{width:180px;height:110px;border-radius:10px;display:grid;grid-template-rows:18px 1fr}
.pl-mh{display:flex;align-items:center;gap:6px;padding:0 9px}
.pl-mh i{width:7px;height:7px;border-radius:50%}
.pl-mb{display:grid;grid-template-columns:1fr 62px;gap:8px;padding:10px 9px 9px}
.pl-mb .pl-col{padding-top:2px}
.pl-stat{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:7px;padding:0 18px}
.pl-pill{display:flex;align-items:center;gap:7px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600}
.pl-pill i{width:9px;height:9px;border-radius:50%;flex:none}
.pl-words{display:flex;align-items:center;gap:14px;padding:0 18px}
.pl-words b{font:600 40px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em}
.pl-words .pl-col{gap:3px;font-size:12px;font-weight:550}

/* a look: the palette as big coordinated swatches */
.art:has(.pl-strip-big){padding:16px;place-content:stretch}
.art:has(.pl-strip-big)>.art-in{width:100%;height:100%;transform:none!important}
.pl-strip-big{display:flex;width:100%;height:100%;min-width:240px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pl-strip-big i{flex:1}

/* a representative piece of the product, painted with the palette */
.pl-scene{box-sizing:border-box;width:360px;font:14px/1.45 var(--sc-body,system-ui,-apple-system,"Segoe UI",sans-serif);text-align:left}
.pl-scene *{box-sizing:border-box}
.pl-sh{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:13px}
.pl-sh b{flex:1;font-weight:650;letter-spacing:-.01em}
.pl-sh span{display:flex;gap:14px}
.pl-sh i{display:none}
.pl-sb{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px}
.pl-eb{margin:0;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
.pl-scene h4{margin:0;font-size:22px;line-height:1.12;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.pl-p{margin:0;font-size:13.5px}
.pl-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 6px;font-size:13.5px;font-weight:550}
.pl-go{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;font-weight:650}
.pl-box{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:12px}
.pl-lbl{font-size:12.5px;font-weight:600}
.pl-in{display:flex;align-items:center;min-height:34px;padding:0 10px;border-radius:8px;font-size:13px}
.pl-st{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:550}
.pl-st i{width:7px;height:7px;border-radius:50%}
.pl-st i:not(:first-child){margin-left:6px}
.pl-scene.big{width:420px}
.pl-cmp{display:flex;flex-direction:column;width:100%}
.pl-cmp .pl-scene{width:100%}
.pl-cmp .pl-strip-big{height:34px;border-radius:0;min-width:0;box-shadow:none}
.pl-live{width:100%;min-height:100%}
.pl-live .pl-scene{width:100%;min-height:100%}

/* colour roles: one row per job, each opening Palette Builder's families and shades */
.panel:has(> .pl-rrow){display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;align-items:start}
.panel:has(> .pl-rrow)>:not(.pl-rrow){grid-column:1/-1}
.pl-rrow{border-radius:13px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pl-rrow.open{grid-column:1/-1;box-shadow:inset 0 0 0 1px var(--line2)}
.pl-rbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px}
.pl-rbtn:hover{background:var(--s2)}
.pl-rbtn:focus-visible{outline:2px solid #5b9dff;outline-offset:-2px}
.pl-rsw{width:40px;height:40px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pl-rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-rtx b{font-size:14px;font-weight:600}
.pl-rtx small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-rv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.pl-rv code{font:12.5px/1 var(--mono);color:var(--fg)}
.pl-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.pl-tag.pl-today{color:var(--okc)}.pl-tag.pl-changed{color:#9cc4ff}.pl-tag.pl-estimated{color:var(--amb)}
.pl-tok,.pl-bad{margin:0;padding:0 12px 9px 64px;font:12px/1.4 var(--mono);color:var(--mut)}
.pl-tok span{color:var(--dim)}
.pl-bad{font-family:var(--font);color:var(--amb)}
.pl-pick{padding:6px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pl-fams{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.pl-fam{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;font-size:12.5px;color:#c3cbc8;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line)}
.pl-fam i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pl-fam[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.pl-fam:focus-visible,.pl-shade:focus-visible{outline:2px solid #5b9dff;outline-offset:2px}
.pl-shades{display:flex;flex-direction:column;gap:6px}
.pl-shrow{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.pl-shrow span{font-size:12px;color:var(--mut)}
.pl-shade{all:unset;cursor:pointer;height:34px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pl-shade[aria-pressed=true]{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--fg)}
.pl-pacts{display:flex;gap:6px;flex-wrap:wrap}

/* readability: every pair, now and today */
.pl-read .why{margin:0 0 14px}
.pl-pairs{list-style:none;margin:0;padding:0;border-radius:13px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--s1)}
.pl-pairs li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.pl-pairs li:first-child{border-top:0}
.pl-pairs li b{font-weight:600}
.pl-aa{display:grid;place-items:center;height:34px;border-radius:8px;font-weight:650;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.pl-res{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.pl-res b{font-size:13px}.pl-res b.ok{color:var(--okc)}.pl-res b.no{color:var(--amb)}
.pl-res small{font-size:12px;color:var(--mut)}
@media (max-width:899px){.pl-shrow{grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px}.pl-shade{height:28px}.pl-tok,.pl-bad{padding-left:12px}}
/* Review and Compare: the palette's piece of the product at full width, never cropped */
.art:has(.pl-cmp),.cmp-art:has(.pl-cmp){height:auto;place-items:stretch;place-content:stretch}
.art:has(.pl-cmp)>.art-in,.cmp-art:has(.pl-cmp)>.art-in{width:100%;transform:none!important}
/* light and dark together */
.pl-strips{display:flex;flex-direction:column;gap:8px;width:100%;height:100%;min-width:240px}
.pl-strips .pl-strip-big{min-width:0;height:auto;flex:1}
.art:has(.pl-strips){padding:16px;place-content:stretch}
.art:has(.pl-strips)>.art-in{width:100%;height:100%;transform:none!important}
.pl-twins{display:flex;gap:10px}
.pl-cap{display:block;padding:7px 12px;font:600 11px/1.3 var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--c-fg-3);background:var(--c-sunken)}
.pl-two{flex-direction:row;gap:1px;background:var(--line)}
.pl-two>div{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--s1)}
.pl-two .pl-scene{flex:1}
.pl-pair{display:grid;grid-template-rows:1fr 1fr;gap:1px;height:100%;background:var(--line)}
.pl-pair>div{position:relative;min-height:0;overflow:hidden;background:var(--c-sunken)}
.pl-pair .pl-cap{position:absolute;z-index:1;right:8px;top:8px;padding:3px 8px;border-radius:6px;background:oklch(0% 0 0 / .62);color:var(--c-fg-2);backdrop-filter:blur(6px)}
.pl-pair .pl-scene{min-height:100%}
.pl-side{margin:18px 0 8px;font:600 12px/1.3 var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--c-fg-3)}
.pl-side:first-child{margin-top:0}
.pl-twinh{margin:26px 0 4px;font-size:15px;font-weight:600}
@media (max-width:899px){.pl-two{flex-direction:column}}
.pl-pair .pl-cap{top:auto;bottom:8px}
.pl-pair .pl-p,.pl-pair .pl-box{display:none}
.pl-pair .pl-sb{padding-top:14px}
.pl-pair .pl-scene h4{font-size:17px}
.ba:has(.pl-two){grid-template-columns:minmax(0,1fr)}
@media (max-width:899px){.pl-pair .pl-sh{display:none}.pl-pair .pl-sb{padding-top:10px}.pl-pair .pl-scene h4{font-size:15px}.pl-pair .pl-acts{margin-top:8px}}
/* a look: the strip, then each theme with the project's own headline and action */
.pl-lk{display:flex;flex-direction:column;gap:10px;width:100%;min-width:260px}
.pl-lk .pl-strip-big{height:40px;min-width:0}
.pl-cards{display:flex;gap:8px}
.pl-card2{font-family:var(--dfont);flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px 12px;border-radius:8px;text-align:left}
.pl-card2 .pl-sd{font-size:11px;font-weight:500;line-height:1.2}
.pl-card2 b{max-width:100%;font-size:14px;line-height:1.2;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-card2 .pl-go{min-height:0;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.art:has(.pl-lk){height:auto;padding:14px;place-content:stretch}
.art:has(.pl-lk)>.art-in{width:100%;transform:none!important}

/* ===== Typography module. Colour is inherited, so drawings read on dark and light stages alike ===== */
.ty{color:inherit;font-synthesis:none;text-align:left;box-sizing:border-box;-webkit-font-smoothing:antialiased}
.bgd[data-bg=light] .ty,.bgd[data-bg=paper] .ty,.ty.ty-lt{color:#14181a}
.ty *{box-sizing:border-box;margin:0}
.ty-h{font-family:var(--ty-display);font-weight:var(--ty-hw);line-height:var(--ty-hlh);letter-spacing:var(--ty-track);text-transform:var(--ty-case);text-wrap:balance;overflow-wrap:anywhere}
.ty-t{font-family:var(--ty-body);font-weight:var(--ty-bw);line-height:var(--ty-lh);font-variant-numeric:var(--ty-num);text-wrap:pretty}
.ty-c{display:block;font-family:var(--ty-mono);font-variant-numeric:normal;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.ty-faint{opacity:.62}
.ty-strong{font-weight:600}
.ty-gap{margin-top:.45em!important}
.ty-c2,.ty-c3,.ty-c4{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.ty-c2{-webkit-line-clamp:2}.ty-c3{-webkit-line-clamp:3}.ty-c4{-webkit-line-clamp:4}
.ty-read{max-width:calc(var(--ty-measure)*1ch)}
.ty-lbl{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:6px!important}
.ty-miss{display:block;margin-top:6px;padding:2px 7px;border-radius:6px;width:max-content;max-width:100%;font:600 12px/1.3 var(--font);color:#1a1300;background:#f5b94a}
.ty-tile .ty-miss{font-size:15px}
.ty-miss.ty-top{margin:0 0 6px}
/* Specimens fill their card and grow to their words: the whole headline, a whole paragraph, nothing clipped. */
.art:has(.ty),.cmp-art:has(.ty){height:auto;min-height:150px;place-items:stretch;place-content:stretch}
.art:has(.ty)>.art-in,.cmp-art:has(.ty)>.art-in{width:100%;transform:none!important}
.ty-tile{width:100%;padding:18px 20px 16px}
.ty-spec{width:100%;padding:20px 22px 18px}
.ty-spec.ty-big{padding:24px 26px 22px}
.looks .art:has(.ty){min-height:240px}
.ty-numrow{display:block;font-family:var(--ty-body);font-variant-numeric:var(--ty-num);letter-spacing:.01em;opacity:.85;margin-top:.5em}
.ty-tile .ty-meta{display:block;margin-bottom:6px}
.ty-nums{border-collapse:collapse;width:100%;line-height:1.35}
.ty-nums td{padding:2px 0}.ty-nums td+td{text-align:right}
/* the "On its own" specimen sheet */
.ty-sheet{width:min(100%,920px);align-self:start;padding:28px clamp(16px,4%,40px) 48px;font-size:var(--ty-size)}
.ty-sheet section{margin-top:34px}
.ty-meta{font:500 12px/1.4 var(--font);letter-spacing:.01em;opacity:.62}
.ty-meta b{display:block;font-weight:500;font-family:var(--mono);opacity:.85}
.ty-sec{margin-bottom:12px!important;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.ty-who{opacity:.8}
.ty-warnline{margin-top:10px!important;padding:8px 12px;border-radius:10px;font:500 13px/1.45 var(--font);color:#1a1300;background:#f5b94a}
.ty-row{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:baseline;gap:14px;padding:6px 0}
.ty-one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ty-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px 40px}
.ty-split .ty-t+.ty-t{margin-top:4px}
.ty-table{border-collapse:collapse;width:100%;max-width:420px}

const HEX = /^#[0-9A-F]{6}$/i;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hue360 = (h) => ((h % 360) + 360) % 360;

const toGamma = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);

  const [r, g, b] = hexRgb(hex).map(toLinear);

  const x = lum(a), y = lum(b);

/* ---- button/preview.js ---- */
/* ===== Button preview: draws the button from S, runs the after-press flows ===== */

const nA = () => Math.max(1, Math.min(S.nagents, AG.length));
const pickedChoice = () => AG[Math.min(S.agent, AG.length - 1)] || ['', '#555', '?', ''];
const fill = (t) => String(t).replace(/\{choice\}/g, AG.length ? pickedChoice()[0] : '');
const hexLum = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return 0;
  const n = parseInt(m[1], 16);
  return ((n >> 16 & 255) * 0.299 + (n >> 8 & 255) * 0.587 + (n & 255) * 0.114) / 255;
};
const lightBg = () => ['light', 'paper'].includes(V.bg) || (V.bg === 'page' && hexLum(pageColour()) > 0.55) || sceneIsLight();
const autoDark = (s) => s.tc === 'dark' || (s.tc === 'auto' && btnColour(s).L > 0.7);
const RADIUS = { pill: '999px', blob: '999px', circle: '999px', leaf: '999px', sharp: '5px' };

/** CSS custom properties the button styles read. */
function previewVars() {
  const s = S, k = btnColour(s);
  const r = s.shape === 'squircle' ? Math.round(s.h * 0.36) + 'px' : RADIUS[s.shape] || s.rr + 'px';
  return {
    '--h': s.h + 'px', '--r': r, '--pad': s.pad, '--H': k.H, '--H2': s.H2, '--C': k.C, '--L': k.L,
    '--on': autoDark(s) ? `oklch(.2 .05 ${k.H})` : '#fff', '--glassfg': lightBg() ? '#0b0e0d' : '#fff',
    '--blur': s.blur, '--fa': s.fa, '--tint': s.tint, '--rim': s.rim, '--depth': s.depth, '--gloss': s.gloss, '--spd': s.spd,
    '--wt': s.wt, '--fs': s.fs, '--trk': s.trk, '--isz': s.isz + 'em', '--bf': btnFont(s),
    '--mr': s.menuR + 'px', '--gap': s.gap + 'px',
  };
}
const previewTall = () => !!S.menuOpen && hasMenu(S) && S.menuStyle !== 'sheet';
const onMenuStep = () => NAV.mod === 'button' && !NAV.review && NAV.cat.button === 'menu' && hasMenu(S);

const svg = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const chev = svg('chevron');

    RL.forEach((r) => {
      const v = s['r_' + r.id], R = rolesOn(s, PROJECT_ROLES.length ? r.side : s.side);
      out[r.id] = typeof v === 'string' && C.HEX.test(v) ? v.toUpperCase() : R[r.slot] || R.text;
    });
    return out;
  };
  /** The colours the drawings use, by kind, with the project's own roles laid over the direction's. */
  const slots = (s, side = s.side) => {
    const R = Object.assign({}, rolesOn(s, side)), v = values(s);
    const lay = PROJECT_ROLES.length ? (BOTH ? FIRST_ON[side] : side === s.side ? FIRST_OF_SLOT : {}) : side === s.side ? FIRST_OF_SLOT : {};
    for (const k in lay) R[k] = v[lay[k]];
    return R;
  };
  /** The other theme, when there is one: [side, its colours, whether it is the project's own or a matched proposal]. */
  const twin = (s) => (twinOn(s) ? [otherSide(s), slots(s, otherSide(s)), BOTH] : null);
  /** A role as Palette Builder's helpers expect it; the thirteen stand-in roles sit on whichever side the palette is. */
  const roleFor = (s) => (r) => (PROJECT_ROLES.length ? r : Object.assign({}, r, { side: s.side === 'light' ? 'light' : 'dark' }));

  /* ---- what the project has today ---- */
  const fromHexes = (h) => {
    const ok = (x) => typeof x === 'string' && C.HEX.test(x), out = {};
    if (!ok(h.page)) return out;
    const [L, ch, H] = C.toOklch(h.page), dark = L < 0.6, side = dark ? 'dark' : 'light';
    out.side = side;
    out.base = r2(lim(dark ? (L - 0.1) / 0.16 : (1 - L) / 0.08, 0, 1));
    if (ch < 0.006) Object.assign(out, { tint: 'Neutral', gH: 0, gC: 0, tintk: 1 });
    else {
      const fam = C.familyOf(h.page, false), t = C.TINTS.find((x) => x[0] === fam) || C.TINTS[1];
      Object.assign(out, { tint: t[0], gH: Math.round(H), gC: t[2], tintk: r2(lim(ch / t[2], 0, 4)) });
    }
    if (ok(h.surface)) out.sep = r2(lim(Math.abs(C.toOklch(h.surface)[0] - L) / (dark ? 0.045 : 0.035), 0.2, 3));
    if (ok(h.text)) { const t = C.toOklch(h.text)[0]; out.textk = r2(lim(dark ? (t - 0.86) / 0.13 : (0.31 - t) / 0.17, 0, 1)); }
    if (ok(h.accent)) {
      const acc = C.toOklch(h.accent);
      if (acc[1] >= 0.03) { out.hue = Math.round(acc[2]); out.vivid = r2(acc[1]); } else out.vivid = 0;
      out.lift = r2(lim(acc[0] - ACC[side], -0.3, 0.25));
    }
    if (ok(h.fill)) {
      const f = C.toOklch(h.fill), near = (x) => ok(x) && C.ratio(x, h.fill) < 1.15 && Math.abs(C.toOklch(x)[1] - f[1]) < 0.04;
      if (near(h.accent)) out.fill = 'accent';
      else if (near(h.text)) out.fill = 'ink';
      else if (C.ratio(h.fill, h.page) < 1.6) out.fill = 'soft';
      else if (f[1] >= 0.03) { out.fill = 'own'; out.fillHue = Math.round(f[2]); }
      else out.fill = 'ink';
    }
    const st = ['ok', 'warn', 'bad'].filter((k) => ok(h[k])).map((k) => [k, C.toOklch(h[k])]);
    if (st.length) {
      out.stC = r2(lim(st.reduce((a, [, x]) => a + x[1], 0) / st.length, 0.02, 0.26));
      st.forEach(([k, x]) => { if (x[1] >= 0.03) out[k + 'H'] = Math.round(x[2]); });
      const gap = (a, b) => Math.min(C.hue360(a - b), C.hue360(b - a));
      const v = Object.assign({}, DEFAULTS, out);
      out.stSet = SETS.reduce((b, x) => { const d = gap(x[3].okH, v.okH) + gap(x[3].warnH, v.warnH) + gap(x[3].badH, v.badH); return d < b[1] ? [x[0], d] : b; }, ['classic', 1e9])[0];
    }
    return out;
  };
  /* The direction that comes closest to today, then every found value laid over it exactly. */
  const found = {};
  RL.forEach((r) => { if (r.value && r.slot && !found[r.slot]) found[r.slot] = r.value; });
  const today = Object.assign(fromHexes(found), (PP.today && typeof PP.today === 'object') ? PP.today : {});
  RL.forEach((r) => { if (r.value) today['r_' + r.id] = r.value; });
  today.pair = DEFAULTS.pair;
  const measured = RL.some((r) => r.value);
  if (!measured && !(PP.today && PP.today.side)) DEFAULTS.side = 'light'; // a project with no colours yet starts on a plain light page

  const fix = (s) => {
    if (s.side !== 'light') s.side = 'dark';
    s.pair = BOTH ? 'both' : s.pair === 'both' ? 'both' : 'one';
    for (const k in DEFAULTS) if (typeof DEFAULTS[k] === 'number') s[k] = num(s[k], DEFAULTS[k]);
    s.base = lim(s.base, 0, 1); s.textk = lim(s.textk, 0, 1); s.tintk = lim(s.tintk, 0, 4); s.sep = lim(s.sep, 0.2, 3);
    s.vivid = lim(s.vivid, 0, 0.32); s.lift = lim(s.lift, -0.3, 0.25); s.stC = lim(s.stC, 0.02, 0.26);
    ['gH', 'hue', 'fillHue', 'okH', 'warnH', 'badH'].forEach((k) => { s[k] = C.hue360(s[k]); });
    RL.forEach((r) => { const k = 'r_' + r.id; s[k] = typeof s[k] === 'string' && C.HEX.test(s[k]) ? s[k].toUpperCase() : ''; });
  };
  const pick = (s, c) => {
    if (c.k === 'hue' && s.vivid < 0.005) s.vivid = 0.14; // choosing a colour should show it
    if (c.k === 'tint' && s.gC > 0 && s.tintk < 0.2) s.tintk = 1;
  };

  /* ---- drawings: every colour inline, so many states can be drawn side by side ---- */
  const bar = (bg, w, h = 4) => `<span class="pl-bar" style="background:${bg};width:${w}px;height:${h}px"></span>`;
  const dots = (R) => `<span class="pl-dots"><i style="background:${R.ok}"></i><i style="background:${R.warn}"></i><i style="background:${R.bad}"></i></span>`;
  const edge = (c) => `box-shadow:inset 0 0 0 1px ${c}`;
  const mini = (R) => `<div class="pl-mini" style="background:${R.page}">`
    + `<div class="pl-mh" style="background:${R.surface};border-bottom:1px solid ${R.line}"><i style="background:${R.accent}"></i>${bar(R.text2, 22, 3)}${bar(R.text3, 16, 3)}</div>`
    + '<div class="pl-mb"><div class="pl-col">'
    + `<span class="pl-bar" style="background:${R.text};width:78px;height:8px;border-radius:3px"></span>${bar(R.text2, 90, 3)}${bar(R.text2, 70, 3)}${bar(R.text3, 48, 3)}`
    + `<span class="pl-row"><span class="pl-btn" style="background:${R.fill}">${bar(R['on-fill'], 18, 3)}</span><span class="pl-bar" style="background:${R.accent};width:24px;height:3px"></span></span></div>`
    + `<div class="pl-card" style="background:${R.surface};${edge(R.line)}">${bar(R.text, 30, 3)}<span class="pl-field" style="${edge(R.control)}"></span>${dots(R)}</div>`
    + '</div></div>';
  const statusArt = (R) => `<div class="pl-mini pl-stat" style="background:${R.page}">`
    + [['ok', 'Saved'], ['warn', 'Needs a look'], ['bad', 'Failed']].map(([k, w]) => `<span class="pl-pill" style="background:${R.surface};${edge(R.line)};color:${R[k]}"><i style="background:${R[k]}"></i>${w}</span>`).join('') + '</div>';
  const wordsArt = (R) => `<div class="pl-mini pl-words" style="background:${R.page}">`
    + `<b style="color:${R.text}">Aa</b><span class="pl-col"><span style="color:${R.text}">Main words</span><span style="color:${R.text2}">Secondary words</span><span style="color:${R.text3}">Faint hint</span></span></div>`;
  /** A coordinated palette at a glance: the jobs that carry it, as big swatches. */
  const STRIP = ['page', 'surface', 'line', 'text2', 'text', 'accent', 'fill', 'warn'];
  const strip = (R) => `<div class="pl-strip-big">${STRIP.map((k) => `<i style="background:${R[k]}" title="${esc(SLOT_NAME[k] || k)}"></i>`).join('')}</div>`;
  /** A representative piece of the product with its own words, painted with the palette: every role at work. */
  const scenelet = (R, big) => {
    const links = (CX.links.length ? CX.links : ['Docs', 'Pricing']).slice(0, big ? 3 : 2);
    const label = (STUDIO.has('button') ? ST.button.label : '') || (P.labels && P.labels[0] && two(P.labels[0])[0]) || 'Get started';
    const f = shared('fonts'), ff = f ? `;font-family:${esc(f.body)}` : '', hf = f ? ` style="font-family:${esc(f.display)}"` : '';
    return `<div class="pl-scene${big ? ' big' : ''}" style="background:${R.page};color:${R.text}${ff}">`
      + `<div class="pl-sh" style="border-bottom:1px solid ${R.line}"><b>${esc(P.name)}</b><span style="color:${R.text2}">${links.map((l) => `<span>${esc(l)}</span>`).join('')}</span></div>`
      + '<div class="pl-sb">'
      + (CX.eyebrow ? `<p class="pl-eb" style="color:${R.accent}">${esc(CX.eyebrow)}</p>` : '')
      + `<h4${hf}>${esc(CX.headline || 'A clear headline that says what this is')}</h4>`
      + `<p class="pl-p" style="color:${R.text2}">${esc(CX.body || 'One or two plain sentences underneath, long enough to judge how words read on this page.')}</p>`
      + `<div class="pl-acts"><span class="pl-go" style="background:${R.fill};color:${R['on-fill']}">${esc(label)}</span><span style="color:${R.accent}">${esc(CX.secondary || (P.secondary && P.secondary[0]) || 'Learn more')} →</span></div>`
      + `<div class="pl-box" style="background:${R.surface};${edge(R.line)}"><span class="pl-lbl">${esc(CX.field || 'Email')}</span>`
      + `<span class="pl-in" style="${edge(R.control)};color:${R.text3}">${esc(CX.placeholder || CX.hint || 'name@example.com')}</span>`
      + `<span class="pl-st"><i style="background:${R.ok}"></i><span style="color:${R.ok}">Saved</span><i style="background:${R.warn}"></i><span style="color:${R.warn}">Needs a look</span><i style="background:${R.bad}"></i><span style="color:${R.bad}">Failed</span></span></div>`
      + '</div></div>';
  };
  /** A look at a glance: one theme's page with the project's headline and its main action. */
  const swatchCard = (R, side) => {
    const f = shared('fonts'), ff = f ? `font-family:${esc(f.display)};` : '';
    const label = (STUDIO.has('button') ? ST.button.label : '') || (P.labels && P.labels[0] && two(P.labels[0])[0]) || 'Get started';
    return `<div class="pl-card2" style="${f ? `font-family:${esc(f.body)};` : ''}background:${R.page};color:${R.text};box-shadow:inset 0 0 0 1px ${R.line}"><span class="pl-sd" style="color:${R.text3}">${sideName(side)}</span>`
      + `<b style="${ff}">${esc(CX.headline || P.name)}</b><span class="pl-go" style="background:${R.fill};color:${R['on-fill']}">${esc(label)}</span></div>`;
  };
  const label2 = (side, own) => `${sideName(side)}${own ? '' : ', matched'}`;
  const still = (s, opt = {}) => {
    const R = slots(s), t = twin(s);
    if (opt.look) return `<div class="pl-lk">${strip(R)}<div class="pl-cards">${swatchCard(R, s.side)}${t ? swatchCard(t[1], t[0]) : ''}</div></div>`;
    if (opt.tile === 'pair') return t ? `<div class="pl-twins">${mini(R)}${mini(t[1])}</div>` : mini(R);
    if (opt.tile === 'stSet' || opt.tile === 'stC') return statusArt(R);
    if (opt.tile === 'textk') return wordsArt(R);
    if (opt.tile) return mini(R);
    if (t) return `<div class="pl-cmp pl-two"><div><span class="pl-cap">${sideName(s.side)}</span>${scenelet(R, true)}${strip(R)}</div><div><span class="pl-cap">${label2(t[0], t[2])}</span>${scenelet(t[1], true)}${strip(t[1])}</div></div>`;
    return `<div class="pl-cmp">${scenelet(R, true)}${strip(R)}</div>`;
  };
  /* The preview card: the palette at work in a representative piece of the product. */
  const live = (el, s) => {
    const t = twin(s);
    el.innerHTML = t
      ? `<div class="pl-live pl-pair"><div><span class="pl-cap">${sideName(s.side)}</span>${scenelet(slots(s), false)}</div><div><span class="pl-cap">${label2(t[0], t[2])}</span>${scenelet(t[1], false)}</div></div>`
      : `<div class="pl-live">${scenelet(slots(s), false)}</div>`;
  };

  /* ---- a role you can change on its own: Palette Builder's families and shades ---- */
  const status = (r, s) => {
    const v = s['r_' + r.id], base = DEFS.palette && DEFS.palette['r_' + r.id];
    if (!v) return ['Proposed', 'From the direction you chose; not a project value.'];
    if (r.value && v === r.value) return r.source === 'estimated' ? ['Estimated', 'Read from source, not measured on a running page.'] : ['Today', 'The exact value found in the project.'];
    return base && v === base ? ['Today', ''] : ['Changed', 'Set by hand here.'];
  };
  const contrastLine = (role, vals) => C.failures([role], vals).map((f) => `Too faint on ${esc((RBY[f.bg] || { name: f.bg }).name)}: ${C.showRatio(f.got)} to 1, needs ${f.min}.`).join(' ');
  function roleRow(c, s) {
    const r = RBY[c.role], vals = values(s), hex = vals[r.id], role = roleFor(s)(r), open = UI.open === 'palette:' + r.id;
    const [tag, tip] = status(r, s);
    const tok = r.tokens[0];
    const bad = contrastLine(role, vals);
    let pick = '';
    if (open) {
      const color = C.isColor(role), range = C.roleRange(role, hex), fam = C.familyOf(hex, color), L = C.toOklch(hex)[0];
      const fams = (color ? C.HUES : C.TINTS);
      const famBtn = (f) => {
        const rows = C.shadeRows(role, f, range, color), row = rows[Math.min(1, rows.length - 1)][1];
        const near = row.reduce((b, x) => (Math.abs(C.toOklch(x)[0] - L) < Math.abs(C.toOklch(b)[0] - L) ? x : b));
        return `<button class="pl-fam" data-mset="palette|r_${r.id}" data-val="${near}" aria-pressed="${f[0] === fam}" title="${esc(f[0])}"><i style="background:${C.familyPreview(role, f, range, color)}"></i>${esc(f[0])}</button>`;
      };
      const shades = C.shadeRows(role, fams.find((f) => f[0] === fam) || fams[0], range, color).map(([n, row]) => `<div class="pl-shrow"><span>${esc(n)}</span>${row.map((x) => `<button class="pl-shade" data-mset="palette|r_${r.id}" data-val="${x}" aria-pressed="${x === hex}" aria-label="${x}" title="${x}" style="background:${x}"></button>`).join('')}</div>`).join('');
      const fixTo = bad ? C.nearestPassing(role, vals) : null;
      pick = `<div class="pl-pick"><div class="pl-fams" role="group" aria-label="Colour family">${fams.map(famBtn).join('')}</div><div class="pl-shades">${shades}</div>`
        + '<div class="pl-pacts">'
        + (fixTo ? `<button class="chip sm" data-mset="palette|r_${r.id}" data-val="${fixTo}">Use the nearest readable shade, ${fixTo}</button>` : '')
        + (r.value && hex !== r.value ? `<button class="chip sm" data-mset="palette|r_${r.id}" data-val="${r.value}">Back to today’s ${r.value}</button>` : '')
        + (s['r_' + r.id] ? `<button class="chip sm ghost" data-mset="palette|r_${r.id}" data-val="">Follow the direction</button>` : '')
        + '</div></div>';
    }
    const head = BOTH && PROJECT_ROLES.find((x) => x.side === r.side) === r ? `<p class="pl-side">${sideName(r.side)} theme</p>` : '';
    return head + `<div class="pl-rrow${open ? ' open' : ''}" data-ctl="${c.id}"><button class="pl-rbtn" data-mopen="palette:${r.id}" aria-expanded="${open}">`
      + `<span class="pl-rsw" style="background:${hex}"></span><span class="pl-rtx"><b>${esc(r.name)}</b><small>${esc(r.used || SLOT_NAME[r.slot] || '')}</small></span>`
      + `<span class="pl-rv"><code>${hex}</code><span class="pl-tag pl-${tag.toLowerCase()}" title="${esc(tip)}">${tag}</span></span></button>`
      + (tok ? `<p class="pl-tok">${esc(tok.name)}${tok.file ? ` <span>${esc(tok.file)}</span>` : ''}${r.tokens.length > 1 ? ` and ${r.tokens.length - 1} more` : ''}</p>` : '')
      + (bad ? `<p class="pl-bad">${bad}</p>` : '') + (r.note ? `<p class="pl-tok">${esc(r.note)}</p>` : '') + pick + '</div>';
  }
  /* ---- every pair that must read together, today and now ---- */
  function board(s) {
    const vals = values(s), base = values(DEFS.palette), rs = RL.map(roleFor(s));
    const rows = [];
    rs.forEach((r) => (r.against || []).forEach(([bg, min]) => {
      if (!min || !(bg in vals)) return;
      const now = C.ratio(vals[r.id], vals[bg]), then = C.ratio(base[r.id], base[bg]);
      rows.push(`<li><span class="pl-aa" style="background:${vals[bg]};color:${vals[r.id]}">Aa</span><span><b>${esc(r.name)}</b> on ${esc((RBY[bg] || { name: bg }).name)}</span>`
        + `<span class="pl-res"><b class="${now >= min ? 'ok' : 'no'}">${now >= min ? 'Readable' : 'Too faint'} · ${C.showRatio(now)}</b><small>needs ${min}${measured ? ` · today ${C.showRatio(then)}` : ''}</small></span></li>`);
    }));
    const fails = C.failures(rs, vals).length, wasFail = measured ? C.failures(rs, base).length : 0;
    return `<div class="pl-read"><p class="why">${fails ? `${fails} pair${fails > 1 ? 's are' : ' is'} too faint with these colours.` : 'Every pair reads with these colours.'}`
      + (measured ? ` ${wasFail ? `Today’s palette already has ${wasFail} pair${wasFail > 1 ? 's' : ''} below the minimum; that is a finding about the product, not a change.` : 'Today’s palette passes every pair.'}` : '')
      + ' Gradients, glass and images behind words are not measured here; check those on the real page.</p>'
      + `<ul class="pl-pairs">${rows.join('')}</ul>${twinBoard(s)}</div>`;
  }
  /** The matched twin's pairs, by kind of role: it has no project values, so only now is measured. */
  const TWIN_PAIRS = Object.entries(SLOT_AGAINST).flatMap(([k, list]) => list.map(([bg, min]) => [k, bg, min]));
  const twinFails = (s) => { const t = twin(s); return t && !t[2] ? TWIN_PAIRS.filter(([k, bg, min]) => C.ratio(t[1][k], t[1][bg]) < min) : []; };
  function twinBoard(s) {
    const t = twin(s);
    if (!t || t[2]) return '';
    const R = t[1], fails = twinFails(s).length;
    return `<h3 class="pl-twinh">${label2(t[0], false)} theme</h3><p class="why">${fails ? `${fails} pair${fails > 1 ? 's are' : ' is'} too faint in the matched theme.` : 'Every pair reads in the matched theme too.'}</p><ul class="pl-pairs">`
      + TWIN_PAIRS.map(([k, bg, min]) => { const now = C.ratio(R[k], R[bg]); return `<li><span class="pl-aa" style="background:${R[bg]};color:${R[k]}">Aa</span><span><b>${esc(SLOT_NAME[k] || k)}</b> on ${esc(SLOT_NAME[bg] || bg)}</span><span class="pl-res"><b class="${now >= min ? 'ok' : 'no'}">${now >= min ? 'Readable' : 'Too faint'} · ${C.showRatio(now)}</b><small>needs ${min}</small></span></li>`; }).join('')
      + '</ul>';
  }
  const control = (c, s) => (c.t === 'role' ? roleRow(c, s) : c.t === 'board' ? board(s) : null);

  /* Every direction control is a way of proposing role values: the proposal names the roles, not the sliders. */
  groups.forEach((g) => g.ctl.forEach((c) => { c.inSpec = false; }));
  groups.unshift({ id: 'roles', t: 'Colour roles', short: 'Roles', sec: 'Roles',
    why: measured ? 'Every job a colour does here, starting from the exact value found in the project. Open one to change it on its own.' : 'Every job a colour does. No project colours were given, so these are proposals; open one to change it on its own.',
    note: () => (PROJECT_ROLES.length || !measured ? '' : '<span>Only some roles were found in the project; the rest are marked Proposed until you choose them.</span>'),
    ctl: RL.map((r) => ({ k: 'r_' + r.id, t: 'role', label: r.name, role: r.id, more: false, inSpec: false })) }); // the notes carry them, with tokens
  groups.push({ id: 'read', t: 'Readability', sec: 'Roles', why: 'Every pair of colours that must read together, measured for the palette you have now, beside today’s.',
    ctl: [{ k: '_board', t: 'board', label: 'Readability', more: false, inSpec: false }] });

  /* ---- what other parts of the studio read ---- */
  const scene = (s) => {
    const R = slots(s);
    return { vars: { '--sc-bg': R.page, '--sc-surface': R.surface, '--sc-line': R.line, '--sc-control': R.control, '--sc-fg': R.text, '--sc-fg2': R.text2, '--sc-fg3': R.text3, '--sc-accent': R.accent, '--sc-fill': R.fill, '--sc-on-fill': R['on-fill'], '--sc-ok': R.ok, '--sc-warn': R.warn, '--sc-bad': R.bad } };
  };
  const share = (s) => {
    const R = slots(s), [L, ch, H] = C.toOklch(R.accent);
    return { accent: { H: ch < 0.01 ? s.hue : Math.round(H), C: Math.round(ch * 1000) / 1000, L: Math.round(L * 1000) / 1000 }, light: s.side === 'light', roles: Object.assign({}, R) };
  };
  const warn = (s) => {
    const vals = values(s), base = values(DEFS.palette), rs = RL.map(roleFor(s));
    const was = new Set(C.failures(rs, base).map((f) => f.role + '/' + f.bg));
    return C.failures(rs, vals).map((f) => ({
      k: 'r_' + f.role, soft: was.has(f.role + '/' + f.bg),
      t: `${RBY[f.role].name} on ${(RBY[f.bg] || { name: f.bg }).name}: ${C.showRatio(f.got)} to 1, needs ${f.min}.${was.has(f.role + '/' + f.bg) ? ' Today’s palette has this too.' : ''}`,
    })).concat(twinFails(s).map(([k, bg, min]) => ({ k: 'pair', t: `Matched ${otherSide(s)} theme: ${SLOT_NAME[k] || k} on ${SLOT_NAME[bg] || bg} is ${C.showRatio(C.ratio(twin(s)[1][k], twin(s)[1][bg]))} to 1, needs ${min}.` })));
  };
  /** What changed, role by role, for Review: the exact values, and how today's was known. */

  });

  return out;
}

/* ---- studio/state.js ---- */
/* ===== State: every module's picks, the view, history and pins, saved in the browser and on the local server ===== */

const ST = {}; // module id -> its state
const DEFS = {}; // module id -> its baseline: defaults with what was measured from the project laid over them
let S = {}; // always the button's state (the button's own code reads it)
for (const m of STUDIO.mods) {
  const d = Object.assign({}, m.defaults);
  for (const k in m.today) if (k in d) d[k] = m.today[k];
  if (m.fix) m.fix(d);
  DEFS[m.id] = d;
  ST[m.id] = clone(d);
}
const fresh = (id) => clone(DEFS[id]);
function setState(id, s) { ST[id] = s; if (id === 'button') S = s; }
setState('button', ST.button || {});

const V = { device: VIEW, bg: 'page', rm: RM_OS, mode: 'alone' }; // how the preview is shown
const NAV = { mod: STUDIO.mods[0].id, cat: {}, review: false }; // cat[module] is a group id, or 'looks'
STUDIO.mods.forEach((m) => { NAV.cat[m.id] = 'looks'; });
const AM = () => STUDIO.by[NAV.mod];
const AS = () => ST[NAV.mod];

const HIST = { undo: [], redo: [] }; // [{ mod, s }] the state a module had before a change
const PINS = []; // [{ id, name, mod, s }] up to three versions kept to compare
let SCOPE = ''; // how far the proposal should reach: 'one' | 'family' | 'system'
const UI = {
  ask: { target: null, text: '' }, // the request box, and the control it is about (null: the whole page in view)
  pending: null, // the last request sent to the agent
  fresh: [], known: [], // choices marked new, and every added choice seen so far
  expanded: {}, fine: {}, // long lists opened, Fine-tune sections opened
  seen: { dev: [], bg: [], rm: false, mode: [] }, // which views were looked at, for Review and the proposal
  devAt: null, scroll: 0, open: '', // open: the module control expanded right now (a colour role being edited)
};
const SKEY = 'studio:' + (P.id || P.name + ':' + P.noun);
const OLD_KEY = 'button-studio:' + P.name + ':' + P.noun; // saved by the button studio before it had modules

/** A value another module offers to follow: 'accent', 'fonts', 'light'. */
function shared(k) {
  for (const m of STUDIO.mods) {
    if (!m.share) continue;
    try { const v = m.share(ST[m.id]); if (v && v[k] != null) return v[k]; } catch {}
  }
  return null;
}

/* ---- history: call commit() before changing a module's state ---- */
function commit(mid = NAV.mod) {
  HIST.undo.push({ mod: mid, s: clone(ST[mid]) });
  if (HIST.undo.length > 60) HIST.undo.shift();
  HIST.redo.length = 0;
}
function travel(from, to) {
  const e = from.pop();
  if (!e || !STUDIO.has(e.mod)) return;
  to.push({ mod: e.mod, s: clone(ST[e.mod]) });
  setState(e.mod, e.s);
  NAV.mod = e.mod;
  redrawAll(); save();
}
const undo = () => travel(HIST.undo, HIST.redo);
const redo = () => travel(HIST.redo, HIST.undo);

/** The keys of a module whose value differs from the baseline. */
function changedKeys(mid, s = ST[mid]) {
  const m = STUDIO.by[mid], d = DEFS[mid];
  return m.keys.filter((k) => !m.transient.includes(k) && k in d && !sameValue(JSON.stringify(s[k]), JSON.stringify(d[k])));
}
const sameLook = (mid, a, b) => STUDIO.by[mid].keys.every((k) => STUDIO.by[mid].transient.includes(k) || JSON.stringify(a[k]) === JSON.stringify(b[k]));

function snapshot() {
  const { ask, pending, fresh: f, known, expanded, fine, seen, devAt } = UI;
  const mods = {};
  for (const m of STUDIO.mods) { mods[m.id] = Object.assign({}, ST[m.id]); m.transient.forEach((k) => { mods[m.id][k] = DEFS[m.id][k]; }); }
  return {
    v: 3, mods, view: V, nav: NAV, pins: PINS, scope: SCOPE, hist: { undo: HIST.undo.slice(-30), redo: HIST.redo.slice(-30) },
    ui: { ask, pending, fresh: f, known, expanded, fine, seen, devAt }, scroll: scrollY, at: Date.now(),
  };
}

/** A saved state for one module, keeping only values that still make sense for this page. Returns a full state. */
function cleanState(mid, saved) {
  const m = STUDIO.by[mid], out = fresh(mid);
  if (!saved || typeof saved !== 'object') return out;
  for (const k in out) {
    if (!(k in saved) || m.transient.includes(k)) continue;
    const v = saved[k];
    if (typeof v !== typeof out[k]) continue;
    const cs = ctlsFor(mid, k);
    const sw = cs.find((c) => c.t === 'swatches');
    if (sw) { if (sw.sw.some((w) => w[0] === v)) out[k] = v; continue; }
    const chips = cs.filter((c) => c.t === 'chips');
    const free = cs.some((c) => c.t !== 'chips');
    if (chips.length && !free && !chips.some((c) => optOf(c, v))) continue; // a choice that no longer exists
    const r = cs.find((c) => c.t === 'range');
    out[k] = r && typeof v === 'number' ? Math.min(r.max, Math.max(r.min, v)) : v;
  }
  if (m.fix) m.fix(out);
  return out;
}

/** Takes a saved snapshot back. Only data is read from it: nothing in it is ever run. */
function restore(d) {
  if (!d || typeof d !== 'object') return false;
  if (d.v === 2 && d.S) d = { v: 3, mods: { button: d.S }, view: { device: d.S.device, bg: d.S.bg, rm: d.S.rm }, ui: d.ui, scroll: d.scroll, at: d.at }; // the button studio's older format
  if (d.v !== 3 || !d.mods) return false;
  for (const m of STUDIO.mods) if (d.mods[m.id]) setState(m.id, cleanState(m.id, d.mods[m.id]));
  const vw = d.view || {};
  if (DEV[vw.device]) V.device = vw.device;
  if (typeof vw.bg === 'string') V.bg = vw.bg;
  if (typeof vw.rm === 'boolean') V.rm = vw.rm;
  if (['alone', 'context', 'compare', 'states'].includes(vw.mode)) V.mode = vw.mode;
  const n = d.nav || {};
  if (STUDIO.has(n.mod)) NAV.mod = n.mod;
  NAV.review = !!n.review;
  for (const m of STUDIO.mods) { const c = n.cat && n.cat[m.id]; if (c === 'looks' || m.groups.some((g) => g.id === c)) NAV.cat[m.id] = c; }
  PINS.length = 0;
  for (const p of Array.isArray(d.pins) ? d.pins.slice(0, 3) : []) if (p && STUDIO.has(p.mod)) PINS.push({ id: String(p.id), name: String(p.name || '').slice(0, 60), mod: p.mod, s: cleanState(p.mod, p.s) });
  SCOPE = ['one', 'family', 'system'].includes(d.scope) ? d.scope : '';
  for (const side of ['undo', 'redo']) {
    HIST[side] = ((d.hist && d.hist[side]) || []).filter((e) => e && STUDIO.has(e.mod)).slice(-30).map((e) => ({ mod: e.mod, s: cleanState(e.mod, e.s) }));
  }
  const u = d.ui || {}, a = u.ask || {};
  Object.assign(UI, {
    ask: { target: a.target && a.target in CT ? a.target : null, text: String(a.text || '').slice(0, 400) },
    pending: u.pending || null, fresh: u.fresh || [], known: u.known || [], expanded: u.expanded || {}, fine: u.fine || {},
    seen: Object.assign({ dev: [], bg: [], rm: false, mode: [] }, u.seen || {}), devAt: u.devAt || null, scroll: d.scroll || 0,
  });
  return true;
}

/** The server copy and the browser copy can differ; the newer one wins. */
const newest = (a, b) => (!a ? b : !b ? a : (b.at || 0) > (a.at || 0) ? b : a);

/* On claude.ai the store takes one write at a time per document: the newest snapshot waits for the last write. */
let cloudNext = null, cloudBusy = false;
async function cloudSave(snap) {
  cloudNext = clone(snap);
  if (cloudBusy) return;
  cloudBusy = true;
  try {
    const db = await STORE;
    while (db && cloudNext) {
      const s = cloudNext;
      cloudNext = null;
      try { await db.doc(STATE_DOC).set(s); } catch { break; }
    }
  } finally { cloudBusy = false; }
}

let saveTimer = 0, cloudTimer = 0, HOLDING = false;
function save(now) {
  clearTimeout(saveTimer);
  const go = () => {
    if (HOLDING) return; // while a baseline is being held up to compare, the real picks are parked
    const snap = snapshot();
    try { localStorage.setItem(SKEY, JSON.stringify(snap)); } catch {}
    if (LIVE) api('/api/state', snap).catch(() => {});
    if (CLOUD) { clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudSave(snap), now ? 0 : 800); }
  };
  if (now) go(); else saveTimer = setTimeout(go, 250);
}
addEventListener('pagehide', () => { if (!HOLDING) try { localStorage.setItem(SKEY, JSON.stringify(snapshot())); } catch {} });

/* In the preview card the design is drawn at its real size, and scaled down only when it is wider than the card; the

function layoutDevice() {

function seen(kind, v) { if (!UI.seen[kind].includes(v)) UI.seen[kind].push(v); }
const seg = (items, cur, attr) => items.map(([k, n, title]) => `<button role="radio" data-${attr}="${k}" aria-checked="${cur === k}"${title ? ` title="${esc(title)}"` : ''}>${esc(n)}</button>`).join('');

/* ---- pins, and holding the baseline up against what you have ---- */
function pinNow() {
  const m = AM(), s = AS();
  if (sameLook(m.id, s, DEFS[m.id])) return msg(`This is ${esc(baseName(m).toLowerCase())}, which Compare always shows. Change something first, then pin it.`);
  const twin = PINS.find((p) => p.mod === m.id && sameLook(m.id, s, p.s));
  if (twin) return msg(`Already pinned as ${esc(twin.name)}.`);
  if (PINS.length >= 3) return msg('Three versions are pinned already. Remove one in Compare first.', 'warn');
  const letter = ['A', 'B', 'C'].find((l) => !PINS.some((p) => p.name.startsWith(l + ' ·') || p.name === l));
  const what = m.summary ? m.summary(s) : (() => { const c = m.groups[0] && m.groups[0].ctl.find((x) => x.t === 'chips'); const op = c && optOf(c, s[c.k]); return op ? op.n : ''; })();
  PINS.push({ id: 'p' + Date.now().toString(36), name: letter + (what ? ' · ' + what : ''), mod: m.id, s: clone(s) });
  renderStageBar(); save();
  if (modeNow() === 'compare') renderStage();
  else msg(`Pinned as ${esc(PINS[PINS.length - 1].name)}. <button class="chip sm" data-mode="compare">Compare</button>`, 'ok');
}
function usePinned(key) {

  if (!s) return;
  commit(mid);

}

}
let held = null;
function holdOn() {
  if (HOLDING || !changedKeys(NAV.mod).length) return;

  held = { mod: NAV.mod, s: AS() };

/* ---- studio/panel.js ---- */
/* ===== Panel: the studio tabs, the navigator, Looks, a category's choices drawn as tiles, Review and the proposal ===== */

const MAX_SHOWN = 9; // longer lists show this many plus the current one, then "Show N more"
const WIDE = () => innerWidth >= 900; // fine adjustments sit in the preview card on wider screens, under the choices on a phone
const fmt = (v, c) => (c.step < 0.01 ? (+v).toFixed(3) : c.step < 1 ? (+v).toFixed(2) : Math.round(v)) + (c.unit || '');

/* ---- a state with one more choice laid on it, and a drawing of any state ---- */
function candidate(c, op) {
  const m = STUDIO.by[c.mid], s = clone(ST[c.mid]);
  s[c.k] = op.v;
  if (op.set) for (const k in op.set) if (k in DEFS[c.mid]) s[k] = op.set[k];
  if (m.touch) [c.k, ...Object.keys(op.set || {})].forEach((k) => m.touch(s, k)); // drawn exactly as picking it would leave it
  if (m.pick) m.pick(s, c, op);

  return s;
}
function art(m, s, opt, cls = '', extra = '') {
  let inner;
  try { inner = m.still(s, opt); } catch (e) { report(m.id + ' drawing: ' + e.message); inner = ''; }
  return `<span class="art ${m.ground ? 'ground' : 'bgd'} ${cls}" ${m.ground ? '' : bgAttr()}><span class="art-in ${dimCls(m.id, s)}" style="${varsCss(m.vars(s))}">${inner}</span>${extra}</span>`;
}
function lookState(m, look) {
  const s = Object.assign(fresh(m.id), look.patch), now = ST[m.id];
  m.keep.forEach((k) => { if (!(k in look.patch)) s[k] = now[k]; });
  if (m.fix) m.fix(s);
  return s;
}

/** Draws each design at its real size, and smaller only when it would not fit its frame; a scaled one says so. */
function fitArt(root) {
  root.querySelectorAll('.art, .cmp-art').forEach((a) => {
    const i = a.querySelector('.art-in'), w = i && i.offsetWidth, h = i && i.offsetHeight;
    if (!w || !h) return;
    const ground = a.classList.contains('ground');
    const k = Math.max(0.2, Math.min(1, (a.clientWidth - (ground ? 0 : 24)) / w, (a.clientHeight - (ground ? 0 : 16)) / h));
    i.style.transform = k < 0.995 ? `scale(${k.toFixed(3)})` : '';
    let tag = a.querySelector(':scope > .scale');
    if (k < 0.97 && !ground) {
      if (!tag) { tag = document.createElement('span'); tag.className = 'scale'; a.appendChild(tag); }
      tag.textContent = Math.round(k * 100) + '%';
    } else if (tag) tag.remove();
  });
}

/* ---- one control ---- */
function descHTML(c, op, s) {

/* ---- the proposal the agent receives ---- */
function specLines(m) {
  const s = ST[m.id], out = [];
  for (const g of m.groups) {
    if (g.na && g.na(s)) continue;
    const parts = [], done = new Set();
    for (const c of g.ctl) {
      if (c.inSpec === false || !shown(c, s) || done.has(c.k)) continue;
      done.add(c.k);
      const same = sameValue(JSON.stringify(s[c.k]), JSON.stringify(DEFS[m.id][c.k]));
      if (c.t === 'swatches') { const k = m.colourOf ? m.colourOf(s) : null; parts.push(`${s[c.k]}${k ? `, oklch(${(+k.L).toFixed(2)} ${(+k.C).toFixed(2)} ${Math.round(k.H)})` : ''}${same ? ' [unchanged]' : ''}`); continue; }
      if (c.t === 'text') { parts.push(`${c.spec || c.label}: “${s[c.k]}”`); continue; }
      if (c.t === 'range') { parts.push(`${c.label}: ${fmt(s[c.k], c)}`); continue; }
      const op = optOf(c, s[c.k]);
      const r = g.ctl.find((x) => x.k === c.k && x.t === 'range');
      if (!op) { parts.push(`${c.label}: ${r ? fmt(s[c.k], r) : s[c.k]}`); continue; }
      const raw = String(op.v);
      const showRaw = typeof op.v === 'string' && raw && raw.toLowerCase() !== op.n.toLowerCase() && c.k !== 'sub' && c.k !== 'label';
      parts.push((c.label.toLowerCase() === g.t.toLowerCase() ? '' : c.label + ': ') + op.n
        + (showRaw ? ` (${raw})` : '') + (r && !op.n.includes(fmt(s[c.k], r)) ? `, ${fmt(s[c.k], r)}` : '') + (same ? ' [unchanged]' : '')
        + (avail(op, s) ? '' : ' [will not show with these choices]'));
    }
    if (parts.length) out.push(`${g.t}: ${parts.join('; ')}`);
  }
  return out;
}
function specText() {
  const scope = SCOPES.find((x) => x[0] === SCOPE);
  const out = [`A proposal from the studio for ${P.name}. Nothing has been changed. Do not build it until I say so in the chat. ${P.specRules}`, '',
    `Reach: ${scope ? `${scope[1]}. ${scope[2]}` : 'not chosen yet. Ask me before deciding.'}`];
  for (const m of STUDIO.mods) {
    const ch = changes(m);
    out.push('', `== ${m.name}: ${m.title()} ==`);
    if (!ch.length) { out.push(`No change from ${baseName(m).toLowerCase()}.`); continue; }
    out.push('Changed: ' + ch.map((x) => `${x.label} ${x.from}${x.known === 'not measured' ? ' (starting value, not measured from the project)' : x.known === 'new' ? ' (a category added in this session)' : ''} → ${x.to}`).join('; ') + '.');
    out.push(...specLines(m).map((l, i) => `${i + 1}. ${l}`));
    const warn = m.warn ? m.warn(ST[m.id]) : [];
    if (warn.length) out.push('To check: ' + warn.map((w) => w.t).join(' '));
    if (m.notes) out.push(...m.notes(ST[m.id]));
    const cats = m.groups.filter((g) => g.dim && changedKeys(m.id).some((k) => g.ctl.some((x) => x.k === k)));
    if (cats.length) out.push(`New in this session: ${cats.map((g) => g.t).join(', ')}. The studio draws ${cats.length > 1 ? 'them' : 'it'} with the .x-${cats[0].ctl[0].k}-* rules (and --x-* properties) in its own <style id="more-css">; carry that look into the project's own styles.`);
    const system = m.system ? m.system() : [];
    if (system.length) out.push(`How the project builds this today: ${system.join(' ')} These choices may change that. Where they differ and the reach allows it, update or add to the design system to match rather than special-casing.`);
  }
  out.push('', checkedLine());
  return out.join('\n');
}
