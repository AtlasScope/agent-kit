/* ===== Connection: hearing from the local server (or the claude.ai store), messages, and sending to the agent ===== */

let STATUS = { live: false, listening: false, cloud: false, queued: 0 };
let pageVersion = SERVED_VERSION; // the version of index.html this page was built from

function conn() {
  const c = $('conn'), t = c.querySelector('span');
  c.className = 'conn' + (STATUS.live && STATUS.listening ? ' on' : '');
  t.textContent = STATUS.live ? (STATUS.listening ? 'Agent listening' : STATUS.queued ? `${STATUS.queued} waiting for the agent` : 'Connected') : STATUS.cloud ? 'Saved on this page' : LIVE ? 'Not connected · buttons copy text' : 'Offline · buttons copy text';
  c.title = STATUS.live ? (STATUS.listening ? 'What you send reaches the agent now.' : 'What you send is kept, and reaches the agent when it next listens. Say “check the studio” in the chat if it seems to have stopped.')
    : STATUS.cloud ? 'Your choices and requests are saved on this page, where the agent can read them. Buttons also copy a message for you to paste in the chat.'
    : 'Everything on this page still works. Buttons copy a message for you to paste in the chat.';
  const b = document.querySelector('[data-act="ask"]'); if (b) b.textContent = STATUS.live ? 'Send' : 'Copy request';
  if (NAV.review) $('pfoot').innerHTML = footHTML();
}

let msgTimer = 0;
function msg(html, kind, sticky) {
  const b = $('msg');
  clearTimeout(msgTimer);
  b.className = 'msg show' + (kind ? ' ' + kind : '');
  b.querySelector('span').innerHTML = html;
  if (!sticky) msgTimer = setTimeout(() => b.classList.remove('show'), 6000);
}

const reported = new Set();
function report(m) {
  if (reported.has(m)) return;
  reported.add(m);
  console.error('[studio]', m);
  if (STATUS.live) api('/api/send', { kind: 'error', message: String(m).slice(0, 500) }).catch(() => {});
  else if (CLOUD) cloudSend({ kind: 'error', message: String(m).slice(0, 500) });
}
/** Leaves a request in the claude.ai store for the agent to read. Resolves whether it was saved. */
async function cloudSend(item) {
  try {
    const db = await STORE;
    if (!db) return false;
    await db.collection(REQUESTS).add(Object.assign({}, item, { at: new Date().toISOString() }));
    return true;
  } catch { return false; }
}
addEventListener('error', (e) => report((e.message || 'error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')));

function onStatus(st) {
  STATUS = { live: true, listening: !!st.listening, queued: +st.queued || 0 };
  if (pageVersion == null) pageVersion = st.version; // opened without a version stamp: trust the first report
  else if (st.version && st.version !== pageVersion) { save(true); setTimeout(() => location.reload(), 120); return; }
  if (st.ok === false) msg('The agent’s last change to this page has a mistake, so you are seeing the version before it. The agent has been told. Your choices are safe.', 'warn', true);
  conn();
}
/* The server pushes status on /api/events; if that is not available, ask every two seconds. */
function connect() {
  if (CLOUD) { STORE.then((db) => { STATUS.cloud = !!db; conn(); }); }
  if (!LIVE) { conn(); return; }
  const lost = () => { STATUS = { live: false, listening: false, queued: 0 }; conn(); };
  const poll = async () => {
    try { onStatus(await api('/api/status')); } catch { lost(); }
    setTimeout(poll, document.hidden ? 5000 : 2000);
  };
  if (!window.EventSource) { poll(); return; }
  const es = new EventSource('/api/events?k=' + encodeURIComponent(LIVE.k));
  es.onmessage = (e) => { try { onStatus(JSON.parse(e.data)); } catch {} };
  es.onerror = () => { lost(); if (es.readyState === 2) { es.close(); poll(); } };
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  return ok;
}

/* What the claude.ai copy says after a request: it was copied, saved on the page, or both. */
function cloudSentMsg(copied, kept, words, after) {
  if (copied) return `Copied. Paste it in the chat with the agent.${kept ? ' It is also saved on this page.' : ''} ${after}`;
  if (kept) return `Saved on this page. In the chat, tell the agent “check the studio”. ${after}`;
  return `Could not copy or save. Tell the agent in the chat: ${esc(words)}`;
}
/** Hands one request to the agent by whichever way is open: the local server, the claude.ai store, or the clipboard. */
async function deliver(payload, words, okMsg, after) {
  let sent = false;
  if (CLOUD) {
    const copied = await copyText(words), kept = await cloudSend(Object.assign({ words }, payload)); // copy first, while the click still counts
    msg(cloudSentMsg(copied, kept, words, after), copied || kept ? 'ok' : 'warn', true);
    return kept;
  }
  if (STATUS.live) { try { await api('/api/send', payload); sent = true; } catch {} }
  if (sent) msg(okMsg + (STATUS.listening ? '' : ' The agent is not listening right now; it is kept until it does. Saying “check the studio” in the chat wakes it.'), 'ok', !STATUS.listening);
  else {
    const ok = await copyText(words);
    msg(ok ? `Copied. Paste it in the chat with the agent. ${after}` : `Could not copy. Tell the agent: ${esc(words)}`, 'warn', true);
  }
  return sent;
}

/* ===== Events: picking, typing, sliding, and the studio's own controls ===== */

const unfresh = (key) => { const i = UI.fresh.indexOf(key); if (i >= 0) UI.fresh.splice(i, 1); };
function choose(c, op) {
  const m = STUDIO.by[c.mid];
  commit(c.mid);
  setState(c.mid, candidate(c, op));
  unfresh(freshKey(c, op.v));
  redrawAll(); save();
  if (m.after) m.after(c);
}
function pickSwatch(c, name) {
  const m = STUDIO.by[c.mid], w = c.sw.find((x) => x[0] === name);
  if (!w) return;
  commit(c.mid);
  const s = ST[c.mid];
  if (m.swatch) m.swatch(s, w); else s[c.k] = w[0];
  unfresh(freshKey(c, w[0]));
  redrawAll(); save();
}
function pickLook(id) {
  const m = AM(), l = m.looks.find((x) => x.id === id);
  if (id !== '@base' && !l) return;
  commit(m.id);
  setState(m.id, l ? lookState(m, l) : fresh(m.id));
  unfresh(m.id + '.look:' + id);
  redrawAll(); save();
}
const tried = new Set();
function surprise() {
  const m = AM(), now = AS();
  let pool = m.looks.filter((l) => !tried.has(l.id) && !sameLook(m.id, lookState(m, l), now));
  if (!pool.length) { tried.clear(); pool = m.looks.filter((l) => !sameLook(m.id, lookState(m, l), now)); }
  const l = pool[Math.floor(Math.random() * pool.length)];
  if (!l) return;
  tried.add(l.id);
  pickLook(l.id);

/** A module's own control setting one value directly: data-mset="module|key" with data-val. The key must already
   exist in that module's state and the value must have the same type; anything else is ignored. */
function setValue(el) {
  const [mid, k] = String(el.dataset.mset).split('|'), m = STUDIO.by[mid];
  if (!m || !(k in DEFS[mid])) return;
  let v = el.dataset.val;
  if (typeof DEFS[mid][k] === 'number') { v = +v; if (!isFinite(v)) return; }
  commit(mid);
  ST[mid][k] = v;
  if (m.touch) m.touch(ST[mid], k);
  if (m.fix) m.fix(ST[mid]);
  redrawAll(); save();
}

  if (STUDIO.has('button') && S.menuOpen && !onMenuStep() && at('#stage') && !at('#menu,#tog,#tog2,.expand,.lg2')) setMenu(false);
  let el;
  if ((el = at('[data-act]'))) return ACTIONS[el.dataset.act] && ACTIONS[el.dataset.act]();
  if ((el = at('[data-mset]'))) return setValue(el);
  if ((el = at('[data-mopen]'))) { UI.open = UI.open === el.dataset.mopen ? '' : el.dataset.mopen; renderPanel(); return save(); }
  if (at('[data-set="rm"]')) return setRm(false);
  if ((el = at('[data-sw]'))) return pickSwatch(CT[el.dataset.c], el.dataset.sw);
  if ((el = at('[data-o]'))) { const c = CT[el.dataset.c]; return choose(c, c.opts[+el.dataset.o]); }
  if ((el = at('[data-look]'))) return pickLook(el.dataset.look);
  if ((el = at('[data-expand]'))) { UI.expanded[el.dataset.expand] = true; renderPanel(); return save(); }
  if ((el = at('[data-more]'))) {
    UI.ask.target = el.dataset.more;
    renderPanel(); save();
    const box = $('ask');
    if (box) { box.focus({ preventScroll: true }); $('askbox').scrollIntoView({ block: 'center', behavior: RM_OS ? 'auto' : 'smooth' }); }
    return;
  }
  if ((el = at('[data-quick]'))) return sendAsk(el.dataset.quick);
  if ((el = at('[data-goctl]'))) return goControl(el.dataset.goctl);
  if ((el = at('[data-scope]'))) { SCOPE = el.dataset.scope; renderPanel(); return save(); }
  if ((el = at('[data-cat]'))) return go(null, el.dataset.cat);
  if ((el = at('[data-mod]'))) return go(el.dataset.mod, NAV.cat[el.dataset.mod]);
  if ((el = at('[data-mode]'))) return setMode(el.dataset.mode);
  if ((el = at('[data-dev]'))) return setDevice(el.dataset.dev);
  if ((el = at('[data-use]'))) return usePinned(el.dataset.use);
  if ((el = at('[data-unpin]'))) return unpin(el.dataset.unpin);
});

/* The States view shows hover and press without a pointer. Rather than keep a second copy of every hover and press
   style, each rule written for :hover or :active is repeated once for a class the drawing code can set. */
(function forcedStates() {
  const out = [];
  const walk = (rules) => {
    for (const r of rules) {
      if (r.cssRules && r.cssRules.length && !r.selectorText) { walk(r.cssRules); continue; }
      const sel = r.selectorText;
      if (!sel || !/:(hover|active)/.test(sel) || !/\.(pv|h-|p-|m-|sh-)/.test(sel)) continue;
      out.push(sel.replace(/:hover/g, '.sx-hover').replace(/:active/g, '.sx-active') + '{' + r.style.cssText + '}');
    }
  };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch {} }
  const st = document.createElement('style');
  st.id = 'sx';
  st.textContent = out.join('\n');
  document.head.appendChild(st);
})();

/* An address ending #palette or #button/material opens straight there. */
function fromHash() {
  const [hm, hc] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (!STUDIO.has(hm)) return false;
  NAV.mod = hm; NAV.review = false;
  if (hc === 'looks' || STUDIO.by[hm].groups.some((g) => g.id === hc)) NAV.cat[hm] = hc;
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
addEventListener('hashchange', () => { if (fromHash()) { redrawAll(); save(); } });

/* For the agent, from the browser console or a browser tool: draws every tiled choice of every studio and reports the
   ones that draw exactly like another choice of the same control. A choice nobody can tell apart is a dead option. */
function studioCheck() {
  const PROPS = ['backgroundColor', 'backgroundImage', 'color', 'borderTopColor', 'borderTopWidth', 'borderTopStyle', 'borderTopLeftRadius', 'borderTopRightRadius', 'boxShadow', 'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 'lineHeight', 'textTransform', 'fontVariantNumeric', 'width', 'height', 'paddingLeft', 'opacity', 'transform', 'translate', 'scale', 'rotate', 'filter', 'backdropFilter', 'animationName', 'animationDuration', 'outlineColor', 'outlineStyle', 'display', 'flexDirection', 'gap', 'content', 'clipPath'];
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-9999px;top:0;width:600px';
  document.body.appendChild(box);
  const print = () => [box, ...box.querySelectorAll('*')].map((el) => [null, '::before', '::after'].map((ps) => { const c = getComputedStyle(el, ps); return ps && c.content === 'none' ? '' : PROPS.map((p) => c[p]).join('|'); }).join('~') + '#' + el.textContent.length + el.childElementCount + (el.getAttribute('href') || '')).join('\n');
  const out = { controls: 0, lookAlike: [], listedAsWords: [] };
  for (const c of Object.values(CT)) {
    if (c.t !== 'chips' || !shown(c, ST[c.mid])) continue; // a control that is hidden right now is not judged
    const m = STUDIO.by[c.mid], t = m.tile && m.tile(c);
    if (!t) { out.listedAsWords.push(c.mid + '.' + c.k); continue; }
    out.controls++;
    const seen = {};
    for (const op of c.opts) {
      if (!avail(op, ST[c.mid])) continue;
      const s = candidate(c, op);
      box.innerHTML = `<div class="${dimCls(m.id, s)}" style="${varsCss(m.vars(s))}">${m.still(s, { tile: c.k })}</div>`;
      if (t.on) box.querySelectorAll('.pv').forEach((b) => b.classList.add('sx-' + t.on));
      const f = print();
      if (seen[f]) out.lookAlike.push(`${c.mid}.${c.k}: “${op.n}” draws the same as “${seen[f]}”`); else seen[f] = op.n;
    }
  }
  box.remove();
  return out;
}

(async () => {
  let local = null, server = null;
  try { local = JSON.parse(localStorage.getItem(SKEY) || localStorage.getItem(OLD_KEY) || 'null'); } catch {}
  if (LIVE) { try { server = (await api('/api/state')).state; } catch {} }
  else if (CLOUD) {
    try {
      const db = await Promise.race([STORE, new Promise((r) => setTimeout(() => r(null), 4000))]);
      const d = db && (await db.doc(STATE_DOC).get());
      if (d && d.exists) server = clone(d.data());
    } catch {}
  }
  const saved = newest(server, local);
  const had = restore(saved);
  if (!had) V.mode = AM().mode0 || 'alone';

  if (!DEV[V.device] || UI.devAt !== VIEW) V.device = VIEW; // a new device, or a different one: start on the one in hand
  UI.devAt = VIEW;
  if (!BGS.some((b) => b[0] === V.bg)) V.bg = 'page';
  seen('dev', V.device);
  seen('bg', V.bg);
  seen('mode', V.mode);

  fromHash();

  /* Choices the agent added since the last visit get a green dot, and the page opens where they are. */
  const all = addedKeys();
  const added = had ? all.filter((k) => !UI.known.includes(k)) : [];
  UI.fresh = [...new Set(UI.fresh.concat(added))].filter((k) => all.includes(k));
  UI.known = all;
  if (DIM_BAD.length) {
    msg(`A new category the agent added has a mistake, so it is left out: ${esc(DIM_BAD[0])} Everything else works, and your choices are safe.`, 'warn', true);
    report('MORE.dims: ' + DIM_BAD.join(' '));
  }
  if (!MORE_OK) {
    msg('The choices the agent added have a mistake, so they are hidden for now. Your choices are safe. The agent has been told.', 'warn', true);
    report('The MORE block in the page did not load (syntax error).');
  } else if (added.length) {
    const [mid, key] = added[0].split(':')[0].split('.');
    if (STUDIO.has(mid)) {
      const c = ctlsFor(mid, key)[0];
      NAV.mod = mid; NAV.review = false;
      NAV.cat[mid] = c ? c.sid : 'looks';
      added.forEach((k) => { const [m2, k2] = k.split(':')[0].split('.'); ctlsFor(m2, k2).forEach((x) => { UI.expanded[x.id] = true; }); });
    }
    const newCats = [...new Set(added.map((k) => ctlsFor(...k.split(':')[0].split('.'))[0]).filter((c) => c && STUDIO.by[c.mid].groups.find((g) => g.id === c.sid && g.dim)).map((c) => STUDIO.by[c.mid].groups.find((g) => g.id === c.sid).t))];
    msg(newCats.length ? `Something new to change: <b>${esc(list(newCats))}</b>, with its choices drawn and marked with a green dot. Everything you picked and pinned is still here.`
      : `${added.length} new choice${added.length > 1 ? 's' : ''} added${UI.pending ? ' to ' + esc(UI.pending.name) : ''}, marked with a green dot. Everything you picked is still selected.`, 'ok');
    UI.pending = null;
  } else if (!(UI.pending && UI.pending.sent && Date.now() - UI.pending.at < 15 * 60e3)) UI.pending = null;

  const m = AM();
  if (m.onNav) m.onNav();
  renderStage();
  renderPanel();
  conn();
  save();
  if (added.length) scrollToPanel(); else if (UI.scroll) scrollTo(0, UI.scroll);
  connect();
})();
