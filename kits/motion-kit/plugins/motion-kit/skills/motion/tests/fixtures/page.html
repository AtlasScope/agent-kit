<!doctype html>
<html lang="en">
<meta charset="utf8">
<title>Motion fixture</title>
<style>
  body { margin: 0; padding: 40px; font: 16px system-ui, sans-serif; }
  button { font: inherit; padding: 8px 14px; }

  /* A good one: opacity and transform, short, decelerating, with a reduced-motion fallback. */
  #good { opacity: 0; transform: translateY(8px); transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1), transform 200ms cubic-bezier(0.2, 0, 0, 1); width: 240px; padding: 16px; background: #1849c4; color: #fff; }
  #good.open { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #good { transform: none; transition: opacity 120ms linear; } }

  /* A bad one: animates height, so layout runs on every frame. Ignores reduced motion. */
  #bad { height: 0; overflow: hidden; transition: height 600ms ease-in; background: #b42318; color: #fff; width: 240px; }
  #bad.open { height: 120px; }

  /* Hidden until opened, so it has no box before the click. */
  #menu { display: none; position: absolute; left: 400px; top: 300px; width: 160px; padding: 12px; background: #5a2fc2; color: #fff; }
  #menu.open { display: block; animation: menu-in 160ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(6px); } }

  /* Script-driven: no CSS or Web Animations, only requestAnimationFrame. */
  #js { width: 40px; height: 40px; background: #00704a; margin-top: 24px; }
</style>
<button id="open-good">Open good</button>
<button id="open-bad">Open bad</button>
<button id="run-js">Run script</button>
<button id="snap" onclick="this.style.background='#111'; this.style.color='#fff'">Snap</button>
<button id="open-menu" onclick="document.getElementById('menu').classList.add('open')">Menu</button>
<a id="next" href="entrance.html">Next page</a>
<div id="menu" role="menu">Menu item</div>
<div id="good">Panel</div>
<div id="bad">Panel</div>
<div id="js"></div>
<script>
  document.getElementById("open-good").onclick = () => document.getElementById("good").classList.toggle("open");
  document.getElementById("open-bad").onclick = () => document.getElementById("bad").classList.toggle("open");
  document.getElementById("run-js").onclick = () => {
    const el = document.getElementById("js"); const start = performance.now();
    const tick = (now) => { const p = Math.min(1, (now - start) / 400); el.style.transform = `translateX(${p * 300}px)`; if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
</script>
</html>
