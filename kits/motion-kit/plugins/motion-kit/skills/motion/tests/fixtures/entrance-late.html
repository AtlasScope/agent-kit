<!doctype html>
<html lang="en">
<meta charset="utf8">
<title>Late entrance fixture</title>
<style>
  #ready { display: none; width: 120px; overflow: hidden; background: #b42318; color: #fff; }
  #ready.on { display: block; height: 100px; animation: grow-late 200ms linear; }
  @keyframes grow-late { from { height: 0; } }
</style>
<div id="ready">Ready</div>
<p>Below.</p>
<script>setTimeout(() => document.getElementById("ready").classList.add("on"), 1200);</script>
</html>
