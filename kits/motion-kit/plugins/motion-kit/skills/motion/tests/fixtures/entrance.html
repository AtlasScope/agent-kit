<!doctype html>
<html lang="en">
<meta charset="utf8">
<title>Entrance fixture</title>
<style>
  /* A page entrance that animates height, so layout runs on every frame while it plays. */
  @keyframes grow { from { height: 0; } }
  #hero { height: 200px; width: 300px; background: #1849c4; animation: grow 500ms linear; }
</style>
<div id="hero"></div>
<p>Content below the hero.</p>
</html>
