<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbit lab</title>
<style>
  :root { color-scheme: dark; --ink: #020302; --line: rgba(255,255,255,.12); --dim: rgba(255,255,255,.62); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0c12; color: #fff; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
  body.bare { grid-template-columns: minmax(0, 1fr); }
  body.bare aside { display: none; }
  main { position: relative; overflow: auto; display: grid; place-items: center; background: #101116; }
  body.bare main { display: block; overflow: hidden; }
  #stage { position: relative; background: var(--ink); overflow: hidden; width: 100%; height: 100%; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% 100%; display: none; }
  /* The homepage's own shade (.launch__shade in app/launch.css; keep the two the same) and a stand-in for its
     words, to judge the scene behind the real layout. */
  #shade { position: absolute; inset: 0; pointer-events: none; display: none;
    background: linear-gradient(100deg, rgba(2,3,2,.52) 0%, rgba(2,3,2,.3) 34%, rgba(2,3,2,0) 60%), linear-gradient(to bottom, rgba(2,3,2,.6), rgba(2,3,2,0) 20%), linear-gradient(to top, rgba(2,3,2,.6), rgba(2,3,2,0) 64px); }
  #words { position: absolute; left: clamp(20px, 5vw, 96px); top: 50%; transform: translateY(-50%); max-width: 40rem; display: none; pointer-events: none; }
  #words h1 { margin: 0 0 22px; max-width: 13.5ch; font: 700 clamp(2.75rem, 5.6vw, 6rem)/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.04em; }
  #words p { margin: 0 0 22px; max-width: 33rem; font-size: 1.1rem; line-height: 1.55; color: rgba(255,255,255,.78); }
  #words b { display: inline-block; padding: 14px 24px; border-radius: 999px; background: #fff; color: #0b0c12; font-weight: 600; }
  .narrow #shade { background: linear-gradient(to bottom, rgba(2,3,2,.6) 0%, rgba(2,3,2,.4) 50%, rgba(2,3,2,.15) 72%, rgba(2,3,2,0) 88%), linear-gradient(to top, rgba(2,3,2,.6), rgba(2,3,2,0) 64px); }
  .narrow #words { top: 5%; transform: none; left: 20px; right: 20px; }
  .narrow #words h1 { font-size: 2.5rem; }
  .narrow #still { object-position: 100% 100%; }
  #error { position: absolute; inset: 12px; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; background: rgba(60,0,0,.92); color: #ffd7d7; font: 12px/1.5 ui-monospace, monospace; display: none; z-index: 5; }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px 40px; background: #0b0c12; }
  h2 { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  label.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px; gap: 8px; align-items: center; height: 24px; }
  label.row span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  label.row output { text-align: right; font: 12px ui-monospace, monospace; }
  label.row.changed span { color: #fff; }
  input[type=range] { width: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button, select { font: inherit; color: #fff; background: #1b1d27; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  button:hover, select:hover { background: #262936; }
  #stats { margin: 8px 0 0; font: 12px/1.5 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="shade"></div>
    <div id="words"><h1>Give your coding agent better instructions.</h1><p>Skills and prompts for Claude Code, Codex and Cursor. Describe the job in plain words; your agent follows a written method for it.</p><b>Install Agent Kit</b></div>
    <pre id="error"></pre>
  </div>
</main>
<aside>
  <div class="bar">
    <select id="size" title="Stage size"></select>
    <select id="tier" title="Quality tier"><option>high</option><option>medium</option><option>low</option><option>still</option></select>
  </div>
  <div class="bar">
    <button id="replay">Play opening</button>
    <button id="rest">At rest</button>
    <button id="words-on">Words</button>
    <button id="still-on">Old photo</button>
  </div>
  <div class="bar">
    <button id="copy">Copy look</button>
    <button id="reset">Reset</button>
  </div>
  <pre id="stats"></pre>
  <div id="controls"></div>
</aside>
<script>
  // Anything that stops the page's script from starting (a file that will not parse, a failed import) is shown here.
  addEventListener("error", (e) => { const box = document.getElementById("error"); box.style.display = "block"; box.textContent = e.message || "The lab's script failed to load."; });
</script>
<script type="module" src="/lab/lab"></script>
</body>
</html>
